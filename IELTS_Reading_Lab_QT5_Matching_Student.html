<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Reading Lab – QT5</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Lexend:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface2:#f0eee8; --ink:#1d1f24; --ink2:#4a4f5a; --ink3:#7a808c; --line:#dedad0;

}

  --accent:#f06a9b; --accent-soft:#3b2230;
  --found:#4cc483; --found-soft:#1c3327; --core:#6aa5f5; --core-soft:#1c2a40; --ext:#b08cf0; --ext-soft:#2c2340; --place:#f0776f; --place-soft:#3d2321;
  --ok:#4cc483; --ok-soft:#1c3327; --bad:#f0776f; --bad-soft:#3d2321; --warn:#f2b54a; --warn-soft:#3a2f17;
  --hl-y:#8a7a12; --hl-g:#2f6b3d; --hl-b:#2b5480; --hl-p:#7a3557;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#15171b; --surface:#1e2127; --surface2:#262a31; --ink:#eceef2; --ink2:#c0c5cf; --ink3:#8d94a1; --line:#353a44;
  --accent:#f06a9b; --accent-soft:#3b2230;
  --found:#4cc483; --found-soft:#1c3327; --core:#6aa5f5; --core-soft:#1c2a40; --ext:#b08cf0; --ext-soft:#2c2340; --place:#f0776f; --place-soft:#3d2321;
  --ok:#4cc483; --ok-soft:#1c3327; --bad:#f0776f; --bad-soft:#3d2321; --warn:#f2b54a; --warn-soft:#3a2f17;
  --hl-y:#8a7a12; --hl-g:#2f6b3d; --hl-b:#2b5480; --hl-p:#7a3557;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 'Source Sans 3',system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Lexend',system-ui,sans-serif;line-height:1.25;margin:0 0 .5em}
h1{font-size:1.45rem;font-weight:600}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600}
.mono,code,.ans,.key{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.eyebrow{font:600 .7rem/1 'Lexend',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink3)}
.small{font-size:.85rem}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top-row{display:flex;gap:14px 24px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 0 12px}
.brand{min-width:0}
.brand .eyebrow{display:block;margin-bottom:8px}
.brand h1{margin:0 0 8px;font-size:1.3rem;line-height:1.2}
.chip{display:inline-block;font:500 .74rem/1 'Lexend',sans-serif;padding:5px 9px;border-radius:99px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.who{display:grid;grid-template-columns:minmax(150px,200px) minmax(170px,230px);gap:6px 8px;align-items:center;max-width:100%}
.who input{width:100%;min-width:0}
.who .status{grid-column:1 / -1;font-size:.78rem;color:var(--ink3);line-height:1.3}
input[type=text],input[type=email],input[type=password],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:2px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;color:var(--ink2);font:500 .9rem 'Lexend',sans-serif;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
main.wrap{padding:36px 16px 64px}
main > .eyebrow{display:block;margin-bottom:8px}
main > h1{margin-bottom:12px}
main > h1 + p{margin:0 0 20px;line-height:1.6}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:600}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.kpi{padding:12px 14px}
.kpi .v{font:600 1.45rem/1.15 'Lexend',sans-serif;margin-bottom:4px}
.kpi .l{font-size:.8rem;color:var(--ink3)}
.lvl-foundation{--lc:var(--found);--ls:var(--found-soft)}
.lvl-core{--lc:var(--core);--ls:var(--core-soft)}
.lvl-extension{--lc:var(--ext);--ls:var(--ext-soft)}
.lvl-placement{--lc:var(--place);--ls:var(--place-soft)}
.lvltag{display:inline-block;font:600 .68rem/1 'Lexend',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:var(--ls);color:var(--lc)}
.modetag{display:inline-block;font:600 .68rem/1 'Lexend',sans-serif;padding:4px 7px;border-radius:6px;border:1px solid var(--line);color:var(--ink2)}
.step-h{display:flex;gap:10px;align-items:center;margin:30px 0 12px}
.step-h .n{font:600 .75rem 'Lexend',sans-serif;background:var(--ink);color:var(--surface);border-radius:99px;padding:3px 9px}
.levelcard{border-top:4px solid var(--lc);cursor:pointer}
.levelcard.sel{outline:2px solid var(--lc);background:var(--ls)}
.levelcard h3{color:var(--lc)}
.testcard{display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--lc)}
.testcard .code{font:600 .8rem 'JetBrains Mono',monospace;color:var(--lc)}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.dots i.on{background:var(--lc)}
.foot{margin-top:40px;text-align:center;font-size:.68rem;opacity:.55;line-height:1.5}

/* test view */
.testbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.stepper{display:flex;gap:4px;flex-wrap:wrap}
.stepper span{font:500 .78rem 'Lexend',sans-serif;padding:5px 10px;border-radius:99px;background:var(--surface2);color:var(--ink3)}
.stepper span.on{background:var(--ink);color:var(--surface)}
.stepper span.done{background:var(--ok-soft);color:var(--ok)}
.timer{font:600 1.05rem 'JetBrains Mono',monospace;padding:5px 12px;border-radius:9px;background:var(--surface2)}
.timer.warn{background:var(--warn-soft);color:var(--warn)}
.timer.crit{background:var(--bad-soft);color:var(--bad)}
.banner{border-radius:var(--r);padding:12px 16px;margin-bottom:12px;border:1px solid var(--line);background:var(--surface)}
.banner.info{background:var(--core-soft);border-color:transparent}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.ok{background:var(--ok-soft);border-color:transparent}
.banner.bad{background:var(--bad-soft);border-color:transparent}
.banner.nudge{animation:nudge .4s}
@keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-height:calc(100vh - 210px);overflow:auto;position:sticky;top:120px}
@media (max-width:900px){.pane{max-height:none;position:static}}
.pane.locked > .inner{filter:blur(6px);pointer-events:none;user-select:none}
.passage h2{font-size:1.15rem}
.passage p{margin:0 0 .85em}
.passage .pl{font:600 .78rem 'Lexend',sans-serif;color:var(--accent);margin-right:6px}
.passage .intro{font-style:italic}
.passage .flash{animation:flash 2.2s}
@keyframes flash{0%,60%{background:var(--warn-soft);box-shadow:0 0 0 4px var(--warn-soft)}100%{background:transparent}}
mark.hl{color:inherit;border-radius:2px;padding:0 1px}
mark.hl-y{background:var(--hl-y)} mark.hl-g{background:var(--hl-g)} mark.hl-b{background:var(--hl-b)} mark.hl-p{background:var(--hl-p)}
mark.ev{background:transparent;box-shadow:inset 0 -3px 0 var(--accent)}
.hltools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:-16px;background:var(--surface);padding:6px 0 10px;z-index:2;border-bottom:1px dashed var(--line);margin-bottom:12px}
.sw{width:26px;height:26px;border-radius:7px;border:2px solid transparent}
.sw.on{border-color:var(--ink)}
.sw.y{background:var(--hl-y)} .sw.g{background:var(--hl-g)} .sw.b{background:var(--hl-b)} .sw.p{background:var(--hl-p)}
.sw.er{background:var(--surface2);font-size:.8rem}
.qgroup{margin-bottom:22px}
.qgroup .gh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.qgroup .ins{margin:2px 0;color:var(--ink2)}
.qgroup .lim{font-weight:700;margin:2px 0 10px}
.qgroup .lim b{color:var(--accent)}
.q{margin:0 0 10px;padding-left:0}
.qn{display:inline-block;min-width:24px;font:600 .82rem 'JetBrains Mono',monospace;color:var(--ink3)}
input.ans{width:170px;padding:3px 8px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);font-size:.92rem}
input.ans::placeholder{color:var(--ink3);font-size:.78rem}
input.ans.ro{background:repeating-linear-gradient(45deg,var(--surface2) 0 6px,var(--surface) 6px 12px);cursor:not-allowed}
input.ans.ok,.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
input.ans.bad,.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
input.ans.lock{pointer-events:none}
.notes{border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--surface)}
.notes .t1{text-align:center;font:600 1.02rem 'Lexend',sans-serif;margin-bottom:8px}
.notes .t2{font-weight:700;margin:8px 0 4px}
.notes .t3{font-style:italic;margin:6px 0 2px}
.notes .b1{margin:3px 0 3px 4px}.notes .b1:before{content:'•  '}
.notes .b2{margin:3px 0 3px 26px}.notes .b2:before{content:'–  '}
.notes .b3{margin:3px 0 3px 50px}.notes .b3:before{content:'◦  '}
table.qt{border-collapse:collapse;width:100%;font-size:.93rem}
table.qt caption{font:600 1rem 'Lexend',sans-serif;margin-bottom:6px}
table.qt th,table.qt td{border:1px solid var(--line);padding:7px 8px;vertical-align:top;text-align:left}
table.qt th{background:var(--surface2);font-family:'Lexend',sans-serif;font-weight:600;font-size:.86rem}
.tablewrap{overflow-x:auto}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0}
.flow .cap{text-align:center;font:600 1rem 'Lexend',sans-serif;margin-bottom:6px}
.flow .fb{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}
.flow .ar{text-align:center;color:var(--ink3);line-height:1.2;font-size:1.1rem}
.wordbox{display:flex;gap:6px;flex-wrap:wrap;border:1px dashed var(--ink3);border-radius:10px;padding:8px 10px;margin:6px 0 10px}
.wordbox span{font-family:'JetBrains Mono',monospace;font-size:.88rem;padding:2px 8px;border-radius:6px;background:var(--surface2)}
.opts{display:inline-flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 10px;font-size:.85rem;font-weight:600}
.opt.on{border-color:var(--ink);background:var(--surface2)}
.hint{font-size:.85rem;background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:6px 10px;margin:4px 0}
.mark-ok{color:var(--ok);font-weight:700}.mark-bad{color:var(--bad);font-weight:700}
.panelnote{font-size:.84rem;color:var(--ink3)}

/* review */
.exp{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--surface)}
.exp.wrong{border-left-color:var(--bad)}
.exp .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.exp .key{font-weight:700;color:var(--ok)}
.exp blockquote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:0 8px 8px 0;font-style:italic}
.pp{width:100%;border-collapse:collapse;font-size:.88rem;margin:6px 0}
.pp th,.pp td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.pp th{background:var(--surface2);font-weight:600}
.lbl{font:600 .72rem 'Lexend',sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-right:6px}
.cause{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.barrow{display:grid;grid-template-columns:170px 1fr 48px;gap:8px;align-items:center;font-size:.88rem;margin:5px 0}
table.data{width:100%;border-collapse:collapse;font-size:.88rem}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.data th{font:600 .78rem 'Lexend',sans-serif;color:var(--ink2);background:var(--surface2)}
.lock{color:var(--ink3);font-size:.85rem}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:99;font-size:.9rem;box-shadow:var(--shadow);max-width:92vw}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:20px;max-width:520px;width:100%;box-shadow:var(--shadow)}
.quiz .qq{margin:10px 0}
details summary{cursor:pointer;font-weight:600}
pre.code{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:.78rem;max-height:340px}

@media print{
  header.top,nav.tabs,.noprint,.foot{display:none!important}
  body{background:#fff;color:#000}
  .card{box-shadow:none;break-inside:avoid}
  .pane{max-height:none;overflow:visible;position:static}
}
@media (max-width:600px){
  .who{grid-template-columns:1fr 1fr;width:100%}
  input.ans{width:130px}
  .barrow{grid-template-columns:110px 1fr 40px}
}
.opts.mc{display:flex;flex-direction:column;align-items:stretch;gap:5px;margin-top:6px}
.opt.mcopt{display:flex;gap:10px;align-items:flex-start;text-align:left;font-weight:400;font-size:.92rem;padding:6px 10px;line-height:1.35}
.opt.mcopt b{flex:0 0 auto;font-family:'JetBrains Mono',monospace}
.q.mcq{margin-bottom:14px}
ol.mlist{list-style:none;padding:0;margin:6px 0}ol.mlist li{margin:3px 0;line-height:1.4}ol.mlist li b{display:inline-block;width:1.4em}
.ow ul{margin:4px 0 4px 18px;padding:0}.ow li{margin:2px 0}
@media (max-width:640px){table.data{display:block;overflow-x:auto;max-width:100%}}
.qn{margin-right:8px}

.hlist{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0 10px;background:var(--surface2)}
.hlist .hlt{font:600 .95rem Lexend,sans-serif;margin-bottom:4px}
.hlist ol{list-style:none;padding:0;margin:0}.hlist li{margin:3px 0;line-height:1.4}.hlist li b{display:inline-block;min-width:2.4em;font-family:'JetBrains Mono',monospace}
.q.hdq{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.q.hdq .hpara{font-weight:600;min-width:6.5em}
.opts.hd{display:inline-flex;flex-wrap:wrap;gap:4px}
.opt.hopt{min-width:2.6em;padding:4px 6px;font-family:'JetBrains Mono',monospace;font-size:.85rem}
.opt.hopt.used{opacity:.4}
.hsel{flex-basis:100%;font-size:.88rem;padding-left:2.2em}
.q.mtq{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.q.mtq .mstmt{flex-basis:100%;line-height:1.5}
.q.mtq .opts.mt{padding-left:2.2em}
</style></head>

<script>window.__LAB__={"name": "IELTS Reading Lab \u2013 Question Type 5", "code": "QT5", "chip": "Matching information (which paragraph?) \u00b7 Matching features (which person?)", "causes": [["type", "Wrong TYPE of information (a reason, a comparison, an example, an estimate \u2026)", "Underline the type word at the start of each question: \u201ca reason why\u201d, \u201ca comparison\u201d, \u201cexamples of\u201d, \u201can estimate of how long\u201d. The paragraph must contain THAT type, not only the same topic."], ["wordmatch", "Chose a paragraph because it repeats a word from the question", "Same word \u2260 same information. Two paragraphs often share a topic word (e.g. \u201c90 percent\u201d, \u201cdoctors\u201d). Check the paraphrase of the whole question."], ["nearest", "Chose the name nearest to the information", "Names often appear before or after the idea, and one paragraph can contain two people. Find who says or thinks it: She, he, they, according to \u2026"], ["reported", "Missed an opinion given without quotation marks", "Reported speech counts: \u201cShe argues \u2026\u201d, \u201cHe maintains \u2026\u201d, \u201cAccording to \u2026\u201d, \u201cBy extension \u2026\u201d. Follow the pronoun back to the name."], ["writer", "Confused the writer's comment with a person's view (or two people's views)", "Separate what each person says from what the writer or another person adds (\u201cLawrence expands on this view\u201d, \u201cThomas agrees\u201d)."], ["several", "Missed that a person is mentioned in more than one place", "Box every mention of each name before answering. The answer is often in the second or third mention."], ["certainty", "Missed how certain the idea is (fact / hope / possibility / estimate)", "Check modal and hedge words: \u201chas potential\u201d \u2260 \u201cis used\u201d; \u201cthe hope is \u2026 yet to be put to the test\u201d = a theory; \u201cwe estimate\u201d = rough calculation."], ["repeat", "Thought each letter can be used only once", "In these tasks a letter may be used more than once (NB) and some letters are not used at all. Do not change a right answer because the letter is already used."], ["synonym", "Did not recognise the paraphrase", "Questions use general nouns for specific details: \u201ca period\u201d = for eight years; \u201cexamples\u201d = for instance; \u201cprofessional groups\u201d = judges, psychiatrists."], ["vocab", "Did not know a key word", "Guess from context, then add the word to your vocabulary list with a synonym."], ["time", "Ran out of time", "About 1.5 minutes per question. Skim and label paragraphs first; answer the easy \u201cscan\u201d questions (numbers, names, dates) first."], ["careless", "Careless / clicked the wrong letter", "Check the letter against your notes before you move on."]], "causesShort": ["wrong type of information", "matching-word trap", "nearest name", "missed reported speech", "writer vs person", "name mentioned again", "certainty level", "assumed no repeats", "missed the paraphrase", "unknown word", "time", "careless"], "choiceLabel": "Option", "place": {"n": 8, "time": 12, "cut1": 3, "cut2": 5, "label": "One Passage 2 task: 4 matching information + 4 matching features (8 questions, 12 minutes)"}, "txt": {"homeH1": "Matching information &amp; Matching features", "homeIntro": "Two tasks, one skill: <b>find the exact place</b>. Matching information asks <b>which paragraph</b> contains a type of information; matching features asks <b>which person (or study, company)</b> said or did something. Routine: <b>label the type of information \u2192 box the names \u2192 scan for the paraphrase \u2192 read the whole sentence (and the next one) \u2192 check who is speaking</b>.", "sources": "Cambridge IELTS 13, 14 and 15 Academic; IELTS Trainer 2 Academic; Mindset for IELTS Level 2 and Level 3 (Cambridge University Press); course Lesson 4 (Matching paragraphs) and Lesson 5 (Matching features).", "howCards": "<div class=\"card\"><h3>Matching information: the 5-step routine</h3><ol>\n    <li><b>Underline the TYPE word</b> in each question: a reason, an example, a comparison, a description, a reference to, an estimate, a suggestion, a warning \u2026</li>\n    <li><b>Underline the content words</b> and think of synonyms (die out \u2192 extinct; prestige \u2192 status).</li>\n    <li><b>Skim and label the paragraphs</b> (2\u20134 words each). Questions are NOT in passage order.</li>\n    <li><b>Scan for the paraphrase</b>, then read the whole sentence: is it the right type of information?</li>\n    <li><b>Remember the NB:</b> one paragraph can contain two answers, and some paragraphs contain none.</li></ol></div>\n  <div class=\"card\"><h3>Matching features: the 5-step routine</h3><ol>\n    <li><b>Box every name</b> in the passage \u2013 people, studies, companies \u2013 including later mentions (\u201che\u201d, \u201cshe\u201d, \u201cThomas agrees\u201d).</li>\n    <li><b>Underline the key idea</b> of each statement. Statements are NOT in passage order.</li>\n    <li><b>Read around each name:</b> the idea is often in the sentence before or after the name, or in reported speech.</li>\n    <li><b>Check who owns the idea:</b> the person, another person, or the writer?</li>\n    <li><b>Letters can be used more than once</b>, and some names in the list are never used.</li></ol></div>\n  <div class=\"card\"><h3>Information-type words</h3><table class=\"data\">\n    <tr><th>Question word</th><th>What to look for in the text</th></tr>\n    <tr><td>a reason / an explanation</td><td>because, this is why, the main cause, due to</td></tr>\n    <tr><td>a comparison / a contrast</td><td>whereas, on the other hand, similar to, more \u2026 than, unlike</td></tr>\n    <tr><td>examples</td><td>for example, for instance, such as, a list of two or more</td></tr>\n    <tr><td>an estimate / a prediction</td><td>about, roughly, we estimate, within the next 10 years, will</td></tr>\n    <tr><td>a reference to / mention of</td><td>a short detail \u2013 maybe one sentence</td></tr>\n    <tr><td>a description / an overview</td><td>several features or stages: first, then, after this</td></tr>\n    <tr><td>a suggestion / an implication</td><td>may, might, suggests \u2013 the idea is not stated directly</td></tr>\n    <tr><td>a theory / a claim</td><td>believed, claimed, the hope is, yet to be tested</td></tr></table></div>", "marking": "<div class=\"card\"><h3>Marking</h3><ul>\n    <li>Click one letter for each question. Each correct letter is one mark.</li>\n    <li>When the instructions say <b>NB You may use any letter more than once</b>, the same letter can be correct for two or more questions. Some letters are not used.</li>\n    <li>In the paper test, write only the letter (A, B, C \u2026).</li></ul></div>", "submitTip": "Check that every question has a letter. Remember: a letter can be used more than once when the instructions say NB.", "hintRule": "(where to look + what to check). After 4 tries, a second hint shows the paraphrase to focus on.", "markingShort": "Letters only. A letter may be used more than once (NB).", "toolkit": "<div class=\"card\"><h3>Toolkit: eight traps in matching tasks</h3><table class=\"data\">\n  <tr><th>Trap</th><th>Example from your exercises</th><th>How to check</th></tr>\n  <tr><td>Wrong type of information</td><td>Harappan Q27 \u201cproposed explanations\u201d = C (a list of causes), not E (evidence for one cause)</td><td>Underline the type word first</td></tr>\n  <tr><td>Same word, other paragraph</td><td>Driverless Q14: \u201c90 percent\u201d in B (collisions) and C (parked)</td><td>Read the whole sentence</td></tr>\n  <tr><td>Nearest name</td><td>Extinct Q24: Novak is just above, but \u201cShe prefers to focus \u2026\u201d = Shapiro</td><td>Follow he / she / they back</td></tr>\n  <tr><td>Reported speech</td><td>Finance and work Q9: Lawrence\u2019s view continues with \u201cShe argues \u2026\u201d \u2013 no quotation marks</td><td>argues, maintains, believes, according to</td></tr>\n  <tr><td>Writer or person?</td><td>Financial crash: \u201cBy extension \u2026\u201d is still Vane\u2019s view, not the writer\u2019s</td><td>Who owns the idea?</td></tr>\n  <tr><td>Name mentioned again</td><td>Lying Q20: Goodger appears in A and again in D; Finance and work Q12: \u201cThomas agrees\u201d in the Haroldson paragraph</td><td>Box every mention</td></tr>\n  <tr><td>Certainty level</td><td>Bugs Q20: alloferon \u201cis used\u201d \u2713 \u2013 wasp venom \u201chas potential\u201d \u2717; Biofuels Q14 \u201cyet to be put to the test\u201d</td><td>is / will / may / the hope is</td></tr>\n  <tr><td>Letters used again</td><td>Extinct Q15 and Q17 are both A; Pillory = three answers in the financial crash task</td><td>Do not cross out letters</td></tr></table></div>", "lesson": "<div class=\"card\"><h3>Lesson 4 \u00b7 Matching information (90 minutes)</h3><ol class=\"small\">\n   <li><b>0\u201310\u2032 Lead-in (F1 Exercise 2).</b> Four quotes about the news: match opinions to speakers using paraphrase (continual exposure = 24 hours a day; confidence = rely on).</li>\n   <li><b>10\u201325\u2032 Types of information (F1 Exercise 8 + F3 Training).</b> Label news extracts (reaction, opinion, summary \u2026) and match phrases (a contrast, a warning \u2026) to extracts.</li>\n   <li><b>25\u201340\u2032 Model (F1 Exercise 5 and Exam skills 15).</b> Think aloud: type word \u2192 synonym \u2192 scan \u2192 read the whole sentence. Show the NB rule.</li>\n   <li><b>40\u201355\u2032 Timed task F3</b> (Sleep, Trainer 2, Questions 14\u201318, 8 min).</li>\n   <li><b>55\u201380\u2032 Error analysis.</b> Students tag causes; build a class table of type words and their signals (because, whereas, for instance, about \u2026).</li>\n   <li><b>80\u201390\u2032 Homework set-up</b> (Homework L4 cards).</li></ol></div>\n  <div class=\"card\"><h3>Lesson 5 \u00b7 Matching features (90 minutes)</h3><ol class=\"small\">\n   <li><b>0\u201310\u2032 Lead-in (F2 Exercise 8).</b> Great entrepreneurs: box the four names, match five statements; discuss Jobs\u2019 \u201cfamily garage\u201d trap.</li>\n   <li><b>10\u201325\u2032 Distractors (F2 Exercise 14).</b> Six people, some not used; Tracey Hayes is not in the list. Read the whole section, not the nearest name.</li>\n   <li><b>25\u201345\u2032 Reported speech (F4 Exercises 4\u20136).</b> Financial crash: who says what? Highlight \u201cwrites\u201d, \u201cmaintains\u201d, \u201cBy extension\u201d.</li>\n   <li><b>45\u201360\u2032 Timed task C1</b> (Laughter, Trainer 2, Questions 14\u201322, 13 min).</li>\n   <li><b>60\u201380\u2032 Error analysis.</b> Focus on nearest name, writer vs person, a name mentioned twice.</li>\n   <li><b>80\u201390\u2032 Homework set-up</b> (Homework L5 cards).</li></ol></div>", "homework": "<div class=\"card\"><h3>Homework by path</h3><ul class=\"small\">\n   <li><b>Homework L4 (matching information):</b> Foundation finish F1, F3 \u00b7 Core C3, C4, C5 \u00b7 Extension E1, E2 (+ P1 if not done).</li>\n   <li><b>Homework L5 (matching features):</b> Foundation F4 \u00b7 Core C2, C6, C7, C8 \u00b7 Extension E3, E4.</li>\n   <li>Everyone: tag error causes, reach 70% to unlock, do the vocabulary revision, send the PDF report.</li></ul></div>", "printRoutine": "<li><b>Matching information:</b> underline the TYPE word \u2192 synonyms \u2192 label the paragraphs \u2192 scan for the paraphrase \u2192 read the whole sentence. A paragraph may be used twice (NB) or not at all.</li>\n    <li><b>Matching features:</b> box every name (and he / she / they) \u2192 read around each name \u2192 check who owns the idea (person or writer?). Letters may be used more than once.</li>\n    <li><b>Answers:</b> write only the letter.</li>"}, "keyStr": "hsrl-qt5-match-2026"};window.__CFG__={"token": "hsp-reading-l4", "lesson": "L4", "defaultEndpoint": "https://script.google.com/macros/s/AKfycbz1Nl3rUpJIO1sv8YpBDyXYmgwuv-Az7x5H0G2ikMS8zSAtqMwBkVatW7AEOC1NkK29/exec", "authHashes": ["d ": {"extinct": {"title": "Should we try to bring extinct species back to life?", "sub": null, "letters": false, "paras": ["@A The passenger pigeon was a legendary species. Flying in vast numbers across North America, with potentially many millions within a single flock, their migration was once one of nature's great spectacles. Sadly, the passenger pigeon's existence came to an end on 1 September 1914, when the last living specimen died at Cincinnati Zoo. Geneticist Ben Novak is lead researcher on an ambitious project which now aims to bring the bird back to life through a process known as 'de-extinction'. The basic premise involves using cloning technology to turn the DNA of extinct animals into a fertilised embryo, which is carried by the nearest relative still in existence – in this case, the abundant band-tailed pigeon – before being born as a living, breathing animal. Passenger pigeons are one of the pioneering species in this field, but they are far from the only ones on which this cutting-edge technology is being trialled.", "@B In Australia, the thylacine, more commonly known as the Tasmanian tiger, is another extinct creature which genetic scientists are striving to bring back to life. 'There is no carnivore now in Tasmania that fills the niche which thylacines once occupied,' explains Michael Archer of the University of New South Wales. He points out that in the decades since the thylacine went extinct, there has been a spread in a 'dangerously debilitating' facial tumour syndrome which threatens the existence of the Tasmanian devils, the island's other notorious resident. Thylacines would have prevented this spread because they would have killed significant numbers of Tasmanian devils. 'If that contagious cancer had popped up previously, it would have burned out in whatever region it started. The return of thylacines to Tasmania could help to ensure that devils are never again subjected to risks of this kind.'", "@C If extinct species can be brought back to life, can humanity begin to correct the damage it has caused to the natural world over the past few millennia? 'The idea of de-extinction is that we can reverse this process, bringing species that no longer exist back to life,' says Beth Shapiro of University of California Santa Cruz's Genomics Institute. 'I don't think that we can do this. There is no way to bring back something that is 100 per cent identical to a species that went extinct a long time ago.' A more practical approach for long-extinct species is to take the DNA of existing species as a template, ready for the insertion of strands of extinct animal DNA to create something new; a hybrid, based on the living species, but which looks and/or acts like the animal which died out.", "@D This complicated process and questionable outcome begs the question: what is the actual point of this technology? 'For us, the goal has always been replacing the extinct species with a suitable replacement,' explains Novak. 'When it comes to breeding, band-tailed pigeons scatter and make maybe one or two nests per hectare, whereas passenger pigeons were very social and would make 10,000 or more nests in one hectare.' Since the disappearance of this key species, ecosystems in the eastern US have suffered, as the lack of disturbance caused by thousands of passenger pigeons wrecking trees and branches means there has been minimal need for regrowth. This has left forests stagnant and therefore unwelcoming to the plants and animals which evolved to help regenerate the forest after a disturbance. According to Novak, a hybridised band-tailed pigeon, with the added nesting habits of a passenger pigeon, could, in theory, re-establish that forest disturbance, thereby creating a habitat necessary for a great many other native species to thrive.", "@E Another popular candidate for this technology is the woolly mammoth. George Church, professor at Harvard Medical School and leader of the Woolly Mammoth Revival Project, has been focusing on cold resistance, the main way in which the extinct woolly mammoth and its nearest living relative, the Asian elephant, differ. By pinpointing which genetic traits made it possible for mammoths to survive the icy climate of the tundra, the project's goal is to return mammoths, or a mammoth-like species, to the area. 'My highest priority would be preserving the endangered Asian elephant,' says Church, 'expanding their range to the huge ecosystem of the tundra. Necessary adaptations would include smaller ears, thicker hair, and extra insulating fat, all for the purpose of reducing heat loss in the tundra, and all traits found in the now extinct woolly mammoth.' This repopulation of the tundra and boreal forests of Eurasia and North America with large mammals could also be a useful factor in reducing carbon emissions – elephants punch holes through snow and knock down trees, which encourages grass growth. This grass growth would reduce temperatures, and mitigate emissions from melting permafrost.", "@F While the prospect of bringing extinct animals back to life might capture imaginations, it is, of course, far easier to try to save an existing species which is merely threatened with extinction. 'Many of the technologies that people have in mind when they think about de-extinction can be used as a form of \"genetic rescue\",' explains Shapiro. She prefers to focus the debate on how this emerging technology could be used to fully understand why various species went extinct in the first place, and therefore how we could use it to make genetic modifications which could prevent mass extinctions in the future. 'I would also say there's an incredible moral hazard to not do anything at all,' she continues. 'We know that what we are doing today is not enough, and we have to be willing to take some calculated and measured risks.'"]}, "oxytocin": {"title": "Oxytocin", "sub": null, "letters": false, "paras": ["## The positive and negative effects of the chemical known as the 'love hormone'", "@A Oxytocin is a chemical, a hormone produced in the pituitary gland in the brain. It was through various studies focusing on animals that scientists first became aware of the influence of oxytocin. They discovered that it helps reinforce the bonds between prairie voles, which mate for life, and triggers the motherly behaviour that sheep show towards their newborn lambs. It is also released by women in childbirth, strengthening the attachment between mother and baby. Few chemicals have as positive a reputation as oxytocin, which is sometimes referred to as the 'love hormone'. One sniff of it can, it is claimed, make a person more trusting, empathetic, generous and cooperative. It is time, however, to revise this wholly optimistic view. A new wave of studies has shown that its effects vary greatly depending on the person and the circumstances, and it can impact on our social interactions for worse as well as for better.", "@B Oxytocin's role in human behaviour first emerged in 2005. In a groundbreaking experiment, Markus Heinrichs and his colleagues at the University of Freiburg, Germany, asked volunteers to do an activity in which they could invest money with an anonymous person who was not guaranteed to be honest. The team found that participants who had sniffed oxytocin via a nasal spray beforehand invested more money than those who received a placebo instead. The study was the start of research into the effects of oxytocin on human interactions. 'For eight years, it was quite a lonesome field,' Heinrichs recalls. 'Now, everyone is interested.' These follow-up studies have shown that after a sniff of the hormone, people become more charitable, better at reading emotions on others' faces and at communicating constructively in arguments. Together, the results fuelled the view that oxytocin universally enhanced the positive aspects of our social nature.", "@C Then, after a few years, contrasting findings began to emerge. Simone Shamay-Tsoory at the University of Haifa, Israel, found that when volunteers played a competitive game, those who inhaled the hormone showed more pleasure when they beat other players, and felt more envy when others won. What's more, administering oxytocin also has sharply contrasting outcomes depending on a person's disposition. Jennifer Bartz from Mount Sinai School of Medicine, New York, found that it improves people's ability to read emotions, but only if they are not very socially adept to begin with. Her research also shows that oxytocin in fact reduces cooperation in subjects who are particularly anxious or sensitive to rejection.", "@D Another discovery is that oxytocin's effects vary depending on who we are interacting with. Studies conducted by Carolyn DeClerck of the University of Antwerp, Belgium, revealed that people who had received a dose of oxytocin actually became less cooperative when dealing with complete strangers. Meanwhile, Carsten De Dreu at the University of Amsterdam in the Netherlands discovered that volunteers given oxytocin showed favouritism: Dutch men became quicker to associate positive words with Dutch names than with foreign ones, for example. According to De Dreu, oxytocin drives people to care for those in their social circles and defend them from outside dangers. So, it appears that oxytocin strengthens biases, rather than promoting general goodwill, as was previously thought.", "@E There were signs of these subtleties from the start. Bartz has recently shown that in almost half of the existing research results, oxytocin influenced only certain individuals or in certain circumstances. Where once researchers took no notice of such findings, now a more nuanced understanding of oxytocin's effects is propelling investigations down new lines. To Bartz, the key to understanding what the hormone does lies in pinpointing its core function rather than in cataloguing its seemingly endless effects. There are several hypotheses which are not mutually exclusive. Oxytocin could help to reduce anxiety and fear. Or it could simply motivate people to seek out social connections. She believes that oxytocin acts as a chemical spotlight that shines on social clues – a shift in posture, a flicker of the eyes, a dip in the voice – making people more attuned to their social environment. This would explain why it makes us more likely to look others in the eye and improves our ability to identify emotions. But it could also make things worse for people who are overly sensitive or prone to interpreting social cues in the worst light.", "@F Perhaps we should not be surprised that the oxytocin story has become more perplexing. The hormone is found in everything from octopuses to sheep, and its evolutionary roots stretch back half a billion years. 'It's a very simple and ancient molecule that has been co-opted for many different functions,' says Sue Carter at the University of Illinois, Chicago, USA. 'It affects primitive parts of the brain like the amygdala, so it's going to have many effects on just about everything.' Bartz agrees. 'Oxytocin probably does some very basic things, but once you add our higher-order thinking and social situations, these basic processes could manifest in different ways depending on individual differences and context.'"]}, "harappan": {"title": "Whatever happened to the Harappan Civilisation?", "sub": null, "letters": false, "paras": ["## New research sheds light on the disappearance of an ancient society", "@A The Harappan Civilisation of ancient Pakistan and India flourished 5,000 years ago, but a thousand years later their cities were abandoned. The Harappan Civilisation was a sophisticated Bronze Age society who built 'megacities' and traded internationally in luxury craft products, and yet seemed to have left almost no depictions of themselves. But their lack of self-imagery - at a time when the Egyptians were carving and painting representations of themselves all over their temples - is only part of the mystery.", "@B 'There is plenty of archaeological evidence to tell us about the rise of the Harappan Civilisation, but relatively little about its fall,' explains archaeologist Dr Cameron Petrie of the University of Cambridge. 'As populations increased, cities were built that had great baths, craft workshops, palaces and halls laid out in distinct sectors. Houses were arranged in blocks, with wide main streets and narrow alleyways, and many had their own wells and drainage systems. It was very much a \"thriving\" civilisation.' Then around 2100 BC, a transformation began. Streets went uncleaned, buildings started to be abandoned, and ritual structures fell out of use. After their final demise, a millennium passed before really large-scale cities appeared once more in South Asia.", "@C Some have claimed that major glacier-fed rivers changed their course, dramatically affecting the water supply and agriculture; or that the cities could not cope with an increasing population, they exhausted their resource base, the trading economy broke down or they succumbed to invasion and conflict; and yet others that climate change caused an environmental change that affected food and water provision. 'It is unlikely that there was a single cause for the decline of the civilisation. But the fact is, until now, we have had little solid evidence from the area for most of the key elements,' said Petrie. 'A lot of the archaeological debate has really only been well-argued speculation.'", "@D A research team led by Petrie, together with Dr Ravindanath Singh of Banaras Hindu University in India, found early in their investigations that many of the archaeological sites were not where they were supposed to be, completely altering understanding of the way that this region was inhabited in the past. When they carried out a survey of how the larger area was settled in relation to sources of water, they found inaccuracies in the published geographic locations of ancient settlements ranging from several hundred metres to many kilometres. They realised that any attempts to use the existing data were likely to be fundamentally flawed. Over the course of several seasons of fieldwork they carried out new surveys, finding an astonishing 198 settlement sites that were previously unknown.", "@E Now, research published by Dr Yama Dixit and Professor David Hodell, both from Cambridge's Department of Earth Sciences, has provided the first definitive evidence for climate change affecting the plains of north-western India, where hundreds of Harappan sites are known to have been situated. The researchers gathered shells of Melanoides tuberculata snails from the sediments of an ancient lake and used geochemical analysis as a means of tracing the climate history of the region. 'As today, the major source of water into the lake is likely to have been the summer monsoon,' says Dixit. 'But we have observed that there was an abrupt change about 4,100 years ago, when the amount of evaporation from the lake exceeded the rainfall - indicative of a drought.' Hodell adds: 'We estimate that the weakening of the Indian summer monsoon climate lasted about 200 years before recovering to the previous conditions, which we still see today.'", "@F It has long been thought that other great Bronze Age civilisations also declined at a similar time, with a global-scale climate event being seen as the cause. While it is possible that these local-scale processes were linked, the real archaeological interest lies in understanding the impact of these larger-scale events on different environments and different populations. 'Considering the vast area of the Harappan Civilisation with its variable weather systems,' explains Singh, 'it is essential that we obtain more climate data from areas close to the two great cities at Mohenjodaro and Harappa and also from the Indian Punjab.'", "@G Petrie and Singh's team is now examining archaeological records and trying to understand details of how people led their lives in the region five millennia ago. They are analysing grains cultivated at the time, and trying to work out whether they were grown under extreme conditions of water stress, and whether they were adjusting the combinations of crops they were growing for different weather systems. They are also looking at whether the types of pottery used, and other aspects of their material culture, were distinctive to specific regions or were more similar across larger areas. This gives us insight into the types of interactive networks the population was involved in, and whether those changed.", "@H Petrie believes that archaeologists are in a unique position to investigate how past societies responded to environmental and climatic change. 'By investigating responses to environmental pressures and threats, we can learn from the past to engage with the public, and the relevant governmental and administrative bodies, to be more proactive in issues such as the management and administration of water supply, the balance of urban and rural development, and the importance of preserving cultural heritage in the future.'"]}, "m25": {"title": "Mindset 2 · Unit 5: business texts", "sub": null, "letters": false, "paras": ["## Text 1 · Great entrepreneurs", "@A Andrew Carnegie was one of the wealthiest businessmen of the 19th century. Mostly self-taught, he started his career as a messenger boy and telegraph operator. By 1889, however, he had become the proud owner of Carnegie Steel Corporation, the largest company of its kind. Famous not only for his success and wealth, he was equally well known for his generous contribution to society. During the last 18 years of his life, it is estimated that he donated roughly $350 million to charities, foundations and universities.", "@B Another success story of the 19th and 20th centuries was the founder of the Ford Motor Company, Henry Ford. Responsible for manufacturing an automobile which could be afforded by the masses, he made a significant impact on society and became incredibly wealthy. Primarily, his success was achieved by using the 'assembly line' to manufacture his cars. Before this, employees of other manufacturers would work in groups to build one car at a time. The moving assembly line meant that each individual was responsible for a specific job. This division of work allowed cars to be produced more quickly and efficiently. With the addition of the world's first automatic conveyor belt, it is estimated that Henry Ford's factory was soon producing a car every 93 minutes.", "@C Estée Lauder started her own beauty company in 1946. Her business, which includes product lines such as Estée Lauder, MAC Cosmetics and Clinique, has had incredible success. Born in Queens, New York, in 1908, she started her first beauty company with a skin cream developed by her uncle - a chemist by profession. Recognised as an innovative businesswoman, Lauder became one of the richest self-made women in the world. She believed her success came from producing high-quality products and focusing on excellent customer service.", "@D Steve Jobs made his fortune by creating some of the most popular products of all time. Born in 1955 in San Francisco, California, Jobs co-founded Apple Computer with Steve Wozniak in 1976, when Jobs was just 21. The project started in the family garage and together they revolutionised the computer industry with products such as the iPod, iPhone, iPad and Mac.", "## Text 2 · Business ideas of the future", "@A The most successful entrepreneurs are those who predict the needs of the future earlier than the competition. No new business start-up is without risk, but the benefits can be immeasurable. Inventions such as the automobile, the internet and the iPad were all initially met with a high degree of criticism, so it is important to maintain the belief that anything is possible! Below are just a few of the business ideas expected to be successful in the future.", "@B Travelling to space used to be possible only for governments or large aerospace companies. This is no longer the case, however, and several private companies have planned tourist missions into space which are going to take place in the next few years. Consulting firm Futron Corporation predict that the space tourism industry will be worth $1.3 billion and have more than 25,000 customers in the next five to ten years. Space tourism pioneer Peter Diamandis also predicts that space hotels are going to be big business, with companies from around the world already working on such projects. Not everyone, however, is as convinced about the prospect of space tourism. Jeffrey Jones, a member of the Center for Space Medicine at Baylor College, warns that even a short journey into space could cause serious health problems for tourists of average or poor health.", "@C Another idea comes from a company in New Zealand called Martin Aircraft. They have produced the first commercially available jetpack, which they plan to start selling next year. Initially, they will be sold to shops and cost approximately $150,000. The craft will work for short trips only, approximately 30 minutes, and manage speeds of up to 74 kph and an altitude of 914 m. The CEO of the company, Peter Coker, notes that, as well as being used by the rich for pleasure, they could also be useful in search-and-rescue operations.", "@D Growing meat in a laboratory is an idea which, understandably, appeals greatly to animal rights activists. Jason Matheny, founder of the not-for-profit company New Harvest, also feels that producing meat in this way would satisfy a growing global demand for meat. It would also be healthier, more energy-efficient and sustainable. The Dutch scientist Professor Post, who served up the world's first laboratory-grown beef burger, predicts that 'cultured meat' will mean the end of traditional cattle farming within decades. Tracey Hayes, the CEO of the Northern Territory Cattlemen's Association in Australia, admits that although this technology could be damaging to the worldwide beef industry, it would not affect Australia, as cattle farming is a great Australian tradition.", "@E According to a recent prediction made by the United Nations, in the future, 86% of people living in developed countries will live in cities. With this in mind, an idea called 'vertical farming' has emerged. Essentially, vertical farming comes from the belief that cities should not rely on rural areas for food but should grow their own crops by creating multi-storey, high-tech greenhouses. The idea for vertical farms came from the ecologist Dickson Despommier, who turned his knowledge of parasites into a way of looking at cities.", "@F Daniel Kluko of Green Spirit Farms predicts that software will be used to look after these multiple farms remotely. For example, an app on a smartphone or tablet will be able to handle the day-to-day care of crops. Kluko also believes that this use of technology will help to keep costs to a minimum, allowing vertical farms to compete with traditional farms."]}, "biofuels": {"title": "Biofuels: are they the fuels of the future?", "sub": null, "letters": false, "paras": ["## Many plants can be turned into biofuels – but which plants and what methods are best?", "@A On paper, biofuels seem the ideal replacement for oil, coal and gas, the fossil fuels we depend upon, and which drive global warming and disrupt weather patterns by releasing carbon dioxide into the atmosphere. But the past decade has seen the biofuel industry face tough questions over whether it can truly claim to be 'green'. One of the biggest criticisms of biofuel crops – at least those that produce the fuel ethanol – has been their impact on food markets and on traditional land use. Direct impacts – for example, cutting down forests to make way for a biofuel crop – are usually obvious, says Professor Bill Laurance, director of the Centre for Tropical Environmental and Sustainability Science at James Cook University. But, in his experience, indirect impacts can be no less devastating for the environment and are far more of a challenge to anticipate.", "@B Let's take Brazil, for example. When farmers in the US opted out of soy in favour of corn as a biofuel crop, soy prices soared, suddenly making it an attractive crop for Brazilian farmers. In turn, this increased demand for freshly deforested cropland in Brazil. Similar situations are occurring all over the world. But while deforestation can certainly lead to economic benefits for farmers, it also puts biodiversity at risk. Then, once a biofuel crop has been planted on deforested land, farmers need to ensure that it grows as well as it can. That means applying large quantities of fertiliser, and while this helps the plants to shoot up, there is also the possibility it will lead to the contamination of local rivers.", "@C Not all biofuels have been grown on land, but the once-popular idea of generating them from microscopic algae grown in ponds or tanks has largely been forgotten. Professor Rachel Burton, leader of the ARC Centre of Excellence for Plant Cell Walls at the University of Adelaide, thinks that there is a smarter way forward for biofuels and it starts with selecting the right crop for land not usually used for agriculture. Burton and others are looking to tough plants that grow on land too dry or salty for conventional crops. Australia, for example, could turn to crops such as agave, hemp or the native saltbush and wild-growing sorghum for the biofuels of the future, she says.", "@D Researchers must also consider economic factors, however. While plant oils can be extracted and turned into biodiesel for vehicles and machinery, currently the process is very expensive – much more so than the process for fossil fuels. Dr Allan Green is innovation leader for bio-based products at CSIRO Agriculture and Food. His solution is to make plants oilier by genetically altering them so that they produce oil in their leaves, not just in their fruit or seeds. With more oil being produced on a particular section of land by the same number of plants, it would become cheaper to harvest and extract the oil. The technology, which has so far only been tested in tobacco, shows that oil production can be boosted to a third or more of a tobacco leaf's weight. If used in a different crop – one that already produces oil in its seeds or fruit – the hope is that oil output could be doubled, though that idea is yet to be put to the test.", "@E A technology which is becoming increasingly popular in the biofuel industry is hydrothermal liquefaction. This is a process which uses heat and pressure to break apart molecules in whole plants and remove oxygen, so that the raw material is turned into 'bio-crude oil'. Then, just as we need to refine the crude oil made from fossil fuels, the plant-based oil is also refined. After this, it can then be turned into different kinds of fuel. One advantage of the hydrothermal liquefaction process is that many kinds of plant can be used. And if this process could run on energy from solar panels or wind farms, it would be much more environmentally sustainable.", "@F New processing technologies are giving biofuel producers hope that, in future, they won't be limited to plants designed to be biofuel-only crops. Perhaps they will be able to choose species that deliver added benefits or sources of income. Hemp crops, for instance, could be used for their oil, but also for their fibre. Some car manufacturers have already used it as a soundproofing material in their vehicles, and others may do the same. And according to Kirsten Heimann, associate professor at the College of Science and Engineering at James Cook University, it might be possible, say, for algae not just to act as a biofuel, but to decontaminate water. Burton believes this kind of multi-purpose use for biofuel crops is the way forward. 'It's much more sophisticated thinking,' she says. 'Biofuels maybe don't need to be as cheap as we think they do, because you can make money out of the other things.' Eventually, the biofuel industry could well develop into a very diverse one, with no one crop or process dominating the market, according to Green. 'The amount of fuel we need to move away from petroleum is massive, so there's plenty of space for all technologies,' he says."]}, "laughter": {"title": "The Science of Human Laughter", "sub": null, "letters": false, "paras": ["@A Human beings love to laugh. It's such an obvious fact that it's easy to overlook. Laughter, like music and language, is a fundamental human trait. Common sense tells us that laughter is associated with happiness. However, there is also a body of scientific evidence proving that laughter is good for us. Studies show that laughter strengthens relationships in both personal and professional life. It has also been established that laughter improves cardiovascular function, boosts the immune system and releases beneficial hormones into the bloodstream. However, according to psychologist Dr Peter Shrimpton, humans might all laugh, but they often don't remember doing it. 'All the studies show that we laugh more frequently than we realise,' says Dr Shrimpton. 'Perhaps because it is such a basic part of human nature, we tend not to notice when we are laughing.'", "@B Infants typically give their first laugh around three to four months of age, long before they can talk. But according to biologists, this isn't because they find something amusing; it is rather a form of non-verbal communication. They laugh to form a closer connection to the people they are with, and adults are little different. 'There is a widespread belief outside the scientific community that we laugh because something is humorous,' says sociologist Jocelyn Barnes. 'While this is true, just as commonly the real purpose of laughter is to promote bonding with other individuals or groups.' This may be partly because it is almost impossible to imitate laughter; even trained actors struggle to mimic a laugh convincingly. So if someone is laughing, the chances are they are being genuine. There's even a difference between a real and a fake smile. In the 19th century, the French neurologist Guillaume Duchenne found that a genuine smile activates the zygomaticus major and orbicularis muscles, and this in turn causes lines to develop called 'crow's feet' at the outside corners of the eyes. No crow's feet appear if the smile is put on.", "@C There is certainly nothing new about joking and laughter. Attempts to be humorous have been found from ancient Egypt, dating from 2600 BC. And a long and detailed joke book called The Laughter Lover, which was written in ancient Rome, still exists today. While of considerable historical value, it may not be all that amusing any more. A professor of classics, Heinrich Ahrends, has studied many such ancient sources and concluded that tastes in jokes have evolved markedly with the passing of the centuries and that the jokes of our forebears would not get much of a laugh today – and vice versa, no doubt. Nonetheless, studies show that almost everyone can find amusement in some form or other. There is a rare neurological disorder named aphonogelia that prevents some people from laughing out loud. However, they may still be amused or entertained, but just express it in different ways.", "@D Much more common is contagious laughter: laughter that spreads uncontrollably between people, sometimes referred to as 'getting the giggles'. Many people will have experienced this themselves, particularly as children, though it also occurs in adults. On one infamous occasion, a group of BBC cricket commentators got the giggles while broadcasting live on radio. And in January 1962 in Tanzania contagious laughter spread through a group of students. Ninety-five pupils were affected and one girl laughed continuously for 16 days. Eventually the situation became so bad that the authorities at the school felt obliged to close it temporarily. In general, however, it is possible for most people to suppress laughter in circumstances where it would be inappropriate. Scientists believe this is possible because in the brain's cerebral cortex there appears to be a laughter switch over which humans have some conscious control.", "@E What is becoming clear to scientists is that laughter is highly complex. It appears, for example, that laughter has the power to override other emotions, at least temporarily. Neurologist Nikki Sokolov is studying the network of brain circuits and neurotransmitters that regulate laughter and other emotions. She hopes her work may provide further insights to explain the processes involved when laughter occurs simultaneously with other, seemingly contradictory emotions, such as crying, for example. Another aspect of humour's complexity is that it is so subjective. What makes one person laugh will be met with stony silence by another. Writer David Mackenzie recognised this from the reactions his own jokes received. Intrigued, Mackenzie conducted an international online survey to establish exactly what makes people laugh and what doesn't, and was surprised by the diverse and often contradictory variety of topics and scenarios that were listed in each category. Understanding humour is still as much an art as a science, according to theatre critic Jake Gottlieb. 'Stand-up comedians are a remarkable type,' says Gottlieb. 'Making jokes for a living is a serious business. You need to be a psychologist and social commentator, be empathetic, self-aware, observant, stubborn and have great timing. Not many of us are so multi-talented.' Perhaps not, but we can still enjoy the instinctive humour of our family and friends, and perhaps sometimes buy a ticket for a show."]}, "bugs": {"title": "Saving bugs to find new drugs", "sub": null, "letters": false, "paras": ["## Zoologist Ross Piper looks at the potential of insects in pharmaceutical research", "@A More drugs than you might think are derived from, or inspired by, compounds found in living things. Looking to nature for the soothing and curing of our ailments is nothing new – we have been doing it for tens of thousands of years. You only have to look at other primates – such as the capuchin monkeys who rub themselves with toxin-oozing millipedes to deter mosquitoes, or the chimpanzees who use noxious forest plants to rid themselves of intestinal parasites – to realise that our ancient ancestors too probably had a basic grasp of medicine.", "@B Pharmaceutical science and chemistry built on these ancient foundations and perfected the extraction, characterisation, modification and testing of these natural products. Then, for a while, modern pharmaceutical science moved its focus away from nature and into the laboratory, designing chemical compounds from scratch. The main cause of this shift is that although there are plenty of promising chemical compounds in nature, finding them is far from easy. Securing sufficient numbers of the organism in question, isolating and characterising the compounds of interest, and producing large quantities of these compounds are all significant hurdles.", "@C Laboratory-based drug discovery has achieved varying levels of success, something which has now prompted the development of new approaches focusing once again on natural products. With the ability to mine genomes for useful compounds, it is now evident that we have barely scratched the surface of nature's molecular diversity. This realisation, together with several looming health crises, such as antibiotic resistance, has put bioprospecting – the search for useful compounds in nature – firmly back on the map.", "@D Insects are the undisputed masters of the terrestrial domain, where they occupy every possible niche. Consequently, they have a bewildering array of interactions with other organisms, something which has driven the evolution of an enormous range of very interesting compounds for defensive and offensive purposes. Their remarkable diversity exceeds that of every other group of animals on the planet combined. Yet even though insects are far and away the most diverse animals in existence, their potential as sources of therapeutic compounds is yet to be realised.", "@E From the tiny proportion of insects that have been investigated, several promising compounds have been identified. For example, alloferon, an antimicrobial compound produced by blow fly larvae, is used as an antiviral and antitumor agent in South Korea and Russia. The larvae of a few other insect species are being investigated for the potent antimicrobial compounds they produce. Meanwhile, a compound from the venom of the wasp Polybia paulista has potential in cancer treatment.", "@F Why is it that insects have received relatively little attention in bioprospecting? Firstly, there are so many insects that, without some manner of targeted approach, investigating this huge variety of species is a daunting task. Secondly, insects are generally very small, and the glands inside them that secrete potentially useful compounds are smaller still. This can make it difficult to obtain sufficient quantities of the compound for subsequent testing. Thirdly, although we consider insects to be everywhere, the reality of this ubiquity is vast numbers of a few extremely common species. Many insect species are infrequently encountered and very difficult to rear in captivity, which, again, can leave us with insufficient material to work with.", "@G My colleagues and I at Aberystwyth University in the UK have developed an approach in which we use our knowledge of ecology as a guide to target our efforts. The creatures that particularly interest us are the many insects that secrete powerful poison for subduing prey and keeping it fresh for future consumption. There are even more insects that are masters of exploiting filthy habitats, such as faeces and carcasses, where they are regularly challenged by thousands of micro-organisms. These insects have many antimicrobial compounds for dealing with pathogenic bacteria and fungi, suggesting that there is certainly potential to find many compounds that can serve as or inspire new antibiotics.", "@H Although natural history knowledge points us in the right direction, it doesn't solve the problems associated with obtaining useful compounds from insects. Fortunately, it is now possible to snip out the stretches of the insect's DNA that carry the codes for the interesting compounds and insert them into cell lines that allow larger quantities to be produced. And although the road from isolating and characterising compounds with desirable qualities to developing a commercial product is very long and full of pitfalls, the variety of successful animal-derived pharmaceuticals on the market demonstrates there is a precedent here that is worth exploring.", "@I With every bit of wilderness that disappears, we deprive ourselves of potential medicines. As much as I'd love to help develop a groundbreaking insect-derived medicine, my main motivation for looking at insects in this way is conservation. I sincerely believe that all species, however small and seemingly insignificant, have a right to exist for their own sake. If we can shine a light on the darker recesses of nature's medicine cabinet, exploring the useful chemistry of the most diverse animals on the planet, I believe we can make people think differently about the value of nature."]}, "trends": {"title": "Making the most of trends", "sub": null, "letters": false, "paras": ["## Experts from Harvard Business School give advice to managers", "Most managers can identify the major trends of the day. But in the course of conducting research in a number of industries and working directly with companies, we have discovered that managers often fail to recognize the less obvious but profound ways these trends are influencing consumers' aspirations, attitudes, and behaviors. This is especially true of trends that managers view as peripheral to their core markets.", "Many ignore trends in their innovation strategies or adopt a wait-and-see approach and let competitors take the lead. At a minimum, such responses mean missed profit opportunities. At the extreme, they can jeopardize a company by ceding to rivals the opportunity to transform the industry. The purpose of this article is twofold: to spur managers to think more expansively about how trends could engender new value propositions in their core markets, and to provide some high-level advice on how to make market research and product development personnel more adept at analyzing and exploiting trends.", "One strategy, known as 'infuse and augment', is to design a product or service that retains most of the attributes and functions of existing products in the category but adds others that address the needs and desires unleashed by a major trend. A case in point is the Poppy range of handbags, which the firm Coach created in response to the economic downturn of 2008. The Coach brand had been a symbol of opulence and luxury for nearly 70 years, and the most obvious reaction to the downturn would have been to lower prices. However, that would have risked cheapening the brand's image. Instead, they initiated a consumer-research project which revealed that customers were eager to lift themselves and the country out of tough times. Using these insights, Coach launched the lower-priced Poppy handbags, which were in vibrant colors, and looked more youthful and playful than conventional Coach products. Creating the sub-brand allowed Coach to avert an across-the-board price cut. In contrast to the many companies that responded to the recession by cutting prices, Coach saw the new consumer mindset as an opportunity for innovation and renewal.", "A further example of this strategy was supermarket Tesco's response to consumers' growing concerns about the environment. With that in mind, Tesco, one of the world's top five retailers, introduced its Greener Living program, which demonstrates the company's commitment to protecting the environment by involving consumers in ways that produce tangible results. For example, Tesco customers can accumulate points for such activities as reusing bags, recycling cans and printer cartridges, and buying home-insulation materials. Like points earned on regular purchases, these green points can be redeemed for cash. Tesco has not abandoned its traditional retail offerings but augmented its business with these innovations, thereby infusing its value proposition with a green streak.", "A more radical strategy is 'combine and transcend'. This entails combining aspects of the product's existing value proposition with attributes addressing changes arising from a trend, to create a novel experience – one that may land the company in an entirely new market space.", "At first glance, spending resources to incorporate elements of a seemingly irrelevant trend into one's core offerings sounds like it's hardly worthwhile. But consider Nike's move to integrate the digital revolution into its reputation for high-performance athletic footwear. In 2006, they teamed up with technology company Apple to launch Nike+, a digital sports kit comprising a sensor that attaches to the running shoe and a wireless receiver that connects to the user's iPod. By combining Nike's original value proposition for amateur athletes with one for digital consumers, the Nike+ sports kit and web interface moved the company from a focus on athletic apparel to a new plane of engagement with its customers.", "A third approach, known as 'counteract and reaffirm', involves developing products or services that stress the values traditionally associated with the category in ways that allow consumers to oppose – or at least temporarily escape from – the aspects of trends they view as undesirable. A product that accomplished this is the ME2, a video game created by Canada's iToys. By reaffirming the toy category's association with physical play, the ME2 counteracted some of the widely perceived negative impacts of digital gaming devices. Like other handheld games, the device featured a host of exciting interactive games, a full-color LCD screen, and advanced 3D graphics. What set it apart was that it incorporated the traditional physical component of children's play: it contained a pedometer, which tracked and awarded points for physical activity (walking, running, biking, skateboarding, climbing stairs). The child could use the points to enhance various virtual skills needed for the video game. The ME2, introduced in mid-2008, catered to kids' huge desire to play video games while countering the negatives, such as associations with lack of exercise and obesity.", "Once you have gained perspective on how trend-related changes in consumer opinions and behaviors impact on your category, you can determine which of our three innovation strategies to pursue. When your category's basic value proposition continues to be meaningful for consumers influenced by the trend, the infuse-and-augment strategy will allow you to reinvigorate the category. If analysis reveals an increasing disparity between your category and consumers' new focus, your innovations need to transcend the category to integrate the two worlds. Finally, if aspects of the category clash with undesired outcomes of a trend, such as associations with unhealthy lifestyles, there is an opportunity to counteract those changes by reaffirming the core values of your category.", "Trends – technological, economic, environmental, social, or political – that affect how people perceive the world around them and shape what they expect from products and services present firms with unique opportunities for growth."]}, "skyscraper": {"title": "Back to the future of skyscraper design", "sub": null, "letters": false, "paras": ["## Answers to the problem of excessive electricity use by skyscrapers and large public buildings can be found in ingenious but forgotten architectural designs of the 19th and early-20th centuries", "@A The Recovery of Natural Environments in Architecture by Professor Alan Short is the culmination of 30 years of research and award-winning green building design by Short and colleagues in Architecture, Engineering, Applied Maths and Earth Sciences at the University of Cambridge.", "@- 'The crisis in building design is already here,' said Short. 'Policy makers think you can solve energy and building problems with gadgets. You can't. As global temperatures continue to rise, we are going to continue to squander more and more energy on keeping our buildings mechanically cool until we have run out of capacity.'", "@B Short is calling for a sweeping reinvention of how skyscrapers and major public buildings are designed – to end the reliance on sealed buildings which exist solely via the 'life support' system of vast air conditioning units.", "@- Instead, he shows it is entirely possible to accommodate natural ventilation and cooling in large buildings by looking into the past, before the widespread introduction of air conditioning systems, which were 'relentlessly and aggressively marketed' by their inventors.", "@C Short points out that to make most contemporary buildings habitable, they have to be sealed and air conditioned. The energy use and carbon emissions this generates is spectacular and largely unnecessary. Buildings in the West account for 40-50% of electricity usage, generating substantial carbon emissions, and the rest of the world is catching up at a frightening rate. Short regards glass, steel and air-conditioned skyscrapers as symbols of status, rather than practical ways of meeting our requirements.", "@D Short's book highlights a developing and sophisticated art and science of ventilating buildings through the 19th and earlier-20th centuries, including the design of ingeniously ventilated hospitals. Of particular interest were those built to the designs of John Shaw Billings, including the first Johns Hopkins Hospital in the US city of Baltimore (1873-1889).", "@- 'We spent three years digitally modelling Billings' final designs,' says Short. 'We put pathogens* in the airstreams, modelled for someone with tuberculosis (TB) coughing in the wards and we found the ventilation systems in the room would have kept other patients safe from harm.", "@E 'We discovered that 19th-century hospital wards could generate up to 24 air changes an hour – that's similar to the performance of a modern-day, computer-controlled operating theatre. We believe you could build wards based on these principles now.", "@- Single rooms are not appropriate for all patients. Communal wards appropriate for certain patients – older people with dementia, for example – would work just as well in today's hospitals, at a fraction of the energy cost.'", "@- Professor Short contends the mindset and skill-sets behind these designs have been completely lost, lamenting the disappearance of expertly designed theatres, opera houses, and other buildings where up to half the volume of the building was given over to ensuring everyone got fresh air.", "@F Much of the ingenuity present in 19th-century hospital and building design was driven by a panicked public clamouring for buildings that could protect against what was thought to be the lethal threat of miasmas – toxic air that spread disease. Miasmas were feared as the principal agents of disease and epidemics for centuries, and were used to explain the spread of infection from the Middle Ages right through to the cholera outbreaks in London and Paris during the 1850s. Foul air, rather than germs, was believed to be the main driver of 'hospital fever', leading to disease and frequent death. The prosperous steered clear of hospitals.", "@- While miasma theory has been long since disproved, Short has for the last 30 years advocated a return to some of the building design principles produced in its wake.", "@G Today, huge amounts of a building's space and construction cost are given over to air conditioning. 'But I have designed and built a series of buildings over the past three decades which have tried to reinvent some of these ideas and then measure what happens.", "@- 'To go forward into our new low-energy, low-carbon future, we would be well advised to look back at design before our high-energy, high-carbon present appeared. What is surprising is what a rich legacy we have abandoned.'", "@H Successful examples of Short's approach include the Queen's Building at De Montfort University in Leicester. Containing as many as 2,000 staff and students, the entire building is naturally ventilated, passively cooled and naturally lit, including the two largest auditoria, each seating more than 150 people. The award-winning building uses a fraction of the electricity of comparable buildings in the UK.", "@- Short contends that glass skyscrapers in London and around the world will become a liability over the next 20 or 30 years if climate modelling predictions and energy price rises come to pass as expected.", "@I He is convinced that sufficiently cooled skyscrapers using the natural environment can be produced in almost any climate. He and his team have worked on hybrid buildings in the harsh climates of Beijing and Chicago – built with natural ventilation assisted by back-up air conditioning – which, surprisingly perhaps, can be switched off more than half the time on milder days and during the spring and autumn.", "@- Short looks at how we might reimagine the cities, offices and homes of the future. Maybe it's time we changed our outlook.", "* pathogens: microorganisms that can cause disease"]}, "driverless": {"title": "Driverless cars", "sub": null, "letters": false, "paras": ["@A The automotive sector is well used to adapting to automation in manufacturing. The implementation of robotic car manufacture from the 1970s onwards led to significant cost saving
