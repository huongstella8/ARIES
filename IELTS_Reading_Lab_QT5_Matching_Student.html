s and improvements in the reliability and flexibility of vehicle mass production. A new challenge to vehicle production is now on the horizon and, again, it comes from automation. However, this time it is not to do with the manufacturing process, but with the vehicles themselves.", "@- Research projects on vehicle automation are not new. Vehicles with limited self-driving capabilities have been around for more than 50 years, resulting in significant contributions towards driver assistance systems. But since Google announced in 2010 that it had been trialling self-driving cars on the streets of California, progress in this field has quickly gathered pace.", "@B There are many reasons why technology is advancing so fast. One frequently cited motive is safety; indeed, research at the UK's Transport Research Laboratory has demonstrated that more than 90 percent of road collisions involve human error as a contributory factor, and it is the primary cause in the vast majority. Automation may help to reduce the incidence of this.", "@- Another aim is to free the time people spend driving for other purposes. If the vehicle can do some or all of the driving, it may be possible to be productive, to socialise or simply to relax while automation systems have responsibility for safe control of the vehicle. If the vehicle can do the driving, those who are challenged by existing mobility models - such as older or disabled travellers – may be able to enjoy significantly greater travel autonomy.", "@C Beyond these direct benefits, we can consider the wider implications for transport and society, and how manufacturing processes might need to respond as a result. At present, the average car spends more than 90 percent of its life parked. Automation means that initiatives for car-sharing become much more viable, particularly in urban areas with significant travel demand. If a significant proportion of the population choose to use shared automated vehicles, mobility demand can be met by far fewer vehicles.", "@D The Massachusetts Institute of Technology investigated automated mobility in Singapore, finding that fewer than 30 percent of the vehicles currently used would be required if fully automated car sharing could be implemented. If this is the case, it might mean that we need to manufacture far fewer vehicles to meet demand.", "@- However, the number of trips being taken would probably increase, partly because empty vehicles would have to be moved from one customer to the next.", "@- Modelling work by the University of Michigan Transportation Research Institute suggests automated vehicles might reduce vehicle ownership by 43 percent, but that vehicles' average annual mileage would double as a result. As a consequence, each vehicle would be used more intensively, and might need replacing sooner. This faster rate of turnover may mean that vehicle production will not necessarily decrease.", "@E Automation may prompt other changes in vehicle manufacture. If we move to a model where consumers are tending not to own a single vehicle but to purchase access to a range of vehicles through a mobility provider, drivers will have the freedom to select one that best suits their needs for a particular journey, rather than making a compromise across all their requirements.", "@- Since, for most of the time, most of the seats in most cars are unoccupied, this may boost production of a smaller, more efficient range of vehicles that suit the needs of individuals. Specialised vehicles may then be available for exceptional journeys, such as going on a family camping trip or helping a son or daughter move to university.", "@F There are a number of hurdles to overcome in delivering automated vehicles to our roads. These include the technical difficulties in ensuring that the vehicle works reliably in the infinite range of traffic, weather and road situations it might encounter; the regulatory challenges in understanding how liability and enforcement might change when drivers are no longer essential for vehicle operation; and the societal changes that may be required for communities to trust and accept automated vehicles as being a valuable part of the mobility landscape.", "@G It's clear that there are many challenges that need to be addressed but, through robust and targeted research, these can most probably be conquered within the next 10 years. Mobility will change in such potentially significant ways and in association with so many other technological developments, such as telepresence and virtual reality, that it is hard to make concrete predictions about the future. However, one thing is certain: change is coming, and the need to be flexible in response to this will be vital for those involved in manufacturing the vehicles that will deliver future mobility."]}, "lying": {"title": "The Truth about Lying", "sub": null, "letters": false, "paras": ["@A An area of scientific study that caught the public imagination during the 1970s involved a gorilla called Koko. Animal psychologist Francine Patterson claimed to have taught Koko a simplified form of American Sign Language, and through signing, Koko could apparently communicate basic ideas such as 'food' and 'more', as well as concepts such as 'good' and 'sorry'. But Koko also used signs to blame other people for damage she had caused herself. While today there is some dispute about whether Koko truly understood the meaning of all the signs she made, Professor Karen Goodger believes she was certainly capable of dishonesty. 'People use words to lie, but for animals with higher brain functions, there's also a higher probability that they'll demonstrate manipulative behaviours. We see this not just in gorillas, but in other creatures with a large neocortex.'", "@B Human societies may appear to disapprove of lying, but that doesn't mean we don't all do it. And it seems that the ability, or at least the desire to deceive, starts from an early age. In one study run by psychologist Kang Lee, children were individually brought into a laboratory and asked to face a wall. They were asked to guess what toy one of Lee's fellow researchers had placed on a table behind them - for example, a fluffy cat or dog. The researcher would then announce they had to leave the lab to take a phone call, reminding the child not to turn around. The research team were well aware that many children would be unable to resist peeking at the toy. Secret cameras showed that 30% of two-year-old children lied about not looking. This went up to 50% for three-year-olds and almost 80% of eight-year-olds. Interestingly, whereas the younger children simply named the toy and denied taking a peek, the older ones came up with some interesting reasons to explain how they had identified the toy correctly. Lee is reassured by this trend, seeing it as evidence in each case that the cognitive growth of a human child is progressing as it should. Parents, of course, may not be so pleased.", "@C Adults, however, can hardly criticise children. According to Professor Richard Wiseman, it appears that adults typically tell two major lies per day, and that one third of adult conversations contain an element of dishonesty. Other research indicates that spouses lie in one out of every 10 interactions. This probably comes as no surprise to Tali Sharot at University College London, who has run a series of experiments proving we become desensitised to lying over time. She has found that while we might initially experience a sense of shame about small lies, this feeling eventually wears off. The result, Sharot has found, is that we progress to more serious ones.", "@D Other researchers, including Tim Levine at the University of Alabama, have analysed our motives for lying. By far the most common is our desire to cover up our own wrongdoing. Second to this are lies we tell to gain economic advantage – we might lie during an interview to increase the chances of getting a job. Interestingly, 'white lies', the kind we tell to avoid hurting people's feelings, account only for a small percentage of our untruths. But if we recognise our own tendency to lie, why don't we recognise it in others? Professor Goodger thinks it has something to do with our strong desire for certain information we hear to be true, even when we might suspect it isn't. This is because we might be 'comforted by others' lies or excited by the promise of a good outcome', Goodger says.", "@E We might not expect ordinary people to be good at recognising lies, but what about people whose job it is to investigate the behaviour of others? Paul Ekman is a psychologist from the University of California. As part of his research into deception, he has invited a range of experts to view videos of people telling lies and of others telling the truth. Among the experts have been judges, psychiatrists and people who operate polygraph machines for police investigations. None of these experts have shown they can detect dishonesty any better than people without their experience. Part of the problem is that so many myths still prevail about 'give-away signs' indicating that someone is lying.", "@F A common claim, for example, is that liars won't look people in the eye during their explanations or while being questioned. Another is that they are likely to gesture as they tell their story, but so frequently that it seems unnatural – as if they are trying to convince others of their sincerity. However, many researchers have come to reject these ideas, suggesting a more effective approach is to listen to their narration style. A difficulty that liars face is having to remember exactly what they said, which is why they don't provide as many details as a person giving an honest account would. It is also typical of liars to mentally rehearse their story, and this is why one stage follows another in apparently chronological fashion. Honest stories, however, feature revisions and repetition. Recent research has also disproved the widely believed notion that liars have a habit of fidgeting in their seats. Rather, it seems that they keep still, especially in the upper body, possibly hoping to give the impression of self-assurance. Liars also put some psychological distance between themselves and their lies. For that reason, they avoid the use of 'I' when narrating their stories. The reverse is true, however, when people write fake reviews of, say, a hotel or restaurant. In these instances, 'I' features again and again as they attempt to convince us that their experience was real."]}, "m34": {"title": "Mindset 3 · Unit 4: finance and work texts", "sub": null, "letters": false, "paras": ["## Text 1 · The financial crash – who was to blame?", "There was once a widely held belief that people who were in debt, but who could not afford to pay back that debt, should be punished severely. At the end of the 19th century, those unable to repay what they owed were arrested, taken to court, and ultimately sent to 'debtors' prisons', locked away until they had worked off what they owed. To be in debt, in the eyes of society, was unacceptable. And yet, by the time we reached the first years of the 21st century, the idea that owning debt was something positive, even productive, had become commonplace in many parts of the world. So much so, that the global financial crash of 2008, in the eyes of many observers, was entirely inevitable.", "At the end of the 20th century, the general financial climate was stable and healthy. Commercial banks and investment banks for a number of years had mostly functioned separately from one another. When people put their income or savings into an investment, it was often done without a great deal of risk, and they tended not to make an astonishing amount of money. But this was soon to change in a disastrous way, writes Alicia Pillory in The Great Deception. In the early 2000s, 'investment bankers devised an opportunity to make huge profits by buying mortgage loans from commercial banks and mortgage lenders'. She explains how the investment banks then created 'packages' of these loans and sold them to individual investors. 'The grand, misguided theory was that any repayments would have to be made to the companies or people who now owned the mortgages, and everyone would get rich.'", "Huge numbers of investors brought their money to the table. They were given confidence by the fact that the packages being offered to them had apparently been assessed and passed by the credit rating agencies. The main purpose of these organisations is to evaluate in a neutral way the amount of risk an individual or company might face in a potential investment. The fundamental problem, as Charles Vane sets out in The End of Innocence, was that these credit rating agencies were actually paid by the investment banks themselves, and the agencies were happy to provide the first-class 'AAA' ratings which did so much to convince potential investors to part with their money: 'which is actually very far from being neutral'. It seems unthinkable now that this was the case, but it was not uncommon at the time. 'We have to take that into consideration before isolating and criticising the investment banks too harshly.'", "The investment banks, now free to offer home loans to anyone, regardless of how much that person earned or was even likely to earn, began offering mortgages to new borrowers: people who were in low-paid employment, and who had no savings at all. Huge levels of debt were provided to those who, within two or three years, would have no way of meeting the monthly repayments. 'So many people were taken advantage of,' writes Pillory, and 'this irresponsible lending behaviour was never made to stop, with no ultimate consequences for the bankers, who simply became very, very rich'. She maintains that the authorities could, and should, have put a stop to it earlier. Instead, 'at this point, another industry saw the potential for profit and greedily stepped in'.", "Insurance companies commonly offer protection against personal debt (for example, when somebody takes out a mortgage but wants to make sure that, if they suffer an unexpected accident and cannot work, the debt will be paid not by themselves, but by that company). However, in the early part of the 21st century, people suddenly became able to buy insurance for properties they did not even own. In other words, when a family could no longer afford the repayments on their home and had to leave, another person - who they had never met, maybe even living on the other side of the country could claim a huge amount of money from the insurance company, simply because they had bought a policy for that particular property. In The Crash: Reasons and Repercussions, Dr Alfred Moran writes, 'The AAA ratings gave everyone a dishonest guarantee that the system could not collapse. Unfortunately for the world's economy, the insurance companies followed those ratings blindly.' Eventually, in 2008, the system did indeed collapse, on a devastating scale.", "Despite this, he emphasises, it should not be overlooked that it was actually the investment banks who paid the ratings agencies in the first place, and so the AAA rating was essentially funded by those who would exploit it – it is they who are most to blame. Pillory contends, however, that we should vent our strongest anger towards the dangerously 'hands-off' approach of western governments at the time, while Vane avoids placing the entire blame at the feet of either the banks, or their governments and regulators. He maintains that, in the western world, the attitude towards debt is careless. 'Chinese people, for example, often put 30% of their income into saving; this sensible attitude to money is commonly seen in Asian countries. In comparison, in Europe and the US, you rarely see anyone putting aside more than 5% of their earnings. This is extremely unwise.' By extension, those people who borrowed money to buy a house, knowing that they could never afford to pay that money back in their entire lifetimes, must take the major share of the blame.", "As Alicia Pillory laments, 'We are living through the worst recession for 80 years, all because a comparatively small number of people working in the financial sector could not control their greed.' Whatever the root causes of this highly devastating period in our history, the one thing that experts seem to agree on is that our shared financial wellbeing is unlikely to return to full health at any point soon. Perhaps it is even time to reconsider some 19th-century notions of how we are supposed to feel about debt.", "* mortgage: a loan given by a bank to help someone buy a place to live (e.g. house, flat)", "## Text 2 · The changing world of work (exam skills passage)", "The accepted concept of a career path followed a similar pattern for decades. After completing their education, people would enter the adult world of work, settling down to a job in which they would likely remain from that point onward. Not only would this occupation provide their income for their entire working life, it would also allow them a healthy pension when they retired and moved into old age. Over the past twenty years, however, the relationship between a wage earner and their chosen profession has changed enormously. Today, the idea of a 'job-for-life' has all but disappeared, to be replaced by an unforgiving world of unstable employment. Some observers even argue that current society appears to pit old against young in a constant battle to find work of some description, all against a backdrop of increasing debt and economic difficulties.", "At the same time, the government regularly releases figures that suggest that the economy is prospering, evidencing this claim with the fact that the unemployment rate continues to fall annually. Given this claim, logic would seem to dictate that, since there are fewer people out of work, an increasing number of people are enjoying a regular income. To dispute this, Frank Thomas's 2016 study on the nature of work, Employment as a Myth, revealed an interesting and contradictory interpretation. There are indeed more jobs available. However, a huge number of these are casual, temporary or short-term positions, all of which are low-paid and create little in the way of tax income for the government. This has a number of debilitating long-term effects, not least because this assurance of a growing economy is based more in myth than fact. Thomas explains, 'Without tax income, the economy cannot grow; if the economy stays weak, new jobs will not be created.'", "He also illustrates how, around the world, increases in life expectancy have created a problem for a huge number of retired workers, who are starting to find that the sum of money they have saved for their retirement does not stretch far enough to provide the financial security that they had expected. As a result, there has been a widespread return of these workers to the job market, very often in search of the type of casual employment that was once the preserve of people in their late teens and early 20s. Lois Lawrence expands on this view in Unfair Returns: 'Older people are taking opportunities away from their grandchildren. Post-education, those new to the world of work are not able to earn any sort of living wage, nor are they getting the opportunity to develop the 'soft skills', e.g. social intelligence, that will enable them to flourish in the job market.'", "For Lawrence, the days of the salaried worker - comfortable, assured, financially secure - are coming to an end, and are being replaced by a new model: the exploited worker. Instead, these are the days of the 'zero-hours' contract, where an employee is told by an employer to be available for work, but is not necessarily given any, and so earns nothing for their time simply spent waiting. She argues that this is causing even more inequality in the employment market, as business leaders realise that they have no obligation to provide their staff with a full- or part-time contract, and can therefore avoid additional expenditure. The 'zero-hours' worker receives no holiday or sick pay, and is considered to be self-employed, so has to pay their own taxes. They also have no hope of stability, and can be instantly dismissed without any hope of recourse. Employment laws, written decades ago at a time when the vast majority of the country's workforce benefitted from permanent positions, do not protect the new breed of worker from being unfairly dismissed at a moment's notice by their manager.", "Less pessimistic interpretations of today's employment market do exist elsewhere. A 2015 study by William Haroldson, How the Market Adjusts to Opportunity, advocated a definition of a new type of multi-skilled worker: the model employee who not only refuses to age, but also does not want to work in the same office every day, or even to be an employee in the first place. In such a progressive, forward-looking environment, young and old are supposed to collaborate extensively, sharing the benefits of each other's talents and prior knowledge. Furthermore, although younger people are traditionally thought to be more willing to try any number of routes into work before deciding on an industry in which they want to develop, such an approach to employment no longer excludes workers of a more advanced age. Thomas agrees: 'Most of today's self-starters believe that the job market offers a vast array of potential opportunities from which they can learn and gain experience. Whether they have a wide range of existing experience, or none at all, is irrelevant to them.'", "Moving from job to job is no longer seen in a negative way, he goes on to argue. In the past, anyone with a series of short-term positions on their CV was seen as unreliable or disloyal. Most of today's self-starters, however, approach the job market as a vast source of possibilities, while employers themselves are more likely to be entrepreneurs who are willing to accept job mobility without question, and less likely to punish potential staff for doing so. One positive result of this development is that 'soft skills' such as social intelligence can therefore be learnt in a new way, and through a greater number of person-to-person encounters than used to be available. This has been made possible through the fact that so much of human contact today now takes place in one enormous meeting room - the internet. Even if it means that the people in contact are not actually present together in the same room, the encounter still happens."]}, "sleep": {"title": "Sleep should be prescribed: what those late nights out could be costing you", "sub": null, "letters": false, "paras": ["## Leading neuroscientist Matthew Walker on why sleep is so important and what you can do about it", "@A Matthew Walker dreads the question \"What do you do?\" On an aeroplane it usually means that while everyone else watches movies, he will find himself giving a talk for the benefit of passengers and crew alike. To be specific, Walker is the director of the Center for Human Sleep Science at the University of California. No wonder people long for his advice. As the line between work and leisure grows more blurred, rare is the person who doesn't worry about their sleep. Indeed, it's Walker's conviction that we are in the midst of a 'catastrophic sleep-loss epidemic'. He has now written Why We Sleep, the idea being that once people know of the powerful links between sleep loss and poor health, they will try harder to get the recommended eight hours a night. Sleep deprivation constitutes anything less than seven. 'No one is doing anything about it but things have to change. But when did you ever see a national health service poster urging sleep on people? When did a doctor prescribe, not sleeping pills, but sleep itself? It needs to be prioritised.'", "@B Why are we so sleep-deprived in this century? In 1942, less than 8% of the population was trying to survive on six hours or less sleep a night; in 2017, almost one in two people is. Some reasons are obvious, but Walker believes, too, that in the developed world sleep is strongly associated with weakness. 'We want to seem busy, and one way we express that is by proclaiming how little sleep we're getting. When I give lectures, people wait behind until there is no one around and then tell me quietly: \"I seem to be one of those people who need eight or nine hours' sleep.\" It's embarrassing to say it in public.'", "@C Walker has found clear evidence that without sleep, there is low energy and disease, and with sleep, there is vitality and health. More than 20 studies all report the same relationship: the shorter your sleep, the shorter your life. For example, adults aged 45 years or older who sleep less than six hours a night are 200% more likely to have a heart attack, as compared with those sleeping seven or eight. This is because even one night of sleep reduction will affect a person's heart and significantly increase their blood pressure as a result. Walker also points out that when your sleep becomes short, you are susceptible to weight gain. Among the reasons for this are the fact that inadequate sleep increases levels of the hunger-signalling hormone, ghrelin. 'I'm not going to say that the obesity crisis is caused by the sleep-loss epidemic alone,' says Walker.'However, processed food and sedentary lifestyles do not adequately explain its rise. It's now clear that sleep is that third ingredient.'", "@D Sleep also has a powerful effect on the immune system, which is why, when we have flu, our first instinct is to go to bed. If you are tired, you are more likely to get sick. The well-rested also respond better to the flu vaccine so this is something people should bear in mind before visiting their doctors. Walker's book also includes a long section on dreams. Here he details the various ways in which deep sleep – the part when we begin to dream – helps us deal with our emotional experiences. He points to how important deep sleep is to young children. If they don't get enough, managing aggressive behaviour becomes harder and harder. Does Walker take his own advice when it comes to sleep? 'Yes. I give myself a non-negotiable eight-hour sleep opportunity every night, and I keep very regular hours. I take my sleep incredibly seriously because I have seen the evidence.'", "@E Sleep research shows that we sleep in 90-minute cycles, and it's only towards the end of each that we go into deep sleep. Each cycle comprises of NREM sleep (non-rapid eye movement sleep), followed by REM (rapid eye movement) sleep.'During NREM sleep … your body settles into this lovely low state of energy,' Walker explains. 'REM sleep, on the other hand is … an incredibly active brain state. Your heart and nervous system go through spurts of activity.' Because we need four or five of these cycles to stay healthy, it's important for people to break bad sleep habits. For example, they should not be regularly working late into the night as this affects cognitive functioning. Depending on sleeping pills is also not a good idea, as it can have a damaging effect on memory.", "@F So what can individuals do to ensure they get the right amount of sleep? Firstly, we could think about getting ready for sleep in the same way we prepare for the end of a workout – say, on a spin bike. 'People use alarms to wake up,' Walker says. 'So why don't we have a bedtime alarm to tell us we've got half an hour, that we should start cycling down?' Companies should think about rewarding sleep. Productivity will rise and motivation will be improved. We can also systematically measure our sleep by using personal tracking devices, Walker says, and points out that some far-sighted companies in the US already give employees time off if they get enough of it. While some researchers recommend banning digital devices from the bedroom because of their effect on the sleep-inducing hormone melatonin, Walker believes that technology will eventually be an aid to sleep, as it helps us discover more about the way we function."]}, "m23": {"title": "Mindset 2 · Unit 3: news texts", "sub": null, "letters": false, "paras": ["## Text 1 · Four opinions about the news", "@A Since the birth of the internet, access to local and world news has become possible 24 hours a day, 7 days a week. This is having an increasingly negative impact on society, and consequently we have all become news addicts! – Sarah (35)", "@B Adults aged 60+ buy a daily newspaper as a matter of habit. Generally, they don't know how to access news online. – Matt (18)", "@C Youngsters these days aren't interested in the news and spend most of their time on social media sites. They don't buy a newspaper or watch a regular TV bulletin. The only news they might be interested in is entertainment news. – Charles (65)", "@D I would only use social media sites to check entertainment news. I wouldn't trust it for any serious news, such as crime or politics. For those topics, I'd only rely on television bulletins. – Mary (25)", "## Text 2 · A smarter way to access the news?", "@A A recent report, issued by the international news agency Reuters, reveals that smartphones are quickly becoming the most popular way to access the news. Over the last year, this increase has been particularly noted in countries such as the UK, the USA and Japan. In fact, for all countries involved in the survey, usage has increased from 37% to 46%. Furthermore, 66% of smartphone users are now using the device for news on a weekly basis.", "@B By comparison, the number of people using tablets to access the news is decreasing in most countries. More sophisticated smartphones are reducing the need for other portable devices. The need for accessing the news on laptops and desktops has also changed. Over half (57%) still consider these devices the most important ways to access the news, but this is a decrease of 8% from last year.", "@C The report also revealed, however, that on average people only use a small number of trusted news sources on their phones, the average across all countries being 1.52 per person. In the UK, for example, over half of smartphone users (51%) regularly use the BBC app.", "@D Across all countries included in the survey, 25% stated that their smartphone was the main device used for accessing digital news, an increase of 20% since last year. This is particularly true of those aged under 35, with the figure rising to 41%. The overall trend, however, is not to use just one digital device to access the news, but rather a combination of two or three.", "## Text 3 · How the younger generation consumes the news", "@A In recent years, there has been growing concern by researchers and indeed the older generation that the younger generation are somewhat disengaged from the news, and as a result have a very narrow view of the world around them. This, however, couldn't be further from the truth, as shown by a recent study carried out by the Media Insight Project (American Press Institute & Associated Press). According to this research, 85% of youngsters say that keeping up to date with the news is important to them, and 69% receive news on a daily basis.", "@B Perhaps what some of the older generation fail to understand is that just because the younger generation does not buy a daily newspaper, it doesn't mean that they don't follow the news. Born into a digital age, or more specifically the age of the internet, the younger generation simply accesses news through the digital devices they grew up using: laptops, tablets, smartphones, etc. A recent study produced by Ofcom revealed that 60% of youngsters in the UK use the internet or apps for news, compared to just 21% of those in the older age range.", "@C Social media also plays an important part in consuming the news for the younger generation. It was also revealed that most youngsters actually don't seek out news from social media, but choose to follow it once they see it there. In other words, they encounter it accidentally and therefore following the news is secondary. For example, when accessing social media sites, news headlines automatically appear. These catch the user's eye and consequently the news link is clicked and followed.", "@D For the moment, social networks are being used selectively, however. For example, social media is used for breaking news, but is not relied on in terms of accuracy. For hard news topics, such as economics or local crime, youngsters continue to look to original sources. For accuracy and reliability, television is still the preferred choice for both generations.", "@E According to Alison Preston, Head of Media Literacy Research at Ofcom, motivations for following the news also vary according to the generation. In her current report on the topic, she states that, for the younger generation, news is largely about convenience and being social. For the older generation, however, motivation is greatly linked to a sense of duty and habit.", "@F Overall, it is fair to say that news plays an important part in all our everyday lives, regardless of generation. However, what is different amongst the generations is why and how it is accessed."]}, "bike": {"title": "The growth of bike-sharing schemes around the world", "sub": null, "letters": false, "paras": ["## How Dutch engineer Luud Schimmelpennink helped to devise urban bike-sharing schemes", "@A The original idea for an urban bike-sharing scheme dates back to a summer's day in Amsterdam in 1965. Provo, the organisation that came up with the idea, was a group of Dutch activists who wanted to change society. They believed the scheme, which was known as the Witte Fietsenplan, was an answer to the perceived threats of air pollution and consumerism. In the centre of Amsterdam, they painted a small number of used bikes white. They also distributed leaflets describing the dangers of cars and inviting people to use the white bikes. The bikes were then left unlocked at various locations around the city, to be used by anyone in need of transport.", "@B Luud Schimmelpennink, a Dutch industrial engineer who still lives and cycles in Amsterdam, was heavily involved in the original scheme. He recalls how the scheme succeeded in attracting a great deal of attention – particularly when it came to publicising Provo's aims – but struggled to get off the ground. The police were opposed to Provo's initiatives and almost as soon as the white bikes were distributed around the city, they removed them. However, for Schimmelpennink and for bike-sharing schemes in general, this was just the beginning. 'The first Witte Fietsenplan was just a symbolic thing,' he says. 'We painted a few bikes white, that was all. Things got more serious when I became a member of the Amsterdam city council two years later.'", "@C Schimmelpennink seized this opportunity to present a more elaborate Witte Fietsenplan to the city council. 'My idea was that the municipality of Amsterdam would distribute 10,000 white bikes over the city, for everyone to use,' he explains. 'I made serious calculations. It turned out that a white bicycle – per person, per kilometre – would cost the municipality only 10% of what it contributed to public transport per person per kilometre.' Nevertheless, the council unanimously rejected the plan. 'They said that the bicycle belongs to the past. They saw a glorious future for the car,' says Schimmelpennink. But he was not in the least discouraged.", "@D Schimmelpennink never stopped believing in bike-sharing, and in the mid-90s, two Danes asked for his help to set up a system in Copenhagen. The result was the world's first large-scale bike-share programme. It worked on a deposit: 'You dropped a coin in the bike and when you returned it, you got your money back.' After setting up the Danish system, Schimmelpennink decided to try his luck again in the Netherlands – and this time he succeeded in arousing the interest of the Dutch Ministry of Transport. 'Times had changed,' he recalls. 'People had become more environmentally conscious, and the Danish experiment had proved that bike-sharing was a real possibility.' A new Witte Fietsenplan was launched in 1999 in Amsterdam. However, riding a white bike was no longer free; it cost one guilder per trip and payment was made with a chip card developed by the Dutch bank Postbank. Schimmelpennink designed conspicuous, sturdy white bikes locked in special racks which could be opened with the chip card – the plan started with 250 bikes, distributed over five stations.", "@E Theo Molenaar, who was a system designer for the project, worked alongside Schimmelpennink. 'I remember when we were testing the bike racks, he announced that he had already designed better ones. But of course, we had to go through with the ones we had.' The system, however, was prone to vandalism and theft. 'After every weekend there would always be a couple of bikes missing,' Molenaar says. 'I really have no idea what people did with them, because they could instantly be recognised as white bikes.' But the biggest blow came when Postbank decided to abolish the chip card, because it wasn't profitable. 'That chip card was pivotal to the system,' Molenaar says. 'To continue the project we would have needed to set up another system, but the business partner had lost interest.'", "@F Schimmelpennink was disappointed, but – characteristically – not for long. In 2002 he got a call from the French advertising corporation JC Decaux, who wanted to set up his bike-sharing scheme in Vienna. 'That went really well. After Vienna, they set up a system in Lyon. Then in 2007, Paris followed. That was a decisive moment in the history of bike-sharing.' The huge and unexpected success of the Parisian bike-sharing programme, which now boasts more than 20,000 bicycles, inspired cities all over the world to set up their own schemes, all modelled on Schimmelpennink's. 'It's wonderful that this happened,' he says. 'But financially I didn't really benefit from it, because I never filed for a patent.'", "@G In Amsterdam today, 38% of all trips are made by bike and, along with Copenhagen, it is regarded as one of the two most cycle-friendly capitals in the world – but the city never got another Witte Fietsenplan. Molenaar believes this may be because everybody in Amsterdam already has a bike. Schimmelpennink, however, cannot see that this changes Amsterdam's need for a bike-sharing scheme. 'People who travel on the underground don't carry their bikes around. But often they need additional transport to reach their final destination.' Although he thinks it is strange that a city like Amsterdam does not have a successful bike-sharing scheme, he is optimistic about the future. 'In the 60s we didn't stand a chance because people were prepared to give their lives to keep cars in the city. But that mentality has totally changed. Today everybody longs for cities that are not dominated by cars.'"]}, "zoos": {"title": "Why zoos are good", "sub": null, "letters": false, "paras": ["## Scientist David Hone makes the case for zoos", "@A In my view, it is perfectly possible for many species of animals living in zoos or wildlife parks to have a quality of life as high as, or higher than, in the wild. Animals in good zoos get a varied and high-quality diet with all the supplements required, and any illnesses they might have will be treated. Their movement might be somewhat restricted, but they have a safe environment in which to live, and they are spared bullying and social ostracism by others of their kind. They do not suffer from the threat or stress of predators, or the irritation and pain of parasites or injuries. The average captive animal will have a greater life expectancy compared with its wild counterpart, and will not die of drought, of starvation or in the jaws of a predator. A lot of very nasty things happen to truly 'wild' animals that simply don't happen in good zoos, and to view a life that is 'free' as one that is automatically 'good' is, I think, an error. Furthermore, zoos serve several key purposes.", "@B Firstly, zoos aid conservation. Colossal numbers of species are becoming extinct across the world, and many more are increasingly threatened and therefore risk extinction. Moreover, some of these collapses have been sudden, dramatic and unexpected, or were simply discovered very late in the day. A species protected in captivity can be bred up to provide a reservoir population against a population crash or extinction in the wild. A good number of species only exist in captivity, with many of these living in Zoos. Still more only exist in the wild because they have been reintroduced from zoos, or have wild populations that have been boosted by captive bred animals. Without these efforts there would be fewer species alive today. Although reintroduction successes are few and far between, the numbers are increasing, and the very fact that species have been saved or reintroduced as a result of captive breeding proves the value of such initiatives.", "@C Zoos also provide education. Many children and adults, especially those in cities, will never see a wild animal beyond a fox or pigeon. While it is true that television documentaries are becoming ever more detailed and impressive, and many natural history specimens are on display in museums, there really is nothing to compare with seeing a living creature in the flesh, hearing it, smelling it, watching what it does and having the time to absorb details. That alone will bring a greater understanding and perspective to many, and hopefully give them a greater appreciation for wildlife, conservation efforts and how they can contribute.", "@D In addition to this, there is also the education that can take place in zoos through signs, talks and presentations which directly communicate information to visitors about the animals they are seeing and their place in the world. This was an area where zoos used to be lacking, but they are now increasingly sophisticated in their communication and outreach work. Many zoos also work directly to educate conservation workers in other countries, or send their animal keepers abroad to contribute their knowledge and skills to those working in zoos and reserves, thereby helping to improve conditions and reintroductions all over the world.", "@E Zoos also play a key role in research. If we are to save wild species and restore and repair ecosystems we need to know about how key species live, act and react. Being able to undertake research on animals in zoos where there is less risk and fewer variables means real changes can be effected on wild populations. Finding out about, for example, the oestrus cycle of an animal or its breeding rate helps us manage wild populations. Procedures such as capturing and moving at-risk or dangerous individuals are bolstered by knowledge gained in zoos about doses for anaesthetics, and by experience in handling and transporting animals. This can make a real difference to conservation efforts and to the reduction of human-animal conflicts, and can provide a knowledge base for helping with the increasing threats of habitat destruction and other problems.", "@F In conclusion, considering the many ongoing global threats to the environment, it is hard for me to see zoos as anything other than essential to the long-term survival of numerous species. They are vital not just in terms of protecting animals, but as a means of learning about them to aid those still in the wild, as well as educating and informing the general population about these animals and their world so that they can assist or at least accept the need to be more environmentally conscious. Without them, the world would be, and would increasingly become, a much poorer place."]}, "babytalk": {"title": "How baby talk gives infant brains a boost", "sub": null, "letters": false, "paras": ["@A The typical way of talking to a baby - high-pitched, exaggerated and repetitious - is a source of fascination for linguists who hope to understand how 'baby talk' impacts on learning. Most babies start developing their hearing while still in the womb, prompting some hopeful parents to play classical music to their pregnant bellies. Some research even suggests that infants are listening to adult speech as early as 10 weeks before being born, gathering the basic building blocks of their family's native tongue.", "@B Early language exposure seems to have benefits to the brain - for instance, studies suggest that babies raised in bilingual homes are better at learning how to mentally prioritize information. So how does the sweet if sometimes absurd sound of infant-directed speech influence a baby's development? Here are some recent studies that explore the science behind baby talk.", "@C Fathers don't use baby talk as often or in the same ways as mothers - and that's perfectly OK, according to a new study. Mark VanDam of Washington State University at Spokane and colleagues equipped parents with recording devices and speech-recognition software to study the way they interacted with their youngsters during a normal day. 'We found that moms do exactly what you'd expect and what's been described many times over,' VanDam explains. 'But we found that dads aren't doing the same thing. Dads didn't raise their pitch or fundamental frequency when they talked to kids.' Their role may be rooted in what is called the bridge hypothesis, which dates back to 1975. It suggests that fathers use less familial language to provide their children with a bridge to the kind of speech they'll hear in public. 'The idea is that a kid gets to practice a certain kind of speech with mom and another kind of speech with dad, so the kid then has a wider repertoire of kinds of speech to practice,' says VanDam.", "@D Scientists from the University of Washington and the University of Connecticut collected thousands of 30-second conversations between parents and their babies, fitting 26 children with audio-recording vests that captured language and sound during a typical eight-hour day. The study found that the more baby talk parents used, the more their youngsters began to babble. And when researchers saw the same babies at age two, they found that frequent baby talk had dramatically boosted vocabulary, regardless of socioeconomic status. 'Those children who listened to a lot of baby talk were talking more than the babies that listened to more adult talk or standard speech,' says Nairán Ramírez-Esparza of the University of Connecticut. 'We also found that it really matters whether you use baby talk in a one-on-one context,' she adds. 'The more parents use baby talk one-on-one, the more babies babble, and the more they babble, the more words they produce later in life.'", "@E Another study suggests that parents might want to pair their youngsters up so they can babble more with their own kind. Researchers from McGill University and Université du Québec à Montréal found that babies seem to like listening to each other rather than to adults - which may be why baby talk is such a universal tool among parents. They played repeating vowel sounds made by a special synthesizing device that mimicked sounds made by either an adult woman or another baby. This way, only the impact of the auditory cues was observed. The team then measured how long each type of sound held the infants' attention. They found that the 'infant' sounds held babies' attention nearly 40 percent longer. The baby noises also induced more reactions in the listening infants, like smiling or lip moving, which approximates sound making. The team theorizes that this attraction to other infant sounds could help launch the learning process that leads to speech. 'It may be some property of the sound that is just drawing their attention,' says study co-author Linda Polka. 'Or maybe they are really interested in that particular type of sound because they are starting to focus on their own ability to make sounds. We are speculating here but it might catch their attention because they recognize it as a sound they could possibly make.'", "@F In a study published in Proceedings of the National Academy of Sciences, a total of 57 babies from two slightly different age groups seven months and eleven and a half months were played a number of syllables from both their native language (English) and a non-native tongue (Spanish). The infants were placed in a brain-activation scanner that recorded activity in a brain region known to guide the motor movements that produce speech. The results suggest that listening to baby talk prompts infant brains to start practicing their language skills. 'Finding activation in motor areas of the brain when infants are simply listening is significant, because it means the baby brain is engaged in trying to talk back right from the start, and suggests that seven-month-olds' brains are already trying to figure out how to make the right movements that will produce words,' says co-author Patricia Kuhl. Another interesting finding was that while the seven-month-olds responded to all speech sounds regardless of language, the brains of the older infants worked harder at the motor activations of non-native sounds compared to native sounds. The study may have also uncovered a process by which babies recognize differences between their native language and other tongues."]}}};</script><script>/* IELTS Reading Lab – shared core: data access, marking, rendering of question papers and explanations */
const LAB = window.__LAB__;            // {name, code, token, keyStr}
const DATA = window.__DATA__;          // {tests, passages}
const TESTS = DATA.tests;
const TBY = Object.fromEntries(TESTS.map(t => [t.id, t]));
const LEVELS = [
  {id:'foundation', label:'Foundation', sub:'Build accuracy', desc:'Short texts and guided steps: predict the word type, locate, copy exactly. Sentences, short answers, a first flow-chart and notes.'},
  {id:'core', label:'Core', sub:'Exam practice', desc:'Full IELTS Passage 1 tasks under exam timing: sentence, note and table completion with ONE or TWO word limits.'},
  {id:'extension', label:'Extension', sub:'Stretch further', desc:'Harder passages and Passage 3 tasks: three-word answers, tables out of passage order, heavy paraphrase.'}
];
const CAUSES = (window.__LAB__ && window.__LAB__.causes) || [
  ['locate', 'Could not find the right part of the passage', 'Underline locating words first (names, numbers, dates, capital letters, long words) and scan for them, not for the answer.'],
  ['paraphrase', 'Missed the paraphrase / synonym', 'Before scanning, write 1–2 synonyms for each key word in the question (e.g. reduce → lessen, cut).'],
  ['vocab', 'Did not know a key word', 'Guess from context, then add the word to your vocabulary list with a synonym and an antonym.'],
  ['grammar', 'Wrong word type or grammar', 'Predict the word type before reading: a/an → singular noun; no article → plural/uncountable; "is ___" → adjective.'],
  ['limit', 'Over the word limit', 'Circle the limit (ONE WORD ONLY / NO MORE THAN TWO WORDS). Remove adjectives the sentence does not need.'],
  ['distractor', 'Chose a nearby distractor', 'Read the whole sentence around the answer. Check who/what/when matches the question exactly.'],
  ['spelling', 'Spelling or plural -s', 'Copy letter by letter from the passage. Check singular/plural against the words before the gap.'],
  ['time', 'Ran out of time', 'About 1.5 minutes per question. Skip, mark it, and come back.'],
  ['careless', 'Careless / typo', 'Use the last minute to check every answer against the sentence and the word limit.']
];
const CAUSE_BY = Object.fromEntries(CAUSES.map(c => [c[0], c]));
const KIND_ORDER = ['short', 'sentence', 'notes', 'table', 'flow', 'choice', 'tfng', 'ynng', 'mcq', 'multi', 'headings', 'match'];
const OPTION_KINDS = ['choice', 'tfng', 'ynng', 'mcq', 'headings', 'match'];
const LISTED = k => k === 'headings' || k === 'match';
function kindOptions(g, b) { if (g.kind === 'mcq') return ((b && b.opts) || []).map(o => o[0]); if (g.kind === 'multi' || LISTED(g.kind)) return g.options.map(o => o[0]); return g.kind === 'tfng' ? ['TRUE', 'FALSE', 'NOT GIVEN'] : g.kind === 'ynng' ? ['YES', 'NO', 'NOT GIVEN'] : g.options; }
function optText(g, b, L) { const list = (g.kind === 'multi' || LISTED(g.kind)) ? g.options : (b && b.opts) || []; const o = list.find(x => x[0] === L); return o ? o[1] : ''; }
const PL = (window.__LAB__ && window.__LAB__.place) || {n:13,time:20,cut1:6,cut2:10,label:'One IELTS Passage 1 (13 questions, 20 minutes)'};
const PLTAB = `<tr><td>0–${PL.cut1}</td><td>Foundation</td></tr><tr><td>${PL.cut1+1}–${PL.cut2}</td><td>Core</td></tr><tr><td>${PL.cut2+1}–${PL.n}</td><td>Extension</td></tr>`;
const KIND_LABEL = {short:'Short answer', sentence:'Sentence', notes:'Notes', table:'Table', flow:'Flow-chart', choice:(window.__LAB__ && window.__LAB__.choiceLabel) || 'Word type', tfng:'True / False / Not Given', ynng:'Yes / No / Not Given', mcq:'Multiple choice', multi:'Choose more than one', headings:'Matching headings'};

/* ---------- decoding (answers are encoded in the student file) ---------- */
const _kc = {};
function getK(box) {
  if (typeof box.k !== 'string') return box.k;
  if (_kc[box.id]) return _kc[box.id];
  return (_kc[box.id] = decStr(box.k));
}
function decStr(s) {
  const bin = atob(s), key = LAB.keyStr, bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ key.charCodeAt(i % key.length);
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* ---------- marking ---------- */
function nrm(s) {
  s = (s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '');
  s = s.replace(/[‘’`´]/g, "'").replace(/[“”]/g, '"').replace(/[–—‑−]/g, '-');
  s = s.toLowerCase().replace(/(\d),(?=\d{3}\b)/g, '$1').replace(/\s+/g, ' ').trim();
  s = s.replace(/[.;:!?,]+$/g, '').replace(/^["']|["']$/g, '').trim();
  s = s.replace(/\s*-\s*/g, '-').replace(/\s*,\s*/g, ', ');
  return s;
}
function expand(alt) {
  const parts = alt.split(/(\([^)]*\))/).filter(x => x !== '');
  let vs = [''];
  for (const p of parts) {
    if (/^\(.*\)$/.test(p)) { const inner = p.slice(1, -1); vs = vs.flatMap(v => [v, v + inner]); }
    else vs = vs.map(v => v + p);
  }
  return vs.map(v => nrm(v));
}
function tokens(s) { return nrm(s).split(' ').filter(Boolean); }
const NUMW = new Set('one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty thirty forty fifty sixty seventy eighty ninety hundred thousand million billion twenty-one twenty-two twenty-five twenty-seven'.split(' '));
function isNum(t) { return /^[$£€]?\d[\d.,/]*(%|²|kg|km|m)?$/.test(t) || NUMW.has(t); }
function overLimit(ans, lim) {
  if (!lim) return false;
  const raw = tokens(ans), ts = raw.filter((x, i) => !(isNum(x) && i > 0 && isNum(raw[i - 1])));  // '3.5 million' = one number
  const nums = ts.filter(isNum).length, words = ts.length - nums;
  return lim.n ? (words > lim.w || nums > 1) : ts.length > lim.w;
}
function accepted(list) { const s = new Set(); list.forEach(a => expand(a).forEach(v => s.add(v))); return s; }
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({length: m + 1}, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
function passageText(t) { return nrm(DATA.passages[t.passage].paras.join(' ')); }

/* grade one test: answers = {boxId: string}. returns {score,total,res:{boxId:{ok,type}}} */
function gradeTest(t, answers) {
  const res = {}; let score = 0;
  const ptext = passageText(t);
  for (const g of t.groups) {
    const setPools = {};
    for (const [sid, kk] of Object.entries(g.sets || {})) { const keys = typeof kk === 'string' ? decStr(kk) : kk; setPools[sid] = keys.map(k => ({acc: accepted(k), used: false})); }
    // set boxes: first pass exact matching to avoid order problems
    // paired boxes: both words needed for ONE mark, any order; joined words in one box (and , ; / - |) are accepted too
    const pairIds = [...new Set(g.boxes.filter(b => b.pair).map(b => b.pair))];
    for (const pid of pairIds) {
      const pb = g.boxes.filter(b => b.pair === pid), keys = setPools[pid].map(p => p.acc);
      const toks = pb.map(b => nrm(answers[b.id] || '')).join(' ; ').split(/\s*(?:,|;|\/|\||-|&|\band\b)\s*|\s+/).filter(Boolean);
      const used = keys.map(() => false); let extra = 0;
      toks.forEach(tk => { const i = keys.findIndex((acc, x) => !used[x] && acc.has(tk)); if (i >= 0) used[i] = true; else extra++; });
      const ok = used.every(Boolean) && extra === 0;
      const type = ok ? '' : !toks.length ? 'No answer' : used.some(Boolean) && !extra ? 'Only one of the two words' : 'Wrong information (in the passage)';
      pb.forEach(b => { res[b.id] = {ok, type}; });
      if (ok) score++;
    }
    for (const b of g.boxes) {
      if (b.pair) continue;
      const k = getK(b), raw = answers[b.id] || '', a = nrm(raw);
      let ok = false, type = '';
      if (!a) { type = 'No answer'; }
      else if (OPTION_KINDS.includes(g.kind)) { ok = k.a.some(x => nrm(x) === a); type = ok ? '' : 'Wrong option'; }
      else if (g.kind === 'multi') {
        const pool = setPools[b.set]; const hit = pool.find(p => !p.used && p.acc.has(a));
        if (hit) { hit.used = true; ok = true; } else type = pool.some(p => p.acc.has(a)) ? 'Repeated answer' : 'Wrong option';
      }
      else if (overLimit(raw, b.lim || g.limit)) { type = 'Over the word limit'; }
      else if (b.set) {
        const pool = setPools[b.set];
        const hit = pool.find(p => !p.used && p.acc.has(a));
        if (hit) { hit.used = true; ok = true; }
        else type = pool.some(p => p.acc.has(a)) ? 'Repeated answer' : classify(a, pool.flatMap(p => [...p.acc]), ptext);
      } else {
        const acc = accepted(k.a);
        ok = acc.has(a);
        if (!ok) type = classify(a, [...acc], ptext);
      }
      res[b.id] = {ok, type};
      if (ok) score++;
    }
    if (g.kind === 'headings' || (g.kind === 'match' && !g.reuse)) {
      const used = {}; if (g.example) used[nrm(g.example.a)] = 1;
      for (const b of g.boxes) { const a = nrm(answers[b.id] || ''); if (!a) continue; if (used[a] && !res[b.id].ok) res[b.id].type = 'Repeated answer'; used[a] = (used[a] || 0) + 1; }
    }
  }
  return {score, total: t.total, res};
}
function classify(a, acc, ptext) {
  for (const x of acc) {
    if (a + 's' === x || a === x + 's' || a + 'es' === x || a === x + 'es') return 'Plural / singular';
  }
  for (const x of acc) { const d = lev(a, x); if ((x.length >= 5 && d <= 2) || d <= 1) return 'Spelling'; }
  if (ptext.includes(a)) return 'Wrong information (in the passage)';
  return 'Not copied from the passage';
}
function suggestCause(type, ans) {
  let s;
  if (type === 'Wrong option') {
    const a = nrm(ans || '').toUpperCase();
    s = (a === 'TRUE' || a === 'YES') ? 'qual' : (a === 'FALSE' || a === 'NO' || a === 'NOT GIVEN') ? 'fng' : 'distractor';
    if (!CAUSE_BY[s]) s = 'distractor';   // based only on the student's own answer, never on the key
  } else s = {'No answer': 'time', 'Over the word limit': 'limit', 'Plural / singular': 'spelling', 'Spelling': 'spelling',
          'Wrong information (in the passage)': 'distractor', 'Not copied from the passage': 'paraphrase', 'Repeated answer': (CAUSE_BY.twice ? 'twice' : 'careless'), 'Only one of the two words': 'careless'}[type];
  if (!s || !CAUSE_BY[s]) s = CAUSE_BY[s] ? s : (CAUSE_BY.grammar && type === 'Wrong option' ? 'grammar' : CAUSES[0][0]);
  return s;
}
function keyText(b) { const k = getK(b); return k.a.join(' / '); }
function keyFull(b) { const k = getK(b), g = b.g; if (g && (g.kind === 'mcq' || g.kind === 'multi' || LISTED(g.kind))) return k.a.map(L => L + (optText(g, b, L) && optText(g, b, L) !== 'Paragraph ' + L && optText(g, b, L) !== 'Section ' + L ? ' · ' + optText(g, b, L) : '')).join(' / '); return k.a.join('  /  '); }
function allBoxes(t) { return t.groups.flatMap(g => g.boxes.map(b => Object.assign({g}, b))); }
function firstLetterHint(b) {

document.addEventListener('mouseup', () => {

function shuffle(a, seed) { a = a.slice(); let s = seed; for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- exam mechanics ---------- */
function startExam(t) {
  const r = T(t.id);
  r.exam = {running: true, startedAt: Date.now(), deadline: Date.now() + t.time * 60000, tabSwitches: 0, interrupts: 0, usedSec: 0};
  r.draft = {}; exam.resumed = true; save(); render();
}
function startClock(t) {
  const r = T(t.id), el = $('#timer');
  const tick = () => {
    const left = (r.exam.deadline - Date.now()) / 1000;
    el.textContent = fmtTime(left);
    el.className = 'timer' + (left <= 60 ? ' crit' : left <= 300 ? ' warn' : '');
    if (Math.floor(left) === 300) toast('5 minutes left.');
    if (Math.floor(left) === 60) toast('1 minute left. Check your word limits.');
    if (left <= 0) { stopTimer(); submitExam(t, true); }
  };
  tick(); exam.timer = setInterval(tick, 1000);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && examRunning()) { const r = T(view.test); r.exam.tabSwitches = (r.exam.tabSwitches || 0) + 1; save(true); const el = $('#tabsw'); if (el) el.textContent = r.exam.tabSwitches; }
});
window.addEventListener('beforeunload', e => { save(true); if (examRunning()) { e.preventDefault(); e.returnValue = ''; } });
function collectDraft() {
  if (!view.test) return; const r = S.tests[view.test]; if (!r) return;
  $$('input.ans').forEach(i => { if (!i.readOnly) r.draft[i.dataset.id] = i.value; });
}
async function submitExam(t, timedOut) {
  const r = T(t.id); if (!r.exam || !r.exam.running) return;
  collectDraft();
  const answers = Object.assign({}, r.draft);
  r.exam.running = false; r.exam.timedOut = !!timedOut; r.exam.usedSec = Math.min(t.time * 60, (Date.now() - r.exam.startedAt) / 1000);
  stopTimer();
  const a = await checkAuth();
  if (!a.ok) { r.unscored = {answers, msg: a.msg, at: new Date().toISOString()}; save(); render(); return; }   // open practice: no score shown
  scoreFirst(t, answers, timedOut);
}
function scoreFirst(t, answers, timedOut) {
  const r = T(t.id), g = gradeTest(t, answers);
  r.attempts = 1; r.first = {score: g.score, answers, res: g.res, at: new Date().toISOString()}; r.latest = r.first; r.unscored = null; r.draft = {};
  allBoxes(t).forEach(b => { r.tries[b.id] = g.res[b.id].ok ? 0 : 1; });
  if (t.id === 'P1' && !S.path) S.path = placementLevel();
  save();
  sendResult(payloadFor(t, timedOut ? 'first (timed out)' : 'first'));
  tryUnlock(t) || render();
}
async function submitRetry(t) {
  const r = T(t.id); collectDraft();
  const a = await checkAuth(); if (!a.ok) { nudge(a.msg); return; }
  const answers = Object.assign({}, r.latest.answers, r.draft);
  const g = gradeTest(t, answers);
  r.attempts++; r.latest = {score: g.score, answers, res: g.res, at: new Date().toISOString()};
  allBoxes(t).forEach(b => {
    if (g.res[b.id].ok) r.tries[b.id] = 0; else { r.tries[b.id] = (r.tries[b.id] || 0) + 1; if (r.tries[b.id] >= 3) r.hints[b.id] = r.tries[b.id] >= 4 ? 2 : 1; }
  });
  save();
  sendResult(payloadFor(t, 'retry'));
  if (!tryUnlock(t)) { render(); toast(`Latest: ${g.score}/${t.total} (${pct(g.score, t.total)}%)`); }
}
function confirmBox(msg, yes) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><p>${esc(msg)}</p><div class="row"><span class="spacer"></span><button class="btn" id="mNo">Cancel</button><button class="btn primary" id="mYes">Yes</button></div></div>`;
  document.body.appendChild(bg); $('#mNo', bg).onclick = () => bg.remove(); $('#mYes', bg).onclick = () => { bg.remove(); yes(); };
}

  ${done.map(t => { const r = S.tests[t.id], ex = r.exam || {}; return `<tr><td class="mono">${t.id}</td><td>${esc(t.title)}</td><td>${t.levelLabel}</td><td><b>${r.first.score}/${t.total}</b> (${pct(r.first.score, t.total)}%)</td><td>${r.latest.score}/${t.total} (${pct(r.latest.score, t.total)}%)</td><td>${r.attempts}</td><td>${fmtTime(ex.usedSec || 0)} / ${t.time}:00${ex.timedOut ? ' ⏱' : ''}</td><td>${ex.tabSwitches || 0}${ex.interrupts ? ' · reload ' + ex.interrupts : ''}</td><td>${Object.keys(r.hints).length}</td><td>${r.pre ? r.pre.score + '/' + r.pre.total : '—'} → ${r.post ? r.post.score + '/' + r.post.total : '—'}</td><td>${r.unlocked ? '<span class="mark-ok">Unlocked</span>' : 'In progress'}</td></tr>`; }).join('') || '<tr><td colspan="11" class="muted">No exercises submitted yet.</td></tr>'}</table></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h3>First-attempt accuracy by task format</h3>${KIND_ORDER.filter(k => byKind[k]).map(k => `<div class="barrow"><span>${KIND_LABEL[k]}</span><div class="bar"><i style="width:${pct(byKind[k][0], byKind[k][1])}%"></i></div><span class="mono">${pct(byKind[k][0], byKind[k][1])}%</span></div>`).join('') || '<p class="muted">No data yet.</p>'}</div>
  <div class="card"><h3>Error causes</h3>${CAUSES.filter(c => causes[c[0]]).map(c => `<div class="barrow"><span>${esc(c[1])}</span><div class="bar"><i style="width:${pct(causes[c[0]], cmax)}%"></i></div><span class="mono">${causes[c[0]]}</span></div>`).join('') || '<p class="muted">No causes tagged yet.</p>'}</div></div>
  <div class="card" style="margin-top:14px;overflow-x:auto"><h3>Error logbook & paraphrase table</h3><table class="data"><tr><th>Ex.</th><th>Q</th><th>My answer</th><th>Correct</th><th>Error type</th><th>Cause</th><th>Paraphrase</th><th>Note</th></tr>
  ${errs.map(({t, b, r}) => `<tr><td class="mono">${t.id}</td><td>${esc(b.n)}</td><td class="mono">${esc(r.first.answers[b.id] || '—')}</td><td class="mono">${r.unlocked ? esc(keyText(b)) : '🔒'}</td><td>${esc(r.first.res[b.id].type)}</td><td>${r.causes[b.id] ? esc(CAUSE_BY[r.causes[b.id]][1]) : '—'}</td><td class="small">${r.unlocked ? (getK(b).pp || []).map(p => esc(p[0]) + ' → ' + esc(p[1])).join('<br>') : '🔒'}</td><td class="small">${esc(r.notes[b.id] || '')}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">No errors logged.</td></tr>'}</table></div>
  ${advice() ? `<div class="banner info" style="margin-top:14px">${advice()}</div>` : ''}
  <div class="card noprint" style="margin-top:14px"><h3>Move my progress to another device</h3><p class="small muted">Copy this backup code and paste it on the other device.</p>
  <div class="row"><button class="btn sm" id="bk">Copy backup code</button><input type="text" id="rsIn" placeholder="Paste a backup code" style="flex:1;min-width:200px"><button class="btn sm" id="rs">Restore</button></div>
  <p class="small muted" style="margin-top:8px">Results waiting to be sent to your teacher: <b>${S.outbox.length}</b> ${S.outbox.length ? '<button class="btn sm" id="flush">Send now</button>' : ''}</p></div>`;
  $('#pdf').onclick = () => window.print();
  $('#bk').onclick = () => { const code = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); navigator.clipboard.writeText(code).then(() => toast('Backup code copied.'), () => { $('#rsIn').value = code; toast('Copy the code from the box.'); }); };
  $('#rs').onclick = () => { try { S = Object.assign(blank(), JSON.parse(decodeURIComponent(escape(atob($('#rsIn').value.trim()))))); save(); toast('Progress restored.'); render(); } catch (_) { toast('That code is not valid.'); } };
  const fl = $('#flush'); if (fl) fl.onclick = () => { flushOutbox(); toast('Sending…'); };
}

/* ---------- boot ---------- */
bindHeader();
{ const run = TESTS.find(t => S.tests[t.id] && S.tests[t.id].exam && S.tests[t.id].exam.running); if (run) view.test = run.id; }
render();
flushOutbox();
</script></body></html>
