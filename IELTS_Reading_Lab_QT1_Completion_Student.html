  <div class="card"><h3>Exam rules in the lab</h3><ul>
    <li>Everyone can open every exercise, read the passage and answer. Enter your <b>name and email</b> at the top. Only emails on the class list get <b>autoscoring</b>: score, fix & retry, hints, answer key and explanations, and results sent to the teacher.</li>
    <li>Each exercise has a <b>timer</b> (about 1.5 minutes per question). Warnings at 5 minutes and 1 minute. When time is up, the answers are submitted automatically.</li>
    <li>No dictionary, translator or notes. Leaving the tab is counted. If you reload, the clock keeps running.</li>
    <li>Your <b>first attempt is your exam score</b>. It is never overwritten.</li></ul></div>
  <div class="card"><h3>Marking</h3><ul>
    <li>Words must come from the passage and be spelled correctly. A spelling mistake = wrong.</li>
    <li><b>Over the word limit = wrong</b>, even if the meaning is right. A hyphenated word (man-made) is one word. A number can be digits or words.</li>
    <li>Capital letters do not matter. Words in brackets in the key are optional.</li>
    <li>Singular/plural must match the key. Do not change the word form.</li></ul></div>
  <div class="card"><h3>Fix, retry, unlock</h3><ul>
    <li>After the exam, correct answers lock. Change only the red ones and press <b>Check my corrected answers</b>. Every check counts as an attempt.</li>
    <li>After <b>3 wrong tries</b> on one question you get a hint (where to look + word type). After 4, the first letter.</li>
    <li>Tag a <b>cause</b> for every first-attempt error in the error logbook.</li>
    <li>The key and explanations unlock at <b>${PASS_MARK}% or more</b> on your latest attempt + all causes tagged.</li></ul></div>
  <div class="card"><h3>Highlighting & saving</h3><ul>
    <li><span style="background:var(--hl-y)">Yellow</span> key words from the question · <span style="background:var(--hl-g)">Green</span> locating words found · <span style="background:var(--hl-b)">Blue</span> paraphrases · <span style="background:var(--hl-p)">Pink</span> the answer.</li>
    <li>Eraser + click removes one highlight; <b>Clear all</b> removes every highlight in the passage.</li>
    <li>Your work is <b>saved automatically every 10 seconds</b> on this device. Every submission is also sent to your teacher.</li>
    <li>Download the PDF result report in <b>My report</b> and send it to your teacher.</li></ul></div>
  </div>`;
}
function renderLog(m) {
  const rows = [];
  TESTS.forEach(t => { const r = S.tests[t.id]; if (!r || !r.first) return; allBoxes(t).forEach(b => { if (!r.first.res[b.id].ok) rows.push({t, b, r}); }); });
  const counts = {}; rows.forEach(x => { const c = x.r.causes[x.b.id]; if (c) counts[c] = (counts[c] || 0) + 1; });
  const max = Math.max(1, ...Object.values(counts));
  const top3 = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 3);
  m.innerHTML = `<div class="eyebrow">Error logbook</div><h1>Learn from every mistake</h1>
  <div class="grid g2"><div class="card"><h3>Causes of my errors</h3>${CAUSES.map(c => `<div class="barrow"><span>${esc(c[1])}</span><div class="bar"><i style="width:${pct(counts[c[0]] || 0, max)}%"></i></div><span class="mono">${counts[c[0]] || 0}</span></div>`).join('')}</div>
  <div class="card"><h3>My top 3 causes and how to fix them</h3>${top3.length ? top3.map(([c, n]) => `<p><b>${esc(CAUSE_BY[c][1])}</b> (${n})<br><span class="small">${esc(CAUSE_BY[c][2])}</span></p>`).join('') : '<p class="muted">Tag the causes of your errors after each exercise.</p>'}</div></div>
  <div class="card" style="margin-top:14px;overflow-x:auto"><h3>All first-attempt errors · paraphrase table</h3>
  <table class="data"><tr><th>Exercise</th><th>Q</th><th>My answer</th><th>Correct answer</th><th>Error type</th><th>Cause</th><th>Question says → Passage says</th><th>My note</th></tr>
  ${rows.map(({t, b, r}) => `<tr><td class="mono">${t.id}</td><td class="mono">${esc(b.n)}</td><td class="mono mark-bad">${esc(r.first.answers[b.id] || '—')}</td>
    <td class="mono">${r.unlocked ? `<span class="mark-ok">${esc(keyText(b))}</span>` : '<span class="lock">🔒 at ' + PASS_MARK + '%</span>'}</td><td>${esc(r.first.res[b.id].type)}</td>
    <td>${r.causes[b.id] ? esc(CAUSE_BY[r.causes[b.id]][1]) : '<span class="mark-bad">not tagged</span>'}</td>
    <td>${r.unlocked ? (getK(b).pp || []).map(p => `${esc(p[0])} → <b>${esc(p[1])}</b>`).join('<br>') : '<span class="lock">🔒</span>'}</td>
    <td><input type="text" data-lognote="${t.id}|${b.id}" value="${esc(r.notes[b.id] || '')}" style="width:100%;min-width:140px"></td></tr>`).join('') || '<tr><td colspan="8" class="muted">No errors yet.</td></tr>'}</table></div>`;
  $$('[data-lognote]', m).forEach(i => i.oninput = () => { const [tid, bid] = i.dataset.lognote.split('|'); T(tid).notes[bid] = i.value; save(true); });
}
function renderVocab(m) {
  let h = `<div class="eyebrow">Vocabulary</div><h1>Words and paraphrases from your exercises</h1>
  <div class="card"><h3>Paraphrase toolkit: how IELTS rewrites the passage</h3><table class="data">
  <tr><th>Type</th><th>Example from your exercises</th><th>Other ways</th></tr>
  <tr><td>Synonym</td><td>reduces → <b>lessen</b>; a lack of → <b>shortage of</b></td><td>reduce = cut, decrease, diminish, alleviate</td></tr>
  <tr><td>Word form</td><td>the death of → plant species <b>die</b></td><td>verb ↔ noun ↔ adjective: erode → erosion; prevent → preventable</td></tr>
  <tr><td>Active ↔ passive</td><td>oxen pulled them → <b>hauled by oxen</b></td><td>X built Y = Y was built by X</td></tr>
  <tr><td>Negative ↔ antonym</td><td>did not give away → <b>held on to</b>; cannot be reversed → <b>irreversible</b></td><td>not + opposite word: not common = rare</td></tr>
  <tr><td>General ↔ specific</td><td>ancient objects → <b>artefacts such as beads…</b></td><td>tools → grindstones, hammerstones</td></tr>
  <tr><td>Numbers & time</td><td>between 1800 and 1850 → <b>the first half of the 1800s</b></td><td>three decades = 30 years; a fifth = 20%</td></tr>
  <tr><td>Grammar structure</td><td>because of → <b>learnt how expensive…, and … was donated</b></td><td>cause can be shown by order of events, "so", "as a result"</td></tr></table></div>`;
  for (const t of TESTS) {
    const r = S.tests[t.id];
    h += `<div class="card ${lvlClass(t.level)}" style="margin-top:12px;border-left:4px solid var(--lc)"><div class="row"><b class="mono">${t.id}</b><b>${esc(t.title)}</b></div>
      <p class="small" style="margin:6px 0">${t.pre.map(v => `<b>${esc(v.w)}</b>: ${esc(v.m)}`).join(' · ')}</p>
      ${r && r.unlocked ? `<table class="pp"><tr><th>Question says</th><th>Passage says</th><th>Expand</th></tr>${allBoxes(t).filter(b => getK(b).pp && getK(b).pp.length).map(b => `<tr><td>${getK(b).pp.map(p => esc(p[0])).join('<br>')}</td><td>${getK(b).pp.map(p => esc(p[1])).join('<br>')}</td><td class="small">${esc(getK(b).ex || '')}</td></tr>`).join('')}</table>` : `<p class="lock">🔒 Paraphrases and word expansions unlock when you reach ${PASS_MARK}% in ${t.id}.</p>`}</div>`;
  }
  m.innerHTML = h;
}
function renderReport(m) {
  const done = TESTS.filter(t => S.tests[t.id] && S.tests[t.id].first);
  const byKind = {}; const causes = {};
  done.forEach(t => { const r = S.tests[t.id]; t.groups.forEach(g => g.boxes.forEach(b => { const k = byKind[g.kind] || (byKind[g.kind] = [0, 0]); k[1]++; if (r.first.res[b.id].ok) k[0]++; })); Object.values(r.causes).forEach(c => causes[c] = (causes[c] || 0) + 1); });
  const errs = []; done.forEach(t => { const r = S.tests[t.id]; allBoxes(t).forEach(b => { if (!r.first.res[b.id].ok) errs.push({t, b, r}); }); });
  const pl = placementLevel();
  const totalTime = done.reduce((a, t) => a + ((S.tests[t.id].exam || {}).usedSec || 0), 0);
  const hints = done.reduce((a, t) => a + Object.keys(S.tests[t.id].hints).length, 0);
  const avg = k => done.length ? Math.round(done.reduce((a, t) => a + pct(S.tests[t.id][k].score, t.total), 0) / done.length) : 0;
  const cmax = Math.max(1, ...Object.values(causes));
  m.innerHTML = `<div class="row noprint"><div><div class="eyebrow">My report</div><h1 style="margin:0">Result report</h1></div><span class="spacer"></span><button class="btn primary" id="pdf">Download PDF report</button></div>
  <p class="small muted noprint">Download the PDF result report and send it to your teacher. (In the print window choose “Save as PDF”.)</p>
  <div class="card" style="margin:12px 0"><div class="row"><div><div class="eyebrow">${esc(LAB.name)}</div><h2 style="margin:4px 0">${esc(S.student.name || 'Name not entered')}</h2><div class="mono small">${esc(S.student.email || '')}</div></div><span class="spacer"></span>
  <div class="small">Placement: <b>${pl ? T('P1').first.score + '/13 → ' + LEVELS.find(l => l.id === pl).label : 'not taken'}</b><br>Chosen path: <b>${S.allPaths ? 'All three paths' : S.path ? LEVELS.find(l => l.id === S.path).label : '—'}</b><br>Report date: ${new Date().toLocaleDateString()}</div></div></div>
  <div class="grid g4">
    <div class="card kpi"><div class="v">${done.length}</div><div class="l">Exercises done</div></div>
    <div class="card kpi"><div class="v">${avg('first')}%</div><div class="l">Average first score</div></div>
    <div class="card kpi"><div class="v">${avg('latest')}%</div><div class="l">Average latest score</div></div>
    <div class="card kpi"><div class="v">${TESTS.filter(t => S.tests[t.id] && S.tests[t.id].unlocked).length}</div><div class="l">Unlocked (≥${PASS_MARK}%)</div></div>
    <div class="card kpi"><div class="v">${Math.round(totalTime / 60)} min</div><div class="l">Exam time used</div></div>
    <div class="card kpi"><div class="v">${hints}</div><div class="l">Hints used</div></div></div>
  <div class="card" style="margin-top:14px;overflow-x:auto"><h3>Exercise results</h3><table class="data"><tr><th>Code</th><th>Exercise</th><th>Level</th><th>First</th><th>Latest</th><th>Attempts</th><th>Time used / allowed</th><th>Tab switches</th><th>Hints</th><th>Vocab before → after</th><th>Status</th></tr>
  ${done.map(t => { const r = S.tests[t.id], ex = r.exam || {}; return `<tr><td class="mono">${t.id}</td><td>${esc(t.title)}</td><td>${t.levelLabel}</td><td><b>${r.first.score}/${t.total}</b> (${pct(r.first.score, t.total)}%)</td><td>${r.latest.score}/${t.total} (${pct(r.latest.score, t.total)}%)</td><td>${r.attempts}</td><td>${fmtTime(ex.usedSec || 0)} / ${t.time}:00${ex.timedOut ? ' ⏱' : ''}</td><td>${ex.tabSwitches || 0}${ex.interrupts ? ' · reload ' + ex.interrupts : ''}</td><td>${Object.keys(r.hints).length}</td><td>${r.pre ? r.pre.score + '/' + r.pre.total : '—'} → ${r.post ? r.post.score + '/' + r.post.total : '—'}</td><td>${r.unlocked ? '<span class="mark-ok">Unlocked</span>' : 'In progress'}</td></tr>`; }).join('') || '<tr><td colspan="11" class="muted">No exercises submitted yet.</td></tr>'}</table></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h3>First-attempt accuracy by task format</h3>${KIND_ORDER.filter(k => byKind[k]).map(k => `<div class="barrow"><span>${KIND_LABEL[k]}</span><div class="bar"><i style="width:${pct(byKind[k][0], byKind[k][1])}%"></i></div><span class="mono">${pct(byKind[k][0], byKind[k][1])}%</span></div>`).join('') || '<p class="muted">No data yet.</p>'}</div>
  <div class="card"><h3>Error causes</h3>${CAUSES.filter(c => causes[c[0]]).map(c => `<div class="barrow"><span>${esc(c[1])}</span><div class="bar"><i style="width:${pct(causes[c[0]], cmax)}%"></i></div><span class="mono">${causes[c[0]]}</span></div>`).join('') || '<p class="muted">No causes tagged yet.</p>'}</div></div>
  <div class="card" style="margin-top:14px;overflow-x:auto"><h3>Error logbook & paraphrase table</h3><table class="data"><tr><th>Ex.</th><th>Q</th><th>My answer</th><th>Correct</th><th>Error type</th><th>Cause</th><th>Paraphrase</th><th>Note</th></tr>
  ${errs.map(({t, b, r}) => `<tr><td class="mono">${t.id}</td><td>${esc(b.n)}</td><td class="mono">${esc(r.first.answers[b.id] || '—')}</td><td class="mono">${r.unlocked ? esc(keyText(b)) : '🔒'}</td><td>${esc(r.first.res[b.id].type)}</td><td>${r.causes[b.id] ? esc(CAUSE_BY[r.causes[b.id]][1]) : '—'}</td><td class="small">${r.unlocked ? (getK(b).pp || []).map(p => esc(p[0]) + ' → ' + esc(p[1])).join('<br>') : '🔒'}</td><td class="small">${esc(r.notes[b.id] || '')}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">No errors logged.</td></tr>'}</table></div>
  ${advice() ? `<div class="banner info" style="margin-top:14px">${advice()}</div>` : ''}
  <div class="card noprint" style="margin-top:14px"><h3>Move my progress to another device</h3><p class="small muted">Copy this backup code and paste it on the other device.</p>
  <div class="row"><button class="btn sm" id="bk">Copy backup code</button><input type="text" id="rsIn" placeholder="Paste a backup code" style="flex:1;min-width:200px"><button class="btn sm" id="rs">Restore</button></div>
  <p class="small muted" style="margin-top:8px">Results waiting to be sent to your teacher: <b>${S.outbox.length}</b> ${S.outbox.length ? '<button class="btn sm" id="flush">Send now</button>' : ''}</p></div>`;
  $('#pdf').onclick = () => window.print();
  $('#bk').onclick = () => { const code = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); navigator.clipboard.writeText(code).then(() => toast('Backup code copied.'), () => { $('#rsIn').value = code; toast('Copy the code from the box.'); }); };
  $('#rs').onclick = () => { try { S = Object.assign(blank(), JSON.parse(decodeURIComponent(escape(atob($('#rsIn').value.trim()))))); save(); toast('Progress restored.'); render(); } catch (_) { toast('That code is not valid.'); } };
  const fl = $('#flush'); if (fl) fl.onclick = () => { flushOutbox(); toast('Sending…'); };
}

/* ---------- boot ---------- */
bindHeader();
{ const run = TESTS.find(t => S.tests[t.id] && S.tests[t.id].exam && S.tests[t.id].exam.running); if (run) view.test = run.id; }
render();
flushOutbox();
</script></body></html>
