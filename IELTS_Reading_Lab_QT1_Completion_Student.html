nk. The flower stems may be tapped for their sap to produce a drink, and the sap can also be reduced by boiling to produce a type of sugar used for cooking.", "Coconut palms produce as many as seventy fruits per year, weighing more than a kilogram each. The wall of the fruit has three layers: a waterproof outer layer, a fibrous middle layer and a hard, inner layer. The thick fibrous middle layer produces coconut fibre, 'coir', which has numerous uses and is particularly important in manufacturing ropes. The woody innermost layer, the shell, with its three prominent 'eyes', surrounds the seed. An important product obtained from the shell is charcoal, which is widely used in various industries as well as in the home as a cooking fuel. When broken in half, the shells are also used as bowls in many parts of Asia.", "Inside the shell are the nutrients (endosperm) needed by the developing seed. Initially, the endosperm is a sweetish liquid, coconut water, which is enjoyed as a drink, but also provides the hormones which encourage other plants to grow more rapidly and produce higher yields. As the fruit matures, the coconut water gradually solidifies to form the brilliant white, fat-rich, edible flesh or meat. Dried coconut flesh, 'copra', is made into coconut oil and coconut milk, which are widely used in cooking in different parts of the world, as well as in cosmetics. A derivative of coconut fat, glycerine, acquired strategic importance in a quite different sphere, as Alfred Nobel introduced the world to his nitroglycerine-based invention: dynamite.", "Their biology would appear to make coconuts the great maritime voyagers and coastal colonizers of the plant world. The large, energy-rich fruits are able to float in water and tolerate salt, but cannot remain viable indefinitely; studies suggest after about 110 days at sea they are no longer able to germinate. Literally cast onto desert island shores, with little more than sand to grow in and exposed to the full glare of the tropical sun, coconut seeds are able to germinate and root. The air pocket in the seed, created as the endosperm solidifies, protects the embryo. In addition, the fibrous fruit wall that helped it to float during the voyage stores moisture that can be taken up by the roots of the coconut seedling as it starts to grow.", "There have been centuries of academic debate over the origins of the coconut. There were no coconut palms in West Africa, the Caribbean or the east coast of the Americas before the voyages of the European explorers Vasco da Gama and Columbus in the late 15th and early 16th centuries. 16th century trade and human migration patterns reveal that Arab traders and European sailors are likely to have moved coconuts from South and Southeast Asia to Africa and then across the Atlantic to the east coast of America. But the origin of coconuts discovered along the west coast of America by 16th century sailors has been the subject of centuries of discussion. Two diametrically opposed origins have been proposed: that they came from Asia, or that they were native to America. Both suggestions have problems. In Asia, there is a large degree of coconut diversity and evidence of millennia of human use – but there are no relatives growing in the wild. In America, there are close coconut relatives, but no evidence that coconuts are indigenous. These problems have led to the intriguing suggestion that coconuts originated on coral islands in the Pacific and were dispersed from there."]}, "antilia": {"title": "Antilia", "sub": null, "letters": true, "paras": ["Mukesh Ambani is one of the richest men in the world, and the first man to own a private residence costing more than one billion dollars to build. The home is on Altamout Road in Mumbai, one of the most expensive addresses in the world. Named after the mythical island Antilia, the property has 27 floors.", "The interior of the home is very glamorous and each floor is made from different materials to give an individual look. Marble floors, rare wood and fine rugs are just some of the design features used to create this extravagant home. The lotus flower and the sun are common symbols used throughout. Many of the rooms have floor-to-ceiling glass windows, offering spectacular views of Mumbai and the Arabian Sea.", "The skyscraper has a multi-storey garage with space for 168 cars. Alternatively, there are also three helipads on the roof of the building. The lobby has numerous reception areas and nine lifts. There are also several floors for dining, vast libraries and a health spa, including a gym, several swimming pools and yoga facilities. There is even an 'ice-room' which creates man-made snow, a Hindu prayer room and several floors of gardens.", "The Ambani residence is clearly designed to entertain guests. It has a theatre which seats 50, several guest bedrooms and a grand ballroom filled with chandeliers.", "The living quarters are on the top floors, because the family wanted as much sunlight as possible. The 400,000 ft² residence requires 600 staff, but all three Ambani children are required to clean their own rooms when they are at home.", "Several experts have criticised the architecture of this very expensive home, comparing it to an 'unstable pile of books'. Mrs Ambani, however, describes her home as 'an elevated house on top of a garden' and 'a modern home with an Indian heart'."]}, "urban": {"title": "Urban farming", "sub": null, "letters": false, "paras": ["In Paris, urban farmers are trying a soil-free approach to agriculture that uses less space and fewer resources. Could it help cities face the threats to our food supplies?", "On top of a striking new exhibition hall in southern Paris, the world's largest urban rooftop farm has started to bear fruit. Strawberries that are small, intensely flavoured and resplendently red sprout abundantly from large plastic tubes. Peer inside and you see the tubes are completely hollow, the roots of dozens of strawberry plants dangling down inside them. From identical vertical tubes nearby burst row upon row of lettuces; near those are aromatic herbs, such as basil, sage and peppermint. Opposite, in narrow, horizontal trays packed not with soil but with coconut fibre, grow cherry tomatoes, shiny aubergines and brightly coloured chards.", "Pascal Hardy, an engineer and sustainable development consultant, began experimenting with vertical farming and aeroponic growing towers- as the soil-free plastic tubes are known on his Paris apartment block roof five years ago. The urban rooftop space above the exhibition hall is somewhat bigger: 14,000 square metres and almost exactly the size of a couple of football pitches. Already, the team of young urban farmers who tend it have picked, in one day, 3,000 lettuces and 150 punnets of strawberries. When the remaining two thirds of the vast open area are in production, 20 staff will harvest up to 1,000 kg of perhaps 35 different varieties of fruit and vegetables, every day. 'We're not ever, obviously, going to feed the whole city this way,' cautions Hardy. 'In the urban environment you're working with very significant practical constraints, clearly, on what you can do and where. But if enough unused space can be developed like this, there's no reason why you shouldn't eventually target maybe between 5% and 10% of consumption.'", "Perhaps most significantly, however, this is a real-life showcase for the work of Hardy's flourishing urban agriculture consultancy, Agripolis, which is currently fielding enquiries from around the world to design, build and equip a new breed of soil-free inner-city farm. 'The method's advantages are many,' he says. 'First, I don't much like the fact that most of the fruit and vegetables we eat have been treated with something like 17 different pesticides, or that the intensive farming techniques that produced them are such huge generators of greenhouse gases. I don't much like the fact, either, that they've travelled an average of 2,000 refrigerated kilometres to my plate, that their quality is so poor, because the varieties are selected for their capacity to withstand such substantial journeys, or that 80% of the price I pay goes to wholesalers and transport companies, not the producers.'", "Produce grown using this soil-free method, on the other hand- which relies solely on a small quantity of water, enriched with organic nutrients, pumped around a closed circuit of pipes, towers and trays- is 'produced up here, and sold locally, just down there. It barely travels at all,' Hardy says. 'You can select crop varieties for their flavour, not their resistance to the transport and storage chain, and you can pick them when they're really at their best, and not before.' No soil is exhausted, and the water that gently showers the plants' roots every 12 minutes is recycled, so the method uses 90% less water than a classic intensive farm for the same yield.", "Urban farming is not, of course, a new phenomenon. Inner-city agriculture is booming from Shanghai to Detroit and Tokyo to Bangkok. Strawberries are being grown in disused shipping containers, mushrooms in underground carparks. Aeroponic farming, he says, is 'virtuous'. The equipment weighs little, can be installed on almost any flat surface and is cheap to buy: roughly €100 to €150 per square metre. It is cheap to run, too, consuming a tiny fraction of the electricity used by some techniques.", "Produce grown this way typically sells at prices that, while generally higher than those of classic intensive agriculture, are lower than soil-based organic growers. There are limits to what farmers can grow this way, of course, and much of the produce is suited to the summer months. 'Root vegetables we cannot do, at least not yet,' he says. 'Radishes are OK, but carrots, potatoes, that kind of thing- the roots are simply too long. Fruit trees are obviously not an option. And beans tend to take up a lot of space for not much return.' Nevertheless, urban farming of the kind being practised in Paris is one part of a bigger and fast-changing picture that is bringing food production closer to our lives."]}, "sahel": {"title": "Deforestation and Desertification", "sub": null, "letters": true, "paras": ["The Sahel zone lies between the Sahara desert and the fertile savannahs of northern Nigeria and southern Sudan. The word sahel comes from Arabic and means marginal or transitional, and this is a good description of these semi-arid lands, which occupy much of the West African countries of Mali, Mauritania, Niger and Chad.", "Unfortunately, over the last century the Sahara desert has steadily crept southwards, eating into once productive Sahel lands. United Nations surveys show that over 70 per cent of the dry land in agricultural use in Africa has deteriorated over the last 30 years. Droughts have become more prolonged and more severe, the most recent lasting over 20 years in parts of the Sahel region. The same process of desertification is taking place across southern Africa as the Kalahari desert advances into Botswana and parts of South Africa.", "One of the major causes of this desert advance is poor agricultural land use, driven by the pressures of increasing population. Overgrazing - keeping too many farm animals on the land - means that grasses and other plants cannot recover, and scarce water supplies are exhausted. Overcultivation - trying to grow too many crops on poor land - results in the soil becoming even less fertile and drier, and beginning to break up. Soil erosion follows, and the land turns into desert.", "Another cause of desertification is loss of tree cover. Trees are cut down for use as fuel and to clear land for agricultural use. Tree roots help to bind the soil together, to conserve moisture and to provide a habitat for other plants and animals. W hen trees are cut down, the soil begins to dry and loosen, wind and rain erosion increase, other plant species die and eventually the fertile topsoil may be almost entirely lost, leaving only bare rock and dust.", "The effects of loss of topsoil and increased drought are irreversible. They are, however, preventable. Careful conservation of tree cover and sustainable agricultural land use have been shown to halt deterioration of soils and lessen the effects of shortage of rainfall. One project in Kita in south-west Mali funded by the UNDP has involved local communities in sustainable management of forest, while at the same time providing a viable agricultural economy based on tne production of soaps, beekeeping and marketing shea nuts. This may be a model for similar projects in other West African countries."]}, "blombos": {"title": "Ochre find reveals ancient knowledge of chemistry", "sub": null, "letters": false, "paras": ["The oldest ochre-processing toolkits and workshop ever found have been unearthed, indicating that as far back as 100,000 years ago, humans had an understanding of chemistry.", "South Africa's Blombos Cave lies within a limestone cliff on the southern Cape coast, 300 km east of Cape Town. It's known for its 75,000-year-old rich deposits of artefacts such as beads, bone tools and ochre engravings. Some engravings date as far back as 100,000 years.", "Archaeologist Christopher S. Henshilwood from the University of Witwatersrand in Johannesburg and University of Bergen, Norway has been excavating at the site since 1992, and has reported the discovery of a mixture, rich in ochre, stored in two abalone shells. It dates back to the Middle Stone Age — 100,000 years ago. Ochre is a term used to describe a piece of earth or rock containing red or yellow oxides or hydroxides of iron. It can be used to make pigments, or paints, ranging from golden-yellow and light yellow-brown to a rich red. Its use spans the history of humans — from those living more than 200,000 years ago, to modern indigenous communities.", "Made from an array of materials, this mixture, which could have functioned as wall, object and skin decoration or skin protection (acting in a similar way to modern-day sunscreen), indicates the early developments that occurred in the people who originally used the site.", "\"[Judging from] the complexity of the material that has been collected from different parts of the landscape and brought to the site, they [the people] must have had an elementary knowledge of chemistry to be able to combine these materials to produce this form. It's not a straightforward process,\" said Henshilwood.", "The Blombos Cave discovery is the earliest-known example of a pigment- or paint-producing workshop. All of the materials were discovered at the same site, and they included an array of raw materials including samples of bone and charcoal, as well as pigment-producing equipment such as grindstones and hammerstones. Judging by the equipment, which shows signs of wear, Henshilwood and his team were able to deduce the process used to produce the ochre mixture.", "First, the pieces of ochre were rubbed on quartzite slabs and crushed to produce a red powder. This was combined with ground-up mammal bone, the traces of which show signs that it was heated before being ground. The ochre powder and the bone pieces were mixed with charcoal, stone chips, quartz grains and a liquid (perhaps water) and was then transferred to abalone shells to be gently stirred before being ready for application."]}, "underground": {"title": "The development of the London underground railway", "sub": null, "letters": false, "paras": ["In the first half of the 1800s, London's population grew at an astonishing rate, and the central area became increasingly congested. In addition, the expansion of the overground railway network resulted in more and more passengers arriving in the capital. However, in 1846, a Royal Commission decided that the railways should not be allowed to enter the City, the capital's historic and business centre. The result was that the overground railway stations formed a ring around the City. The area within consisted of poorly built, overcrowded slums and the streets were full of horse-drawn traffic. Crossing the City became a nightmare. It could take an hour and a half to travel 8 km by horse-drawn carriage or bus. Numerous schemes were proposed to resolve these problems, but few succeeded.", "Amongst the most vocal advocates for a solution to London's traffic problems was Charles Pearson, who worked as a solicitor for the City of London. He saw both social and economic advantages in building an underground railway that would link the overground railway stations together and clear London slums at the same time. His idea was to relocate the poor workers who lived in the inner-city slums to newly constructed suburbs, and to provide cheap rail travel for them to get to work. Pearson's ideas gained support amongst some businessmen and in 1851 he submitted a plan to Parliament. It was rejected, but coincided with a proposal from another group for an underground connecting line, which Parliament passed.", "The two groups merged and established the Metropolitan Railway Company in August 1854. The company's plan was to construct an underground railway line from the Great Western Railway's (GWR) station at Paddington to the edge of the City at Farringdon Street – a distance of almost 5 km. The organisation had difficulty in raising the funding for such a radical and expensive scheme, not least because of the critical articles printed by the press. Objectors argued that the tunnels would collapse under the weight of traffic overhead, buildings would be shaken and passengers would be poisoned by the emissions from the train engines. However, Pearson and his partners persisted.", "The GWR, aware that the new line would finally enable them to run trains into the heart of the City, invested almost £250,000 in the scheme. Eventually, over a five-year period, £1m was raised. The chosen route ran beneath existing main roads to minimise the expense of demolishing buildings. Originally scheduled to be completed in 21 months, the construction of the underground line took three years. It was built just below street level using a technique known as 'cut and cover'. A trench about ten metres wide and six metres deep was dug, and the sides temporarily held up with timber beams. Brick walls were then constructed, and finally a brick arch was added to create a tunnel. A two-metre-deep layer of soil was laid on top of the tunnel and the road above rebuilt.", "The Metropolitan line, which opened on 10 January 1863, was the world's first underground railway. On its first day, almost 40,000 passengers were carried between Paddington and Farringdon, the journey taking about 18 minutes. By the end of the Metropolitan's first year of operation, 9.5 million journeys had been made.", "Even as the Metropolitan began operation, the first extensions to the line were being authorised; these were built over the next five years, reaching Moorgate in the east of London and Hammersmith in the west. The original plan was to pull the trains with steam locomotives, using firebricks in the boilers to provide steam, but these engines were never introduced. Instead, the line used specially designed locomotives that were fitted with water tanks in which steam could be condensed. However, smoke and fumes remained a problem, even though ventilation shafts were added to the tunnels.", "Despite the extension of the underground railway, by the 1880s, congestion on London's streets had become worse. The problem was partly that the existing underground lines formed a circuit around the centre of London and extended to the suburbs, but did not cross the capital's centre. The 'cut and cover' method of construction was not an option in this part of the capital. The only alternative was to tunnel deep underground.", "Although the technology to create these tunnels existed, steam locomotives could not be used in such a confined space. It wasn't until the development of a reliable electric motor, and a means of transferring power from the generator to a moving train, that the world's first deep-level electric railway, the City & South London, became possible. The line opened in 1890, and ran from the City to Stockwell, south of the River Thames. The trains were made up of three carriages and driven by electric engines. The carriages were narrow and had tiny windows just below the roof because it was thought that passengers would not want to look out at the tunnel walls. The line was not without its problems, mainly caused by an unreliable power supply. Although the City & South London Railway was a great technical achievement, it did not make a profit. Then, in 1900, the Central London Railway, known as the 'Tuppenny Tube', began operation using new electric locomotives. It was very popular and soon afterwards new railways and extensions were added to the growing tube network. By 1907, the heart of today's Underground system was in place."]}, "tortoise": {"title": "The history of the tortoise", "sub": null, "letters": false, "paras": ["If you go back far enough, everything lived in the sea. At various points in evolutionary history, enterprising individuals within many different animal groups moved out onto the land, sometimes even to the most parched deserts, taking their own private seawater with them in blood and cellular fluids. In addition to the reptiles, birds, mammals and insects which we see all around us, other groups that have succeeded out of water include scorpions, snails, crustaceans such as woodlice and land crabs, millipedes and centipedes, spiders and various worms. And we mustn't forget the plants, without whose prior invasion of the land none of the other migrations could have happened.", "Moving from water to land involved a major redesign of every aspect of life, including breathing and reproduction. Nevertheless, a good number of thoroughgoing land animals later turned around, abandoned their hard-earned terrestrial re-tooling, and returned to the water again. Seals have only gone part way back. They show us what the intermediates might have been like, on the way to extreme cases such as whales and dugongs. Whales (including the small whales we call dolphins) and dugongs, with their close cousins the manatees, ceased to be land creatures altogether and reverted to the full marine habits of their remote ancestors. They don't even come ashore to breed. They do, however, still breathe air, having never developed anything equivalent to the gills of their earlier marine incarnation. Turtles went back to the sea a very long time ago and, like all vertebrate returnees to the water, they breathe air. However, they are, in one respect, less fully given back to the water than whales or dugongs, for turtles still lay their eggs on beaches.", "There is evidence that all modern turtles are descended from a terrestrial ancestor which lived before most of the dinosaurs. There are two key fossils called Proganochelys quenstedti and Palaeochersis talampayensis dating from early dinosaur times, which appear to be close to the ancestry of all modern turtles and tortoises. You might wonder how we can tell whether fossil animals lived on land or in water, especially if only fragments are found. Sometimes it's obvious. Ichthyosaurs were reptilian contemporaries of the dinosaurs, with fins and streamlined bodies. The fossils look like dolphins and they surely lived like dolphins, in the water. With turtles it is a little less obvious. One way to tell is by measuring the bones of their forelimbs.", "Walter Joyce and Jacques Gauthier, at Yale University, obtained three measurements in these particular bones of 71 species of living turtles and tortoises. They used a kind of triangular graph paper to plot the three measurements against one another. All the land tortoise species formed a tight cluster of points in the upper part of the triangle; all the water turtles cluster in the lower part of the triangular graph. There was no overlap, except when they added some species that spend time both in water and on land. Sure enough, these amphibious species show up on the triangular graph approximately half way between the 'wet cluster' of sea turtles and the 'dry cluster' of land tortoises. The next step was to determine where the fossils fell. The bones of P. quenstedti and P. talampayensis leave us in no doubt. Their points on the graph are right in the thick of the dry cluster. Both these fossils were dry-land tortoises. They come from the era before our turtles returned to the water.", "You might think, therefore, that modern land tortoises have probably stayed on land ever since those early terrestrial times, as most mammals did after a few of them went back to the sea. But apparently not. If you draw out the family tree of all modern turtles and tortoises, nearly all the branches are aquatic. Today's land tortoises constitute a single branch, deeply nested among branches consisting of aquatic turtles. This suggests that modern land tortoises have not stayed on land continuously since the time of P. quenstedti and P. talampayensis. Rather, their ancestors were among those who went back to the water, and they then re-emerged back onto the land in (relatively) more recent times.", "Tortoises therefore represent a remarkable double return. In common with all mammals, reptiles and birds, their remote ancestors were marine fish and before that various more or less worm-like creatures stretching back, still in the sea, to the primeval bacteria. Later ancestors lived on land and stayed there for a very large number of generations. Later ancestors still evolved back into the water and became sea turtles. And finally they returned yet again to the land as tortoises, some of which now live in the driest of deserts."]}, "timetravel": {"title": "Time Travel", "sub": null, "letters": false, "paras": ["Time travel took a small step away from science fiction and toward science recently when physicists discovered that sub-atomic particles known as neutrinos – progeny of the sun's radioactive debris – can exceed the speed of light. The unassuming particle – it is electrically neutral, small but with a \"non-zero mass\" and able to penetrate the human form undetected – is on its way to becoming a rock star of the scientific world.", "Researchers from the European Organisation for Nuclear Research (CERN) in Geneva sent the neutrinos hurtling through an underground corridor toward their colleagues at the Oscillation Project with Emulsion-Tracing Apparatus (OPERA) team 730 kilometres away in Gran Sasso, Italy. The neutrinos arrived promptly – so promptly, in fact, that they triggered what scientists are calling the unthinkable – that everything they have learnt, known or taught stemming from the last one hundred years of the physics discipline may need to be reconsidered.", "The issue at stake is a tiny segment of time – precisely sixty nanoseconds (which is sixty billionths of a second). This is how much faster than the speed of light the neutrinos managed to go in their underground travels and at a consistent rate (15,000 neutrinos were sent over three years). Even allowing for a margin of error of ten billionths of a second, this stands as proof that it is possible to race against light and win. The duration of the experiment also accounted for and ruled out any possible lunar effects or tidal bulges in the earth's crust.", "Nevertheless, there's plenty of reason to remain sceptical. According to Harvard University science historian Peter Galison, Einstein's relativity theory has been \"pushed harder than any theory in the history of the physical sciences\". Yet each prior challenge has come to no avail, and relativity has so far refused to buckle.", "So is time travel just around the corner? The prospect has certainly been wrenched much closer to the realm of possibility now that a major physical hurdle – the speed of light – has been cleared. If particles can travel faster than light, in theory travelling back in time is possible. How anyone harnesses that to some kind of helpful end is far beyond the scope of any modern technologies, however, and will be left to future generations to explore.", "Certainly, any prospective time travellers may have to overcome more physical and logical hurdles than merely overtaking the speed of light. One such problem, posited by René Barjavel in his 1943 text Le Voyageur Imprudent is the so- called grandfather paradox. Barjavel theorised that, if it were possible to go back in time, a time traveller could potentially kill his own grandfather. If this were to happen, however, the time traveller himself would not be born, which is already known to be true. In other words, there is a paradox in circumventing an already known future; time travel is able to facilitate past actions that mean time travel itself cannot occur.", "Other possible routes have been offered, though. For Igor Novikov, astrophysicist behind the 1980s' theorem known as the self-consistency principle, time travel is possible within certain boundaries. Novikov argued that any event causing a paradox would have zero probability. It would be possible, however, to \"affect\" rather than \"change\" historical outcomes if travellers avoided all inconsistencies. Averting the sinking of the Titanic, for example, would revoke any future imperative to stop it from sinking – it would be impossible. Saving selected passengers from the water and replacing them with realistic corpses would not be impossible, however, as the historical record would not be altered in any way.", "A further possibility is that of parallel universes. Popularised by Bryce Seligman DeWitt in the 1960s (from the seminal formulation of Hugh Everett), the many-worlds interpretation holds that an alternative pathway for every conceivable occurrence actually exists. If we were to send someone back in time, we might therefore expect never to see him again – any alterations would divert that person down a new historical trajectory.", "A final hypothesis, one of unidentified provenance, reroutes itself quite efficiently around the grandfather paradox. Non-existence theory suggests exactly that – a person would quite simply never exist if they altered their ancestry in ways that obstructed their own birth. They would still exist in person upon returning to the present, but any chain reactions associated with their actions would not be registered. Their \"historical identity\" would be gone.", "So, will humans one day step across the same boundary that the neutrinos have? World-renowned astrophysicist Stephen Hawking believes that once spaceships can exceed the speed of light, humans could feasibly travel millions of years into the future in order to repopulate earth in the event of a forthcoming apocalypse. This is because, as the spaceships accelerate into the future, time would slow down around them (Hawking concedes that bygone eras are off limits – this would violate the fundamental rule that cause comes before effect).", "Hawking is therefore reserved yet optimistic. \"Time travel was once considered scientific heresy, and I used to avoid talking about it for fear of being labelled a crank. These days I'm not so cautious.\""]}, "swallows": {"title": "Swallows in Migration", "sub": null, "letters": false, "paras": ["Every April, along with many other species of birds, the swallow arrives to spend the summer months in northern Europe, in Russia, Iran and parts of Siberia. Here it will breed and raise its young.", "The swallow is well known for several reasons. Firstly, it is very distinctive, with its forked tail and characteristic acrobatic swooping flight. Secondly, it is very common, and, like its near relative the house martin, lives in close proximity to human habitation, at least in rural areas. It is, however, rarely to be encountered in towns or cities.", "For centuries, people have observed swallows, noted their arrival and their patterns of feeding. In several countries, these observations have passed into the language as proverbs or sayings. In England, people comment on unpredictable late spring weather by saying, 'one swallow does not a summer make'. Similarly, 'the swallows are flying low' was held to predict rainy, even stormy weather. There may be some truth in this observation, though it is the insects the swallows feed on that seem to be more susceptible to the fall in barometric pressure that heralds a storm. Insects keep low in these conditions, and so do the swallows that hunt them. At the end of the summer season, when the swallows are about to leave, they frequently flock together in large numbers on convenient high open perches, like roof ridges and telegraph wires. When people remark that 'the swallows are gathering', they mean that autumn has arrived.", "At some point in mid-September the swallows leave together, usually all on the same day. One day there are thousands, the next there are none, and none will be seen again until the following spring. For centuries, this was a complete mystery to people. The Hampshire naturalist Gilbert White, writing in the late eighteenth century, believed that the swallows dived into ponds and rivers in autumn and remained in the bottom mud the whole winter, re-emerging the following spring. This idea seems extraordinary to us, but White was not a stupid man: many of his other observations of natural life were informed and accurate. In this case, however, he simply had no means of determining the truth and was forced to make a random guess. The idea that swallows migrate to central or southern Africa would have seemed as fanciful to him as his theory seems to us.", "Although we now know that swallows migrate, there are still unanswered questions. Why do they go so far? Why not stay on the shores of the Mediterranean? The majority continue to equatorial Africa, and some even further south. Also it appears that populations of swallows that have bred in different countries also spend the winter in different areas. Those from France, Germany and much of western Europe have mostly been traced to East Africa, Kenya or Tanzania for example. Above all, how does a bird weighing approximately twenty grams find its way across mountain ranges, ocean and desert to winter in the south, and then return the following year to the very location it was born, in some cases to the very same nest?", "Birds can navigate by the Sun, and are also able to detect the magnetic field of the Earth. Species that migrate at night are also able to navigate by the stars. By these means, they travel long distances. The close navigation that brings them back to the same field or nest appears to be related to memory of local landmarks imprinted on the minds of young birds as they crisscross the area in the weeks before departure.", "Nevertheless, the journey is very dangerous. Long sea crossings, where there is little available food or water, are generally avoided. In western Europe, most swallows cross to Africa via the Straits of Gibraltar, or fly the length of Italy before tackling the relatively short crossing to Tunisia in North Africa. However, in storms they may be blown hundreds of kilometres off course. Exhausted swallows sometimes come to rest on ships way out in the Atlantic Ocean. They have to cross mountain ranges too, where again the weather may be unpredictable and food scarce. Along the coast of North Africa, many young swallows become the prey of Eleonora's falcons, which time their breeding to coincide with the migration of young birds southwards. But the most dangerous part of the journey is the crossing of the Sahara desert. Here, there is little food or water, sandstorms may delay and exhaust the already weakened birds, and many die. It is estimated that around 50 per cent of adult birds die, and up to 80 per cent of young birds, but enough survive to ensure the continuation of the species."]}, "hearst": {"title": "Hearst Castle", "sub": null, "letters": true, "paras": ["William Randolph Hearst was a successful American newspaper publisher who received over 1,000 km² of land when his mother died in 1919. Initially, he had planned to build just a small bungalow, so he hired Julia Morgan, the first female architect in California. Together, however, they designed a magnificent castle which cost 10 million dollars and took 28 years to build. The property, named La Cuesta Encantada (The Enchanted Mountain), has 56 bedrooms, 61 bathrooms, 19 sitting rooms and about 52,000 m² of garden.", "Hearst loved travelling to Europe when he was a child and we can see this in the overall design of the house. He even included cathedral ceilings and Roman columns in his home. Hearst was also a keen art collector and, during his lifetime, spent $3.5 million on his collection, which is displayed in the rooms at Hearst Castle. Today, his collection is worth much more, with one piece alone valued at $10 million.", "One of the highlights of the estate is the Neptune Pool. It took 15 years to build and includes the front of an ancient Roman temple. It is on top of a hill and has wonderful views of the mountains, ocean and main house. The pool was rebuilt three times until he was satisfied.", "Although the inside of the house is very European, the outside is very Californian, with palm trees and water. Hearst loved trees and 70,000 were planted on the property during his lifetime. The castle was also home to the world's largest private zoo, holding animals from every continent. Although the zoo is now closed, zebras can still be seen on the hillside.", "As well as the Casa Grande (the main house), there are also three guest houses on the property: Casa Del Monte, Casa Del Sol and Casa Del Mar. Hearst entertained a great number of Hollywood stars and political leaders at the castle and many used his private airfield. Guests had to attend formal dinners every evening, but were free to do what they liked during the day. They were invited to stay as long as they wanted, but the longer they stayed, the further away they sat from Hearst at the dinner table.", "When Hearst died in 1951, his family learnt how expensive maintenance would be, and the mansion was donated to the State of California. Since then, it has been open for public tours and the site attracts millions of tourists every year. However, the Hearst family is still allowed to use it when they wish. The castle was never completed and remains unfinished."]}, "stonehenge": {"title": "Stonehenge", "sub": "Construction", "letters": false, "paras": ["For centuries, historians and archaeologists have puzzled over the many mysteries of Stonehenge, a prehistoric monument that took an estimated 1,500 years to erect. Located on Salisbury Plain in southern England, it is comprised of roughly 100 massive upright stones placed in a circular layout.", "Archaeologists believe England's most iconic prehistoric ruin was built in several stages with the earliest constructed 5,000 or more years ago. First, Neolithic* Britons used primitive tools, which may have been fashioned out of deer antlers, to dig a massive circular ditch and bank, or henge. Deep pits dating back to that era and located within the circle may have once held a ring of timber posts, according to some scholars.", "Several hundred years later, it is thought, Stonehenge's builders hoisted an estimated 80 bluestones, 43 of which remain today, into standing positions and placed them in either a horseshoe or circular formation. These stones have been traced all the way to the Preseli Hills in Wales, some 300 kilometres from Stonehenge. How, then, did prehistoric builders without sophisticated tools or engineering haul these boulders, which weigh up to four tons, over such a great distance?", "According to one long-standing theory among archaeologists, Stonehenge's builders fashioned sledges and rollers out of tree trunks to lug the bluestones from the Preseli Hills. They then transferred the boulders onto rafts and floated them first along the Welsh coast and then up the River Avon toward Salisbury Plain; alternatively, they may have towed each stone with a fleet of vessels. More recent archaeological hypotheses have them transporting the bluestones with supersized wicker baskets on a combination of ball bearings and long grooved planks, hauled by oxen.", "As early as the 1970s, geologists have been adding their voices to the debate over how Stonehenge came into being. Challenging the classic image of industrious builders pushing, carting, rolling or hauling giant stones from faraway Wales, some scientists have suggested that it was glaciers, not humans, that carried the bluestones to Salisbury Plain. Most archaeologists have remained sceptical about this theory, however, wondering how the forces of nature could possibly have delivered the exact number of stones needed to complete the circle.", "The third phase of construction took place around 2000 BCE. At this point, sandstone slabs known as 'sarsens' were arranged into an outer crescent or ring; some were assembled into the iconic three-pieced structures called trilithons that stand tall in the centre of Stonehenge. Some 50 of these stones are now visible on the site, which may once have contained many more. Radiocarbon dating has revealed that work continued at Stonehenge until roughly 1600 BCE, with the bluestones in particular being repositioned multiple times.", "But who were the builders of Stonehenge? In the 17th century, archaeologist John Aubrey made the claim that Stonehenge was the work of druids, who had important religious, judicial and political roles in Celtic** society. This theory was widely popularized by the antiquarian William Stukeley, who had unearthed primitive graves at the site. Even today, people who identify as modern druids continue to gather at Stonehenge for the summer solstice. However, in the mid-20th century, radiocarbon dating demonstrated that Stonehenge stood more than 1,000 years before the Celts inhabited the region.", "Many modern historians and archaeologists now agree that several distinct tribes of people contributed to Stonehenge, each undertaking a different phase of its construction. Bones, tools and other artefacts found on the site seem to support this hypothesis. The first stage was achieved by Neolithic agrarians who were likely to have been indigenous to the British Isles. Later, it is believed, groups with advanced tools and a more communal way of life left their mark on the site. Some believe that they were immigrants from the European continent, while others maintain that they were probably native Britons, descended from the original builders.", "If the facts surrounding the architects and construction of Stonehenge remain shadowy at best, the purpose of the striking monument is even more of a mystery. While there is consensus among the majority of modern scholars that Stonehenge once served the function of burial ground, they have yet to determine what other purposes it had.", "In the 1960s, the astronomer Gerald Hawkins suggested that the cluster of megalithic stones operated as a form of calendar, with different points corresponding to astrological phenomena such as solstices, equinoxes and eclipses occurring at different times of the year. While his theory has received a considerable amount of attention over the decades, critics maintain that Stonehenge's builders probably lacked the knowledge necessary to predict such events or that England's dense cloud cover would have obscured their view of the skies.", "More recently, signs of illness and injury in the human remains unearthed at Stonehenge led a group of British archaeologists to speculate that it was considered a place of healing, perhaps because bluestones were thought to have curative powers.", "* Neolithic – The era, also known as the New Stone Age, which began around 12,000 years ago and ended around 3500 BCE ** Celtic – The Celts were people who lived in Britain and northwest Europe during the Iron Age from 600 BCE to 43 CE"]}, "collect": {"title": "Why do people collect things?", "sub": null, "letters": false, "paras": ["People from almost every culture love collecting things. They might collect stamps, books, cards, priceless paintings or worthless ticket stubs to old sports games. Their collection might hang on the walls of a mansion or be stored in a box under the bed. So what is it that drives people to collect? Psychologist Dr Maria Richter argues that the urge to collect is a basic human characteristic. According to her, in the very first years of life we form emotional connections with lifeless objects such as soft toys. And these positive relationships are the starting point for our fascination with collecting objects. In fact, the desire to collect may go back further still. Scientists suggest that for some ancient humans living hundreds of thousands of years ago, collecting may have had a serious purpose. Only by collecting sufficient food supplies to last through freezing winters or dry summers could our ancestors stay alive until the weather improved.", "It turns out that even collecting for pleasure has a very long history. In 1925, the archaeologist Leonard Woolley was working at a site in the historic Babylonian city of Ur. Woolley had travelled to the region intending only to excavate the site of a palace. Instead, to his astonishment, he dug up artefacts which appeared to belong to a 2,500-year-old museum. Among the objects was part of a statue and a piece of a local building. And accompanying some of the artefacts were descriptions like modern-day labels. These texts appeared in three languages and were carved into pieces of clay. It seems likely that this early private collection of objects was created by Princess Ennigaldi, the daughter of King Nabonidus. However, very little else is known about Princess Ennigaldi or what her motivations were for setting up her collection.", "This may have been one of the first large private collections, but it was not the last. Indeed, the fashion for establishing collections really got started in Europe around 2,000 years later with the so-called 'Cabinets of Curiosities'. These were collections, usually belonging to wealthy families, that were displayed in cabinets or small rooms. Cabinets of Curiosities typically included fine paintings and drawings, but equal importance was given to exhibits from the natural world such as animal specimens, shells and plants.", "Some significant private collections of this sort date from the fifteenth century. One of the first belonged to the Medici family. The Medicis became a powerful political family in Italy and later a royal house, but banking was originally the source of all their wealth. The family started by collecting coins and valuable gems, then artworks and antiques from around Europe. In 1570 a secret 'studio' was built inside the Palazzo Medici to house their growing collection. This exhibition room had solid walls without windows to keep the valuable collection safe.", "In the seventeenth century, another fabulous collection was created by a Danish physician named Ole Worm. His collection room contained numerous skeletons and specimens, as well as ancient texts and a laboratory. One of Ole Worm's motivations was to point out when other researchers had made mistakes, such as the false claim that birds of paradise had no feet. He also owned a great auk, a species of bird that has now become extinct, and the illustration he produced of it has been of value to later scientists.", "The passion for collecting was just as strong in the nineteenth century. Lady Charlotte Guest spoke at least six languages and became well-known for translating English books into Welsh. She also travelled widely throughout Europe acquiring old and rare pottery, which she added to her collection at home in southern England. When Lady Charlotte died in 1895 this collection was given to the Victoria and Albert Museum in London. At around the same time in the north of England, a wealthy goldsmith named Joseph Mayer was building up an enormous collection of artefacts, particularly those dug up from sites in his local area. His legacy, the Mayer Trust, continues to fund public lectures in accordance with his wishes.", "In the twentieth century, the writer Beatrix Potter had a magnificent collection of books, insects, plants and other botanical specimens. Most of these were donated to London's Natural History Museum, but Beatrix held on to her cabinets of fossils, which she was particularly proud of. In the United States, President Franklin D. Roosevelt began his stamp collection as a child and continued to add to it all his life. The stress associated with being president was easier to cope with, Roosevelt said, by taking time out to focus on his collection. By the end of his life this had expanded to include model ships, coins and artworks.", "Most of us will never own collections so large or valuable as these. However, the examples given here suggest that collecting is a passion that has been shared by countless people over many centuries."]}, "animals": {"title": "Can animals count?", "sub": null, "letters": false, "paras": ["Prime among basic numerical faculties is the ability to distinguish between a larger and a smaller number, says psychologist Elizabeth Brannon. Humans can do this with ease - providing the ratio is big enough - but do other animals share this ability? In one experiment, rhesus monkeys and university students examined two sets of geometrical objects that appeared briefly on a computer monitor. They had to decide which set contained more objects. Both groups performed successfully but, importantly, Brannon's team found that monkeys, like humans, make more errors when two sets of objects are close in number. 'The students' performance ends up looking just like a monkey's. It's practically identical,' she says.", "Humans and monkeys are mammals, in the animal family known as primates. These are not the only animals whose numerical capacities rely on ratio, however. The same seems to apply to some amphibians. Psychologist Claudia Uller's team tempted salamanders with two sets of fruit flies held in clear tubes. In a series of trials, the researchers noted which tube the salamanders scampered towards, reasoning that if they had a capacity to recognise number, they would head for the larger number. The salamanders successfully discriminated between tubes containing 8 and 16 flies respectively, but not between 3 and 4, 4 and 6, or 8 and 12. So it seems that for the salamanders to discriminate between two numbers, the larger must be at least twice as big as the smaller. However, they could differentiate between 2 and 3 flies just as well as between 1 and 2 flies, suggesting they recognise small numbers in a different way from larger numbers.", "Further support for this theory comes from studies of mosquitofish, which instinctively join the biggest shoal* they can. A team at the University of Padova found that while mosquitofish can tell the difference between a group containing 3 shoal-mates and a group containing 4, they did not show a preference between groups of 4 and 5. The team also found that mosquitofish can discriminate between numbers up to 16, but only if the ratio between the fish in each shoal was greater than 2:1. This indicates that the fish, like salamanders, possess both the approximate and precise number systems found in more intelligent animals such as infant humans and other primates.", "While these findings are highly suggestive, some critics argue that the animals might be relying on other factors to complete the tasks, without considering the number itself. 'Any study that's claiming an animal is capable of representing number should also be controlling for other factors,' says Brannon. Experiments have confirmed that primates can indeed perform numerical feats without extra clues, but what about the more primitive animals? To consider this possibility, the mosquitofish tests were repeated, this time using varying geometrical shapes in place of fish. The team arranged these shapes so that they had the same overall surface area and luminance even though they contained a different number of objects. Across hundreds of trials on 14 different fish, the team found they consistently discriminated 2 objects from 3. The team is now testing whether mosquitofish can also distinguish 3 geometric objects from 4.", "Even more primitive organisms may share this ability. Entomologist Jurgen Tautz sent a group of bees down a corridor, at the end of which lay two chambers – one which contained sugar water, which they like, while the other was empty. To test the bees' numeracy, the team marked each chamber with a different number of geometrical shapes – between 2 and 6. The bees quickly learned to match the number of shapes with the correct chamber. Like the salamanders and fish, there was a limit to the bees' mathematical prowess – they could differentiate up to 4 shapes, but failed with 5 or 6 shapes.", "These studies still do not show whether animals learn to count through training, or whether they are born with the skills already intact. If the latter is true, it would suggest there was a strong evolutionary advantage to a mathematical mind. Proof that this may be the case has emerged from an experiment testing the mathematical ability of three- and four-day-old chicks. Like mosquitofish, chicks prefer to be around as many of their siblings as possible, so they will always head towards a larger number of their kin. If chicks spend their first few days surrounded by certain objects, they become attached to these objects as if they were family. Researchers placed each chick in the middle of a platform and showed it two groups of balls of paper. Next, they hid the two piles behind screens, changed the quantities and revealed them to the chick. This forced the chick to perform simple computations to decide which side now contained the biggest number of its \"brothers\". Without any prior coaching, the chicks scuttled to the larger quantity at a rate well above chance. They were doing some very simple arithmetic, claim the researchers.", "Why these skills evolved is not hard to imagine, since it would help almost any animal forage for food. Animals on the prowl for sustenance must constantly decide which tree has the most fruit, or which patch of flowers will contain the most nectar. There are also other, less obvious, advantages of numeracy. In one compelling example, researchers in America found that female coots appear to calculate how many eggs they have laid – and add any in the nest laid by an intruder – before making any decisions about adding to them. Exactly how ancient these skills are is difficult to determine, however. Only by studying the numerical abilities of more and more creatures using standardised procedures can we hope to understand the basic preconditions for the evolution of number.", "* a group of fish"]}}};</script><script>/* IELTS Reading Lab – shared core: data access, marking, rendering of question papers and explanations */
const LAB = window.__LAB__;            // {name, code, token, keyStr}
const DATA = window.__DATA__;          // {tests, passages}
const TESTS = DATA.tests;
const TBY = Object.fromEntries(TESTS.map(t => [t.id, t]));
const LEVELS = [
  {id:'foundation', label:'Foundation', sub:'Build accuracy', desc:'Short texts and guided steps: predict the word type, locate, copy exactly. Sentences, short answers, a first flow-chart and notes.'},
  {id:'core', label:'Core', sub:'Exam practice', desc:'Full IELTS Passage 1 tasks under exam timing: sentence, note and table completion with ONE or TWO word limits.'},
  {id:'extension', label:'Extension', sub:'Stretch further', desc:'Harder passages and Passage 3 tasks: three-word answers, tables out of passage order, heavy paraphrase.'}
];
const CAUSES = [
  ['locate', 'Could not find the right part of the passage', 'Underline locating words first (names, numbers, dates, capital letters, long words) and scan for them, not for the answer.'],
  ['paraphrase', 'Missed the paraphrase / synonym', 'Before scanning, write 1–2 synonyms for each key word in the question (e.g. reduce → lessen, cut).'],
  ['vocab', 'Did not know a key word', 'Guess from context, then add the word to your vocabulary list with a synonym and an antonym.'],
  ['grammar', 'Wrong word type or grammar', 'Predict the word type before reading: a/an → singular noun; no article → plural/uncountable; "is ___" → adjective.'],
  ['limit', 'Over the word limit', 'Circle the limit (ONE WORD ONLY / NO MORE THAN TWO WORDS). Remove adjectives the sentence does not need.'],
  ['distractor', 'Chose a nearby distractor', 'Read the whole sentence around the answer. Check who/what/when matches the question exactly.'],
  ['spelling', 'Spelling or plural -s', 'Copy letter by letter from the passage. Check singular/plural against the words before the gap.'],
  ['time', 'Ran out of time', 'About 1.5 minutes per question. Skip, mark it, and come back.'],
  ['careless', 'Careless / typo', 'Use the last minute to check every answer against the sentence and the word limit.']
];
const CAUSE_BY = Object.fromEntries(CAUSES.map(c => [c[0], c]));
const KIND_ORDER = ['short', 'sentence', 'notes', 'table', 'flow', 'choice', 'tfng'];
const KIND_LABEL = {short:'Short answer', sentence:'Sentence', notes:'Notes', table:'Table', flow:'Flow-chart', choice:'Word type', tfng:'TFNG'};

/* ---------- decoding (answers are encoded in the student file) ---------- */
const _kc = {};
function getK(box) {
  if (typeof box.k !== 'string') return box.k;
  if (_kc[box.id]) return _kc[box.id];
  return (_kc[box.id] = decStr(box.k));
}
function decStr(s) {
  const bin = atob(s), key = LAB.keyStr, bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ key.charCodeAt(i % key.length);
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* ---------- marking ---------- */
function nrm(s) {
  s = (s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '');
  s = s.replace(/[‘’`´]/g, "'").replace(/[“”]/g, '"').replace(/[–—‑−]/g, '-');
  s = s.toLowerCase().replace(/(\d),(?=\d{3}\b)/g, '$1').replace(/\s+/g, ' ').trim();
  s = s.replace(/[.;:!?,]+$/g, '').replace(/^["']|["']$/g, '').trim();
  s = s.replace(/\s*-\s*/g, '-').replace(/\s*,\s*/g, ', ');
  return s;
}
function expand(alt) {
  const parts = alt.split(/(\([^)]*\))/).filter(x => x !== '');
  let vs = [''];
  for (const p of parts) {
    if (/^\(.*\)$/.test(p)) { const inner = p.slice(1, -1); vs = vs.flatMap(v => [v, v + inner]); }
    else vs = vs.map(v => v + p);
  }
  return vs.map(v => nrm(v));
}
function tokens(s) { return nrm(s).split(' ').filter(Boolean); }
const NUMW = new Set('one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty thirty forty fifty sixty seventy eighty ninety hundred thousand million billion twenty-one twenty-two twenty-five twenty-seven'.split(' '));
function isNum(t) { return /^[$£€]?\d[\d.,/]*(%|²|kg|km|m)?$/.test(t) || NUMW.has(t); }
function overLimit(ans, lim) {
  if (!lim) return false;
  const raw = tokens(ans), ts = raw.filter((x, i) => !(isNum(x) && i > 0 && isNum(raw[i - 1])));  // '3.5 million' = one number
  const nums = ts.filter(isNum).length, words = ts.length - nums;
  return lim.n ? (words > lim.w || nums > 1) : ts.length > lim.w;
}
function accepted(list) { const s = new Set(); list.forEach(a => expand(a).forEach(v => s.add(v))); return s; }
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({length: m + 1}, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
function passageText(t) { return nrm(DATA.passages[t.passage].paras.join(' ')); }

/* grade one test: answers = {boxId: string}. returns {score,total,res:{boxId:{ok,type}}} */
function gradeTest(t, answers) {
  const res = {}; let score = 0;
  const ptext = passageText(t);
  for (const g of t.groups) {
    const setPools = {};
    for (const [sid, kk] of Object.entries(g.sets || {})) { const keys = typeof kk === 'string' ? decStr(kk) : kk; setPools[sid] = keys.map(k => ({acc: accepted(k), used: false})); }
    // set boxes: first pass exact matching to avoid order problems
    // paired boxes: both words needed for ONE mark, any order; joined words in one box (and , ; / - |) are accepted too
    const pairIds = [...new Set(g.boxes.filter(b => b.pair).map(b => b.pair))];
    for (const pid of pairIds) {
      const pb = g.boxes.filter(b => b.pair === pid), keys = setPools[pid].map(p => p.acc);
      const toks = pb.map(b => nrm(answers[b.id] || '')).join(' ; ').split(/\s*(?:,|;|\/|\||-|&|\band\b)\s*|\s+/).filter(Boolean);
      const used = keys.map(() => false); let extra = 0;
      toks.forEach(tk => { const i = keys.findIndex((acc, x) => !used[x] && acc.has(tk)); if (i >= 0) used[i] = true; else extra++; });
      const ok = used.every(Boolean) && extra === 0;
      const type = ok ? '' : !toks.length ? 'No answer' : used.some(Boolean) && !extra ? 'Only one of the two words' : 'Wrong information (in the passage)';
      pb.forEach(b => { res[b.id] = {ok, type}; });
      if (ok) score++;
    }
    for (const b of g.boxes) {
      if (b.pair) continue;
      const k = getK(b), raw = answers[b.id] || '', a = nrm(raw);
      let ok = false, type = '';
      if (!a) { type = 'No answer'; }
      else if (g.kind === 'choice' || g.kind === 'tfng') { ok = k.a.some(x => nrm(x) === a); type = ok ? '' : 'Wrong option'; }
      else if (overLimit(raw, b.lim || g.limit)) { type = 'Over the word limit'; }
      else if (b.set) {
        const pool = setPools[b.set];
        const hit = pool.find(p => !p.used && p.acc.has(a));
        if (hit) { hit.used = true; ok = true; }
        else type = pool.some(p => p.acc.has(a)) ? 'Repeated answer' : classify(a, pool.flatMap(p => [...p.acc]), ptext);
      } else {
        const acc = accepted(k.a);
        ok = acc.has(a);
        if (!ok) type = classify(a, [...acc], ptext);
      }
      res[b.id] = {ok, type};
      if (ok) score++;
    }
  }
  return {score, total: t.total, res};
}
function classify(a, acc, ptext) {
  for (const x of acc) {
    if (a + 's' === x || a === x + 's' || a + 'es' === x || a === x + 'es') return 'Plural / singular';
  }
  for (const x of acc) { const d = lev(a, x); if ((x.length >= 5 && d <= 2) || d <= 1) return 'Spelling'; }
  if (ptext.includes(a)) return 'Wrong information (in the passage)';
  return 'Not copied from the passage';
}
function suggestCause(type) {
  return {'No answer': 'time', 'Over the word limit': 'limit', 'Plural / singular': 'spelling', 'Spelling': 'spelling',
          'Wrong information (in the passage)': 'distractor', 'Not copied from the passage': 'paraphrase', 'Wrong option': 'grammar', 'Repeated answer': 'careless'}[type] || 'locate';
}
function keyText(b) { const k = getK(b); return k.a.join(' / '); }
function allBoxes(t) { return t.groups.flatMap(g => g.boxes.map(b => Object.assign({g}, b))); }
function firstLetterHint(b) {
  const k = getK(b), a = expand(k.a[0]).sort((x, y) => x.length - y.length)[0] || '';
  const ws = a.split(' ').length;
  return `Starts with “${a.charAt(0).toUpperCase()}” · ${ws} word${ws > 1 ? 's' : ''}${/\d/.test(a) ? ' (includes a number)' : ''}`;
}

function sha256(ascii) { // compact SHA-256 (works without a secure context)
  function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
  const mp = Math.pow, maxWord = mp(2, 32); let result = '', words = [], asciiBitLength = ascii.length * 8;
  let hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [], primeCounter = k.length; const isComposite = {};
  for (let candidate = 2; primeCounter < 64; candidate++) { if (!isComposite[candidate]) { for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate; hash[primeCounter] = (mp(candidate, .5) * maxWord) | 0; k[primeCounter++] = (mp(candidate, 1 / 3) * maxWord) | 0; } }
  ascii += '\x80'; while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++) { const j = ascii.charCodeAt(i); words[i >> 2] |= j << ((3 - i) % 4) * 8; }
  words[words.length] = ((asciiBitLength / maxWord) | 0); words[words.length] = (asciiBitLength);
  hash = hash.slice(0, 8);
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16), oldHash = hash;
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      const temp1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      const temp2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash); hash[4] = (hash[4] + temp1) | 0; hash.length = 8;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (let i = 0; i < 8; i++) for (let j = 3; j + 1; j--) { const b = (hash[i] >> (j * 8)) & 255; result += ((b < 16) ? 0 : '') + b.toString(16); }
  return result;
}

/* ---------- small helpers ---------- */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c])); }
function $(s, r = document) { return r.querySelector(s); }
function $$(s, r = document) { return [...r.querySelectorAll(s)]; }
function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }
function toast(msg, ms = 2600) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }
function lvlClass(l) { return 'lvl-' + l; }
function fmtTime(sec) { sec = Math.max(0, Math.round(sec)); return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }

/* ---------- rendering: passage ---------- */
function renderPassage(t) {
  const P = DATA.passages[t.passage];
  let h = `<h2>${esc(P.title)}</h2>`;
  if (P.sub) h += `<p class="muted"><i>${esc(P.sub)}</i></p>`;
  P.paras.forEach((p, i) => {
    const lab = P.letters ? String.fromCharCode(65 + i) : String(i + 1);
    const isFoot = /^\*/.test(p);
    h += `<p data-pi="${i}" class="${i === 0 && t.passage === 'blombos' ? 'intro' : ''}">${isFoot ? '' : `<span class="pl">${lab}</span>`}${esc(p)}</p>`;
  });
  return h;
}

/* ---------- rendering: question paper ----------
   opts: {inputFor(box) -> html, after(box) -> html (per item), groupExtra(g) -> html} */
function fillPh(text, g, opts) {
  return esc(text).replace(/\{(\w+)\}/g, (m, n) => {
    const b = g.boxes.find(x => x.n === n);
    return b ? opts.inputFor(b, g) : m;
  });
}
function renderGroup(t, g, opts) {
  let h = `<div class="qgroup" data-g="${esc(g.title)}"><div class="gh"><h3 style="margin:0">${esc(g.title)}</h3><span class="chip">${esc(g.kindLabel)}</span></div>`;
  h += `<p class="ins">${esc(g.ins)}</p>`;
  if (g.limtext) h += `<p class="lim">${esc(g.limtext).replace(/(ONE WORD ONLY|NO MORE THAN [A-Z ]+?WORDS?(?: AND\/OR A NUMBER)?|ONE or TWO WORDS|ONE option)/g, '<b>$1</b>')}</p>`;
  if (g.heading) h += `<div style="text-align:center;font:600 1rem Lexend,sans-serif;margin:4px 0 10px">${esc(g.heading)}</div>`;
  if (g.box) h += `<div class="wordbox">${g.box.map(w => `<span>${esc(w)}</span>`).join('')}</div>`;
  if (g.kind === 'notes') {
    h += '<div class="notes">';
    for (const ln of g.lines) {
      const m = ln.match(/^(#{1,3}|-{1,3}) (.*)$/);
      const cls = {'#': 't1', '##': 't2', '###': 't3', '-': 'b1', '--': 'b2', '---': 'b3'}[m[1]];
      h += `<div class="${cls}">${fillPh(m[2], g, opts)}</div>`;
    }
    h += '</div>';
  } else if (g.kind === 'table') {
    const T = g.table;

function startExam(t) {
  const r = T(t.id);
  r.exam = {running: true, startedAt: Date.now(), deadline: Date.now() + t.time * 60000, tabSwitches: 0, interrupts: 0, usedSec: 0};
  r.draft = {}; exam.resumed = true; save(); render();
}
function startClock(t) {
  const r = T(t.id), el = $('#timer');
  const tick = () => {
    const left = (r.exam.deadline - Date.now()) / 1000;
    el.textContent = fmtTime(left);
    el.className = 'timer' + (left <= 60 ? ' crit' : left <= 300 ? ' warn' : '');
    if (Math.floor(left) === 300) toast('5 minutes left.');
    if (Math.floor(left) === 60) toast('1 minute left. Check your word limits.');
    if (left <= 0) { stopTimer(); submitExam(t, true); }
  };
  tick(); exam.timer = setInterval(tick, 1000);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && examRunning()) { const r = T(view.test); r.exam.tabSwitches = (r.exam.tabSwitches || 0) + 1; save(true); const el = $('#tabsw'); if (el) el.textContent = r.exam.tabSwitches; }
});
window.addEventListener('beforeunload', e => { save(true); if (examRunning()) { e.preventDefault(); e.returnValue = ''; } });
function collectDraft() {
  if (!view.test) return; const r = S.tests[view.test]; if (!r) return;
  $$('input.ans').forEach(i => { if (!i.readOnly) r.draft[i.dataset.id] = i.value; });
}
async function submitExam(t, timedOut) {
  const r = T(t.id); if (!r.exam || !r.exam.running) return;
  collectDraft();
  const answers = Object.assign({}, r.draft);
  r.exam.running = false; r.exam.timedOut = !!timedOut; r.exam.usedSec = Math.min(t.time * 60, (Date.now() - r.exam.startedAt) / 1000);
  stopTimer();
  const a = await checkAuth();
  if (!a.ok) { r.unscored = {answers, msg: a.msg, at: new Date().toISOString()}; save(); render(); return; }   // open practice: no score shown
  scoreFirst(t, answers, timedOut);
}
function scoreFirst(t, answers, timedOut) {
  const r = T(t.id), g = gradeTest(t, answers);
  r.attempts = 1; r.first = {score: g.score, answers, res: g.res, at: new Date().toISOString()}; r.latest = r.first; r.unscored = null; r.draft = {};
  allBoxes(t).forEach(b => { r.tries[b.id] = g.res[b.id].ok ? 0 : 1; });
  if (t.id === 'P1' && !S.path) S.path = placementLevel();
  save();
  sendResult(payloadFor(t, timedOut ? 'first (timed out)' : 'first'));
  tryUnlock(t) || render();
}
async function submitRetry(t) {
  const r = T(t.id); collectDraft();
  const a = await checkAuth(); if (!a.ok) { nudge(a.msg); return; }
  const answers = Object.assign({}, r.latest.answers, r.draft);
  const g = gradeTest(t, answers);
  r.attempts++; r.latest = {score: g.score, answers, res: g.res, at: new Date().toISOString()};
  allBoxes(t).forEach(b => {
    if (g.res[b.id].ok) r.tries[b.id] = 0; else { r.tries[b.id] = (r.tries[b.id] || 0) + 1; if (r.tries[b.id] >= 3) r.hints[b.id] = r.tries[b.id] >= 4 ? 2 : 1; }
  });
  save();
  sendResult(payloadFor(t, 'retry'));
  if (!tryUnlock(t)) { render(); toast(`Latest: ${g.score}/${t.total} (${pct(g.score, t.total)}%)`); }
}
function confirmBox(msg, yes) {
