<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Reading Lab – QT3</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Lexend:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface2:#f0eee8; --ink:#1d1f24; --ink2:#4a4f5a; --ink3:#7a808c; --line:#dedad0;
  --accent:#b4235a; --accent-soft:#fbe7ef;
  --found:#1f8a52; --found-soft:#e3f4ea; --core:#2463b8; --core-soft:#e4eefb; --ext:#7340b8; --ext-soft:#efe7fa; --place:#c2332b; --place-soft:#fbe8e6;
  --ok:#1f8a52; --ok-soft:#e3f4ea; --bad:#c2332b; --bad-soft:#fbe8e6; --warn:#b26b00; --warn-soft:#fff3dc;
  --hl-y:#fff07a; --hl-g:#b8f0c4; --hl-b:#bfe0ff; --hl-p:#ffc9e1;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171b; --surface:#1e2127; --surface2:#262a31; --ink:#eceef2; --ink2:#c0c5cf; --ink3:#8d94a1; --line:#353a44;
  --accent:#f06a9b; --accent-soft:#3b2230;
  --found:#4cc483; --found-soft:#1c3327; --core:#6aa5f5; --core-soft:#1c2a40; --ext:#b08cf0; --ext-soft:#2c2340; --place:#f0776f; --place-soft:#3d2321;
  --ok:#4cc483; --ok-soft:#1c3327; --bad:#f0776f; --bad-soft:#3d2321; --warn:#f2b54a; --warn-soft:#3a2f17;
  --hl-y:#8a7a12; --hl-g:#2f6b3d; --hl-b:#2b5480; --hl-p:#7a3557;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#15171b; --surface:#1e2127; --surface2:#262a31; --ink:#eceef2; --ink2:#c0c5cf; --ink3:#8d94a1; --line:#353a44;
  --accent:#f06a9b; --accent-soft:#3b2230;
  --found:#4cc483; --found-soft:#1c3327; --core:#6aa5f5; --core-soft:#1c2a40; --ext:#b08cf0; --ext-soft:#2c2340; --place:#f0776f; --place-soft:#3d2321;
  --ok:#4cc483; --ok-soft:#1c3327; --bad:#f0776f; --bad-soft:#3d2321; --warn:#f2b54a; --warn-soft:#3a2f17;
  --hl-y:#8a7a12; --hl-g:#2f6b3d; --hl-b:#2b5480; --hl-p:#7a3557;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 'Source Sans 3',system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Lexend',system-ui,sans-serif;line-height:1.25;margin:0 0 .5em}
h1{font-size:1.45rem;font-weight:600}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600}
.mono,code,.ans,.key{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.eyebrow{font:600 .7rem/1 'Lexend',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink3)}
.small{font-size:.85rem}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top-row{display:flex;gap:14px 24px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 0 12px}
.brand{min-width:0}
.brand .eyebrow{display:block;margin-bottom:8px}
.brand h1{margin:0 0 8px;font-size:1.3rem;line-height:1.2}
.chip{display:inline-block;font:500 .74rem/1 'Lexend',sans-serif;padding:5px 9px;border-radius:99px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.who{display:grid;grid-template-columns:minmax(150px,200px) minmax(170px,230px);gap:6px 8px;align-items:center;max-width:100%}
.who input{width:100%;min-width:0}
.who .status{grid-column:1 / -1;font-size:.78rem;color:var(--ink3);line-height:1.3}
input[type=text],input[type=email],input[type=password],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:2px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;color:var(--ink2);font:500 .9rem 'Lexend',sans-serif;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
main.wrap{padding:36px 16px 64px}
main > .eyebrow{display:block;margin-bottom:8px}
main > h1{margin-bottom:12px}
main > h1 + p{margin:0 0 20px;line-height:1.6}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:600}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.kpi{padding:12px 14px}
.kpi .v{font:600 1.45rem/1.15 'Lexend',sans-serif;margin-bottom:4px}
.kpi .l{font-size:.8rem;color:var(--ink3)}
.lvl-foundation{--lc:var(--found);--ls:var(--found-soft)}
.lvl-core{--lc:var(--core);--ls:var(--core-soft)}
.lvl-extension{--lc:var(--ext);--ls:var(--ext-soft)}
.lvl-placement{--lc:var(--place);--ls:var(--place-soft)}
.lvltag{display:inline-block;font:600 .68rem/1 'Lexend',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:var(--ls);color:var(--lc)}
.modetag{display:inline-block;font:600 .68rem/1 'Lexend',sans-serif;padding:4px 7px;border-radius:6px;border:1px solid var(--line);color:var(--ink2)}
.step-h{display:flex;gap:10px;align-items:center;margin:30px 0 12px}
.step-h .n{font:600 .75rem 'Lexend',sans-serif;background:var(--ink);color:var(--surface);border-radius:99px;padding:3px 9px}
.levelcard{border-top:4px solid var(--lc);cursor:pointer}
.levelcard.sel{outline:2px solid var(--lc);background:var(--ls)}
.levelcard h3{color:var(--lc)}
.testcard{display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--lc)}
.testcard .code{font:600 .8rem 'JetBrains Mono',monospace;color:var(--lc)}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.dots i.on{background:var(--lc)}
.foot{margin-top:40px;text-align:center;font-size:.68rem;opacity:.55;line-height:1.5}

/* test view */
.testbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.stepper{display:flex;gap:4px;flex-wrap:wrap}
.stepper span{font:500 .78rem 'Lexend',sans-serif;padding:5px 10px;border-radius:99px;background:var(--surface2);color:var(--ink3)}
.stepper span.on{background:var(--ink);color:var(--surface)}
.stepper span.done{background:var(--ok-soft);color:var(--ok)}
.timer{font:600 1.05rem 'JetBrains Mono',monospace;padding:5px 12px;border-radius:9px;background:var(--surface2)}
.timer.warn{background:var(--warn-soft);color:var(--warn)}
.timer.crit{background:var(--bad-soft);color:var(--bad)}
.banner{border-radius:var(--r);padding:12px 16px;margin-bottom:12px;border:1px solid var(--line);background:var(--surface)}
.banner.info{background:var(--core-soft);border-color:transparent}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.ok{background:var(--ok-soft);border-color:transparent}
.banner.bad{background:var(--bad-soft);border-color:transparent}
.banner.nudge{animation:nudge .4s}
@keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-height:calc(100vh - 210px);overflow:auto;position:sticky;top:120px}
@media (max-width:900px){.pane{max-height:none;position:static}}
.pane.locked > .inner{filter:blur(6px);pointer-events:none;user-select:none}
.passage h2{font-size:1.15rem}
.passage p{margin:0 0 .85em}
.passage .pl{font:600 .78rem 'Lexend',sans-serif;color:var(--accent);margin-right:6px}
.passage .intro{font-style:italic}
.passage .flash{animation:flash 2.2s}
@keyframes flash{0%,60%{background:var(--warn-soft);box-shadow:0 0 0 4px var(--warn-soft)}100%{background:transparent}}
mark.hl{color:inherit;border-radius:2px;padding:0 1px}
mark.hl-y{background:var(--hl-y)} mark.hl-g{background:var(--hl-g)} mark.hl-b{background:var(--hl-b)} mark.hl-p{background:var(--hl-p)}
mark.ev{background:transparent;box-shadow:inset 0 -3px 0 var(--accent)}
.hltools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:-16px;background:var(--surface);padding:6px 0 10px;z-index:2;border-bottom:1px dashed var(--line);margin-bottom:12px}
.sw{width:26px;height:26px;border-radius:7px;border:2px solid transparent}
.sw.on{border-color:var(--ink)}
.sw.y{background:var(--hl-y)} .sw.g{background:var(--hl-g)} .sw.b{background:var(--hl-b)} .sw.p{background:var(--hl-p)}
.sw.er{background:var(--surface2);font-size:.8rem}
.qgroup{margin-bottom:22px}
.qgroup .gh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.qgroup .ins{margin:2px 0;color:var(--ink2)}
.qgroup .lim{font-weight:700;margin:2px 0 10px}
.qgroup .lim b{color:var(--accent)}
.q{margin:0 0 10px;padding-left:0}
.qn{display:inline-block;min-width:24px;font:600 .82rem 'JetBrains Mono',monospace;color:var(--ink3)}
input.ans{width:170px;padding:3px 8px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);font-size:.92rem}
input.ans::placeholder{color:var(--ink3);font-size:.78rem}
input.ans.ro{background:repeating-linear-gradient(45deg,var(--surface2) 0 6px,var(--surface) 6px 12px);cursor:not-allowed}
input.ans.ok,.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
input.ans.bad,.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
input.ans.lock{pointer-events:none}
.notes{border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--surface)}
.notes .t1{text-align:center;font:600 1.02rem 'Lexend',sans-serif;margin-bottom:8px}
.notes .t2{font-weight:700;margin:8px 0 4px}
.notes .t3{font-style:italic;margin:6px 0 2px}
.notes .b1{margin:3px 0 3px 4px}.notes .b1:before{content:'•  '}
.notes .b2{margin:3px 0 3px 26px}.notes .b2:before{content:'–  '}
.notes .b3{margin:3px 0 3px 50px}.notes .b3:before{content:'◦  '}
table.qt{border-collapse:collapse;width:100%;font-size:.93rem}
table.qt caption{font:600 1rem 'Lexend',sans-serif;margin-bottom:6px}
table.qt th,table.qt td{border:1px solid var(--line);padding:7px 8px;vertical-align:top;text-align:left}
table.qt th{background:var(--surface2);font-family:'Lexend',sans-serif;font-weight:600;font-size:.86rem}
.tablewrap{overflow-x:auto}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0}
.flow .cap{text-align:center;font:600 1rem 'Lexend',sans-serif;margin-bottom:6px}
.flow .fb{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}
.flow .ar{text-align:center;color:var(--ink3);line-height:1.2;font-size:1.1rem}
.wordbox{display:flex;gap:6px;flex-wrap:wrap;border:1px dashed var(--ink3);border-radius:10px;padding:8px 10px;margin:6px 0 10px}
.wordbox span{font-family:'JetBrains Mono',monospace;font-size:.88rem;padding:2px 8px;border-radius:6px;background:var(--surface2)}
.opts{display:inline-flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 10px;font-size:.85rem;font-weight:600}
.opt.on{border-color:var(--ink);background:var(--surface2)}
.hint{font-size:.85rem;background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:6px 10px;margin:4px 0}
.mark-ok{color:var(--ok);font-weight:700}.mark-bad{color:var(--bad);font-weight:700}
.panelnote{font-size:.84rem;color:var(--ink3)}

/* review */
.exp{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--surface)}
.exp.wrong{border-left-color:var(--bad)}
.exp .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.exp .key{font-weight:700;color:var(--ok)}
.exp blockquote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:0 8px 8px 0;font-style:italic}
.pp{width:100%;border-collapse:collapse;font-size:.88rem;margin:6px 0}
.pp th,.pp td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.pp th{background:var(--surface2);font-weight:600}
.lbl{font:600 .72rem 'Lexend',sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-right:6px}
.cause{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.barrow{display:grid;grid-template-columns:170px 1fr 48px;gap:8px;align-items:center;font-size:.88rem;margin:5px 0}
table.data{width:100%;border-collapse:collapse;font-size:.88rem}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.data th{font:600 .78rem 'Lexend',sans-serif;color:var(--ink2);background:var(--surface2)}
.lock{color:var(--ink3);font-size:.85rem}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:99;font-size:.9rem;box-shadow:var(--shadow);max-width:92vw}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:20px;max-width:520px;width:100%;box-shadow:var(--shadow)}
.quiz .qq{margin:10px 0}
details summary{cursor:pointer;font-weight:600}
pre.code{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:.78rem;max-height:340px}

@media print{
  header.top,nav.tabs,.noprint,.foot{display:none!important}
  body{background:#fff;color:#000}
  .card{box-shadow:none;break-inside:avoid}
  .pane{max-height:none;overflow:visible;position:static}
}
@media (max-width:600px){
  .who{grid-template-columns:1fr 1fr;width:100%}
  input.ans{width:130px}
  .barrow{grid-template-columns:110px 1fr 40px}
}
.opts.mc{display:flex;flex-direction:column;align-items:stretch;gap:5px;margin-top:6px}
.opt.mcopt{display:flex;gap:10px;align-items:flex-start;text-align:left;font-weight:400;font-size:.92rem;padding:6px 10px;line-height:1.35}
.opt.mcopt b{flex:0 0 auto;font-family:'JetBrains Mono',monospace}
.q.mcq{margin-bottom:14px}
ol.mlist{list-style:none;padding:0;margin:6px 0}ol.mlist li{margin:3px 0;line-height:1.4}ol.mlist li b{display:inline-block;width:1.4em}
.ow ul{margin:4px 0 4px 18px;padding:0}.ow li{margin:2px 0}
@media (max-width:640px){table.data{display:block;overflow-x:auto;max-width:100%}}
.qn{margin-right:8px}
</style></head>
<body><header class="top"><div class="wrap"><div class="top-row"><div class="brand"><div class="eyebrow">Huong Stella Paradigm</div>
<h1>IELTS Reading Lab – Question Type 3</h1><span class="chip">Multiple choice · one answer · choose TWO / THREE</span></div><div class="who"><input type="text" id="stName" placeholder="Full name" autocomplete="name"><input type="email" id="stEmail" placeholder="Email" autocomplete="email"><span class="status" id="saveStatus">Enter your name and email to start a test</span></div></div>
<nav class="tabs"><button data-tab="home">Study paths</button><button data-tab="how">How it works</button><button data-tab="log">Error logbook</button><button data-tab="vocab">Vocabulary</button><button data-tab="report">My report</button></nav></div></header>
<main class="wrap" id="main"></main>
<script>window.__LAB__={"name": "IELTS Reading Lab \u2013 Question Type 3", "code": "QT3", "chip": "Multiple choice \u00b7 one answer \u00b7 choose TWO / THREE", "causes": [["locate", "Could not find the right part of the passage", "Underline locating words in the question stem (names, numbers, \u201cin the third paragraph\u201d). Questions follow passage order."], ["distractor", "Chose an option because it repeats words from the passage", "Matching words are a trap. The correct option usually paraphrases the passage; check that the whole option says the same as the text."], ["partial", "Read only one sentence, not the whole part", "For \u201cmain point\u201d, \u201cwhat is the writer doing\u201d and \u201cconclude\u201d questions, read the whole paragraph, then choose the option that covers all of it."], ["truebutnot", "Chose an option that is true but does not answer the question", "Read the question stem again. A true sentence from the passage is wrong if it answers a different question (who? why? when?)."], ["writer", "Confused the writer's view with another person's view or a fact", "Look for the writer\u2019s evaluating words (remarkable, impressively, however, the truth is). A view the writer rejects is a distractor."], ["purpose", "Misunderstood a purpose question (\u201crefers to X in order to \u2026\u201d)", "Do not ask \u201cwhat is X?\u201d Ask \u201cwhy is X here?\u201d: find the point that X supports, usually just before or after it."], ["global", "Missed the main idea of the whole passage (title, purpose, tone)", "For global questions, read the first and last paragraphs and the first sentence of each paragraph. Choose the option that covers the whole passage."], ["paraphrase", "Missed the paraphrase / synonym", "Before deciding, find the words in the passage that mean the same as each part of the option."], ["own", "Used my own knowledge or made a guess", "Answer only from the passage, even if another option is true in real life."], ["vocab", "Did not know a key word", "Guess from context, then add the word to your vocabulary list with a synonym."], ["time", "Ran out of time", "About 1.5\u20132 minutes per question. Read the stem first, find the part, then read all the options."], ["careless", "Careless / clicked the wrong letter", "Check your letter against your notes before you move on. For choose TWO, check that you have two different letters."]], "causesShort": ["could not locate", "matching-word trap", "read only part", "true but not the answer", "writer's view", "purpose question", "global question", "missed the paraphrase", "own knowledge", "unknown word", "time", "careless"], "choiceLabel": "Option", "place": {"n": 7, "time": 15, "cut1": 3, "cut2": 5, "label": "One multiple-choice passage (7 questions, 15 minutes)"}, "txt": {"homeH1": "Multiple choice", "homeIntro": "Learn one routine for every question: <b>read the stem \u2192 underline the locating words \u2192 find the part of the passage \u2192 read it in detail \u2192 check every option against the text \u2192 choose</b>. Work through your path.", "sources": "Cambridge IELTS 9, 12, 15 and 18 Academic; IELTS Trainer Academic; IELTS Trainer 2 Academic; The Official Cambridge Guide to IELTS (Reading Skills Units 1, 3 and 6); Mindset for IELTS Level 1 (Cambridge University Press); course Unit 2 Reading.", "howCards": "<div class=\"card\"><h3>The 5-step routine for every question</h3><ol>\n    <li><b>Read the stem first.</b> Decide what it asks: a detail, the main point, the writer\u2019s view, the purpose of a reference, or the whole passage.</li>\n    <li><b>Underline the locating words.</b> Names, dates, quotations, \u201cin the fourth paragraph\u201d. Questions follow the order of the passage (global questions come last).</li>\n    <li><b>Find the part and read it in detail.</b> Often a whole paragraph, not one sentence.</li>\n    <li><b>Check every option.</b> Write \u2713 (the text says this), \u2717 (the text says something different) or ? (not in the text) next to each letter.</li>\n    <li><b>Choose the option that answers the stem.</b> Not the one with the most matching words.</li></ol></div>\n  <div class=\"card\"><h3>Types of multiple choice</h3><ul>\n    <li><b>One answer, A\u2013D</b> (sometimes A\u2013C): complete a sentence or answer a question.</li>\n    <li><b>Choose TWO (or THREE) from a list</b>: each correct letter is one mark; letters can be in any order.</li>\n    <li><b>Main point / \u201cWhat is the writer doing?\u201d</b>: summarise the whole paragraph (describing, comparing, dismissing, outlining \u2026).</li>\n    <li><b>Writer\u2019s view or purpose</b>: \u201cThe writer refers to X in order to \u2026\u201d asks why X is mentioned.</li>\n    <li><b>Global</b>: best title or subheading, the writer\u2019s overall purpose or tone.</li></ul></div>", "marking": "<div class=\"card\"><h3>Marking</h3><ul>\n    <li>Click one letter for each one-answer question.</li>\n    <li>For \u201cChoose TWO letters\u201d, click two different letters (click again to remove one). Each correct letter is one mark, in any order. Choosing the same letter twice scores only once.</li>\n    <li>In the paper test, write only the letter (A, B, C or D).</li></ul></div>", "submitTip": "Check that every question has a letter and that each \u201cchoose TWO\u201d group has two different letters.", "hintRule": "(where to look + what to check). After 4 tries, a second hint shows the idea to focus on.", "markingShort": "Letters only. Choose TWO / THREE: one mark per correct letter, any order.", "toolkit": "<div class=\"card\"><h3>Toolkit: why wrong options look right</h3><table class=\"data\">\n  <tr><th>Trap</th><th>Example from your exercises</th><th>How to check</th></tr>\n  <tr><td>Matching words</td><td>\u201cfashion\u201d (Serena); \u201cupside-down jellyfish\u201d (one type named \u2260 several types)</td><td>Same word \u2260 same meaning: does the whole option match?</td></tr>\n  <tr><td>Only part of the paragraph</td><td>Jellyfish paragraph 5: harm AND benefits \u2192 \u201cadvantages and disadvantages\u201d</td><td>Read to the end; the conclusion is often the last sentence.</td></tr>\n  <tr><td>True but not the answer</td><td>\u201ccost savings\u201d (Driverless cars: from manufacture, not for travellers)</td><td>Does it answer THIS stem?</td></tr>\n  <tr><td>A view the writer rejects</td><td>\u201cpersonality\u201d (Iconoclasts: the naysayers\u2019 view); \u201ca golden age\u201d</td><td>Look for however, as if, the truth is, more precisely.</td></tr>\n  <tr><td>Purpose of a reference</td><td>\u201cscyphozoa\u201d \u2192 evidence that jellyfish are sophisticated</td><td>Ask why it is mentioned, not what it is.</td></tr>\n  <tr><td>Global</td><td>Best title, overall purpose, tone (\u201cneutral account\u201d)</td><td>Cover the whole passage, not one paragraph.</td></tr></table></div>", "lesson": "<div class=\"card\"><h3>In-class lesson (90 minutes)</h3><ol class=\"small\">\n   <li><b>0\u20135\u2032 Lead-in.</b> Show one question with four options. Ask: why might three wrong options look right?</li>\n   <li><b>5\u201325\u2032 Model with F1</b> (Mindset: Muhammad Ali and Serena Williams): fact vs opinion, then choose TWO with one matching-word trap per question. Think aloud.</li>\n   <li><b>25\u201345\u2032 Guided practice F3</b> (Ice cream): main idea of a paragraph \u2192 which parts give the main idea \u2192 the writer\u2019s opinion words.</li>\n   <li><b>45\u201360\u2032 Timed exam task C1</b> (Jellyfish, Trainer 2, 4 questions, 8 min) under exam rules.</li>\n   <li><b>60\u201380\u2032 Error analysis.</b> Students tag causes; collect the class\u2019s top traps (matching words, only part of the paragraph, true but not the answer) and build a trap table on the board.</li>\n   <li><b>80\u201390\u2032 Homework set-up.</b> Each student continues their path at home (Homework cards).</li></ol></div>", "homework": "<div class=\"card\"><h3>Homework by path</h3><ul class=\"small\">\n   <li><b>Foundation:</b> F2, F4, F5, F6 (+ finish F1 and F3 if not done in class).</li>\n   <li><b>Core:</b> C2, C3, C4, C5 (Cambridge Passage 1\u20132, choose TWO and paragraph questions).</li>\n   <li><b>Extension:</b> E1\u2013E6 (Passage 3: writer\u2019s purpose, views, main point, subheadings).</li>\n   <li>Everyone: tag error causes, reach 70% to unlock, do the vocabulary revision, send the PDF report.</li></ul></div>", "printRoutine": "<li><b>The 5-step routine:</b> read the stem \u2192 underline the locating words \u2192 find the part and read it in detail \u2192 check every option (\u2713 \u2717 ?) \u2192 choose the option that answers the stem.</li>\n    <li><b>Answers:</b> write only the letter. For \u201cChoose TWO letters\u201d, write two different letters, one in each box, in any order.</li>"}, "keyStr": "hsrl-qt3-mcq-2026"};window.__CFG__={"token": "hsp-reading-l2", "lesson": "L2", "defaultEndpoint": "https://script.google.com/macros/s/AKfycbz1Nl3rUpJIO1sv8YpBDyXYmgwuv-Az7x5H0G2ikMS8zSAtqMwBkVatW7AEOC1NkK29/exec", "authHashes": ["dffa4aa52137eff55be7200610ee50d00961e22640693ccbd67276f40f8dd3a7"]};window.__DATA__={"tests": [{"id": "P1", "level": "placement", "levelLabel": "Placement", "mode": "Everyone", "title": "Placement · The History of Chocolate", "passage": "chocolate", "time": 15, "src": "Unit 2 Reading, Exercise 8 (course file “unit 2 - Reading.docx”; answers from the course key “UNIT 2 - KEY.docx”, where it is Exercise 5)", "pre": [{"w": "civilisation", "m": "an organised society with its own culture", "d": ["a type of bean", "a sweet drink"]}, {"w": "roast", "m": "to cook something with dry heat", "d": ["to freeze something", "to sell something"]}, {"w": "humid", "m": "warm and wet (air or climate)", "d": ["cold and dry", "very high"]}, {"w": "ritual", "m": "a set of actions done as part of a ceremony", "d": ["a tax", "a farm tool"]}, {"w": "edible", "m": "safe to eat", "d": ["very expensive", "easy to grow"]}], "groups": [{"title": "Question 1cRV5aRFNQA1pTThNWTyJTFxISd1gPHxsfRVEdQA0DDAUNX1VcQgEcHAlJURJcX00XGUhBVRJGBBIRCV5fVh8NTyFTFxISZl4NUwIeQhYGUkAABlFEQRBbWEg/HQJJHhoIDRoGUU5TXlxZHFMBDVRRA1tCTRcDTFteV1JIEh4ADR0dXUoYCgJZQRBFWRoYGwJKUQBbSB8GXw8eEBBySklSTmoeG1cNCQwSWF9VXEIJBxsDQ1EdQA0MAR5YRhBzVAcBGwtEHxVfDQECH0pHUVVTG1MbAg0wAUBZHwIdRFMeEEsV"}, {"id": "E6-36", "n": "36", "text": "Michael Krauss has frequently pointed out that", "opts": [["A", "linguists are failing to record languages before they die out."], ["B", "linguists have made poor use of improvements in technology."], ["C", "linguistics has declined in popularity as an academic subject."], ["D", "linguistics departments are underfunded in most universities."]], "set": null, "lim": null, "pair": null, "k": "E1ETThdRLxFsTz5dDRBVRBRSU1AkSFEcUl5NDBdZV14SVQceAgBMGBpWSU0XGUxGEF5fBhQHBV4FBxNMHwZRXV5RS18GFFIbRAUcE0MCDVxIQUNXWBwaEwBeUQNbRAEGUUBdQ0YWBxVSGEUUHUENHwIGDVZRRldIGgFMSRgHUl0dBhBfW15VGEpfUk5dEAZSD1dDQgESEkJaCREXAA9LVBEZT09RD1oBEAxIUSINXxATQUwdC1EZCBBUXwYXUo6t7TlaTgUCFEESe0BXHQABjq3sVFJDCUOTra5fVEINHVIPQhwEX0wEDRRJ0LCvGEpfUk5FQ1YJDU80GUxGEFtFSAcaCQ2T9K9fDBRRSVNEU9To7lIDS1EVE0EEDRZYW0NGCUpfUk5aBVYJDQMWHUEeEBBGGFFITHYqVlVfCBIESFxEXk9IAx0FQwURVw0CFgUPHhAQXgkAUgNLBRFdDQ4MHF1eUVtYDRdQMQFRLxFLDAodRFxXEkIHUwAJTh4GVw0BAh9KR1FVUxtTEAlLHgZWDRkLFFQSVFtTSBwHGA9dVBFdAQIIRFxXEkEBBxpMQx4aHkgeEBRDRllTWhtTBQREHRETQAIQBQ1dVhJCABYbHg0DFUQNCQIFTBJZQRYMGgENXQERUl8EDRYPb20eFkoEGhUPS1QRZh8CBF5BEFFZBQMeDUQfBxNZBQIFDV5ZXFEdGgEYXlEEX0wUQwZERlgSWAcdXwleAhFdWQQCHV4SR1pfBBZSGEUUVF9MAwQETFVVQRYcGxcVDQIcXFgBB1FfV1NdRAxTEx5IURBaXgwTAUhTQltYD11QQA1TAEFMHUFLDRBkWlNIBxcPRR8bX0IKGlEF0LCuRx0aEQcNFRVARY/j7A1AVVFZGhcbAkpYVFpeTQADREZZUV8bFhZMRB9UR0UIQwJMX1USRgkBEwtfEARbAU0BBFkSUksWHBsXTFoDHUdIH09RTFxUEn0aEgcfXpP0ql5NEx5EXEQSXxtTEw5CBAATQQIQGENVEEZeDVMWDVkQWhEBTUEUVRAKElgdHx5ADVMbRA9XQwoPcBIIFkonFw9FHxtfQgoaUURBEFZfGxAHH14UEB8NDxYFDUZYW0VIGgFMQx4AE2YfAgReQdKyrxtTEQNAARhSRAMXXw8eEBB1SklSTs/x6GNBCA0FVBJfVBYbBwcISB8AQA0ODB9ZW15HU0gHHUxPFFRXXwwUH8+yrRJCB1MeBUMWAVpeGQoSXhwSHhZKN1BWDVMyRkMJCh9KEllBFgUWHBhEHhpWSU0PEFlXQhJXChwHGA0XHVZBCUMGQkBbHhYGHAZMTwhUeF8MFgJeHBJPSw=="}], "sets": {}, "kindLabel": "Multiple choice (one answer)"}], "total": 4, "kinds": ["mcq"]}], "passages": {"greenroofs": {"title": "Green roofs", "sub": null, "letters": false, "paras": ["@A Rooftops covered with grass, vegetable gardens and lush foliage are now a common sight in many cities around the world. More and more private companies and city authorities are investing in green roofs, drawn to their wide-ranging benefits. Among the benefits are saving on energy costs, mitigating the risk of floods, making habitats for urban wildlife, tackling air pollution and even growing food. These increasingly radical urban designs can help cities adapt to the monumental problems they face, such as access to resources and a lack of green space due to development. But the involvement of city authorities, businesses and other institutions is crucial to ensuring their success as is research investigating different options to suit the variety of rooftop spaces found in cities. The UK is relatively new to developing green roofs, and local governments and institutions are playing a major role in spreading the practice. London is home to much of the UK's green roof market, mainly due to forward-thinking policies such as the London Plan, which has paved the way to more than doubling the area of green roofs in the capital.", "@B Ongoing research is showcasing how green roofs in cities can integrate with 'living walls': environmentally friendly walls which are partially or completely covered with greenery, including a growing medium, such as soil or water. Research also indicates that green roofs can be integrated with drainage systems on the ground, such as street trees, so that the water is managed better and the built environment is made more sustainable. There is also evidence to demonstrate the social value of green roofs. Doctors are increasingly prescribing time spent gardening outdoors for patients dealing with anxiety and depression. And research has found that access to even the most basic green spaces can provide a better quality of life for dementia sufferers and help people avoid obesity.", "@C In North America, green roofs have become mainstream, with a wide array of expansive, accessible and food-producing roofs installed in buildings. Again, city leaders and authorities have helped push the movement forward. Only recently, San Francisco, USA, created a policy requiring new buildings to have green roofs. Toronto, Canada, has policies dating from the 1990s, encouraging the development of urban farms on rooftops. These countries also benefit from having newer buildings than in many parts of the world, which makes it easier to install green roofs. Being able to keep enough water at roof height and distribute it right across the rooftop is crucial to maintaining the plants on any green roof – especially on 'edible roofs' where fruit and vegetables are farmed. And it's much easier to do this in newer buildings, which can typically hold greater weight, than to retro-fit old ones. Having a stronger roof also makes it easier to grow a greater variety of plants, since the soil can be deeper.", "@D For green roofs to become the norm for new developments, there needs to be support from public authorities and private investors. Those responsible for maintaining buildings may have to acquire new skills, such as landscaping, and in some cases, volunteers may be needed to help out. Other considerations include installing drainage paths, meeting health and safety requirements and perhaps allowing access for the public, as well as planning restrictions and disruption from regular activities in and around the buildings during installation. To convince investors and developers that installing green roofs is worthwhile, economic arguments are still the most important. The term 'natural capital' has been developed to explain the economic value of nature; for example, measuring the money saved by installing natural solutions to protect against flood damage, adapt to climate change or help people lead healthier and happier lives.", "@E As the expertise about green roofs grows, official standards have been developed to ensure that they are designed, constructed and maintained properly, and function well. Improvements in the science and technology underpinning green roof development have also led to new variations in the concept. For example, 'blue roofs' enable buildings to hold water over longer periods of time, rather than draining it away quickly – crucial in times of heavier rainfall. There are also combinations of green roofs with solar panels, and 'brown roofs' which are wilder in nature and maximise biodiversity. If the trend continues, it could create new jobs and a more vibrant and sustainable local food economy alongside many other benefits. There are still barriers to overcome, but the evidence so far indicates that green roofs have the potential to transform cities and help them function sustainably long into the future. The success stories need to be studied and replicated elsewhere, to make green, blue, brown and food-producing roofs the norm in cities around the world."]}, "noise": {"title": "", "sub": null, "letters": false, "paras": ["@A Hearing impairment or other auditory function deficit in young children can have a major impact on their development of speech and communication, resulting in a detrimental effect on their ability to learn at school. This is likely to have major consequences for the individual and the population as a whole. The New Zealand Ministry of Health has found from research carried out over two decades that 6-10% of children in that country are affected by hearing loss.", "@B A preliminary study in New Zealand has shown that classroom noise presents a major concern for teachers and pupils. Modern teaching practices, the organisation of desks in the classroom, poor classroom acoustics, and mechanical means of ventilation such as air-conditioning units all contribute to the number of children unable to comprehend the teacher's voice. Education researchers Nelson and Soli have also suggested that recent trends in learning often involve collaborative interaction of multiple minds and tools as much as individual possession of information. This all amounts to heightened activity and noise levels, which have the potential to be particularly serious for children experiencing auditory function deficit. Noise in classrooms can only exacerbate their difficulty in comprehending and processing verbal communication with other children and instructions from the teacher.", "@C Children with auditory function deficit are potentially failing to learn to their maximum potential because of noise levels generated in classrooms. The effects of noise on the ability of children to learn effectively in typical classroom environments are now the subject of increasing concern. The International Institute of Noise Control Engineering (I-INCE), on the advice of the World Health Organization, has established an international working party, which includes New Zealand, to evaluate noise and reverberation control for school rooms.", "@D While the detrimental effects of noise in classroom situations are not limited to children experiencing disability, those with a disability that affects their processing of speech and verbal communication could be extremely vulnerable. The auditory function deficits in question include hearing impairment, autistic spectrum disorders (ASD) and attention deficit disorders (ADD/ADHD).", "@E Autism is considered a neurological and genetic life-long disorder that causes discrepancies in the way information is processed. This disorder is characterised by interlinking problems with social imagination, social communication and social interaction. According to Janzen, this affects the ability to understand and relate in typical ways to people, understand events and objects in the environment, and understand or respond to sensory stimuli. Autism does not allow learning or thinking in the same ways as in children who are developing normally. Autistic spectrum disorders often result in major difficulties in comprehending verbal information and speech processing. Those experiencing these disorders often find sounds such as crowd noise and the noise generated by machinery painful and distressing. This is difficult to scientifically quantify as such extra-sensory stimuli vary greatly from one autistic individual to another. But a child who finds any type of noise in their classroom or learning space intrusive is likely to be adversely affected in their ability to process information.", "@F The attention deficit disorders are indicative of neurological and genetic disorders and are characterised by difficulties with sustaining attention, effort and persistence, organisation skills and disinhibition. Children experiencing these disorders find it difficult to screen out unimportant information, and focus on everything in the environment rather than attending to a single activity. Background noise in the classroom becomes a major distraction, which can affect their ability to concentrate.", "@G Children experiencing an auditory function deficit can often find speech and communication very difficult to isolate and process when set against high levels of background noise. These levels come from outside activities that penetrate the classroom structure, from teaching activities, and other noise generated inside, which can be exacerbated by room reverberation. Strategies are needed to obtain the optimum classroom construction and perhaps a change in classroom culture and methods of teaching. In particular, the effects of noisy classrooms and activities on those experiencing disabilities in the form of auditory function deficit need thorough investigation. It is probable that many undiagnosed children exist in the education system with 'invisible' disabilities. Their needs are less likely to be met than those of children with known disabilities.", "@H The New Zealand Government has developed a New Zealand Disability Strategy and has embarked on a wide-ranging consultation process. The strategy recognises that people experiencing disability face significant barriers in achieving a full quality of life in areas such as attitude, education, employment and access to services. Objective 3 of the New Zealand Disability Strategy is to 'Provide the Best Education for Disabled People' by improving education so that all children, youth learners and adult learners will have equal opportunities to learn and develop within their already existing local school. For a successful education, the learning environment is vitally significant, so any effort to improve this is likely to be of great benefit to all children, but especially to those with auditory function disabilities.", "@I A number of countries are already in the process of formulating their own standards for the control and reduction of classroom noise. New Zealand will probably follow their example. The literature to date on noise in school rooms appears to focus on the effects on schoolchildren in general, their teachers and the hearing impaired. Only limited attention appears to have been given to those students experiencing the other disabilities involving auditory function deficit. It is imperative that the needs of these children are taken into account in the setting of appropriate international standards to be promulgated in future."]}, "wegener": {"title": "Alfred Wegener: science, exploration and the theory of continental drift", "sub": "by Mott T Greene", "letters": false, "paras": ["## Introduction", "This is a book about the life and scientific work of Alfred Wegener, whose reputation today rests with his theory of continental displacements, better known as 'continental drift'. Wegener proposed this theory in 1912 and developed it extensively for nearly 20 years. His book on the subject, The Origin of Continents and Oceans, went through four editions and was the focus of an international controversy in his lifetime and for some years after his death.", "Wegener's basic idea was that many mysteries about the Earth's history could be solved if one supposed that the continents moved laterally, rather than supposing that they remained fixed in place. Wegener showed in great detail how such continental movements were plausible and how they worked, using evidence from a large number of sciences including geology, geophysics, paleontology, and climatology. Wegener's idea that the continents move is at the heart of the theory that guides Earth sciences today: namely plate tectonics. Plate tectonics is in many respects quite different from Wegener's proposal, in the same way that modern evolutionary theory is very different from the ideas Charles Darwin proposed in the 1850s about biological evolution. Yet plate tectonics is a descendant of Alfred Wegener's theory of continental drift, in quite the same way that modern evolutionary theory is a descendant of Darwin's theory of natural selection.", "When I started writing about Wegener's life and work, one of the most intriguing things about him for me was that, although he came up with a theory on continental drift, he was not a geologist. He trained as an astronomer and pursued a career in atmospheric physics. When he proposed the theory of continental displacements in 1912, he was a lecturer in physics and astronomy at the University of Marburg, in southern Germany. However, he was not an 'unknown'. In 1906 he had set a world record (with his brother Kurt) for time aloft in a hot-air balloon: 52 hours. Between 1906 and 1908 he had taken part in a highly publicized and extremely dangerous expedition to the coast of northeast Greenland. He had also made a name for himself amongst a small circle of meteorologists and atmospheric physicists in Germany as the author of a textbook, Thermodynamics of the Atmosphere (1911), and of a number of interesting scientific papers.", "As important as Wegener's work on continental drift has turned out to be, it was largely a sideline to his interest in atmospheric physics, geophysics, and paleoclimatology*, and thus I have been at great pains to put Wegener's work on continental drift in the larger context of his other scientific work, and in the even larger context of atmospheric sciences in his lifetime. This is a 'continental drift book' only to the extent that Wegener was interested in that topic and later became famous for it. My treatment of his other scientific work is no less detailed, though I certainly have devoted more attention to the reception of his ideas on continental displacement, as they were much more controversial than his other work.", "Readers interested in the specific detail of Wegener's career will see that he often stopped pursuing a given line of investigation (sometimes for years on end), only to pick it up later. I have tried to provide guideposts to his rapidly shifting interests by characterizing different phases of his life as careers in different sciences, which is reflected in the titles of the chapters. Thus, the index should be a sufficient guide for those interested in a particular aspect of Wegener's life but perhaps not all of it. My own feeling, however, is that the parts do not make as much sense on their own as do all of his activities taken together. In this respect I urge readers to try to experience Wegener's life as he lived it, with all the interruptions, changes of mind, and renewed efforts this entailed.", "Wegener left behind a few published works but, as was standard practice, these reported the results of his work – not the journey he took to reach that point. Only a few hundred of the many thousands of letters he wrote and received in his lifetime have survived and he didn't keep notebooks or diaries that recorded his life and activities. He was not active (with a few exceptions) in scientific societies, and did not seek to find influence or advance his ideas through professional contacts and politics, spending most of his time at home in his study reading and writing, or in the field collecting observations.", "Some famous scientists, such as Newton, Darwin, and Einstein, left mountains of written material behind, hundreds of notebooks and letters numbering in the tens of thousands. Others, like Michael Faraday, left extensive journals of their thoughts and speculations, parallel to their scientific notebooks. The more such material a scientist leaves behind, the better chance a biographer has of forming an accurate picture of how a scientist's ideas took shape and evolved.", "I am firmly of the opinion that most of us, Wegener included, are not in any real sense the authors of our own lives. We plan, think, and act, often with apparent freedom, but most of the time our lives 'happen to us', and we only retrospectively turn this happenstance into a coherent narrative of fulfilled intentions. This book, therefore, is a story both of the life and scientific work that Alfred Wegener planned and intended and of the life and scientific work that actually 'happened to him'. These are, as I think you will soon see, not always the same thing.", "* Paleoclimatology – The study of past climates"]}, "stars": {"title": "", "sub": null, "letters": false, "paras": ["## Text 1 · Muhammad Ali", "@- Although Muhammad Ali was responsible for many legendary moments in the boxing ring, there was much more to this man's appeal. Not only was he a successful athlete, but he was also well known for his strong work ethic and fearless approach to standing up for his beliefs.", "@- Born as Cassius Clay in 1942, Muhammad Ali began training at just 12 years old and, at the age of 22, won the world heavyweight championship in 1964. It was a title he went on to win again, in 1974 and 1978. He referred to himself as 'The Greatest', and was famous for boasting about his ability to 'float like a butterfly and sting like a bee'.", "## Text 2 · Serena Williams", "@- Serena Williams has dominated women's professional tennis since the 1990s, when she and her sister, Venus, became global tennis superstars. Serena in particular has become known for her determination, powerful game and unique fashion sense.", "@- Serena was born on 26 September 1981 in Saginaw, Michigan. When she was just a baby, her family moved to California, and it was there she started playing tennis at the age of four. She was coached by her father, Richard Williams, until she was 12. Although Mr Williams was determined that his daughters would succeed in the tennis world, he was also focused on giving them a good education. In fact, whilst they were training to be tennis stars, he also took responsibility for their home-schooling.", "@- Serena is so successful on the tennis court because of her rapid movement, speed of thought and powerful shots. Indeed, whilst she was playing a match in the 2013 Australian Open, Serena hit a serve* at a speed of just under 207 km per hour, the third fastest recorded among female players. This powerful serve helps put her opponents under pressure from the very start of the game.", "@- During her career, she has won 56 singles championships, 22 doubles championships and was also a gold medallist at the 2000, 2008 and 2012 Olympics.", "* serve (v) – to hit the ball to the other player as a way of starting the game"]}, "garden": {"title": "Planned communities: garden cities", "sub": null, "letters": true, "paras": ["The notion of planning entire communities prior to their construction is an ancient one. In fact, one of the earliest such cities on record is Miletus, Greece, which was built in the 4th century BC. Throughout the Middle Ages and the Renaissance, various planned communities (both theoretical and actual) were conceived. Leonardo da Vinci designed several cities that were never constructed. Following the Great Fire of London in 1666, the architect Christopher Wren created a new master plan for the city, incorporating park land and urban space. Several 18th-century cities, including Washington D.C., New York City, and St Petersburg, Russia, were built according to comprehensive planning.", "One of the most important planned city concepts, the Garden City Movement, arose in the latter part of the 19th century as a reaction to the pollution and crowding of the Industrial Revolution. In 1898, Ebenezer Howard published the book To-Morrow: A Peaceful Path to Real Reform in which he laid out his ideas concerning the creation of new economically viable towns. Howard believed that these towns should be limited in size and density, and surrounded with a belt of undeveloped land. The idea gained enough attention and financial backing to lead to the creation of Letchworth, in Hertfordshire, England. This was the first such 'Garden City'. After the First World War, the second town built following Howard's ideas, Welwyn Garden City, was constructed.", "In the early 1920s, American architects Clarence Stein and Henry Wright, inspired by Howard's ideas and the success of Letchworth and Welwyn, created the city of Radburn, New Jersey. Conceived as a community which would be safe for children, Radburn was intentionally designed so that the residents would not require automobiles. Several urban planning designs were pioneered at Radburn that would influence later planned communities, including the separation of pedestrians and vehicles, and the use of 'superblocks', each of which shared 23 acres of commonly held parkland.", "In America, following the stock market crash of 1929, there was great demand for both affordable housing and employment for workers who had lost their jobs. In direct response to this, in 1935 President Roosevelt created the Resettlement Administration, which brought about a total of three greenbelt towns: Greenbelt, Maryland; Greenhills, Ohio; and Greendale, Wisconsin. These towns contained many of the elements of the Garden City Movement developments, including the use of superblocks and a 'green belt' of undeveloped land surrounding the community."]}, "business2": {"title": "Environmental practices of big businesses", "sub": null, "letters": false, "paras": ["The environmental practices of big businesses are shaped by a fundamental fact that for many of us offends our sense of justice. Depending on the circumstances, a business may maximize the amount of money it makes, at least in the short term, by damaging the environment and hurting people. That is still the case today for fishermen in an unmanaged fishery without quotas, and for international logging companies with short-term leases on tropical rainforest land in places with corrupt officials and unsophisticated landowners. When government regulation is effective, and when the public is environmentally aware, environmentally clean big businesses may out-compete dirty ones, but the reverse is likely to be true if government regulation is ineffective and if the public doesn't care.", "It is easy for the rest of us to blame a business for helping itself by hurting other people. But blaming alone is unlikely to produce change. It ignores the fact that businesses are not charities but profit-making companies, and that publicly owned companies with shareholders are under obligation to those shareholders to maximize profits, provided that they do so by legal means. US laws make a company's directors legally liable for something termed 'breach of fiduciary responsibility' if they knowingly manage a company in a way that reduces profits. The car manufacturer Henry Ford was in fact successfully sued by shareholders in 1919 for raising the minimum wage of his workers to $5 per day: the courts declared that, while Ford's humanitarian sentiments about his employees were nice, his business existed to make profits for its stockholders.", "Our blaming of businesses also ignores the ultimate responsibility of the public for creating the conditions that let a business profit through destructive environmental policies. In the long run, it is the public, either directly or through its politicians, that has the power to make such destructive policies unprofitable and illegal, and to make sustainable environmental policies profitable.", "The public can do that by suing businesses for harming them, as happened after the Exxon Valdez disaster, in which over 40,000 m³ of oil were spilled off the coast of Alaska. The public may also make their opinion felt by preferring to buy sustainably harvested products; by making employees of companies with poor track records feel ashamed of their company and complain to their own management; by preferring their governments to award valuable contracts to businesses with a good environmental track record; and by pressing their governments to pass and enforce laws and regulations requiring good environmental practices.", "In turn, big businesses can exert powerful pressure on any suppliers that might ignore public or government pressure. For instance, after the US public became concerned about the spread of a disease known as BSE, which was transmitted to humans through infected meat, the US government's Food and Drug Administration introduced rules demanding that the meat industry abandon practices associated with the risk of the disease spreading. But for five years the meat packers refused to follow these, claiming that they would be too expensive to obey. However, when a major fast-food company then made the same demands after customer purchases of its hamburgers plummeted, the meat industry complied within weeks. The public's task is therefore to identify which links in the supply chain are sensitive to public pressure: for instance, fast-food chains or jewelry stores, but not meat packers or gold miners.", "Some readers may be disappointed or outraged that I place the ultimate responsibility for business practices harming the public on the public itself. I also believe that the public must accept the necessity for higher prices for products to cover the added costs, if any, of sound environmental practices. My views may seem to ignore the belief that businesses should act in accordance with moral principles even if this leads to a reduction in their profits. But I think we have to recognize that, throughout human history, in all politically complex human societies, government regulation has arisen precisely because it was found that not only did moral principles need to be made explicit, they also needed to be enforced.", "To me, the conclusion that the public has the ultimate responsibility for the behavior of even the biggest businesses is empowering and hopeful, rather than disappointing. My conclusion is not a moralistic one about who is right or wrong, admirable or selfish, a good guy or a bad guy. In the past, businesses have changed when the public came to expect and require different behavior, to reward businesses for behavior that the public wanted, and to make things difficult for businesses practicing behaviors that the public didn't want. I predict that in the future, just as in the past, changes in public attitudes will be essential for changes in businesses' environmental practices."]}, "explore": {"title": "What is exploration?", "sub": null, "letters": false, "paras": ["We are all explorers. Our desire to discover, and then share that new-found knowledge, is part of what makes us human - indeed, this has played an important part in our success as a species. Long before the first caveman slumped down beside the fire and grunted news that there were plenty of wildebeest over yonder, our ancestors had learnt the value of sending out scouts to investigate the unknown. This questing nature of ours undoubtedly helped our species spread around the globe, just as it nowadays no doubt helps the last nomadic Penan maintain their existence in the depleted forests of Borneo, and a visitor negotiate the subways of New York.", "Over the years, we've come to think of explorers as a peculiar breed – different from the rest of us, different from those of us who are merely 'well travelled', even; and perhaps there is a type of person more suited to seeking out the new, a type of caveman more inclined to risk venturing out. That, however, doesn't take away from the fact that we all have this enquiring instinct, even today; and that in all sorts of professions - whether artist, marine biologist or astronomer - borders of the unknown are being tested each day.", "Thomas Hardy set some of his novels in Egdon Heath, a fictional area of uncultivated land, and used the landscape to suggest the desires and fears of his characters. He is delving into matters we all recognise because they are common to humanity. This is surely an act of exploration, and into a world as remote as the author chooses. Explorer and travel writer Peter Fleming talks of the moment when the explorer returns to the existence he has left behind with his loved ones. The traveller 'who has for weeks or months seen himself only as a puny and irrelevant alien crawling laboriously over a country in which he has no roots and no background, suddenly encounters his other self, a relatively solid figure, with a place in the minds of certain people'.", "In this book about the exploration of the earth's surface, I have confined myself to those whose travels were real and who also aimed at more than personal discovery. But that still left me with another problem: the word 'explorer' has become associated with a past era. We think back to a golden age, as if exploration peaked somehow in the 19th century - as if the process of discovery is now on the decline, though the truth is that we have named only one and a half million of this planet's species, and there may be more than 10 million – and that's not including bacteria. We have studied only 5 per cent of the species we know. We have scarcely mapped the ocean floors, and know even less about ourselves; we fully understand the workings of only 10 per cent of our brains.", "Here is how some of today's 'explorers' define the word. Ran Fiennes, dubbed the 'greatest living explorer', said, 'An explorer is someone who has done something that no human has done before - and also done something scientifically useful.' Chris Bonington, a leading mountaineer, felt exploration was to be found in the act of physically touching the unknown: 'You have to have gone somewhere new.' Then Robin Hanbury-Tenison, a campaigner on behalf of remote so-called 'tribal' peoples, said, 'A traveller simply records information about some far-off world, and reports back; but an explorer changes the world.' Wilfred Thesiger, who crossed Arabia's Empty Quarter in 1946, and belongs to an era of unmechanised travel now lost to the rest of us, told me, 'If I'd gone across by camel when I could have gone by car, it would have been a stunt.' To him, exploration meant bringing back information from a remote place regardless of any great self-discovery.", "Each definition is slightly different - and tends to reflect the field of endeavour of each pioneer. It was the same whoever I asked: the prominent historian would say exploration was a thing of the past, the cutting-edge scientist would say it was of the present. And so on. They each set their own particular criteria; the common factor in their approach being that they all had, unlike many of us who simply enjoy travel or discovering new things, both a very definite objective from the outset and also a desire to record their findings.", "I'd best declare my own bias. As a writer, I'm interested in the exploration of ideas. I've done a great many expeditions and each one was unique. I've lived for months alone with isolated groups of people all around the world, even two 'uncontacted tribes'. But none of these things is of the slightest interest to anyone unless, through my books, I've found a new slant, explored a new idea. Why? Because the world has moved on. The time has long passed for the great continental voyages - another walk to the poles, another crossing of the Empty Quarter. We know how the land surface of our planet lies; exploration of it is now down to the details - the habits of microbes, say, or the grazing behaviour of buffalo. Aside from the deep sea and deep underground, it's the era of specialists. However, this is to disregard the role the human mind has in conveying remote places; and this is what interests me: how a fresh interpretation, even of a well-travelled route, can give its readers new insights."]}, "diets": {"title": "", "sub": null, "letters": true, "paras": ["The diets of children have changed dramatically over the last century due to the effect of technologies (such as improved transport, canning and refrigeration), social changes (such as the establishment of boarding schools) and evolving ideas about the nutritional needs of growing bodies. Before World War I, the meals of children and adults alike would typically consist of vegetables (often potatoes), large amounts of bread (often 0.5 kg/day) and soups with small amounts of meat.", "Imagine a 12-year-old Australian boy from 1970 standing next to a 12-year-old boy from 2010. The boy from 2010 will probably be 3-5 cm taller and 7 kg heavier than his counterpart in 1970. He will also be 25% fatter. A lot of that fat will be around the waist. The 2010 school trousers won't fit the boy from 1970: they will be 10 cm too big around the waist. Now imagine that the two boys have a running race of over 1,600 metres: the boy from 1970 will finish 300 metres ahead of his mate from 40 years in the future.", "There are two chances in three that the boy from 1970 walked to school each day; there are three chances in four that the boy from 2010 is driven to school by mum or dad. There are four chances in five that in 1970 the boy was allowed to play unsupervised in the neighbourhood; there is only one chance in four that in 2010 the boy will be allowed to go down to the park on his own. The boy in 1970 probably played three or four different sports; the boy from 2010 plays one or none. It is 30 times more likely that the local river was the favourite play space of the boy from 1970 than it is for the boy today.", "What has caused these dramatic changes in the space of a single generation? There are two main theories. Increasing overweight is caused by an energy imbalance: either energy intake (food) increases, or energy expenditure decreases, or both. The 'Gluttony Theory' argues that children are fatter because they are eating more than they used to, and more bad food (high energy density, high in fat and sugar, high in saturated fats). The 'Sloth Theory' argues that children are fatter because they are less active than they used to be. The two theories have battled it out in nutrition and physical activity journals for the last 10 years."]}, "jellyfish": {"title": "Jellyfish: A Remarkable Marine Life Form", "sub": null, "letters": false, "paras": ["When viewed in the wild, jellyfish are perhaps the most graceful and vividly coloured of all sea creatures. But few people have ever seen a jellyfish living in its natural habitat. Instead, they might see a dead and shapeless specimen lying on the beach, or perhaps receive a painful sting while swimming, so it is inevitable that jellyfish are often considered ugly and possibly dangerous. This misunderstanding can be partly traced back to the 20th century, when the use of massive nets and mechanical winches often damaged the delicate jellyfish that scientists managed to recover. As a result, disappointingly little research was carried out into jellyfish, as marine biologists took the easy option and focused on physically stronger species such as fish, crabs and shrimp. Fortunately, however, new techniques are now being developed. For example, scientists have discovered that sound bounces harmlessly off jellyfish, so in the Arctic and Norway researchers are using sonar to monitor jellyfish beneath the ocean's surface. This, together with aeroplane surveys, satellite imagery and underwater cameras, has provided a wealth of new information in recent years.", "Scientists now believe that in shallow water alone there are at least 38 million tonnes of jellyfish and that these creatures inhabit every type of marine habitat, including deep water. Furthermore, jellyfish were once regarded as relatively solitary, but this is another area where the science has evolved. Dr Karen Hansen was the first to suggest that jellyfish are in fact the centre of entire ecosystems, as shrimp, lobster and fish shelter and feed among their tentacles. This proposition has subsequently been conclusively proven by independent studies. DNA sequencing and isotope analysis have provided further insights, including the identification of numerous additional species of jellyfish unknown to science only a few years ago.", "This brings us to the issue of climate change. Research studies around the world have recorded a massive growth in jellyfish populations in recent years and some scientists have linked this to climate change. However, while this may be credible, it cannot be established with certainty as other factors might be involved. Related to this was the longstanding academic belief that jellyfish had no predators and therefore there was no natural process to limit their numbers. However, observations made by Paul Dewar and his team showed that this was incorrect. As a result, the scientific community now recognises that species including sharks, tuna, swordfish and some salmon all prey on jellyfish.", "It is still widely assumed that jellyfish are among the simplest lifeforms, as they have no brain or central nervous system. While this is true, we now know they possess senses that allow them to see, feel and interact with their environment in subtle ways. What is more, analysis of the so-called 'upside-down jellyfish' shows that they shut down their bodies and rest in much the same way that humans do at night, something once widely believed to be impossible for jellyfish. Furthermore, far from 'floating' in the water as they are still sometimes thought to do, analysis has shown jellyfish to be the most economical swimmers in the animal kingdom. In short, scientific progress in recent years has shown that many of our established beliefs about jellyfish were inaccurate.", "Jellyfish, though, are not harmless. Their sting can cause a serious allergic reaction in some people and large outbreaks of them — known as 'blooms' — can damage tourist businesses, break fishing nets, overwhelm fish farms and block industrial cooling pipes. On the other hand, jellyfish are a source of medical collagen used in surgery and wound dressings. In addition, a particular protein taken from jellyfish has been used in over 30,000 scientific studies of serious diseases such as Alzheimer's. Thus, our relationship with jellyfish is complex as there are a range of conflicting factors to consider.", "Jellyfish have existed more or less unchanged for at least 500 million years. Scientists recognise that over the planet's history there have been three major extinction events connected with changing environmental conditions. Together, these destroyed 99% of all life, but jellyfish lived through all three. Research in the Mediterranean Sea has now shown, remarkably, that in old age and on the point of death, certain jellyfish are able to revert to an earlier physical state, leading to the assertion that they are immortal. While this may not technically be true, it is certainly an extraordinary discovery. What is more, the oceans today contain 30% more poisonous acid than they did 100 years ago, causing problems for numerous species, but not jellyfish, which may even thrive in more acidic waters. Jellyfish throughout their long history have shown themselves to be remarkably resilient.", "Studies of jellyfish in the class known as scyphozoa have shown a lifecycle of three distinct phases. First, thousands of babies known as planulae are released. Then, after a few days the planulae develop into polyps — stationary lifeforms that feed off floating particles. Finally, these are transformed into something that looks like a stack of pancakes, each of which is a tiny jellyfish. It is now understood that all species of jellyfish go through similarly distinct stages of life. This is further evidence of just how sophisticated and unusual these lifeforms are."]}, "growth": {"title": "The growth mindset", "sub": null, "letters": false, "paras": ["Over the past century, a powerful idea has taken root in the educational landscape. The concept of intelligence as something innate has been supplanted by the idea that intelligence is not fixed, and that, with the right training, we can be the authors of our own cognitive capabilities. Psychologist Alfred Binet, the developer of the first intelligence tests, was one of many 19th-century scientists who held that earlier view and sought to quantify cognitive ability. Then, in the early 20th century, progressive thinkers revolted against the notion that inherent ability is destiny. Instead, educators such as John Dewey argued that every child's intelligence could be developed, given the right environment.", "'Growth mindset theory' is a relatively new and extremely popular version of this idea. In many schools today you will see hallways covered in motivational posters and hear speeches on the mindset of great sporting heroes who simply believed their way to the top. A major focus of the growth mindset in schools is coaxing students away from seeing failure as an indication of their ability, and towards seeing it as a chance to improve that ability. As educationalist Jeff Howard noted several decades ago: 'Smart is not something that you just are, smart is something that you can get.'", "The idea of the growth mindset is based on the work of psychologist Carol Dweck in California in the 1990s. In one key experiment, Dweck divided a group of 10- to 12-year-olds into two groups. All were told that they had achieved a high score on a test but the first group were praised for their intelligence in achieving this, while the others were praised for their effort. The second group – those who had been instilled with a 'growth mindset' – were subsequently far more likely to put effort into future tasks. Meanwhile, the former took on only those tasks that would not risk their sense of worth. This group had inferred that success or failure is due to innate ability, and this 'fixed mindset' had led them to fear of failure and lack of effort. Praising ability actually made the students perform worse, while praising effort emphasised that change was possible.", "One of the greatest impediments to successfully implementing a growth mindset, however, is the education system itself: in many parts of the world, the school climate is obsessed with performance in the form of constant testing, analysing and ranking of students – a key characteristic of the fixed mindset. Nor is it unusual for schools to create a certain cognitive dissonance, when they applaud the benefits of a growth mindset but then hand out fixed target grades in lessons based on performance. Aside from the implementation problem, the original growth mindset research has also received harsh criticism. The statistician Andrew Gelman claims that 'their research designs have enough degrees of freedom that they could take their data to support just about any theory at all'. Professor of Psychology Timothy Bates, who has been trying to replicate Dweck's work, is finding that the results are repeatedly null. He notes that: 'People with a growth mindset don't cope any better with failure. Kids with the growth mindset aren't getting better grades, either before or after our intervention study.'", "Much of this criticism is not lost on Dweck, and she deserves great credit for responding to it and adapting her work accordingly. In fact, she argues that her work has been misunderstood and misapplied in a range of ways. She has also expressed concerns that her theories are being misappropriated in schools by being conflated with the self-esteem movement: 'For me the growth mindset is a tool for learning and improvement. It's not just a vehicle for making children feel good.' But there is another factor at work here. The failure to translate the growth mindset into the classroom might reflect a misunderstanding of the nature of teaching and learning itself. Growth mindset supporters David Yeager and Gregory Walton claim that interventions should be delivered in a subtle way to maximise their effectiveness. They say that if adolescents perceive a teacher's intervention as conveying that they are in need of help, this could undo its intended effects.", "A lot of what drives students is their innate beliefs and how they perceive themselves. There is a strong correlation between self-perception and achievement, but there is evidence to suggest that the actual effect of achievement on self-perception is stronger than the other way round. To stand up in a classroom and successfully deliver a good speech is a genuine achievement, and that is likely to be more powerfully motivating than vague notions of 'motivation' itself.", "Recent evidence would suggest that growth mindset interventions are not the elixir of student learning that its proponents claim to be. The growth mindset appears to be a viable construct in the lab, which, when administered in the classroom via targeted interventions, doesn't seem to work. It is hard to dispute that having faith in the capacity to change is a good attribute for students. Paradoxically, however, that aspiration is not well served by direct interventions that try to instil it.", "Motivational posters and talks are often a waste of time, and might well give students a deluded notion of what success actually means. Teaching concrete skills such as how to write an effective introduction to an essay then praising students' effort in getting there is probably a far better way of improving confidence than telling them how unique they are, or indeed how capable they are of changing their own brains. Perhaps growth mindset works best as a philosophy and not an intervention."]}, "chocolate": {"title": "The history of chocolate", "sub": "Why people first started eating chocolate and how it spread across the world", "letters": false, "paras": ["No one is certain which Mesoamerican* culture first farmed cacao trees. However, archaeologists think the Olmec people of southern Mexico were one of the earliest to create a drink using cacao beans. While the Olmecs left behind no written records, researchers have dug up pots from this ancient civilisation that date back to 1500 BC. After the pots were taken to a laboratory and analysed, it was discovered that they contained theobromine, a chemical found in cacao beans. A small team of archaeologists has also been looking at a site in the Mexican state of Chiapas. Here, they claim, is proof of another society making cacao drinks even earlier. Not everyone accepts their evidence, so it seems further investigation is necessary.", "Each fruit of the cacao tree is full of white flesh, and inside this are about 60 brown seeds, or beans. Some researchers theorise that early Mesoamerican cultures boiled the flesh for stews, before discovering that the seeds could also be used. This seems highly likely, as the flesh is sweet, but the seeds are incredibly bitter. It's remarkable, in fact, that anyone would have thought to dry out the seeds and then roast them in the first place. Perhaps what happened is that someone was eating the fruit and spitting seeds into a fire. They might have then noticed that the burnt seeds were producing a rich smell, and decided to experiment, but we can never know for sure. More certain is the fact that the Olmecs turned the roasted beans into a thick paste to make their drink, and into this was added chilli and vanilla.", "Unlike the Olmecs, the Mayan people left behind paintings showing their use of cacao beans. From these pictures, we know that cacao beans and chocolate drinks had a special status in Mayan society, and were often used in marriage ceremonies and other rituals. Later, when the Aztecs ruled much of Mesoamerica, they wanted cacao beans for themselves, and would trade with the Mayans to get them. Although other crops were important at the time, they were nowhere near as valuable as cacao beans. This was partly because cacao trees could not survive in the dry highlands of central Mexico, the centre of Aztec civilisation. Unusually for plants, cacao trees depended on tiny swarms of flies for pollination, and these insects lived only in a humid climate.", "In Mayan society, we know that cacao beans were very valuable, perhaps so valuable that it may have been worth creating 'fake beans'. Archaeologists have discovered beans made of clay in many Mesoamerican sites, and suspect that they were used by Mayans when they had to pay a form of tax to the Aztecs. But it wasn't just their economic value that made them important in society. Like today, the Mayan people liked to prepare traditional dishes to share with friends and family. Extended families would have come together to collect cacao beans and slowly turn them into a rich drink, using the occasion to strengthen their social ties.", "In the 16th century, the Spanish arrived in Mexico and noticed the way in which cacao was central to the local diet. We still have records of the letters they sent home to Spain. Expedition leader Hernán Cortés wrote to King Carlos I of Spain about a strange drink called xocoatl, which he mistakenly believed the Aztecs, including their ruler, Montezuma, used for medicinal purposes. One of Cortés's officers even cla
