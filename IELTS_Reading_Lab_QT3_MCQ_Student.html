imed to have seen Montezuma drinking more than 50 cups of a chocolate drink per day, and thought he was doing this to improve his health. That number is no doubt inaccurate, but even if it were true, the officer missed the point. The Aztecs simply saw cacao as part of their diet and did not attribute any special qualities to it. Nevertheless, the Spanish were soon exporting cacao beans back to Spain and creating chocolate drinks for themselves, adding sugar and honey to sweeten them. The demand for cacao soon spread across the rest of Europe.", "Until 1828, it was only the wealthy that could afford these new chocolate drinks. It was in this year that Dutch chemist Coenraad Johannes van Houten invented the cocoa press, a machine that could squeeze the natural oils from roasted cacao beans. The beans were then crushed into powder, combined with alkaline salts, and sold as cheap blocks of cooking chocolate. Later, in 1847 the first edible chocolate was created by Fry and Sons in England. Unfortunately, its bitter taste was unpopular with consumers. In 1874, Swiss chocolate maker Daniel Peter finally realised that milk was perfect for improving the taste and texture of chocolate, and it has been a key ingredient ever since.", "* Mesoamerica A region stretching from Mexico to Costa Rica in which several advanced civilisations existed before the 1600s."]}, "icecream": {"title": "A history of ice cream", "sub": null, "letters": false, "paras": ["Although many people might consider ice cream a recent invention, dependent on refrigeration technology and the dairy industry, there have been certain people eating frozen desserts made by mixing ice with fruit flavours for thousands of years. We don't know when people started doing this, but we do know that Roman and Chinese emperors used to eat fruit mixed with snow as far back as 2,000 years ago. However, most fruit grows in the warmer months, and ice needed to be transported from distant mountain tops, or collected in winter and stored in very expensive underground chambers. This meant that it was available only to the people at the very top of society, and only on special occasions.", "Not until relatively recently – the 1600s – did people begin mixing milk or cream with ice to create what people today might recognise as ice cream. Ice cream desserts began to appear in expensive cafés in Paris, and then in New York in the 1700s. In England, recipes for making your own ice cream began to be published in the early 1700s. Indeed, the word ice cream appeared for the first time in a dictionary in 1744. This all meant that ordinary people might have heard about ice cream and understood what a frozen dessert was, even if they couldn't afford to buy one themselves.", "In the 1700s, ice cream started to become popular in the USA. Adverts began to appear in newspapers for a growing number of specialist ice-cream shops, which made and sold their own frozen desserts. As before, however, ice cream was only affordable for society's elite. The first American president, George Washington, was known to enjoy ice cream. He spent an incredible $200 on ice cream in just one year – the equivalent of at least $5,000 in today's money.", "Of course, when the right technology came along, ice cream became something that could be easily produced. It was in the USA, in the mid-1800s, that the first small freezers appeared. These were quite primitive compared to today's machines, and were powered by steam. Around this time, the first ice cream factory was set up in Pennsylvania, in the USA. From there, ice cream was transported by train to different cities in the region. This was, essentially, the beginning of the ice-cream industry. However, it was not until the beginning of the 20th century that ice cream became a successful commercial product. By this time, much cheaper methods of refrigeration had been developed, meaning that the technology to create ice cream could be adopted in different countries around the world, and affordable products became available to millions of ordinary people."]}, "driverless": {"title": "Driverless cars", "sub": null, "letters": false, "paras": ["@A The automotive sector is well used to adapting to automation in manufacturing. The implementation of robotic car manufacture from the 1970s onwards led to significant cost savings and improvements in the reliability and flexibility of vehicle mass production. A new challenge to vehicle production is now on the horizon and, again, it comes from automation. However, this time it is not to do with the manufacturing process, but with the vehicles themselves.", "@- Research projects on vehicle automation are not new. Vehicles with limited self-driving capabilities have been around for more than 50 years, resulting in significant contributions towards driver assistance systems. But since Google announced in 2010 that it had been trialling self-driving cars on the streets of California, progress in this field has quickly gathered pace.", "@B There are many reasons why technology is advancing so fast. One frequently cited motive is safety; indeed, research at the UK's Transport Research Laboratory has demonstrated that more than 90 percent of road collisions involve human error as a contributory factor, and it is the primary cause in the vast majority. Automation may help to reduce the incidence of this.", "@- Another aim is to free the time people spend driving for other purposes. If the vehicle can do some or all of the driving, it may be possible to be productive, to socialise or simply to relax while automation systems have responsibility for safe control of the vehicle. If the vehicle can do the driving, those who are challenged by existing mobility models - such as older or disabled travellers – may be able to enjoy significantly greater travel autonomy.", "@C Beyond these direct benefits, we can consider the wider implications for transport and society, and how manufacturing processes might need to respond as a result. At present, the average car spends more than 90 percent of its life parked. Automation means that initiatives for car-sharing become much more viable, particularly in urban areas with significant travel demand. If a significant proportion of the population choose to use shared automated vehicles, mobility demand can be met by far fewer vehicles.", "@D The Massachusetts Institute of Technology investigated automated mobility in Singapore, finding that fewer than 30 percent of the vehicles currently used would be required if fully automated car sharing could be implemented. If this is the case, it might mean that we need to manufacture far fewer vehicles to meet demand.", "@- However, the number of trips being taken would probably increase, partly because empty vehicles would have to be moved from one customer to the next.", "@- Modelling work by the University of Michigan Transportation Research Institute suggests automated vehicles might reduce vehicle ownership by 43 percent, but that vehicles' average annual mileage would double as a result. As a consequence, each vehicle would be used more intensively, and might need replacing sooner. This faster rate of turnover may mean that vehicle production will not necessarily decrease.", "@E Automation may prompt other changes in vehicle manufacture. If we move to a model where consumers are tending not to own a single vehicle but to purchase access to a range of vehicles through a mobility provider, drivers will have the freedom to select one that best suits their needs for a particular journey, rather than making a compromise across all their requirements.", "@- Since, for most of the time, most of the seats in most cars are unoccupied, this may boost production of a smaller, more efficient range of vehicles that suit the needs of individuals. Specialised vehicles may then be available for exceptional journeys, such as going on a family camping trip or helping a son or daughter move to university.", "@F There are a number of hurdles to overcome in delivering automated vehicles to our roads. These include the technical difficulties in ensuring that the vehicle works reliably in the infinite range of traffic, weather and road situations it might encounter; the regulatory challenges in understanding how liability and enforcement might change when drivers are no longer essential for vehicle operation; and the societal changes that may be required for communities to trust and accept automated vehicles as being a valuable part of the mobility landscape.", "@G It's clear that there are many challenges that need to be addressed but, through robust and targeted research, these can most probably be conquered within the next 10 years. Mobility will change in such potentially significant ways and in association with so many other technological developments, such as telepresence and virtual reality, that it is hard to make concrete predictions about the future. However, one thing is certain: change is coming, and the need to be flexible in response to this will be vital for those involved in manufacturing the vehicles that will deliver future mobility."]}, "icono": {"title": "", "sub": "A neuroscientist reveals how to think differently", "letters": false, "paras": ["In the last decade a revolution has occurred in the way that scientists think about the brain. We now know that the decisions humans make can be traced to the firing patterns of neurons in specific parts of the brain. These discoveries have led to the field known as neuroeconomics, which studies the brain's secrets to success in an economic environment that demands innovation and being able to do things differently from competitors. A brain that can do this is an iconoclastic one. Briefly, an iconoclast is a person who does something that others say can't be done.", "This definition implies that iconoclasts are different from other people, but more precisely, it is their brains that are different in three distinct ways: perception, fear response, and social intelligence. Each of these three functions utilizes a different circuit in the brain. Naysayers might suggest that the brain is irrelevant, that thinking in an original, even revolutionary, way is more a matter of personality than brain function. But the field of neuroeconomics was born out of the realization that the physical workings of the brain place limitations on the way we make decisions. By understanding these constraints, we begin to understand why some people march to a different drumbeat.", "The first thing to realize is that the brain suffers from limited resources. It has a fixed energy budget, about the same as a 40 watt light bulb, so it has evolved to work as efficiently as possible. This is where most people are impeded from being an iconoclast. For example, when confronted with information streaming from the eyes, the brain will interpret this information in the quickest way possible. Thus it will draw on both past experience and any other source of information, such as what other people say, to make sense of what it is seeing. This happens all the time. The brain takes shortcuts that work so well we are hardly ever aware of them. We think our perceptions of the world are real, but they are only biological and electrical rumblings. Perception is not simply a product of what your eyes or ears transmit to your brain. More than the physical reality of photons or sound waves, perception is a product of the brain.", "Perception is central to iconoclasm. Iconoclasts see things differently to other people. Their brains do not fall into efficiency pitfalls as much as the average person's brain. Iconoclasts, either because they were born that way or through learning, have found ways to work around the perceptual shortcuts that plague most people. Perception is not something that is hardwired into the brain. It is a learned process, which is both a curse and an opportunity for change. The brain faces the fundamental problem of interpreting physical stimuli from the senses. Everything the brain sees, hears, or touches has multiple interpretations. The one that is ultimately chosen is simply the brain's best theory. In technical terms, these conjectures have their basis in the statistical likelihood of one interpretation over another and are heavily influenced by past experience and, importantly for potential iconoclasts, what other people say.", "The best way to see things differently to other people is to bombard the brain with things it has never encountered before. Novelty releases the perceptual process from the chains of past experience and forces the brain to make new judgments. Successful iconoclasts have an extraordinary willingness to be exposed to what is fresh and different. Observation of iconoclasts shows that they embrace novelty while most people avoid things that are different.", "The problem with novelty, however, is that it tends to trigger the brain's fear system. Fear is a major impediment to thinking like an iconoclast and stops the average person in his tracks. There are many types of fear, but the two that inhibit iconoclastic thinking and people generally find difficult to deal with are fear of uncertainty and fear of public ridicule. These may seem like trivial phobias. But fear of public speaking, which everyone must do from time to time, afflicts one-third of the population. This makes it too common to be considered a mental disorder. It is simply a common variant of human nature, one which iconoclasts do not let inhibit their reactions.", "Finally, to be successful iconoclasts, individuals must sell their ideas to other people. This is where social intelligence comes in. Social intelligence is the ability to understand and manage people in a business setting. In the last decade there has been an explosion of knowledge about the social brain and how the brain works when groups coordinate decision making. Neuroscience has revealed which brain circuits are responsible for functions like understanding what other people think, empathy, fairness, and social identity. These brain regions play key roles in whether people convince others of their ideas. Perception is important in social cognition too. The perception of someone's enthusiasm, or reputation, can make or break a deal. Understanding how perception becomes intertwined with social decision making shows why successful iconoclasts are so rare.", "Iconoclasts create new opportunities in every area from artistic expression to technology to business. They supply creativity and innovation not easily accomplished by committees. Rules aren't important to them. Iconoclasts face alienation and failure, but can also be a major asset to any organization. It is crucial for success in any field to understand how the iconoclastic mind works."]}, "music": {"title": "Music and the emotions", "sub": "Neuroscientist Jonah Lehrer considers the emotional power of music", "letters": false, "paras": ["Why does music make us feel? On the one hand, music is a purely abstract art form, devoid of language or explicit ideas. And yet, even though music says little, it still manages to touch us deeply. When listening to our favourite songs, our body betrays all the symptoms of emotional arousal. The pupils in our eyes dilate, our pulse and blood pressure rise, the electrical conductance of our skin is lowered, and the cerebellum, a brain region associated with bodily movement, becomes strangely active. Blood is even re-directed to the muscles in our legs. In other words, sound stirs us at our biological roots.", "A recent paper in Nature Neuroscience by a research team in Montreal, Canada, marks an important step in revealing the precise underpinnings of 'the potent pleasurable stimulus' that is music. Although the study involves plenty of fancy technology, including functional magnetic resonance imaging (fMRI) and ligand-based positron emission tomography (PET) scanning, the experiment itself was rather straightforward. After screening 217 individuals who responded to advertisements requesting people who experience 'chills' to instrumental music, the scientists narrowed down the subject pool to ten. They then asked the subjects to bring in their playlist of favourite songs – virtually every genre was represented, from techno to tango – and played them the music while their brain activity was monitored. Because the scientists were combining methodologies (PET and fMRI), they were able to obtain an impressively exact and detailed portrait of music in the brain. The first thing they discovered is that music triggers the production of dopamine – a chemical with a key role in setting people's moods – by the neurons (nerve cells) in both the dorsal and ventral regions of the brain. As these two regions have long been linked with the experience of pleasure, this finding isn't particularly surprising.", "What is rather more significant is the finding that the dopamine neurons in the caudate – a region of the brain involved in learning stimulus-response associations, and in anticipating food and other 'reward' stimuli – were at their most active around 15 seconds before the participants' favourite moments in the music. The researchers call this the 'anticipatory phase' and argue that the purpose of this activity is to help us predict the arrival of our favourite part. The question, of course, is what all these dopamine neurons are up to. Why are they so active in the period preceding the acoustic climax? After all, we typically associate surges of dopamine with pleasure, with the processing of actual rewards. And yet, this cluster of cells is most active when the 'chills' have yet to arrive, when the melodic pattern is still unresolved.", "One way to answer the question is to look at the music and not the neurons. While music can often seem (at least to the outsider) like a labyrinth of intricate patterns, it turns out that the most important part of every song or symphony is when the patterns break down, when the sound becomes unpredictable. If the music is too obvious, it is annoyingly boring, like an alarm clock. Numerous studies, after all, have demonstrated that dopamine neurons quickly adapt to predictable rewards. If we know what's going to happen next, then we don't get excited. This is why composers often introduce a key note in the beginning of a song, spend most of the rest of the piece in the studious avoidance of the pattern, and then finally repeat it only at the end. The longer we are denied the pattern we expect, the greater the emotional release when the pattern returns, safe and sound.", "To demonstrate this psychological principle, the musicologist Leonard Meyer, in his classic book Emotion and Meaning in Music (1956), analysed the 5th movement of Beethoven's String Quartet in C-sharp minor, Op. 131. Meyer wanted to show how music is defined by its flirtation with – but not submission to – our expectations of order. Meyer dissected 50 measures (bars) of the masterpiece, showing how Beethoven begins with the clear statement of a rhythmic and harmonic pattern and then, in an ingenious tonal dance, carefully holds off repeating it. What Beethoven does instead is suggest variations of the pattern. He wants to preserve an element of uncertainty in his music, making our brains beg for the one chord he refuses to give us. Beethoven saves that chord for the end.", "According to Meyer, it is the suspenseful tension of music, arising out of our unfulfilled expectations, that is the source of the music's feeling. While earlier theories of music focused on the way a sound can refer to the real world of images and experiences – its 'connotative' meaning – Meyer argued that the emotions we find in music come from the unfolding events of the music itself. This 'embodied meaning' arises from the patterns the symphony invokes and then ignores. It is this uncertainty that triggers the surge of dopamine in the caudate, as we struggle to figure out what will happen next. We can predict some of the notes, but we can't predict them all, and that is what keeps us listening, waiting expectantly for our reward, for the pattern to be completed."]}, "languages": {"title": "Endangered languages", "sub": "'Never mind whales, save the languages', says Peter Monaghan, graduate of the Australian National University", "letters": false, "paras": ["Worried about the loss of rainforests and the ozone layer? Well, neither of those is doing any worse than a large majority of the 6,000 to 7,000 languages that remain in use on Earth. One half of the survivors will almost certainly be gone by 2050, while 40% more will probably be well on their way out. In their place, almost all humans will speak one of a handful of megalanguages - Mandarin, English, Spanish.", "Linguists know what causes languages to disappear, but less often remarked is what happens on the way to disappearance: languages' vocabularies, grammars and expressive potential all diminish as one language is replaced by another. 'Say a community goes over from speaking a traditional Aboriginal language to speaking a creole*,' says Australian Nick Evans, a leading authority on Aboriginal languages, 'you leave behind a language where there's very fine vocabulary for the landscape. All that is gone in a creole. You've just got a few words like 'gum tree' or whatever. As speakers become less able to express the wealth of knowledge that has filled ancestors' lives with meaning over millennia, it's no wonder that communities tend to become demoralised.'", "If the losses are so huge, why are relatively few linguists combating the situation? Australian linguists, at least, have achieved a great deal in terms of preserving traditional languages. Australian governments began in the 1970s to support an initiative that has resulted in good documentation of most of the 130 remaining Aboriginal languages. In England, another Australian, Peter Austin, has directed one of the world's most active efforts to limit language loss, at the University of London. Austin heads a programme that has trained many documentary linguists in England as well as in language-loss hotspots such as West Africa and South America.", "At linguistics meetings in the US, where the endangered-language issue has of late been something of a flavour of the month, there is growing evidence that not all approaches to the preservation of languages will be particularly helpful. Some linguists are boasting, for example, of more and more sophisticated means of capturing languages: digital recording and storage, and internet and mobile phone technologies. But these are encouraging the 'quick dash' style of recording trip: fly in, switch on digital recorder, fly home, download to hard drive, and store gathered material for further research. That's not quite what some endangered-language specialists have been seeking for more than 30 years. Most loud and untiring has been Michael Krauss, of the University of Alaska. He has often complained that linguists are playing with non-essentials while most of their raw data is disappearing.", "Who is to blame? That prominent linguist Noam Chomsky, say Krauss and many others. Or, more precisely, they blame those linguists who have been obsessed with his approaches. Linguists who go out into communities to study, document and describe languages, argue that theoretical linguists, who draw conclusions about how languages work, have had so much influence that linguistics has largely ignored the continuing disappearance of languages.", "Chomsky, from his post at the Massachusetts Institute of Technology, has been the great man of theoretical linguistics for far longer than he has been known as a political commentator. His landmark work of 1957 argues that all languages exhibit certain universal grammatical features, encoded in the human mind. American linguists, in particular, have focused largely on theoretical concerns ever since, even while doubts have mounted about Chomsky's universals.", "Austin and Co. are in no doubt that because languages are unique, even if they do tend to have common underlying features, creating dictionaries and grammars requires prolonged and dedicated work. This requires that documentary linguists observe not only languages' structural subtleties, but also related social, historical and political factors. Such work calls for persistent funding of field scientists who may sometimes have to venture into harsh and even hazardous places. Once there, they may face difficulties such as community suspicion. As Nick Evans says, a community who speak an endangered language may have reasons to doubt or even oppose efforts to preserve it. They have seen support and funding for such work come and go. They have given up using the language with their children, believing they will benefit from speaking a more widely understood one.", "Plenty of students continue to be drawn to the intellectual thrill of linguistics field work. That's all the more reason to clear away barriers, contend Evans, Austin and others. The highest barrier, they agree, is that the linguistics profession's emphasis on theory gradually wears down the enthusiasm of linguists who work in communities. Chomsky disagrees. He has recently begun to speak in support of language preservation. But his linguistic, as opposed to humanitarian, argument is, let's say, unsentimental: the loss of a language, he states, 'is much more of a tragedy for linguists whose interests are mostly theoretical, like me, than for linguists who focus on describing specific languages, since it means the permanent loss of the most relevant data for general theoretical work'. At the moment, few institutions award doctorates for such work, and that's the way it should be, he reasons. In linguistics, as in every other discipline, he believes that good descriptive work requires thorough theoretical understanding and should also contribute to building new theory. But that's precisely what documentation does, objects Evans. The process of immersion in a language, to extract, analyse and sum it up, deserves a PhD because it is 'the most demanding intellectual task a linguist can engage in'.", "* a language developed from a mixture of two different languages"]}, "sports2": {"title": "", "sub": null, "letters": false, "paras": ["## Text 1", "@- Despite Beckham's good looks and famous marriage to Victoria Beckham, he was actually an exceptionally good footballer. His professional career began with Manchester United in 1992, at the age of 17. With United he won the Premier League title six times, the FA Cup twice and the UEFA Champions League in 1999. He later went on to play for Real Madrid and LA Galaxy.", "@- In international football, he made his England debut in 1996 at the age of 21.", "@- He was also made captain in 2002 and had short spells at AC Milan and Paris St Germain. His former boss, Alex Ferguson, praised David for always trying hard, playing with supreme confidence and scoring important goals.", "@- His football career was not always easy, however. During the 1998 World Cup, in a game against Argentina, he was fouled by the player Diego Simeone. In retaliation, Beckham kicked Simeone and was given a red card. Consequently, when England went on to lose the game and go out of the World Cup, Beckham became hated by football fans and was portrayed very negatively by the media.", "@- It took three years before Beckham was allowed to play for England again and in 2002 he redeemed himself by scoring a penalty in a 1-0 victory against Argentina.", "@- In 2013 Beckham retired from professional football and played the last game of his 20-year career. Although he is now retired from football, reports claim that he earns more money now than he did as a successful footballer. In 2014 it was documented that he earned £50.5 million, a large portion of which came from brand endorsements for companies such as Adidas, Sky Sports and Samsung.", "## Text 2 · A brief history of football", "@- There is no clear evidence stating where and when football was actually invented, but most historians agree that some type of ball game had been played centuries before the modern game developed in England. Football has a long and interesting history and origins of the game are present in sports played thousands of years ago in China, Egypt, Japan and Greece. Aspects of the game can be traced as early as the second and third centuries BC in China. Their game, originally named 'Tsu Chu', involved kicking a leather ball into a small hole.", "@- The first football games played in Britain were in the 700s and the English equivalent of a football was made using an animal bladder. Games were violent and injury and death were common. Despite the violence, however, they were still very popular. The game had become so popular that in the 1300s Edward II banned the sport because people were playing football rather than practising archery. This was especially important to this king, as he was preparing to go to war with Scotland. This was to be the first of many bans imposed by the kings and queens of England.", "## In 1605 football became legal and once again the sport grew in popularity.", "@- In the 1800s it became particularly common in private schools such as Eton, and it was only then that a set of rules was established. Until then, the game had continued to be violent, as it had had limited rules and no referees. Before the 1800s, for example, it was considered normal to hit players on the opposite team and to damage their possessions. In 1848, on Parker's Piece in Cambridge, these rules were developed further and a new version called the 'Cambridge Rules' was used by all schools, colleges and universities.", "## Though football could be considered a male sport, women also play it.", "@- An increase in women playing the sport began during the First World War, when women did jobs traditionally done by men. Those working in places like factories regularly met to play. Unfortunately, a ban was imposed when the war ended, but it was eventually lifted in the UK in 1971. In 1991 China hosted the first Women's World Cup and in 1996 the first ever women's football event was held at the Olympics."]}, "og6": {"title": "", "sub": null, "letters": false, "paras": ["## Extract 1", "@- Linguists agree that language is needed during reading, but at which stage language becomes a necessity has come under debate. Past research has shown that animals have the ability to discriminate letters from one another, but previously, experts thought the ability to recognise written words was dependent on an ability to understand language. Findings recently published in the journal Science challenge this long-held notion, showing that despite having no linguistic skills, monkeys are able to tell the difference between sequences of letters that form real English words, and those that do not.", "## Extract 2 · What do hurricanes mean for dolphins?", "@- Hurricanes are typically associated with loss of life, loss of property and economic devastation. Hurricane Katrina, which blew through the gulf coast of North America in 2005, brought all those things and more. It also brought lots of baby dolphins. Hurricanes tend to be related to increased strandings of marine mammals, so why might a hurricane be associated with more dolphins, rather than fewer?", "@- Scientist Lance J. Miller reasoned that there were probably several related phenomena that, combined, could explain the apparent increase. Firstly, after a female dolphin loses her calf, she can give birth again much sooner than if her calf had matured to adulthood. \"If a large number of calves perished as a result of Hurricane Katrina, this would allow for a greater percentage of females to become reproductively active the following year.\" By itself, this didn't seem to adequately explain the increase in dolphin calves. Something else was going on. That something was distinctively human.", "@- When Hurricane Katrina blew through the gulf, the local shrimping, crabbing and fishing industries were ravaged. In Mississippi, according to one estimate, 87% of commercial fishing vessels were damaged or destroyed. This meant a decrease in the amount of seafood brought into shore, of nearly 15%. Despite the common notion that dolphins enjoy playing in the wakes created by boats, there is plenty of evidence that dolphins actually avoid them. Miller deduced that, with a reduction in the number of boats in the water, both commercial and recreational, dolphins may have been able to spend more time eating, and less time travelling or diving in an effort to avoid boats.", "## Extract 3", "@- One of the reasons Jurassic Park was so successful — as a novel and a blockbuster film — is that it presented a plausible way to bring dinosaurs back to life. The idea that viable dinosaur DNA might be retrieved from bloodsucking prehistoric insects seemed like a project that could actually succeed. Even though the actual methodology is hopelessly flawed and would never work, the premise was science-ish enough to let us suspend our disbelief and revel in the return of the dinosaurs.", "## Extract 4 · (IELTS Trainer 2)", "@- There is no question that it is exciting to set up a new business, but it is also a time when there are numerous problems to overcome. As a business analyst, I have often seen people making the same errors. One frequent issue is that business owners try to do everything themselves because they feel a sense of responsibility; however, they should be delegating some tasks to others. Secondly, in my experience, too many new business owners do not have a comprehensive financial plan. And lastly, many of them have not studied the market thoroughly enough. All of these errors can be avoided."]}}};</script><script>/* IELTS Reading Lab – shared core: data access, marking, rendering of question papers and explanations */
const LAB = window.__LAB__;            // {name, code, token, keyStr}
const DATA = window.__DATA__;          // {tests, passages}
const TESTS = DATA.tests;
const TBY = Object.fromEntries(TESTS.map(t => [t.id, t]));
const LEVELS = [
  {id:'foundation', label:'Foundation', sub:'Build accuracy', desc:'Short texts and guided steps: predict the word type, locate, copy exactly. Sentences, short answers, a first flow-chart and notes.'},
  {id:'core', label:'Core', sub:'Exam practice', desc:'Full IELTS Passage 1 tasks under exam timing: sentence, note and table completion with ONE or TWO word limits.'},
  {id:'extension', label:'Extension', sub:'Stretch further', desc:'Harder passages and Passage 3 tasks: three-word answers, tables out of passage order, heavy paraphrase.'}
];
const CAUSES = (window.__LAB__ && window.__LAB__.causes) || [
  ['locate', 'Could not find the right part of the passage', 'Underline locating words first (names, numbers, dates, capital letters, long words) and scan for them, not for the answer.'],
  ['paraphrase', 'Missed the paraphrase / synonym', 'Before scanning, write 1–2 synonyms for each key word in the question (e.g. reduce → lessen, cut).'],
  ['vocab', 'Did not know a key word', 'Guess from context, then add the word to your vocabulary list with a synonym and an antonym.'],
  ['grammar', 'Wrong word type or grammar', 'Predict the word type before reading: a/an → singular noun; no article → plural/uncountable; "is ___" → adjective.'],
  ['limit', 'Over the word limit', 'Circle the limit (ONE WORD ONLY / NO MORE THAN TWO WORDS). Remove adjectives the sentence does not need.'],
  ['distractor', 'Chose a nearby distractor', 'Read the whole sentence around the answer. Check who/what/when matches the question exactly.'],
  ['spelling', 'Spelling or plural -s', 'Copy letter by letter from the passage. Check singular/plural against the words before the gap.'],
  ['time', 'Ran out of time', 'About 1.5 minutes per question. Skip, mark it, and come back.'],
  ['careless', 'Careless / typo', 'Use the last minute to check every answer against the sentence and the word limit.']
];
const CAUSE_BY = Object.fromEntries(CAUSES.map(c => [c[0], c]));
const KIND_ORDER = ['short', 'sentence', 'notes', 'table', 'flow', 'choice', 'tfng', 'ynng', 'mcq', 'multi'];
const OPTION_KINDS = ['choice', 'tfng', 'ynng', 'mcq'];
function kindOptions(g, b) { if (g.kind === 'mcq') return ((b && b.opts) || []).map(o => o[0]); if (g.kind === 'multi') return g.options.map(o => o[0]); return g.kind === 'tfng' ? ['TRUE', 'FALSE', 'NOT GIVEN'] : g.kind === 'ynng' ? ['YES', 'NO', 'NOT GIVEN'] : g.options; }
function optText(g, b, L) { const list = g.kind === 'multi' ? g.options : (b && b.opts) || []; const o = list.find(x => x[0] === L); return o ? o[1] : ''; }
const PL = (window.__LAB__ && window.__LAB__.place) || {n:13,time:20,cut1:6,cut2:10,label:'One IELTS Passage 1 (13 questions, 20 minutes)'};
const PLTAB = `<tr><td>0–${PL.cut1}</td><td>Foundation</td></tr><tr><td>${PL.cut1+1}–${PL.cut2}</td><td>Core</td></tr><tr><td>${PL.cut2+1}–${PL.n}</td><td>Extension</td></tr>`;
const KIND_LABEL = {short:'Short answer', sentence:'Sentence', notes:'Notes', table:'Table', flow:'Flow-chart', choice:(window.__LAB__ && window.__LAB__.choiceLabel) || 'Word type', tfng:'True / False / Not Given', ynng:'Yes / No / Not Given', mcq:'Multiple choice', multi:'Choose more than one'};

/* ---------- decoding (answers are encoded in the student file) ---------- */
const _kc = {};
function getK(box) {
  if (typeof box.k !== 'string') return box.k;
  if (_kc[box.id]) return _kc[box.id];
  return (_kc[box.id] = decStr(box.k));
}
function decStr(s) {
  const bin = atob(s), key = LAB.keyStr, bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ key.charCodeAt(i % key.length);
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* ---------- marking ---------- */
function nrm(s) {
  s = (s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '');
  s = s.replace(/[‘’`´]/g, "'").replace(/[“”]/g, '"').replace(/[–—‑−]/g, '-');
  s = s.toLowerCase().replace(/(\d),(?=\d{3}\b)/g, '$1').replace(/\s+/g, ' ').trim();
  s = s.replace(/[.;:!?,]+$/g, '').replace(/^["']|["']$/g, '').trim();
  s = s.replace(/\s*-\s*/g, '-').replace(/\s*,\s*/g, ', ');
  return s;
}
function expand(alt) {
  const parts = alt.split(/(\([^)]*\))/).filter(x => x !== '');
  let vs = [''];
  for (const p of parts) {
    if (/^\(.*\)$/.test(p)) { const inner = p.slice(1, -1); vs = vs.flatMap(v => [v, v + inner]); }
    else vs = vs.map(v => v + p);
  }
  return vs.map(v => nrm(v));
}
function tokens(s) { return nrm(s).split(' ').filter(Boolean); }
const NUMW = new Set('one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty thirty forty fifty sixty seventy eighty ninety hundred thousand million billion twenty-one twenty-two twenty-five twenty-seven'.split(' '));
function isNum(t) { return /^[$£€]?\d[\d.,/]*(%|²|kg|km|m)?$/.test(t) || NUMW.has(t); }
function overLimit(ans, lim) {
  if (!lim) return false;
  const raw = tokens(ans), ts = raw.filter((x, i) => !(isNum(x) && i > 0 && isNum(raw[i - 1])));  // '3.5 million' = one number
  const nums = ts.filter(isNum).length, words = ts.length - nums;
  return lim.n ? (words > lim.w || nums > 1) : ts.length > lim.w;
}
function accepted(list) { const s = new Set(); list.forEach(a => expand(a).forEach(v => s.add(v))); return s; }
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({length: m + 1}, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];

function placementLevel() {
  const r = T('P1'); if (!r.first) return null;
  const s = r.first.score; return s <= PL.cut1 ? 'foundation' : s <= PL.cut2 ? 'core' : 'extension';
}
function pathTests(level) { return TESTS.filter(t => t.level === level); }
function stage(t) {
  const r = S.tests[t.id]; if (!r) return 0;
  if (r.unlocked) return 4; if (r.attempts > 1) return 3; if (r.first || r.unscored) return 2; if (r.pre) return 1; return 0;
}
function nextUp() {
  const levels = S.allPaths ? ['foundation', 'core', 'extension'] : (S.path ? [S.path] : []);
  for (const l of levels) for (const t of pathTests(l)) if (stage(t) < 4) return t;
  return null;
}
function advice() {
  if (!S.path || S.allPaths) return '';
  const done = pathTests(S.path).filter(t => S.tests[t.id] && S.tests[t.id].first);
  if (done.length < 3) return '';
  const avg = done.reduce((a, t) => a + pct(S.tests[t.id].first.score, t.total), 0) / done.length;
  const i = LEVELS.findIndex(l => l.id === S.path);
  if (avg >= 85 && i < 2) return `Your first-attempt average in ${LEVELS[i].label} is ${Math.round(avg)}%. You are ready to try <b>${LEVELS[i + 1].label}</b>.`;
  if (avg < 55 && i > 0) return `Your first-attempt average in ${LEVELS[i].label} is ${Math.round(avg)}%. Consider practising <b>${LEVELS[i - 1].label}</b> first.`;
  return '';
}

function render() {
  $$('nav.tabs button').forEach(b => b.classList.toggle('on', !view.test && b.dataset.tab === view.tab));

}

function testCard(t) {
  const r = S.tests[t.id], st = stage(t);
  const sc = r && r.first ? `First <b>${r.first.score}/${t.total}</b> · Latest <b>${r.latest.score}/${t.total}</b>` : `${t.total} marks · ${t.time} min`;
  return `<div class="card testcard ${lvlClass(t.level)}">
    <div class="row"><span class="code">${t.id}</span><span class="modetag">${t.mode}</span><span class="spacer"></span><span class="dots" title="Vocab check · Exam · Fix & retry · Review">${[1, 2, 3, 4].map(i => `<i class="${st >= i ? 'on' : ''}"></i>`).join('')}</span></div>
    <h3 style="margin:0">${esc(t.title)}</h3>
    <div class="small muted">${t.kinds.filter(k => k !== 'tfng' || t.id === 'P1').map(k => KIND_LABEL[k]).join(' · ')}</div>
    <div class="small">${sc}${r && r.unlocked ? ' · <span class="mark-ok">Unlocked</span>' : ''}</div>
    <div><button class="btn sm ${st < 4 ? 'primary' : ''}" data-open="${t.id}">${st === 0 ? 'Start' : st < 4 ? 'Continue' : 'Review'}</button></div></div>`;
}

/* ---------- test page ---------- */
function examRunning() { const t = view.test && S.tests[view.test]; return !!(t && t.exam && t.exam.running); }
function stopTimer() { if (exam.timer) { clearInterval(exam.timer); exam.timer = null; } }

function renderTest(m, t) {
  const r = T(t.id);
  // a reload during a running exam: continue the clock, count the interruption
  if (r.exam && r.exam.running && !exam.resumed) { r.exam.interrupts = (r.exam.interrupts || 0) + 1; exam.resumed = true; }
  const st = stage(t);
  const steps = ['Vocabulary check', 'Exam attempt', 'Fix & retry', 'Review & learn'];
  const cur = !r.pre ? 0 : !r.first ? 1 : !r.unlocked ? 2 : 3;
  let h = `<div class="testbar noprint"><button class="btn sm" id="back">← Study paths</button>
    <span class="lvltag ${lvlClass(t.level)}">${t.levelLabel}</span><b class="mono">${t.id}</b><span style="font:600 1.05rem Lexend">${esc(t.title)}</span><span class="spacer"></span>
    <span class="timer" id="timer">${fmtTime(t.time * 60)}</span></div>
    <div class="stepper noprint" style="margin-bottom:10px">${steps.map((s, i) => `<span class="${i === cur ? 'on' : i < cur ? 'done' : ''}">${i + 1} · ${s}</span>`).join('')}</div>
    <div id="banner" class="banner"></div>
    ${!r.pre ? '<div id="below"></div>' : ''}
    <div class="split" ${!r.pre ? 'style="display:none"' : ''}><div class="pane" id="ppane"><div class="hltools noprint" id="hltools"></div><div class="inner passage" id="passage"></div></div>
    <div class="pane" id="qpane"><div class="inner" id="questions"></div></div></div>

  m.innerHTML = h;
  $('#back').onclick = () => { if (examRunning()) { nudge('The exam is running. Submit first.'); return; } view.test = null; exam.resumed = false; render(); };
  // passage with saved highlights

}

function renderHlTools(t) {
  const el = $('#hltools');
  el.innerHTML = `<span class="small muted">Highlight:</span>
    <button class="sw y ${exam.hlColor === 'y' && !exam.erase ? 'on' : ''}" data-c="y" title="Yellow · key words from the question"></button>
    <button class="sw g ${exam.hlColor === 'g' && !exam.erase ? 'on' : ''}" data-c="g" title="Green · locating words found"></button>
    <button class="sw b ${exam.hlColor === 'b' && !exam.erase ? 'on' : ''}" data-c="b" title="Blue · paraphrases"></button>
    <button class="sw p ${exam.hlColor === 'p' && !exam.erase ? 'on' : ''}" data-c="p" title="Pink · the answer"></button>
    <button class="sw er ${exam.erase ? 'on' : ''}" data-c="er" title="Eraser: click a highlight to remove it">⌫</button>
    <button class="btn sm ghost" id="hlClear">Clear all</button>
    <span class="small muted">Select text to highlight · eraser + click to remove</span>`;
  $$('.sw', el).forEach(b => b.onclick = () => { if (b.dataset.c === 'er') exam.erase = !exam.erase; else { exam.hlColor = b.dataset.c; exam.erase = false; } renderHlTools(t); });
  $('#hlClear').onclick = () => { T(t.id).hl = null; $('#passage').innerHTML = renderPassage(t); save(); };
}
function savePassageHl(t) {
  const pas = $('#passage'); if (!pas) return;
  const c = pas.cloneNode(true); $$('mark.ev', c).forEach(x => x.replaceWith(...x.childNodes));
  T(t.id).hl = c.innerHTML;
}
document.addEventListener('mouseup', () => {
  const pas = $('#passage'); if (!pas || !view.test || exam.erase) return;
  const sel = getSelection(); if (!sel.rangeCount || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  if (!pas.contains(range.commonAncestorContainer)) return;
  const walker = document.createTreeWalker(range.commonAncestorContainer.nodeType === 3 ? range.commonAncestorContainer.parentNode : range.commonAncestorContainer, NodeFilter.SHOW_TEXT);
  const parts = [];
  while (walker.nextNode()) {
    const n = walker.currentNode; if (!range.intersectsNode(n) || !pas.contains(n)) continue;
    if (n.parentNode.closest('.pl,h2')) continue;
    const s = n === range.startContainer ? range.startOffset : 0, e = n === range.endContainer ? range.endOffset : n.nodeValue.length;
    if (e > s && n.nodeValue.slice(s, e).trim()) parts.push([n, s, e]);
  }
  parts.reverse().forEach(([n, s, e]) => { const r = document.createRange(); r.setStart(n, s); r.setEnd(n, e); const mk = document.createElement('mark'); mk.className = 'hl hl-' + exam.hlColor; r.surroundContents(mk); });
  sel.removeAllRanges();
  savePassageHl(TBY[view.test]); save(true);
});
document.addEventListener('click', e => {
  const mk = e.target.closest && e.target.closest('mark.hl'); if (!mk || !exam.erase) return;
  mk.replaceWith(...mk.childNodes); $('#passage').normalize(); savePassageHl(TBY[view.test]); save(true);
});

function inputHtml(t, b, g) {
  const r = T(t.id), val = (r.draft[b.id] ?? (r.latest ? r.latest.answers[b.id] : r.unscored ? r.unscored.answers[b.id] : '')) || '';
  let cls = 'ans', ro = '';
  const running = r.exam && r.exam.running;
  if (!r.first && !running) { cls += ' ro'; ro = 'readonly'; }
  if (r.retake) { const v2 = r.draft[b.id] ?? r.retake.answers[b.id] ?? ''; const rs = r.retake.res && r.retake.res[b.id];
    return `<input class="ans ${rs ? (rs.ok ? 'ok' : 'bad') : ''}" data-id="${b.id}" value="${esc(v2)}" placeholder="${esc(b.n)}" autocomplete="off" spellcheck="false">`; }
  if (r.latest) { const ok = r.latest.res[b.id].ok; cls += ok ? ' ok lock' : ' bad'; if (ok || r.unlocked) ro = 'readonly'; }
  return `<input class="${cls}" data-id="${b.id}" value="${esc(val)}" placeholder="${esc(b.n)}" ${ro} autocomplete="off" spellcheck="false" aria-label="Answer ${esc(b.n)}">`;
}
function choiceHtml(t, b, g) {
  const r = T(t.id), val = (r.draft[b.id] ?? (r.latest ? r.latest.answers[b.id] : r.unscored ? r.unscored.answers[b.id] : '')) || '';
  const opts = kindOptions(g, b);
  const res = r.retake ? (r.retake.res && r.retake.res[b.id]) : r.latest && r.latest.res[b.id];
  if (g.kind === 'mcq') return `<div class="opts mc" data-id="${b.id}">${b.opts.map(o => `<button class="opt mcopt ${val === o[0] ? 'on' : ''} ${res && val === o[0] ? (res.ok ? 'ok' : 'bad') : ''}" data-v="${esc(o[0])}"><b>${esc(o[0])}</b><span>${esc(o[1])}</span></button>`).join('')}</div>`;
  return `<span class="opts" data-id="${b.id}">${opts.map(o => `<button class="opt ${val === o ? 'on' : ''} ${res && val === o ? (res.ok ? 'ok' : 'bad') : ''}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</span>`;
}
/* choose TWO / THREE: one button list, letters stored in the group's boxes (any order) */
function multiState(t, g) {
  const r = T(t.id);
  return g.boxes.map(b => {
    const v = (r.draft[b.id] ?? (r.retake ? (r.retake.answers || {})[b.id] : r.latest ? r.latest.answers[b.id] : r.unscored ? r.unscored.answers[b.id] : '')) || '';
    const res = r.retake ? (r.retake.res && r.retake.res[b.id]) : r.latest && r.latest.res[b.id];
    const locked = !r.retake && r.latest && (r.latest.res[b.id].ok || r.unlocked);
    return {b, v, res, locked};
  });
}
function multiHtml(t, g) {
  const st = multiState(t, g), gi = t.groups.indexOf(g);
  return `<p class="small muted" style="margin:6px 0 2px">Choose <b>${g.boxes.length}</b> letters. Click a letter again to remove it.</p><div class="opts mc mopts" data-g="${gi}">${g.options.map(o => {
    const s2 = st.find(x => x.v === o[0]);
    const cls = s2 ? 'on' + (s2.res ? (s2.res.ok ? ' ok' : ' bad') : '') : '';
    return `<button class="opt mcopt ${cls}" data-v="${esc(o[0])}"><b>${esc(o[0])}</b><span>${esc(o[1])}</span></button>`;
  }).join('')}</div>`;
}
function multiClick(t, gi, L) {
  const rr = T(t.id), g = t.groups[gi]; const running = rr.exam && rr.exam.running;
  if (!running && !rr.first) { nudge('Start the exam first.'); return; }
  const st = multiState(t, g);
  const cur = st.find(x => x.v === L);
  if (cur) { if (cur.locked) return; rr.draft[cur.b.id] = ''; }
  else {
    const free = st.find(x => !x.locked && !x.v) || st.find(x => !x.locked && x.v && x.res && !x.res.ok);
    if (!free) { nudge(`Choose only ${g.boxes.length} letters. Click a letter again to remove it.`); return; }
    rr.draft[free.b.id] = L;
  }
  save(true); renderQuestions(t);
}
function renderQuestions(t) {
  const r = T(t.id), q = $('#questions');
  q.innerHTML = t.groups.map(g => renderGroup(t, g, {
    inputFor: b => inputHtml(t, b, g), choiceFor: b => choiceHtml(t, b, g), multiFor: g2 => multiHtml(t, g2),
    groupExtra: g2 => `<div class="hints" data-hints="${esc(g2.title)}">${g2.boxes.filter(b => r.hints[b.id]).map(b => `<div class="hint"><b>Hint Q${esc(b.n)}:</b> ${esc(hintText(t, b))}</div>`).join('')}</div>`
  })).join('') + `<div class="row noprint" id="qactions"></div>`;
  $$('input.ans', q).forEach(inp => {
    inp.addEventListener('input', () => { T(t.id).draft[inp.dataset.id] = inp.value; });
    inp.addEventListener('blur', () => save(true));
    inp.addEventListener('focus', () => { if (inp.readOnly && !T(t.id).first) nudge('Answer boxes open when you start the exam.'); });
  });
  $$('.mopts', q).forEach(o => $$('.opt', o).forEach(btn => btn.onclick = () => multiClick(t, +o.dataset.g, btn.dataset.v)));
  $$('.opts[data-id]', q).forEach(o => $$('.opt', o).forEach(btn => btn.onclick = () => {
    const rr = T(t.id); const running = rr.exam && rr.exam.running;
    if (!running && !rr.first) { nudge('Start the exam first.'); return; }
    if (!rr.retake && rr.latest && (rr.latest.res[o.dataset.id].ok || rr.unlocked)) return;
    rr.draft[o.dataset.id] = btn.dataset.v; $$('.opt', o).forEach(x => x.classList.toggle('on', x === btn)); save(true);
  }));
  const acts = $('#qactions');
  if (r.exam && r.exam.running) acts.innerHTML = `<button class="btn primary" id="submitExam">Submit answers</button><span class="small muted">${(window.__LAB__.txt.submitTip) || 'Check spelling, plural -s and the word limit before you submit.'}</span>`;
  else if (r.retake) acts.innerHTML = `<button class="btn primary" id="practiceCheck">Check practice answers</button><button class="btn" id="practiceEnd">End practice</button>`;
  else if (r.first && !r.unlocked) acts.innerHTML = `<button class="btn primary" id="retry">Check my corrected answers</button><span class="small muted">Correct answers are locked. Change only the red answers.</span>`;
  const sb = $('#submitExam'); if (sb) sb.onclick = () => confirmBox('Submit your answers now? Your first attempt is your exam score.', () => submitExam(t, false));
  const rb = $('#retry'); if (rb) rb.onclick = () => submitRetry(t);
  const pc = $('#practiceCheck'); if (pc) pc.onclick = () => { collectDraft(); const rr = T(t.id); rr.retake.answers = Object.assign({}, rr.retake.answers, rr.draft); const g = gradeTest(t, rr.retake.answers); rr.retake.res = g.res; rr.retake.score = g.score; rr.retake.checks++; rr.history.push({practice: g.score, at: new Date().toISOString()}); rr.draft = {}; save(); render(); toast(`Practice: ${g.score}/${t.total}`); };
  const pe = $('#practiceEnd'); if (pe) pe.onclick = () => { const rr = T(t.id); rr.retake = null; rr.draft = {}; save(); render(); };
}
function hintText(t, b) {
  const k = getK(b), r = T(t.id), lvl = r.hints[b.id] || 0;
  const where = k.plabel ? `Look in ${DATA.passages[t.passage].letters ? 'paragraph' : '¶'} ${k.plabel}. ` : '';
  const gk = (t.groups.find(g => g.boxes.some(x => x.id === b.id)) || {}).kind;
  if (OPTION_KINDS.includes(gk) || gk === 'multi') {
    let s = where + (k.h1 || 'Find the sentence about the key words, then compare: same meaning, opposite, or not mentioned?');
    if (lvl >= 2 && k.h2) s += ' ' + k.h2;
    return s;
  }
  let s = where + (k.wt ? `The answer is a ${k.wt}.` : 'Re-read the instructions and the words around the gap.');
  if (lvl >= 2) s += ' ' + firstLetterHint(b) + '.';
  return s;
}

function renderBanner(t) {
  const r = T(t.id), bn = $('#banner');
  if (!r.pre) {
    bn.className = 'banner info';
    bn.innerHTML = `<b>Step 1 · Vocabulary check (2 minutes, not scored).</b> Match ${t.pre.length} useful words from the passage with their meanings. The answer words of the test are never pre-taught.`;
  } else if (!r.first && r.unscored) {
    bn.className = 'banner warn';
    bn.innerHTML = `<b>Answers submitted, not scored.</b> ${esc(r.unscored.msg)}<br>Your answers are saved on this device. Enter a registered email at the top of the page, then press the button below to see your autoscored result (it counts as your first attempt).
      <div class="row" style="margin-top:8px"><button class="btn primary" id="scoreNow">Score my answers</button><button class="btn" id="againNow">Clear and try again</button><span class="small muted" id="authMsg"></span></div>`;
    $('#againNow').onclick = () => confirmBox('Clear these answers and start the exercise again?', () => { const rr = T(t.id); rr.unscored = null; rr.exam = null; rr.draft = {}; save(); render(); });
    $('#scoreNow').onclick = async () => {
      const a = await checkAuth(); save(true);
      if (!a.ok) { $('#authMsg').textContent = a.msg; nudge(a.msg); return; }
      scoreFirst(t, r.unscored.answers, r.exam.timedOut);
    };
  } else if (!r.first && !(r.exam && r.exam.running)) {
    bn.className = 'banner info';
    bn.innerHTML = `<b>Step 2 · Exam attempt.</b> ${t.total} marks · <b>${t.time} minutes</b>. The passage and questions open when you press Start. Real exam rules: one sitting, no dictionary or translator, copy words exactly from the passage, the word limit is strict, leaving the tab is recorded. The test submits automatically when time runs out.<br><span class="small">Everyone can read and practise. <b>Autoscoring</b> (score, fix & retry, answer key) is only for students whose email is on the class list.</span>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="startExam">Start exam</button><span class="small muted" id="authMsg"></span></div>`;
    $('#startExam').onclick = () => startExam(t);

/* ---------- exam mechanics ---------- */
function startExam(t) {
  const r = T(t.id);
  r.exam = {running: true, startedAt: Date.now(), deadline: Date.now() + t.time * 60000, tabSwitches: 0, interrupts: 0, usedSec: 0};
  r.draft = {}; exam.resumed = true; save(); render();
}
function startClock(t) {
  const r = T(t.id), el = $('#timer');
  const tick = () => {
    const left = (r.exam.deadline - Date.now()) / 1000;
    el.textContent = fmtTime(left);
    el.className = 'timer' + (left <= 60 ? ' crit' : left <= 300 ? ' warn' : '');
    if (Math.floor(left) === 300) toast('5 minutes left.');
    if (Math.floor(left) === 60) toast('1 minute left. Check your word limits.');
    if (left <= 0) { stopTimer(); submitExam(t, true); }
  };
  tick(); exam.timer = setInterval(tick, 1000);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && examRunning()) { const r = T(view.test); r.exam.tabSwitches = (r.exam.tabSwitches || 0) + 1; save(true); const el = $('#tabsw'); if (el) el.textContent = r.exam.tabSwitches; }
});
window.addEventListener('beforeunload', e => { save(true); if (examRunning()) { e.preventDefault(); e.returnValue = ''; } });
function collectDraft() {
  if (!view.test) return; const r = S.tests[view.test]; if (!r) return;
  $$('input.ans').forEach(i => { if (!i.readOnly) r.draft[i.dataset.id] = i.value; });
}
async function submitExam(t, timedOut) {
  const r = T(t.id); if (!r.exam || !r.exam.running) return;
  collectDraft();
  const answers = Object.assign({}, r.draft);
  r.exam.running = false; r.exam.timedOut = !!timedOut; r.exam.usedSec = Math.min(t.time * 60, (Date.now() - r.exam.startedAt) / 1000);
  stopTimer();
  const a = await checkAuth();
  if (!a.ok) { r.unscored = {answers, msg: a.msg, at: new Date().toISOString()}; save(); render(); return; }   // open practice: no score shown
  scoreFirst(t, answers, timedOut);
}
function scoreFirst(t, answers, timedOut) {
  const r = T(t.id), g = gradeTest(t, answers);
  r.attempts = 1; r.first = {score: g.score, answers, res: g.res, at: new Date().toISOString()}; r.latest = r.first; r.unscored = null; r.draft = {};
  allBoxes(t).forEach(b => { r.tries[b.id] = g.res[b.id].ok ? 0 : 1; });
  if (t.id === 'P1' && !S.path) S.path = placementLevel();
  save();
  sendResult(payloadFor(t, timedOut ? 'first (timed out)' : 'first'));
  tryUnlock(t) || render();
}
async function submitRetry(t) {
  const r = T(t.id); collectDraft();
  const a = await checkAuth(); if (!a.ok) { nudge(a.msg); return; }
  const answers = Object.assign({}, r.latest.answers, r.draft);
  const g = gradeTest(t, answers);
  r.attempts++; r.latest = {score: g.score, answers, res: g.res, at: new Date().toISOString()};
  allBoxes(t).forEach(b => {
    if (g.res[b.id].ok) r.tries[b.id] = 0; else { r.tries[b.id] = (r.tries[b.id] || 0) + 1; if (r.tries[b.id] >= 3) r.hints[b.id] = r.tries[b.id] >= 4 ? 2 : 1; }
  });
  save();
  sendResult(payloadFor(t, 'retry'));
  if (!tryUnlock(t)) { render(); toast(`Latest: ${g.score}/${t.total} (${pct(g.score, t.total)}%)`); }
}
function confirmBox(msg, yes) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><p>${esc(msg)}</p><div class="row"><span class="spacer"></span><button class="btn" id="mNo">Cancel</button><button class="btn primary" id="mYes">Yes</button></div></div>`;
  document.body.appendChild(bg); $('#mNo', bg).onclick = () => bg.remove(); $('#mYes', bg).onclick = () => { bg.remove(); yes(); };
}

    <div class="card kpi"><div class="v">${hints}</div><div class="l">Hints used</div></div></div>
  <div class="card" style="margin-top:14px;overflow-x:auto"><h3>Exercise results</h3><table class="data"><tr><th>Code</th><th>Exercise</th><th>Level</th><th>First</th><th>Latest</th><th>Attempts</th><th>Time used / allowed</th><th>Tab switches</th><th>Hints</th><th>Vocab before → after</th><th>Status</th></tr>
  ${done.map(t => { const r = S.tests[t.id], ex = r.exam || {}; return `<tr><td class="mono">${t.id}</td><td>${esc(t.title)}</td><td>${t.levelLabel}</td><td><b>${r.first.score}/${t.total}</b> (${pct(r.first.score, t.total)}%)</td><td>${r.latest.score}/${t.total} (${pct(r.latest.score, t.total)}%)</td><td>${r.attempts}</td><td>${fmtTime(ex.usedSec || 0)} / ${t.time}:00${ex.timedOut ? ' ⏱' : ''}</td><td>${ex.tabSwitches || 0}${ex.interrupts ? ' · reload ' + ex.interrupts : ''}</td><td>${Object.keys(r.hints).length}</td><td>${r.pre ? r.pre.score + '/' + r.pre.total : '—'} → ${r.post ? r.post.score + '/' + r.post.total : '—'}</td><td>${r.unlocked ? '<span class="mark-ok">Unlocked</span>' : 'In progress'}</td></tr>`; }).join('') || '<tr><td colspan="11" class="muted">No exercises submitted yet.</td></tr>'}</table></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h3>First-attempt accuracy by task format</h3>${KIND_ORDER.filter(k => byKind[k]).map(k => `<div class="barrow"><span>${KIND_LABEL[k]}</span><div class="bar"><i style="width:${pct(byKind[k][0], byKind[k][1])}%"></i></div><span class="mono">${pct(byKind[k][0], byKind[k][1])}%</span></div>`).join('') || '<p class="muted">No data yet.</p>'}</div>
  <div class="card"><h3>Error causes</h3>${CAUSES.filter(c => causes[c[0]]).map(c => `<div class="barrow"><span>${esc(c[1])}</span><div class="bar"><i style="width:${pct(causes[c[0]], cmax)}%"></i></div><span class="mono">${causes[c[0]]}</span></div>`).join('') || '<p class="muted">No causes tagged yet.</p>'}</div></div>
  <div class="card" style="margin-top:14px;overflow-x:auto"><h3>Error logbook & paraphrase table</h3><table class="data"><tr><th>Ex.</th><th>Q</th><th>My answer</th><th>Correct</th><th>Error type</th><th>Cause</th><th>Paraphrase</th><th>Note</th></tr>
  ${errs.map(({t, b, r}) => `<tr><td class="mono">${t.id}</td><td>${esc(b.n)}</td><td class="mono">${esc(r.first.answers[b.id] || '—')}</td><td class="mono">${r.unlocked ? esc(keyText(b)) : '🔒'}</td><td>${esc(r.first.res[b.id].type)}</td><td>${r.causes[b.id] ? esc(CAUSE_BY[r.causes[b.id]][1]) : '—'}</td><td class="small">${r.unlocked ? (getK(b).pp || []).map(p => esc(p[0]) + ' → ' + esc(p[1])).join('<br>') : '🔒'}</td><td class="small">${esc(r.notes[b.id] || '')}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">No errors logged.</td></tr>'}</table></div>
  ${advice() ? `<div class="banner info" style="margin-top:14px">${advice()}</div>` : ''}
  <div class="card noprint" style="margin-top:14px"><h3>Move my progress to another device</h3><p class="small muted">Copy this backup code and paste it on the other device.</p>
  <div class="row"><button class="btn sm" id="bk">Copy backup code</button><input type="text" id="rsIn" placeholder="Paste a backup code" style="flex:1;min-width:200px"><button class="btn sm" id="rs">Restore</button></div>
  <p class="small muted" style="margin-top:8px">Results waiting to be sent to your teacher: <b>${S.outbox.length}</b> ${S.outbox.length ? '<button class="btn sm" id="flush">Send now</button>' : ''}</p></div>`;
  $('#pdf').onclick = () => window.print();
  $('#bk').onclick = () => { const code = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); navigator.clipboard.writeText(code).then(() => toast('Backup code copied.'), () => { $('#rsIn').value = code; toast('Copy the code from the box.'); }); };
  $('#rs').onclick = () => { try { S = Object.assign(blank(), JSON.parse(decodeURIComponent(escape(atob($('#rsIn').value.trim()))))); save(); toast('Progress restored.'); render(); } catch (_) { toast('That code is not valid.'); } };
  const fl = $('#flush'); if (fl) fl.onclick = () => { flushOutbox(); toast('Sending…'); };
}

/* ---------- boot ---------- */
bindHeader();
{ const run = TESTS.find(t => S.tests[t.id] && S.tests[t.id].exam && S.tests[t.id].exam.running); if (run) view.test = run.id; }
render();
flushOutbox();
</script></body></html>
