alled into question unsuccessfully.", "set": null, "lim": null, "pair": null, "k": "E1ETThdRLxB5JjMrRXAeEBBTHlFITA8UFVFFVBYcDkJAEFFeCR8eCUMWERJFFRVOBEJfVRJCB1McAw0QAlNEGERCRw9CUUBXSklSXwFRVkJBFQQLCw8IEBACSl9STkVAVggNVjYPFUxVQlNGAFNGQg9dVBBFRkRUR0NHXF4aSFEFGA9LVFxYGApCRw9CQBAMSCgpTk4QGF5IEEYHCVldEENDDQAGBUIfVh4NVhYbFEVXVBJeCQEWCV9RWhwDVAMPBEUSQEBfBwFSD0UQGF5IGgELRXAeEGkUHR0BGU4SEUFeEhMCC1QQHBIUABIBTE4eGVcNAAlOCUISUURXAR9QMXBdVBBaHB9MXQ1cRV5aRFNQGF8QBBAXVAgbC0EeEBBTEFFITEMEGF5Q"}, {"id": "E4-33", "n": "33", "text": "This experiment could soon lead to some practical uses for time travel.", "set": null, "lim": null, "pair": null, "k": "E1ETThdRLxBrNSo9Ig9vHBIUDQVQVg1THUENEgccR09XSV1YDFMGBEhRB1FCBANOCEsSUVxPSB4dCEgDGhJZEQUGCUJeX1VfDQBQQA1TBFNfFURURxkeEBBGBBIQCUFTThIPQURCRw9aARAMSFEiDV8QE0BMBA5OUgMQHBIUAEFQVg0fAV5BWEZMEFkQChJYHR8eQA1TBEIPTkY1PA9BX11YSF1cQg0BBlNOAA8NBkESRUFTG1FeTA8XFUANFgMXCENWEEZeDVMBD0IBERJCEkYPCVQSXV1SDQEcTFkUF1pDGwoBAERXQxIYRl1SAEgXABJZG0YIEllHQlcWDxYcCV8QAFtCGhVMOnAeEBBBAApQVg0fAV5BWEZME19TQBAMSB0HAEFdVBBIDERUR0NHXF5L"}], "sets": {}, "kindLabel": "True / False / Not Given"}], "total": 6, "kinds": ["tfng"]}], "passages": {"sports": {"title": "Unusual Sports", "sub": null, "letters": true, "paras": ["Do you ever get bored with the same old sports? If you're tired of tennis, fed up with football or bored of basketball, don't worry. There are plenty of new and unusual sports out there for you to try. Many of these are a mix of existing sports, sometimes with a local element added. Bossaball, for example, is a mix of football and volleyball, played on an inflatable pitch with a trampoline in the middle. To make it more exciting, it also has elements of Brazilian martial arts!", "If you are very good at horse riding, you could try the national sport of Afghanistan, buzkashi. Many versions have been played in the Central Asian region for hundreds of years. The game involves players on horseback trying to get hold of a dead goat. The Afghan Buzkashi Federation wants the game to spread throughout the world and has finally written down the rules because they hope to get Olympic status for the sport.", "A sport that is more likely to become famous is kabaddi. It is popular in India and other parts of South Asia. It is similar in some ways to the game called 'tag' or 'it' which schoolchildren play. One person is 'it' and has to catch the others. In kabaddi, a 'raider' from one team tries to tag a player from the other team and then return to their own half of the field without getting caught. In some versions of the game, the raider must chant the word 'kabaddi' as he returns to his place. Kabaddi is good fun, good exercise and doesn't need any equipment. It is played at the Asian Games.", "There is an unusual sport which describes itself as a 'classic mix of brains and brawn'. The game, called 'chess boxing', involves a round of chess and then a round of boxing, then another of chess, and so on. There is one minute between rounds. The first chess boxing world championship took place in 2003 in Amsterdam and was won by a Dutchman, Iepe Rubingh. Since then, it has become more popular, particularly in Germany, the UK, India and Russia. It is a difficult sport, as players need to be very good at two very different activities and be able to switch quickly between the two.", "Finally, an unusual sport that will be familiar to most of us is roshambo, which began in China about 2000 years ago and spread gradually to the rest of the world. Played by young and old, in the UK it is known as 'rock-paper-scissors'. It is surprising that it is called a sport and taken so seriously: there's a World Rock Paper Scissors Society and a league which holds championships every year. So, whatever kinds of sport you like, there is something new and interesting for you to try."]}, "underground": {"title": "The development of the London underground railway", "sub": null, "letters": false, "paras": ["In the first half of the 1800s, London's population grew at an astonishing rate, and the central area became increasingly congested. In addition, the expansion of the overground railway network resulted in more and more passengers arriving in the capital. However, in 1846, a Royal Commission decided that the railways should not be allowed to enter the City, the capital's historic and business centre. The result was that the overground railway stations formed a ring around the City. The area within consisted of poorly built, overcrowded slums and the streets were full of horse-drawn traffic. Crossing the City became a nightmare. It could take an hour and a half to travel 8 km by horse-drawn carriage or bus. Numerous schemes were proposed to resolve these problems, but few succeeded.", "Amongst the most vocal advocates for a solution to London's traffic problems was Charles Pearson, who worked as a solicitor for the City of London. He saw both social and economic advantages in building an underground railway that would link the overground railway stations together and clear London slums at the same time. His idea was to relocate the poor workers who lived in the inner-city slums to newly constructed suburbs, and to provide cheap rail travel for them to get to work. Pearson's ideas gained support amongst some businessmen and in 1851 he submitted a plan to Parliament. It was rejected, but coincided with a proposal from another group for an underground connecting line, which Parliament passed.", "The two groups merged and established the Metropolitan Railway Company in August 1854. The company's plan was to construct an underground railway line from the Great Western Railway's (GWR) station at Paddington to the edge of the City at Farringdon Street – a distance of almost 5 km. The organisation had difficulty in raising the funding for such a radical and expensive scheme, not least because of the critical articles printed by the press. Objectors argued that the tunnels would collapse under the weight of traffic overhead, buildings would be shaken and passengers would be poisoned by the emissions from the train engines. However, Pearson and his partners persisted.", "The GWR, aware that the new line would finally enable them to run trains into the heart of the City, invested almost £250,000 in the scheme. Eventually, over a five-year period, £1m was raised. The chosen route ran beneath existing main roads to minimise the expense of demolishing buildings. Originally scheduled to be completed in 21 months, the construction of the underground line took three years. It was built just below street level using a technique known as 'cut and cover'. A trench about ten metres wide and six metres deep was dug, and the sides temporarily held up with timber beams. Brick walls were then constructed, and finally a brick arch was added to create a tunnel. A two-metre-deep layer of soil was laid on top of the tunnel and the road above rebuilt.", "The Metropolitan line, which opened on 10 January 1863, was the world's first underground railway. On its first day, almost 40,000 passengers were carried between Paddington and Farringdon, the journey taking about 18 minutes. By the end of the Metropolitan's first year of operation, 9.5 million journeys had been made.", "Even as the Metropolitan began operation, the first extensions to the line were being authorised; these were built over the next five years, reaching Moorgate in the east of London and Hammersmith in the west. The original plan was to pull the trains with steam locomotives, using firebricks in the boilers to provide steam, but these engines were never introduced. Instead, the line used specially designed locomotives that were fitted with water tanks in which steam could be condensed. However, smoke and fumes remained a problem, even though ventilation shafts were added to the tunnels.", "Despite the extension of the underground railway, by the 1880s, congestion on London's streets had become worse. The problem was partly that the existing underground lines formed a circuit around the centre of London and extended to the suburbs, but did not cross the capital's centre. The 'cut and cover' method of construction was not an option in this part of the capital. The only alternative was to tunnel deep underground.", "Although the technology to create these tunnels existed, steam locomotives could not be used in such a confined space. It wasn't until the development of a reliable electric motor, and a means of transferring power from the generator to a moving train, that the world's first deep-level electric railway, the City & South London, became possible. The line opened in 1890, and ran from the City to Stockwell, south of the River Thames. The trains were made up of three carriages and driven by electric engines. The carriages were narrow and had tiny windows just below the roof because it was thought that passengers would not want to look out at the tunnel walls. The line was not without its problems, mainly caused by an unreliable power supply. Although the City & South London Railway was a great technical achievement, it did not make a profit. Then, in 1900, the Central London Railway, known as the 'Tuppenny Tube', began operation using new electric locomotives. It was very popular and soon afterwards new railways and extensions were added to the growing tube network. By 1907, the heart of today's Underground system was in place."]}, "coconut": {"title": "The coconut palm", "sub": null, "letters": false, "paras": ["For millennia, the coconut has been central to the lives of Polynesian and Asian peoples. In the western world, on the other hand, coconuts have always been exotic and unusual, sometimes rare. The Italian merchant traveller Marco Polo apparently saw coconuts in South Asia in the late 13th century, and among the mid-14th-century travel writings of Sir John Mandeville there is mention of 'great Notes of Ynde' (great Nuts of India). Today, images of palm-fringed tropical beaches are clichés in the west to sell holidays, chocolate bars, fizzy drinks and even romance.", "Typically, we envisage coconuts as brown cannonballs that, when opened, provide sweet white flesh. But we see only part of the fruit and none of the plant from which they come. The coconut palm has a smooth, slender, grey trunk, up to 30 metres tall. This is an important source of timber for building houses, and is increasingly being used as a replacement for endangered hardwoods in the furniture construction industry. The trunk is surmounted by a rosette of leaves, each of which may be up to six metres long. The leaves have hard veins in their centres which, in many parts of the world, are used as brushes after the green part of the leaf has been stripped away. Immature coconut flowers are tightly clustered together among the leaves at the top of the trunk. The flower stems may be tapped for their sap to produce a drink, and the sap can also be reduced by boiling to produce a type of sugar used for cooking.", "Coconut palms produce as many as seventy fruits per year, weighing more than a kilogram each. The wall of the fruit has three layers: a waterproof outer layer, a fibrous middle layer and a hard, inner layer. The thick fibrous middle layer produces coconut fibre, 'coir', which has numerous uses and is particularly important in manufacturing ropes. The woody innermost layer, the shell, with its three prominent 'eyes', surrounds the seed. An important product obtained from the shell is charcoal, which is widely used in various industries as well as in the home as a cooking fuel. When broken in half, the shells are also used as bowls in many parts of Asia.", "Inside the shell are the nutrients (endosperm) needed by the developing seed. Initially, the endosperm is a sweetish liquid, coconut water, which is enjoyed as a drink, but also provides the hormones which encourage other plants to grow more rapidly and produce higher yields. As the fruit matures, the coconut water gradually solidifies to form the brilliant white, fat-rich, edible flesh or meat. Dried coconut flesh, 'copra', is made into coconut oil and coconut milk, which are widely used in cooking in different parts of the world, as well as in cosmetics. A derivative of coconut fat, glycerine, acquired strategic importance in a quite different sphere, as Alfred Nobel introduced the world to his nitroglycerine-based invention: dynamite.", "Their biology would appear to make coconuts the great maritime voyagers and coastal colonizers of the plant world. The large, energy-rich fruits are able to float in water and tolerate salt, but cannot remain viable indefinitely; studies suggest after about 110 days at sea they are no longer able to germinate. Literally cast onto desert island shores, with little more than sand to grow in and exposed to the full glare of the tropical sun, coconut seeds are able to germinate and root. The air pocket in the seed, created as the endosperm solidifies, protects the embryo. In addition, the fibrous fruit wall that helped it to float during the voyage stores moisture that can be taken up by the roots of the coconut seedling as it starts to grow.", "There have been centuries of academic debate over the origins of the coconut. There were no coconut palms in West Africa, the Caribbean or the east coast of the Americas before the voyages of the European explorers Vasco da Gama and Columbus in the late 15th and early 16th centuries. 16th century trade and human migration patterns reveal that Arab traders and European sailors are likely to have moved coconuts from South and Southeast Asia to Africa and then across the Atlantic to the east coast of America. But the origin of coconuts discovered along the west coast of America by 16th century sailors has been the subject of centuries of discussion. Two diametrically opposed origins have been proposed: that they came from Asia, or that they were native to America. Both suggestions have problems. In Asia, there is a large degree of coconut diversity and evidence of millennia of human use – but there are no relatives growing in the wild. In America, there are close coconut relatives, but no evidence that coconuts are indigenous. These problems have led to the intriguing suggestion that coconuts originated on coral islands in the Pacific and were dispersed from there."]}, "collect": {"title": "Why do people collect things?", "sub": null, "letters": false, "paras": ["People from almost every culture love collecting things. They might collect stamps, books, cards, priceless paintings or worthless ticket stubs to old sports games. Their collection might hang on the walls of a mansion or be stored in a box under the bed. So what is it that drives people to collect? Psychologist Dr Maria Richter argues that the urge to collect is a basic human characteristic. According to her, in the very first years of life we form emotional connections with lifeless objects such as soft toys. And these positive relationships are the starting point for our fascination with collecting objects. In fact, the desire to collect may go back further still. Scientists suggest that for some ancient humans living hundreds of thousands of years ago, collecting may have had a serious purpose. Only by collecting sufficient food supplies to last through freezing winters or dry summers could our ancestors stay alive until the weather improved.", "It turns out that even collecting for pleasure has a very long history. In 1925, the archaeologist Leonard Woolley was working at a site in the historic Babylonian city of Ur. Woolley had travelled to the region intending only to excavate the site of a palace. Instead, to his astonishment, he dug up artefacts which appeared to belong to a 2,500-year-old museum. Among the objects was part of a statue and a piece of a local building. And accompanying some of the artefacts were descriptions like modern-day labels. These texts appeared in three languages and were carved into pieces of clay. It seems likely that this early private collection of objects was created by Princess Ennigaldi, the daughter of King Nabonidus. However, very little else is known about Princess Ennigaldi or what her motivations were for setting up her collection.", "This may have been one of the first large private collections, but it was not the last. Indeed, the fashion for establishing collections really got started in Europe around 2,000 years later with the so-called 'Cabinets of Curiosities'. These were collections, usually belonging to wealthy families, that were displayed in cabinets or small rooms. Cabinets of Curiosities typically included fine paintings and drawings, but equal importance was given to exhibits from the natural world such as animal specimens, shells and plants.", "Some significant private collections of this sort date from the fifteenth century. One of the first belonged to the Medici family. The Medicis became a powerful political family in Italy and later a royal house, but banking was originally the source of all their wealth. The family started by collecting coins and valuable gems, then artworks and antiques from around Europe. In 1570 a secret 'studio' was built inside the Palazzo Medici to house their growing collection. This exhibition room had solid walls without windows to keep the valuable collection safe.", "In the seventeenth century, another fabulous collection was created by a Danish physician named Ole Worm. His collection room contained numerous skeletons and specimens, as well as ancient texts and a laboratory. One of Ole Worm's motivations was to point out when other researchers had made mistakes, such as the false claim that birds of paradise had no feet. He also owned a great auk, a species of bird that has now become extinct, and the illustration he produced of it has been of value to later scientists.", "The passion for collecting was just as strong in the nineteenth century. Lady Charlotte Guest spoke at least six languages and became well-known for translating English books into Welsh. She also travelled widely throughout Europe acquiring old and rare pottery, which she added to her collection at home in southern England. When Lady Charlotte died in 1895 this collection was given to the Victoria and Albert Museum in London. At around the same time in the north of England, a wealthy goldsmith named Joseph Mayer was building up an enormous collection of artefacts, particularly those dug up from sites in his local area. His legacy, the Mayer Trust, continues to fund public lectures in accordance with his wishes.", "In the twentieth century, the writer Beatrix Potter had a magnificent collection of books, insects, plants and other botanical specimens. Most of these were donated to London's Natural History Museum, but Beatrix held on to her cabinets of fossils, which she was particularly proud of. In the United States, President Franklin D. Roosevelt began his stamp collection as a child and continued to add to it all his life. The stress associated with being president was easier to cope with, Roosevelt said, by taking time out to focus on his collection. By the end of his life this had expanded to include model ships, coins and artworks.", "Most of us will never own collections so large or valuable as these. However, the examples given here suggest that collecting is a passion that has been shared by countless people over many centuries."]}, "fairgames": {"title": "FAIR GAMES?", "sub": null, "letters": false, "paras": ["For seventeen days every four years the world is briefly arrested by the captivating, dizzying spectacle of athleticism, ambition, pride and celebration on display at the Summer Olympic Games. After the last weary spectators and competitors have returned home, however, host cities are often left awash in high debts and costly infrastructure maintenance. The staggering expenses involved in a successful Olympic bid are often assumed to be easily mitigated by tourist revenues and an increase in local employment, but more often than not host cities are short changed and their taxpayers for generations to come are left settling the debt.", "Olympic extravagances begin with the application process. Bidding alone will set most cities back about $20 million, and while officially bidding only takes two years (for cities that make the shortlist), most cities can expect to exhaust a decade working on their bid from the moment it is initiated to the announcement of voting results from International Olympic Committee members. Aside from the financial costs of the bid alone, the process ties up real estate in prized urban locations until the outcome is known. This can cost local economies millions of dollars of lost revenue from private developers who could have made use of the land, and can also mean that particular urban quarters lose their vitality due to the vacant lots. All of this can be for nothing if a bidding city does not appease the whims of IOC members – private connections and opinions on government conduct often hold sway (Chicago's 2012 bid is thought to have been undercut by tensions over U.S. foreign policy).", "Bidding costs do not compare, however, to the exorbitant bills that come with hosting the Olympic Games themselves. As is typical with large-scale, one-off projects, budgeting for the Olympics is a notoriously formidable task. Los Angelinos have only recently finished paying off their budget-breaking 1984 Olympics; Montreal is still in debt for its 1976 Games (to add insult to injury, Canada is the only host country to have failed to win a single gold medal during its own Olympics). The tradition of runaway expenses has persisted in recent years. London Olympics managers have admitted that their 2012 costs may increase ten times over their initial projections, leaving tax payers 20 billion pounds in the red.", "Hosting the Olympics is often understood to be an excellent way to update a city's sporting infrastructure. The extensive demands of Olympic sports include aquatic complexes, equestrian circuits, shooting ranges, beach volleyball courts, and, of course, an 80,000 seat athletic stadium. Yet these demands are typically only necessary to accommodate a brief influx of athletes from around the world. Despite the enthusiasm many populations initially have for the development of world-class sporting complexes in their home towns, these complexes typically fall into disuse after the Olympic fervour has waned. Even Australia, home to one of the world's most sportive populations, has left its taxpayers footing a $32 million-a-year bill for the maintenance of vacant facilities.", "Another major concern is that when civic infrastructure developments are undertaken in preparation for hosting the Olympics, these benefits accrue to a single metropolitan centre (with the exception of some outlying areas that may get some revamped sports facilities). In countries with an expansive land mass, this means vast swathes of the population miss out entirely. Furthermore, since the International Olympic Committee favours prosperous \"global\" centres (the United Kingdom was told, after three failed bids from its provincial cities, that only London stood any real chance at winning), the improvement of public transport, roads and communication links tends to concentrate in places already well-equipped with world-class infrastructures. Perpetually by-passing minor cities creates a cycle of disenfranchisement: these cities never get an injection of capital, they fail to become first-rate candidates, and they are constantly passed over in favour of more secure choices.", "Finally, there is no guarantee that an Olympics will be a popular success. The \"feel good\" factor that most proponents of Olympic bids extol (and that was no doubt driving the 90 to 100 per cent approval rates of Parisians and Londoners for their cities' respective 2012 bids) can be an elusive phenomenon, and one that is tied to that nation's standing on the medal tables. This ephemeral thrill cannot compare to the years of disruptive construction projects and security fears that go into preparing for an Olympic Games, nor the decades of debt repayment that follow (Greece's preparation for Athens 2004 famously deterred tourists from visiting the country due to widespread unease about congestion and disruption)", "There are feasible alternatives to the bloat, extravagance and wasteful spending that comes with a modern Olympic Games. One option is to designate a permanent host city that would be re-designed or built from scratch especially for the task. Another is to extend the duration of the Olympics so that it becomes a festival of several months. Local businesses would enjoy the extra spending and congestion would ease substantially as competitors and spectators come and go according to their specific interests. Neither the \"Olympic City\" nor the extended length options really get to the heart of the issue, however. Stripping away ritual and decorum in favour of concentrating on athletic rivalry would be preferable.", "Failing that, the Olympics could simply be scrapped altogether. International competition could still be maintained through world championships in each discipline. Most of these events are already held on non-Olympic years anyway – the International Association of Athletics Federations, for example, has run a biennial World Athletics Championship since 1983 after members decided that using the Olympics for their championship was no longer sufficient. Events of this nature keep world-class competition alive without requiring Olympic-sized expenses."]}, "seti": {"title": "IS THERE ANYBODY OUT THERE?", "sub": "The Search for Extra-terrestrial Intelligence", "letters": false, "paras": ["@- The question of whether we are alone in the Universe has haunted humanity for centuries, but we may now stand poised on the brink of the answer to that question, as we search for radio signals from other intelligent civilisations. This search, often known by the acronym SETI (search for extra-terrestrial intelligence), is a difficult one. Although groups around the world have been searching intermittently for three decades, it is only now that we have reached the level of technology where we can make a determined attempt to search all nearby stars for any sign of life.", "@A The primary reason for the search is basic curiosity – the same curiosity about the natural world that drives all pure science. We want to know whether we are alone in the Universe. We want to know whether life evolves naturally if given the right conditions, or whether there is something very special about the Earth to have fostered the variety of life forms that we see around us on the planet. The simple detection of a radio signal will be sufficient to answer this most basic of all questions. In this sense, SETI is another cog in the machinery of pure science which is continually pushing out the horizon of our knowledge. However, there are other reasons for being interested in whether life exists elsewhere. For example, we have had civilisation on Earth for perhaps only a few thousand years, and the threats of nuclear war and pollution over the last few decades have told us that our survival may be tenuous. Will we last another two thousand years or will we wipe ourselves out? Since the lifetime of a planet like ours is several billion years, we can expect that, if other civilisations do survive in our galaxy, their ages will range from zero to several billion years. Thus any other civilisation that we hear from is likely to be far older, on average, than ourselves. The mere existence of such a civilisation will tell us that long-term survival is possible, and gives us some cause for optimism. It is even possible that the older civilisation may pass on the benefits of their experience in dealing with threats to survival such as nuclear war and global pollution, and other threats that we haven't yet discovered.", "@B In discussing whether we are alone, most SETI scientists adopt two ground rules. First, UFOs (Unidentified Flying Objects) are generally ignored since most scientists don't consider the evidence for them to be strong enough to bear serious consideration (although it is also important to keep an open mind in case any really convincing evidence emerges in the future). Second, we make a very conservative assumption that we are looking for a life form that is pretty well like us, since if it differs radically from us we may well not recognise it as a life form, quite apart from whether we are able to communicate with it. In other words, the life form we are looking for may well have two green heads and seven fingers, but it will nevertheless resemble us in that it should communicate with its fellows, be interested in the Universe, live on a planet orbiting a star like our Sun, and perhaps most restrictively, have a chemistry, like us, based on carbon and water.", "@C Even when we make these assumptions, our understanding of other life forms is still severely limited. We do not even know, for example, how many stars have planets, and we certainly do not know how likely it is that life will arise naturally, given the right conditions. However, when we look at the 100 billion stars in our galaxy (the Milky Way), and 100 billion galaxies in the observable Universe, it seems inconceivable that at least one of these planets does not have a life form on it; in fact, the best educated guess we can make, using the little that we do know about the conditions for carbon-based life, leads us to estimate that perhaps one in 100,000 stars might have a life-bearing planet orbiting it. That means that our nearest neighbours are perhaps 100 light years away, which is almost next door in astronomical terms.", "@D An alien civilisation could choose many different ways of sending information across the galaxy, but many of these either require too much energy, or else are severely attenuated while traversing the vast distances across the galaxy. It turns out that, for a given amount of transmitted power, radio waves in the frequency range 1000 to 3000 MHz travel the greatest distance, and so all searches to date have concentrated on looking for radio waves in this frequency range. So far there have been a number of searches by various groups around the world, including Australian searches using the radio telescope at Parkes, New South Wales. Until now there have not been any detections from the few hundred stars which have been searched. The scale of the searches has been increased dramatically since 1992, when the US Congress voted NASA $10 million per year for ten years to conduct a thorough search for extra-terrestrial life. Much of the money in this project is being spent on developing the special hardware needed to search many frequencies at once. The project has two parts. One part is a targeted search using the world's largest radio telescopes, the American-operated telescope in Arecibo, Puerto Rico and the French telescope in Nancy in France. This part of the project is searching the nearest 1000 likely stars with high sensitivity for signals in the frequency range 1000 to 3000 MHz. The other part of the project is an undirected search which is monitoring all of space with a lower sensitivity, using the smaller antennas of NASA's Deep Space Network.", "@E There is considerable debate over how we should react if we detect a signal from an alien civilisation. Everybody agrees that we should not reply immediately. Quite apart from the impracticality of sending a reply over such large distances at short notice, it raises a host of ethical questions that would have to be addressed by the global community before any reply could be sent. Would the human race face the culture shock if faced with a superior and much older civilisation? Luckily, there is no urgency about this. The stars being searched are hundreds of light years away, so it takes hundreds of years for their signal to reach us, and a further few hundred years for our reply to reach them. It's not important, then, if there's a delay of a few years, or decades, while the human race debates the question of whether to reply, and perhaps carefully drafts a reply."]}, "timetravel": {"title": "Time Travel", "sub": null, "letters": false, "paras": ["Time travel took a small step away from science fiction and toward science recently when physicists discovered that sub-atomic particles known as neutrinos – progeny of the sun's radioactive debris – can exceed the speed of light. The unassuming particle – it is electrically neutral, small but with a \"non-zero mass\" and able to penetrate the human form undetected – is on its way to becoming a rock star of the scientific world.", "Researchers from the European Organisation for Nuclear Research (CERN) in Geneva sent the neutrinos hurtling through an underground corridor toward their colleagues at the Oscillation Project with Emulsion-Tracing Apparatus (OPERA) team 730 kilometres away in Gran Sasso, Italy. The neutrinos arrived promptly – so promptly, in fact, that they triggered what scientists are calling the unthinkable – that everything they have learnt, known or taught stemming from the last one hundred years of the physics discipline may need to be reconsidered.", "The issue at stake is a tiny segment of time – precisely sixty nanoseconds (which is sixty billionths of a second). This is how much faster than the speed of light the neutrinos managed to go in their underground travels and at a consistent rate (15,000 neutrinos were sent over three years). Even allowing for a margin of error of ten billionths of a second, this stands as proof that it is possible to race against light and win. The duration of the experiment also accounted for and ruled out any possible lunar effects or tidal bulges in the earth's crust.", "Nevertheless, there's plenty of reason to remain sceptical. According to Harvard University science historian Peter Galison, Einstein's relativity theory has been \"pushed harder than any theory in the history of the physical sciences\". Yet each prior challenge has come to no avail, and relativity has so far refused to buckle.", "So is time travel just around the corner? The prospect has certainly been wrenched much closer to the realm of possibility now that a major physical hurdle – the speed of light – has been cleared. If particles can travel faster than light, in theory travelling back in time is possible. How anyone harnesses that to some kind of helpful end is far beyond the scope of any modern technologies, however, and will be left to future generations to explore.", "Certainly, any prospective time travellers may have to overcome more physical and logical hurdles than merely overtaking the speed of light. One such problem, posited by René Barjavel in his 1943 text Le Voyageur Imprudent is the so- called grandfather paradox. Barjavel theorised that, if it were possible to go back in time, a time traveller could potentially kill his own grandfather. If this were to happen, however, the time traveller himself would not be born, which is already known to be true. In other words, there is a paradox in circumventing an already known future; time travel is able to facilitate past actions that mean time travel itself cannot occur.", "Other possible routes have been offered, though. For Igor Novikov, astrophysicist behind the 1980s' theorem known as the self-consistency principle, time travel is possible within certain boundaries. Novikov argued that any event causing a paradox would have zero probability. It would be possible, however, to \"affect\" rather than \"change\" historical outcomes if travellers avoided all inconsistencies. Averting the sinking of the Titanic, for example, would revoke any future imperative to stop it from sinking – it would be impossible. Saving selected passengers from the water and replacing them with realistic corpses would not be impossible, however, as the historical record would not be altered in any way.", "A further possibility is that of parallel universes. Popularised by Bryce Seligman DeWitt in the 1960s (from the seminal formulation of Hugh Everett), the many-worlds interpretation holds that an alternative pathway for every conceivable occurrence actually exists. If we were to send someone back in time, we might therefore expect never to see him again – any alterations would divert that person down a new historical trajectory.", "A final hypothesis, one of unidentified provenance, reroutes itself quite efficiently around the grandfather paradox. Non-existence theory suggests exactly that – a person would quite simply never exist if they altered their ancestry in ways that obstructed their own birth. They would still exist in person upon returning to the present, but any chain reactions associated with their actions would not be registered. Their \"historical identity\" would be gone.", "So, will humans one day step across the same boundary that the neutrinos have? World-renowned astrophysicist Stephen Hawking believes that once spaceships can exceed the speed of light, humans could feasibly travel millions of years into the future in order to repopulate earth in the event of a forthcoming apocalypse. This is because, as the spaceships accelerate into the future, time would slow down around them (Hawking concedes that bygone eras are off limits – this would violate the fundamental rule that cause comes before effect).", "Hawking is therefore reserved yet optimistic. \"Time travel was once considered scientific heresy, and I used to avoid talking about it for fear of being labelled a crank. These days I'm not so cautious.\""]}, "parkour": {"title": "Parkour", "sub": null, "letters": true, "paras": ["Parkour was developed in France in the 1980s by Raymond Belle and later by his son David Belle and his friends. It is based on military obstacle course training. The aim is to get from one point to another in any way you can, and express yourself while doing so. There are no limits on how you move in parkour: running, climbing, swinging, jumping, rolling and any other types of movement are possible. Parkour is more of a philosophy or set of ideas than a sport. It is a new way of seeing the environment and finding ways to go over, under, around, across or through obstacles.", "Parkour can be done alone or in groups. The most famous group of traceurs (people who do parkour) were the Yamakasi, a group made up of David Belle and his friends and cousins. They formed in the late 1980s and became popular during the 1990s and 2000s after appearing in several films, documentaries and advertisements. In the Yamakasi, there were strict rules. Members had to arrive on time and they were not allowed to complain or make excuses. They valued humility, so they were not allowed to show off or compete with other members.", "Parkour is a 'state of mind'. It is about getting over mental as well as physical barriers. It teaches people to touch the world and interact with it. It is about understanding what it means to be human. The organisation Parkour.net believes that parkour can never be a competitive sport. It is an art and is concerned with self-development. They say you can't ask, 'Who is the best at parkour?' Raymond Belle's advice is: 'If two roads open up before you, always take the more difficult one. Because you know you can travel the easy one.'", "There are some gyms and camps where you can practise and learn parkour. However, many traceurs do not like the idea of special places for their activity. The idea behind parkour is to adapt to any environment and be creative about how you get through it. It is about freedom and self-expression. The founder of parkour refused to teach people how to do moves or get over obstacles. The whole point is to learn your own technique and way of moving. So the idea of having classes or a limited space to practise in conflicts with the values of parkour.", "Parkour is also known as freerunning. Sometimes freerunning refers to another form of parkour developed by Sebastien Foucan, which has more focus on the individual. The term freerunning came out of the film Jump London (2003). It told the story of three French traceurs practising parkour around the famous monuments of London. Freerunning was the English translation of parkour. There are more similarities than differences between the two activities, and the Parkour UK website uses the two terms to refer to the same activity."]}, "urban": {"title": "Urban farming", "sub": null, "letters": false, "paras": ["In Paris, urban farmers are trying a soil-free approach to agriculture that uses less space and fewer resources. Could it help cities face the threats to our food supplies?", "On top of a striking new exhibition hall in southern Paris, the world's largest urban rooftop farm has started to bear fruit. Strawberries that are small, intensely flavoured and resplendently red sprout abundantly from large plastic tubes. Peer inside and you see the tubes are completely hollow, the roots of dozens of strawberry plants dangling down inside them. From identical vertical tubes nearby burst row upon row of lettuces; near those are aromatic herbs, such as basil, sage and peppermint. Opposite, in narrow, horizontal trays packed not with soil but with coconut fibre, grow cherry tomatoes, shiny aubergines and brightly coloured chards.", "Pascal Hardy, an engineer and sustainable development consultant, began experimenting with vertical farming and aeroponic growing towers- as the soil-free plastic tubes are known on his Paris apartment block roof five years ago. The urban rooftop space above the exhibition hall is somewhat bigger: 14,000 square metres and almost exactly the size of a couple of football pitches. Already, the team of young urban farmers who tend it have picked, in one day, 3,000 lettuces and 150 punnets of strawberries. When the remaining two thirds of the vast open area are in production, 20 staff will harvest up to 1,000 kg of perhaps 35 different varieties of fruit and vegetables, every day. 'We're not ever, obviously, going to feed the whole city this way,' cautions Hardy. 'In the urban environment you're working with very significant practical constraints, clearly, on what you can do and where. But if enough unused space can be developed like this, there's no reason why you shouldn't eventually target maybe between 5% and 10% of consumption.'", "Perhaps most significantly, however, this is a real-life showcase for the work of Hardy's flourishing urban agriculture consultancy, Agripolis, which is currently fielding enquiries from around the world to design, build and equip a new breed of soil-free inner-city farm. 'The method's advantages are many,' he says. 'First, I don't much like the fact that most of the fruit and vegetables we eat have been treated with something like 17 different pesticides, or that the intensive farming techniques that produced them are such huge generators of greenhouse gases. I don't much like the fact, either, that they've travelled an average of 2,000 refrigerated kilometres to my plate, that their quality is so poor, because the varieties are selected for their capacity to withstand such substantial journeys, or that 80% of the price I pay goes to wholesalers and transport companies, not the producers.'", "Produce grown using this soil-free method, on the other hand- which relies solely on a small quantity of water, enriched with organic nutrients, pumped around a closed circuit of pipes, towers and trays- is 'produced up here, and sold locally, just down there. It barely travels at all,' Hardy says. 'You can select crop varieties for their flavour, not their resistance to the transport and storage chain, and you can pick them when they're really at their best, and not before.' No soil is exhausted, and the water that gently showers the plants' roots every 12 minutes is recycled, so the method uses 90% less water than a classic intensive farm for the same yield.", "Urban farming is not, of course, a new phenomenon. Inner-city agriculture is booming from Shanghai to Detroit and Tokyo to Bangkok. Strawberries are being grown in disused shipping containers, mushrooms in underground carparks. Aeroponic farming, he says, is 'virtuous'. The equipment weighs little, can be installed on almost any flat surface and is cheap to buy: roughly €100 to €150 per square metre. It is cheap to run, too, consuming a tiny fraction of the electricity used by some techniques.", "Produce grown this way typically sells at prices that, while generally higher than those of classic intensive agriculture, are lower than soil-based organic growers. There are limits to what farmers can grow this way, of course, and much of the produce is suited to the summer months. 'Root vegetables we cannot do, at least not yet,' he says. 'Radishes are OK, but carrots, potatoes, that kind of thing- the roots are simply too long. Fruit trees are obviously not an option. And beans tend to take up a lot of space for not much return.' Nevertheless, urban farming of the kind being practised in Paris is one part of a bigger and fast-changing picture that is bringing food production closer to our lives."]}, "animals": {"title": "Can animals count?", "sub": null, "letters": false, "paras": ["Prime among basic numerical faculties is the ability to distinguish between a larger and a smaller number, says psychologist Elizabeth Brannon. Humans can do this with ease - providing the ratio is big enough - but do other animals share this ability? In one experiment, rhesus monkeys and university students examined two sets of geometrical objects that appeared briefly on a computer monitor. They had to decide which set contained more objects. Both groups performed successfully but, importantly, Brannon's team found that monkeys, like humans, make more errors when two sets of objects are close in number. 'The students' performance ends up looking just like a monkey's. It's practically identical,' she says.", "Humans and monkeys are mammals, in the animal family known as primates. These are not the only animals whose numerical capacities rely on ratio, however. The same seems to apply to some amphibians. Psychologist Claudia Uller's team tempted salamanders with two sets of fruit flies held in clear tubes. In a series of trials, the researchers noted which tube the salamanders scampered towards, reasoning that if they had a capacity to recognise number, they would head for the larger number. The salamanders successfully discriminated between tubes containing 8 and 16 flies respectively, but not between 3 and 4, 4 and 6, or 8 and 12. So it seems that for the salamanders to discriminate between two numbers, the larger must be at least twice as big as the smaller. However, they could differentiate between 2 and 3 flies just as well as between 1 and 2 flies, suggesting they recognise small numbers in a different way from larger numbers.", "Further support for this theory comes from studies of mosquitofish, which instinctively join the biggest shoal* they can. A team at the University of Padova found that while mosquitofish can tell the difference between a group containing 3 shoal-mates and a group containing 4, they did not show a preference between groups of 4 and 5. The team also found that mosquitofish can discriminate between numbers up to 16, but only if the ratio between the fish in each shoal was greater than 2:1. This indicates that the fish, like salamanders, possess both the approximate and precise number systems found in more intelligent animals such as infant humans and other primates.", "While these findings are highly suggestive, some critics argue that the animals might be relying on other factors to complete the tasks, without considering the number itself. 'Any study that's claiming an animal is capable of representing number should also be controlling for other factors,' says Brannon. Experiments have confirmed that primates can indeed perform numerical feats without extra clues, but what about the more primitive animals? To consider this possibility, the mosquitofish tests were repeated, this time using varying geometrical shapes in place of fish. The team arranged these shapes so that they had the same overall surface area and luminance even though they contained a different number of objects. Across hundreds of trials on 14 different fish, the team found they consistently discriminated 2 objects from 3. The team is now testing whether mosquitofish can also distinguish 3 geometric objects from 4.", "Even more primitive organisms may share this ability. Entomologist Jurgen Tautz sent a group of bees down a corridor, at the end of which lay two chambers – one which contained sugar water, which they like, while the other was empty. To test the bees' numeracy, the team marked each chamber with a different number of geometrical shapes – between 2 and 6. The bees quickly learned to match the number of shapes with the correct chamber. Like the salamanders and fish, there was a limit to the bees' mathematical prowess – they could differentiate up to 4 shapes, but failed with 5 or 6 shapes.", "These studies still do not show whether animals learn to count through training, or whether they are born with the skills already intact. If the latter is true, it would suggest there was a strong evolutionary advantage to a mathematical mind. Proof that this may be the case has emerged from an experiment testing the mathematical ability of three- and four-day-old chicks. Like mosquitofish, chicks prefer to be around as many of their siblings as possible, so they will always head towards a larger number of their kin. If chicks spend their first few days surrounded by certain objects, they become attached to these objects as if they were family. Researchers placed each chick in the middle of a platform and showed it two groups of balls of paper. Next, they hid the two piles behind screens, changed the quantities and revealed them to the chick. This forced the chick to perform simple computations to decide which side now contained the biggest number of its \"brothers\". Without any prior coaching, the chicks scuttled to the larger quantity at a rate well above chance. They were doing some very simple arithmetic, claim the researchers.", "Why these skills evolved is not hard to imagine, since it would help almost any animal forage for food. Animals on the prowl for sustenance must constantly decide which tree has the most fruit, or which patch of flowers will contain the most nectar. There are also other, less obvious, advantages of numeracy. In one compelling example, researchers in America found that female coots appear to calculate how many eggs they have laid – and add any in the nest laid by an intruder – before making any decisions about adding to them. Exactly how ancient these skills are is difficult to determine, however. Only by studying the numerical abilities of more and more creatures using standardised procedures can we hope to understand the basic preconditions for the evolution of number.", "* a group of fish"]}, "venice": {"title": "Venice Carnival", "sub": null, "letters": false, "paras": ["In January or February, Venice plays host to the most magical of carnivals. During the carnival, the city is filled with a mass of masked party-goers, posing and dancing, in an attempt to reinvent one of the great traditions of the city. Naturally, it is very crowded and hotels and restaurants are expensive, but it is a unique occasion and a great time to experience this beautiful city.", "The carnival was first held in Venice in the 11th century and lasted for over two months. Activities involved a series of formal parties in St Mark's Square and playing games for money. Regardless of social status, participants wore costumes and masks. Images of the time and occasion are still displayed throughout the city today. During the 18th century, however, this period of festivities came to an end, and the carnival did not return until 1979. Today, the carnival is extremely popular with people eager to dress up and parade around the city in their masks and costumes.", "The weekends are the busiest times at the carnival - the final weekend in particular. During the festivities, you can enjoy live music and take part in a large open-air festival. Costumes are also a major feature of the occasion and there is even a competition to judge the best one. The best ones are usually displayed at the centre of carnival festivities, in the breathtaking St Mark's Square. Numerous shops in Venice sell these costumes and masks in preparation for this great event.", "Perhaps the most attractive aspect of the Venice carnival, though, is the variety of masked balls and parties there are to attend. You do have to pay for these, however, and they can be quite costly. One of the most expensive parties is the Valentine's Grand Masquerade Ball, held on February 14th at the Palazzo Flangini."]}, "festivals": {"title": "Festivals and Traditions", "sub": null, "letters": false, "paras": ["## La Tomatina – Spain", "@- La Tomatina is the world's biggest food fight! It is always held on the last Wednesday of August every year in Bunol, a town near Valencia in Spain. Because it is such fun, it has become very popular and officials have had to limit the event to 20,000 people by issuing tickets. More than 100 metric tons of over-ripe tomatoes are thrown in the street during the event.", "## Boryeong Mud Festival – South Korea", "@- A cosmetics company in South Korea created a line of beauty products which featured mud from the Boryeong mud flats as a main ingredient. The company did not want to spend money on advertising, so the Boryeong Mud Festival was born. This allowed potential customers to feel the benefits of the special mud. The festival is home to mud slides, a mud prison, mud pools and mud skiing. You can also enjoy live music, acupuncture and a fireworks display.", "## Dia de los Muertos (Day of the Dead) – Mexico", "@- This Mexican holiday is celebrated throughout Mexico and around the world. The holiday focuses on remembering friends and family members who have died. It is particularly celebrated in Mexico, where the day is a bank holiday. Activities involved in the holiday include building private altars, cleaning the graves of loved ones and telling funny stories about dead relatives. Street parties, parades and festivals are also a common feature of the celebration.", "## Birthdays", "@- Birthdays take place once a year and celebrate the day you were born. Many people have a party on their birthday and socialise with family and friends. A birthday cake, with candles on the top, is often presented at this celebration, together with gifts and cards.", "## Harbin Ice and Snow Festival", "@- Another spectacular festival hosted by the Chinese is the Harbin Ice and Snow Festival. This is an annual winter festival which takes place in Harbin, Heilongjiang, China, and is now the largest ice and snow festival in the world. Initially, the majority of participants were Chinese, but it has since become an international festival and competition. The festival includes the world's biggest ice sculptures. Officially, the festival starts on 5th January and lasts for one month. However, exhibits often open earlier and finish later, weather permitting. The ice sculptures are displayed throughout the city.", "## Chinese Festivals", "@- If I could visit any country to be a part of their celebrations and festivals, it would be China. China is home to some of the most beautiful celebrations on the planet - celebrations filled with colour and meaning.", "## Dragon Boat Racing", "@- The Dragon Boat festival, also known as the Dwanwu Festival, has been celebrated in China for more than 2,000 years. The festival occurs on the fifth day of the fifth month of the Chinese lunar calendar. The celebration emerged after the Chinese scholar, Qu Yuan, threw himself into the Mi Lo river in protest against the government of the time. Qu Yuan was drowned and the people were unable to find the body, so to prevent the fish from eating him, the locals threw rice patties into the river. Ever since then, rice dumplings or zongzi are prepared and eaten during this festival season. Other activities include drinking a special drink called realgar and dragon-boat racing to the sound of beating drums.", "## Chinese New Year", "@- By far the biggest celebration in the Chinese calendar, however, is Chinese New Year. In fact, the lantern festival signifies the end of this long celebration, which begins on Chinese New Year's Eve. It is a holiday filled with dragons, fireworks, symbolic clothing and flowers. Chinese New Year is a time for families to get together. The New Year's Eve dinner is called Reunion Dinner, and is believed to be the most important meal of the year. Families of several generations sit together, enjoying food and socialising.", "## Lantern Riddles", "@- Also in January there is the Lantern Festival, or the Shangyuan Festival, which is celebrated on 15th January of the Chinese lunar calendar. This festival marks the return of spring and is regarded as a day for appreciating family and the bright full moon. There are several different activities involved in this celebration, appealing to all age groups. These include: watching fireworks or solving the riddles* featured on the lanterns.", "* riddle – a strange and difficult question that has a clever and often funny answer"]}, "victorian": {"title": "The greatest of Victorian engineers", "sub": null, "letters": true, "paras": ["In the hundred years up to 1860, the work of a small group of construction engineers carried forward the enormous social and economic change that we associate with the Industrial Revolution in Britain. The most important of these engineers was Isambard Kingdom Brunel, whose work in shipping, bridge-building and railway construction, to name just three fields, both challenged and motivated his colleagues. He was the driving force behind a number of hugely ambitious projects, some of which resulted in works which are still in use today.", "The son of an engineer, Brunel apprenticed with his father at an early age on the building of the Thames Tunnel. At the age of just twenty, he became the engineer in charge of the project. This impressive plan to bore under the Thames twice suffered major disasters when the river broke through into the tunnel. When the second breach occurred in 1827, Brunel was seriously injured during rescue operations and further work was halted.", "While recovering from his injuries, Brunel entered a design competition for a new bridge over the Avon Gorge near Clifton, Bristol. The original judge of the competition was Thomas Telford, a leading civil engineer of his day, who rejected all entries to the competition in favour of his own design. After considerable scandal, a second contest was held and Brunel's design was accepted. For reasons of funding, however, exacerbated by social unrest in Bristol, the project was abandoned in 1843 with only the towers completed. After Brunel's death, it was decided to begin work on it again, partly so that the bridge could form a fitting memorial to the great engineer. Work was finally completed in 1864. Today, the well known Clifton Suspension Bridge is a symbol of Bristol, just as the Opera House is of Sydney. Originally intended only for horse-drawn traffic, the bridge now bears over four million motor vehicles a year."]}, "sahel": {"title": "Deforestation and Desertification", "sub": null, "letters": true, "paras": ["The Sahel zone lies between the Sahara desert and the fertile savannahs of northern Nigeria and southern Sudan. The word sahel comes from Arabic and means marginal or transitional, and this is a good description of these semi-arid lands, which occupy much of the West African countries of Mali, Mauritania, Niger and Chad.", "Unfortunately, over the last century the Sahara desert has steadily crept southwards, eating into once productive Sahel lands. United Nations surveys show that over 70 per cent of the dry land in agricultural use in Africa has deteriorated over the last 30 years. Droughts have become more prolonged and more severe, the most recent lasting over 20 years in parts of the Sahel region. The same process of desertification is taking place across southern Africa as the Kalahari desert advances into Botswana and parts of South Africa.", "One of the major causes of this desert advance is poor agricultural land use, driven by the pressures of increasing population. Overgrazing - keeping too many farm animals on the land - means that grasses and other plants cannot recover, and scarce water supplies are exhausted. Overcultivation - trying to grow too many crops on poor land - results in the soil becoming even less fertile and drier, and beginning to break up. Soil erosion follows, and the land turns into desert.", "Another cause of desertification is loss of tree cover. Trees are cut down for use as fuel and to clear land for agricultural use. Tree roots help to bind the soil together, to conserve moisture and to provide a habitat for other plants and animals. When trees are cut down, the soil begins to dry and loosen, wind and rain erosion increase, other plant species die and eventually the fertile topsoil may be almost entirely lost, leaving only bare rock and dust.", "The effects of loss of topsoil and increased drought are irreversible. They are, however, preventable. Careful conservation of tree cover and sustainable agricultural land use have been shown to halt deterioration of soils and lessen the effects of shortage of rainfall. One project in Kita in south-west Mali funded by the UNDP has involved local communities in sustainable management of forest, while at the same time providing a viable agricultural economy based on tne production of soaps, beekeeping and marketing shea nuts. This may be a model for similar projects in other West African countries."]}, "stonehenge": {"title": "Stonehenge", "sub": "Construction", "letters": false, "paras": ["For centuries, historians and archaeologists have puzzled over the many mysteries of Stonehenge, a prehistoric monument that took an estimated 1,500 years to erect. Located on Salisbury Plain in southern England, it is comprised of roughly 100 massive upright stones placed in a circular layout.", "Archaeologists believe England's most iconic prehistoric ruin was built in several stages with the earliest constructed 5,000 or more years ago. First, Neolithic* Britons used primitive tools, which may have been fashioned out of deer antlers, to dig a massive circular ditch and bank, or henge. Deep pits dating back to that era and located within the circle may have once held a ring of timber posts, according to some scholars.", "Several hundred years later, it is thought, Stonehenge's builders hoisted an estimated 80 bluestones, 43 of which remain today, into standing positions and placed them in either a horseshoe or circular formation. These stones have been traced all the way to the Preseli Hills in Wales, some 300 kilometres from Stonehenge. How, then, did prehistoric builders without sophisticated tools or engineering haul these boulders, which weigh up to four tons, over such a great distance?", "According to one long-standing theory among archaeologists, Stonehenge's builders fashioned sledges and rollers out of tree trunks to lug the bluestones from the Preseli Hills. They then transferred the boulders onto rafts and floated them first along the Welsh coast and then up the River Avon toward Salisbury Plain; alternatively, they may have towed each stone with a fleet of vessels. More recent archaeological hypotheses have them transporting the bluestones with supersized wicker baskets on a combination of ball bearings and long grooved planks, hauled by oxen.", "As early as the 1970s, geologists have been adding their voices to the debate over how Stonehenge came into being. Challenging the classic image of industrious builders pushing, carting, rolling or hauling giant stones from faraway Wales, some scientists have suggested that it was glaciers, not humans, that carried the bluestones to Salisbury Plain. Most archaeologists have remained sceptical about this theory, however, wondering how the forces of nature could possibly have delivered the exact number of stones needed to complete the circle.", "The third phase of construction took place around 2000 BCE. At this point, sandstone slabs known as 'sarsens' were arranged into an outer crescent or ring; some were assembled into the iconic three-pieced structures called trilithons that stand tall in the centre of Stonehenge. Some 50 of these stones are now visible on the site, which may once have contained many more. Radiocarbon dating has revealed that work continued at Stonehenge until roughly 1600 BCE, with the bluestones in particular being repositioned multiple times.", "But who were the builders of Stonehenge? In the 17th century, archaeologist John Aubrey made the claim that Stonehenge was the work of druids, who had important religious, judicial and political roles in Celtic** society. This theory was widely popularized by the antiquarian William Stukeley, who had unearthed primitive graves at the site. Even today, people who identify as modern druids continue to gather at Stonehenge for the summer solstice. However, in the mid-20th century, radiocarbon dating demonstrated that Stonehenge stood more than 1,000 years before the Celts inhabited the region.", "Many modern historians and archaeologists now agree that several distinct tribes of people contributed to Stonehenge, each undertaking a different phase of its construction. Bones, tools and other artefacts found on the site seem to support this hypothesis. The first stage was achieved by Neolithic agrarians who were likely to have been indigenous to the British Isles. Later, it is believed, groups with advanced tools and a more communal way of life left their mark on the site. Some believe that they were immigrants from the European continent, while others maintain that they were probably native Britons, descended from the original builders.", "If the facts surrounding the architects and construction of Stonehenge remain shadowy at best, the purpose of the striking monument is even more of a mystery. While there is consensus among the majority of modern scholars that Stonehenge once served the function of burial ground, they have yet to determine what other purposes it had.", "In the 1960s, the astronomer Gerald Hawkins suggested that the cluster of megalithic stones operated as a form of calendar, with different points corresponding to astrological phenomena such as solstices, equinoxes and eclipses occurring at different times of the year. While his theory has received a considerable amount of attention over the decades, critics maintain that Stonehenge's builders probably lacked the knowledge necessary to predict such events or that England's dense cloud cover would have obscured their view of the skies.", "More recently, signs of illness and injury in the human remains unearthed at Stonehenge led a group of British archaeologists to speculate that it was considered a place of healing, perhaps because bluestones were thought to have curative powers.", "* Neolithic – The era, also known as the New Stone Age, which began around 12,000 years ago and ended around 3500 BCE ** Celtic – The Celts were people who lived in Britain and northwest Europe during the Iron Age from 600 BCE to 43 CE"]}, "perkin": {"title": "William Henry Perkin", "sub": "The man who invented synthetic dyes", "letters": false, "paras": ["William Henry Perkin was born on March 12, 1838, in London, England. As a boy, Perkin's curiosity prompted early interests in the arts, sciences, photography, and engineering. But it was a chance stumbling upon a run-down, yet functional, laboratory in his late grandfather's home that solidified the young man's enthusiasm for chemistry.", "As a student at the City of London School, Perkin became immersed in the study of chemistry. His talent and devotion to the subject were perceived by his teacher, Thomas Hall, who encouraged him to attend a series of lectures given by the eminent scientist Michael Faraday at the Royal Institution. Those speeches fired the young chemist's enthusiasm further, and he later went on to attend the Royal College of Chemistry, which he succeeded in entering in 1853, at the age of 15.", "At the time of Perkin's enrolment, the Royal College of Chemistry was headed by the noted German chemist August Wilhelm Hofmann. Perkin's scientific gifts soon caught Hofmann's attention and, within two years, he became Hofmann's youngest assistant. Not long after that, Perkin made the scientific breakthrough that would bring him both fame and fortune.", "At the time, quinine was the only viable medical treatment for malaria. The drug is derived from the bark of the cinchona tree, native to South America, and by 1856 demand for the drug was surpassing the available supply. Thus, when Hofmann made some passing comments about the desirability of a synthetic substitute for quinine, it was unsurprising that his star pupil was moved to take up the challenge.", "During his vacation in 1856, Perkin spent his time in the laboratory on the top floor of his family's house. He was attempting to manufacture quinine from aniline, an inexpensive and readily available coal tar waste product. Despite his best efforts, however, he did not end up with quinine. Instead, he produced a mysterious dark sludge. Luckily, Perkin's scientific training and nature prompted him to investigate the substance further. Incorporating potassium dichromate and alcohol into the aniline at various stages of the experimental process, he finally produced a deep purple solution. And, proving the truth of the famous scientist Louis Pasteur's words 'chance favours only the prepared mind', Perkin saw the potential of his unexpected find.", "Historically, textile dyes were made from such natural sources as plants and animal excretions. Some of these, such as the glandular mucus of snails, were difficult to obtain and outrageously expensive. Indeed, the purple colour extracted from a snail was once so costly that in society at the time only the rich could afford it. Further, natural dyes tended to be muddy in hue and fade quickly. It was against this backdrop that Perkin's discovery was made.", "Perkin quickly grasped that his purple solution could be used to colour fabric, thus making it the world's first synthetic dye. Realising the importance of this breakthrough, he lost no time in patenting it. But perhaps the most fascinating of all Perkin's reactions to his find was his nearly instant recognition that the new dye had commercial possibilities.", "Perkin originally named his dye Tyrian Purple, but it later became commonly known as mauve (from the French for the plant used to make the colour violet). He asked advice of Scottish dye works owner Robert Pullar, who assured him that manufacturing the dye would be well worth it if the colour remained fast (i.e. would not fade) and the cost was relatively low. So, over the fierce objections of his mentor Hofmann, he left college to give birth to the modern chemical industry.", "With the help of his father and brother, Perkin set up a factory not far from London. Utilising the cheap and plentiful coal tar that was an almost unlimited byproduct of London's gas street lighting, the dye works began producing the world's first synthetically dyed material in 1857. The company received a commercial boost from the Empress Eugénie of France, when she decided the new colour flattered her. Very soon, mauve was the necessary shade for all the fashionable ladies in that country. Not to be outdone, England's Queen Victoria also appeared in public wearing a mauve gown, thus making it all the rage in England as well. The dye was bold and fast, and the public clamoured for more. Perkin went back to the drawing board.", "Although Perkin's fame was achieved and fortune assured by his first discovery, the chemist continued his research. Among other dyes he developed and introduced were aniline red (1859) and aniline black (1863) and, in the late 1860s, Perkin's green. It is important to note that Perkin's synthetic dye discoveries had outcomes far beyond the merely decorative. The dyes also became vital to medical research in many ways. For instance, they were used to stain previously invisible microbes and bacteria, allowing researchers to identify such bacilli as tuberculosis, cholera, and anthrax. Artificial dyes continue to play a crucial role today. And, in what would have been particularly pleasing to Perkin, their current use is in the search for a vaccine against malaria."]}, "idealcity": {"title": "An ideal city", "sub": "Leonardo da Vinci's ideal city was centuries ahead of its time", "letters": false, "paras": ["The word 'genius' is universally associated with the name of Leonardo da Vinci. A true Renaissance man, he embodied scientific spirit, artistic talent and humanist sensibilities. Five hundred years have passed since Leonardo died in his home at Chateau du Clos Luce, outside Tours, France. Yet far from fading into insignificance, his thinking has carried down the centuries and still surprises today.", "The Renaissance marked the transition from the 15th century to modernity and took place after the spread of the plague in the 14th century, which caused a global crisis resulting in some 200 million deaths across Europe and Asia. Today, the world is on the cusp of a climate crisis, which is predicted to cause widespread displacement, extinctions and death, if left unaddressed. Then, as now, radical solutions were called for to revolutionise the way people lived and safeguard humanity against catastrophe.", "Around 1486 – after a pestilence that killed half the population in Milan, Italy - Leonardo turned his thoughts to urban planning problems. Following a typical Renaissance trend, he began to work on an 'ideal city' project, which - due to its excessive costs – would remain unfulfilled. Yet given that unsustainable urban models are a key cause of global climate change today, it's only natural to wonder how Leonardo might have changed the shape of modern cities.", "Although the Renaissance is renowned as an era of incredible progress in art and architecture, it is rarely noted that the 15th century also marked the birth of urbanism as a true academic discipline. The rigour and method behind the conscious conception of a city had been largely missing in Western thought until the moment when prominent Renaissance men pushed forward large-scale urban projects in Italy, such as the reconfiguration of the town of Pienza and the expansion of the city of Ferrara. These works surely inspired Leonardo's decision to rethink the design of medieval cities, with their winding and overcrowded streets and with houses piled against one another.", "It is not easy to identify a coordinated vision of Leonardo's ideal city because of his disordered way of working with notes and sketches. But from the largest collection of Leonardo's papers ever assembled, a series of innovative thoughts can be reconstructed regarding the foundation of a new city along the Ticino River, which runs from Switzerland into Italy and is 248 kilometres long. He designed the city for the easy transport of goods and clean urban spaces, and he wanted a comfortable and spacious city, with well-ordered streets and architecture. He recommended 'high, strong walls', with 'towers and battlements of all necessary and pleasant beauty'.", "His plans for a modern and 'rational' city were consistent with Renaissance ideals. But, in keeping with his personality, Leonardo included several innovations in his urban design. Leonardo wanted the city to be built on several levels, linked with vertical outdoor staircases. This design can be seen in some of today's high-rise buildings but was unconventional at the time. Indeed, this idea of taking full advantage of the interior spaces wasn't implemented until the 1920s and 1930s, with the birth of the Modernist movement.", "While in the upper layers of the city, people could walk undisturbed between elegant palaces and streets, the lower layer was the place for services, trade, transport and industry. But the true originality of Leonardo's vision was its fusion of architecture and engineering. Leonardo designed extensive hydraulic plants to create artificial canals throughout the city. The canals, regulated by clocks and basins, were supposed to make it easier for boats to navigate inland. Leonardo also thought that the width of the streets ought to match the average height of the adjacent houses: a rule still followed in many contemporary cities across Italy, to allow access to sun and reduce the risk of damage from earthquakes.", "Although some of these features existed in Roman cities, before Leonardo's drawings there had never been a multi-level, compact modern city which was thoroughly technically conceived. Indeed, it wasn't until the 19th century that some of his ideas were applied. For example, the subdivision of the city by function- with services and infrastructures located in the lower levels and wide and well-ventilated boulevards and walkways above for residents is an idea that can be found in Georges-Eugene Haussmann's renovation of Paris under Emperor Napoleon III between 1853 and 1870.", "Today, Leonardo's ideas are not simply valid, they actually suggest a way forward for urban planning. Many scholars think that the compact city, built upwards instead of outwards, integrated with nature (especially water systems), with efficient transport infrastructure, could help modern cities become more efficient and sustainable. This is yet another reason why Leonardo was aligned so closely with modern urban planning and centuries ahead of his time."]}}};</script><script>/* IELTS Reading Lab – shared core: data access, marking, rendering of question papers and explanations */

const NUMW = new Set('one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty thirty forty fifty sixty seventy eighty ninety hundred thousand million billion twenty-one twenty-two twenty-five twenty-seven'.split(' '));

/* ---------- small helpers ---------- */

/* ---------- rendering: passage ---------- */
function passageItems(P) {

/* ---------- rendering: question paper ----------

function fillPh(text, g, opts) {

function renderGroup(t, g, opts) {

/* ---------- rendering: explanation card ---------- */
function renderExplanation(t, b, extra) {
