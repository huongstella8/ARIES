<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Reading Lab – QT4</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Lexend:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface2:#f0eee8; --ink:#1d1f24; --ink2:#4a4f5a; --ink3:#7a808c; --line:#dedad0;
  --accent:#b4235a; --accent-soft:#fbe7ef;
  --found:#1f8a52; --found-soft:#e3f4ea; --core:#2463b8; --core-soft:#e4eefb; --ext:#7340b8; --ext-soft:#efe7fa; --place:#c2332b; --place-soft:#fbe8e6;
  --ok:#1f8a52; --ok-soft:#e3f4ea; --bad:#c2332b; --bad-soft:#fbe8e6; --warn:#b26b00; --warn-soft:#fff3dc;
  --hl-y:#fff07a; --hl-g:#b8f0c4; --hl-b:#bfe0ff; --hl-p:#ffc9e1;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171b; --surface:#1e2127; --surface2:#262a31; --ink:#eceef2; --ink2:#c0c5cf; --ink3:#8d94a1; --line:#353a44;
  --accent:#f06a9b; --accent-soft:#3b2230;
  --found:#4cc483; --found-soft:#1c3327; --core:#6aa5f5; --core-soft:#1c2a40; --ext:#b08cf0; --ext-soft:#2c2340; --place:#f0776f; --place-soft:#3d2321;
  --ok:#4cc483; --ok-soft:#1c3327; --bad:#f0776f; --bad-soft:#3d2321; --warn:#f2b54a; --warn-soft:#3a2f17;
  --hl-y:#8a7a12; --hl-g:#2f6b3d; --hl-b:#2b5480; --hl-p:#7a3557;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#15171b; --surface:#1e2127; --surface2:#262a31; --ink:#eceef2; --ink2:#c0c5cf; --ink3:#8d94a1; --line:#353a44;
  --accent:#f06a9b; --accent-soft:#3b2230;
  --found:#4cc483; --found-soft:#1c3327; --core:#6aa5f5; --core-soft:#1c2a40; --ext:#b08cf0; --ext-soft:#2c2340; --place:#f0776f; --place-soft:#3d2321;
  --ok:#4cc483; --ok-soft:#1c3327; --bad:#f0776f; --bad-soft:#3d2321; --warn:#f2b54a; --warn-soft:#3a2f17;
  --hl-y:#8a7a12; --hl-g:#2f6b3d; --hl-b:#2b5480; --hl-p:#7a3557;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 'Source Sans 3',system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Lexend',system-ui,sans-serif;line-height:1.25;margin:0 0 .5em}
h1{font-size:1.45rem;font-weight:600}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600}
.mono,code,.ans,.key{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.eyebrow{font:600 .7rem/1 'Lexend',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink3)}
.small{font-size:.85rem}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top-row{display:flex;gap:14px 24px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 0 12px}
.brand{min-width:0}
.brand .eyebrow{display:block;margin-bottom:8px}
.brand h1{margin:0 0 8px;font-size:1.3rem;line-height:1.2}
.chip{display:inline-block;font:500 .74rem/1 'Lexend',sans-serif;padding:5px 9px;border-radius:99px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.who{display:grid;grid-template-columns:minmax(150px,200px) minmax(170px,230px);gap:6px 8px;align-items:center;max-width:100%}
.who input{width:100%;min-width:0}
.who .status{grid-column:1 / -1;font-size:.78rem;color:var(--ink3);line-height:1.3}
input[type=text],input[type=email],input[type=password],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:2px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;color:var(--ink2);font:500 .9rem 'Lexend',sans-serif;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
main.wrap{padding:36px 16px 64px}
main > .eyebrow{display:block;margin-bottom:8px}
main > h1{margin-bottom:12px}
main > h1 + p{margin:0 0 20px;line-height:1.6}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:600}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.kpi{padding:12px 14px}
.kpi .v{font:600 1.45rem/1.15 'Lexend',sans-serif;margin-bottom:4px}
.kpi .l{font-size:.8rem;color:var(--ink3)}
.lvl-foundation{--lc:var(--found);--ls:var(--found-soft)}
.lvl-core{--lc:var(--core);--ls:var(--core-soft)}
.lvl-extension{--lc:var(--ext);--ls:var(--ext-soft)}
.lvl-placement{--lc:var(--place);--ls:var(--place-soft)}
.lvltag{display:inline-block;font:600 .68rem/1 'Lexend',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:var(--ls);color:var(--lc)}
.modetag{display:inline-block;font:600 .68rem/1 'Lexend',sans-serif;padding:4px 7px;border-radius:6px;border:1px solid var(--line);color:var(--ink2)}
.step-h{display:flex;gap:10px;align-items:center;margin:30px 0 12px}
.step-h .n{font:600 .75rem 'Lexend',sans-serif;background:var(--ink);color:var(--surface);border-radius:99px;padding:3px 9px}
.levelcard{border-top:4px solid var(--lc);cursor:pointer}
.levelcard.sel{outline:2px solid var(--lc);background:var(--ls)}
.levelcard h3{color:var(--lc)}
.testcard{display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--lc)}
.testcard .code{font:600 .8rem 'JetBrains Mono',monospace;color:var(--lc)}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.dots i.on{background:var(--lc)}
.foot{margin-top:40px;text-align:center;font-size:.68rem;opacity:.55;line-height:1.5}

/* test view */
.testbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.stepper{display:flex;gap:4px;flex-wrap:wrap}
.stepper span{font:500 .78rem 'Lexend',sans-serif;padding:5px 10px;border-radius:99px;background:var(--surface2);color:var(--ink3)}
.stepper span.on{background:var(--ink);color:var(--surface)}
.stepper span.done{background:var(--ok-soft);color:var(--ok)}
.timer{font:600 1.05rem 'JetBrains Mono',monospace;padding:5px 12px;border-radius:9px;background:var(--surface2)}
.timer.warn{background:var(--warn-soft);color:var(--warn)}
.timer.crit{background:var(--bad-soft);color:var(--bad)}
.banner{border-radius:var(--r);padding:12px 16px;margin-bottom:12px;border:1px solid var(--line);background:var(--surface)}
.banner.info{background:var(--core-soft);border-color:transparent}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.ok{background:var(--ok-soft);border-color:transparent}
.banner.bad{background:var(--bad-soft);border-color:transparent}
.banner.nudge{animation:nudge .4s}
@keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-height:calc(100vh - 210px);overflow:auto;position:sticky;top:120px}
@media (max-width:900px){.pane{max-height:none;position:static}}
.pane.locked > .inner{filter:blur(6px);pointer-events:none;user-select:none}
.passage h2{font-size:1.15rem}
.passage p{margin:0 0 .85em}
.passage .pl{font:600 .78rem 'Lexend',sans-serif;color:var(--accent);margin-right:6px}
.passage .intro{font-style:italic}
.passage .flash{animation:flash 2.2s}
@keyframes flash{0%,60%{background:var(--warn-soft);box-shadow:0 0 0 4px var(--warn-soft)}100%{background:transparent}}
mark.hl{color:inherit;border-radius:2px;padding:0 1px}
mark.hl-y{background:var(--hl-y)} mark.hl-g{background:var(--hl-g)} mark.hl-b{background:var(--hl-b)} mark.hl-p{background:var(--hl-p)}
mark.ev{background:transparent;box-shadow:inset 0 -3px 0 var(--accent)}
.hltools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:-16px;background:var(--surface);padding:6px 0 10px;z-index:2;border-bottom:1px dashed var(--line);margin-bottom:12px}
.sw{width:26px;height:26px;border-radius:7px;border:2px solid transparent}
.sw.on{border-color:var(--ink)}
.sw.y{background:var(--hl-y)} .sw.g{background:var(--hl-g)} .sw.b{background:var(--hl-b)} .sw.p{background:var(--hl-p)}
.sw.er{background:var(--surface2);font-size:.8rem}
.qgroup{margin-bottom:22px}
.qgroup .gh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.qgroup .ins{margin:2px 0;color:var(--ink2)}
.qgroup .lim{font-weight:700;margin:2px 0 10px}
.qgroup .lim b{color:var(--accent)}
.q{margin:0 0 10px;padding-left:0}
.qn{display:inline-block;min-width:24px;font:600 .82rem 'JetBrains Mono',monospace;color:var(--ink3)}
input.ans{width:170px;padding:3px 8px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);font-size:.92rem}
input.ans::placeholder{color:var(--ink3);font-size:.78rem}
input.ans.ro{background:repeating-linear-gradient(45deg,var(--surface2) 0 6px,var(--surface) 6px 12px);cursor:not-allowed}
input.ans.ok,.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
input.ans.bad,.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
input.ans.lock{pointer-events:none}
.notes{border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--surface)}
.notes .t1{text-align:center;font:600 1.02rem 'Lexend',sans-serif;margin-bottom:8px}
.notes .t2{font-weight:700;margin:8px 0 4px}
.notes .t3{font-style:italic;margin:6px 0 2px}
.notes .b1{margin:3px 0 3px 4px}.notes .b1:before{content:'•  '}
.notes .b2{margin:3px 0 3px 26px}.notes .b2:before{content:'–  '}
.notes .b3{margin:3px 0 3px 50px}.notes .b3:before{content:'◦  '}
table.qt{border-collapse:collapse;width:100%;font-size:.93rem}
table.qt caption{font:600 1rem 'Lexend',sans-serif;margin-bottom:6px}
table.qt th,table.qt td{border:1px solid var(--line);padding:7px 8px;vertical-align:top;text-align:left}
table.qt th{background:var(--surface2);font-family:'Lexend',sans-serif;font-weight:600;font-size:.86rem}
.tablewrap{overflow-x:auto}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0}
.flow .cap{text-align:center;font:600 1rem 'Lexend',sans-serif;margin-bottom:6px}
.flow .fb{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}
.flow .ar{text-align:center;color:var(--ink3);line-height:1.2;font-size:1.1rem}
.wordbox{display:flex;gap:6px;flex-wrap:wrap;border:1px dashed var(--ink3);border-radius:10px;padding:8px 10px;margin:6px 0 10px}
.wordbox span{font-family:'JetBrains Mono',monospace;font-size:.88rem;padding:2px 8px;border-radius:6px;background:var(--surface2)}
.opts{display:inline-flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 10px;font-size:.85rem;font-weight:600}
.opt.on{border-color:var(--ink);background:var(--surface2)}
.hint{font-size:.85rem;background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:6px 10px;margin:4px 0}
.mark-ok{color:var(--ok);font-weight:700}.mark-bad{color:var(--bad);font-weight:700}
.panelnote{font-size:.84rem;color:var(--ink3)}

/* review */
.exp{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--surface)}
.exp.wrong{border-left-color:var(--bad)}
.exp .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.exp .key{font-weight:700;color:var(--ok)}
.exp blockquote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:0 8px 8px 0;font-style:italic}
.pp{width:100%;border-collapse:collapse;font-size:.88rem;margin:6px 0}
.pp th,.pp td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.pp th{background:var(--surface2);font-weight:600}
.lbl{font:600 .72rem 'Lexend',sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-right:6px}
.cause{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.barrow{display:grid;grid-template-columns:170px 1fr 48px;gap:8px;align-items:center;font-size:.88rem;margin:5px 0}
table.data{width:100%;border-collapse:collapse;font-size:.88rem}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.data th{font:600 .78rem 'Lexend',sans-serif;color:var(--ink2);background:var(--surface2)}
.lock{color:var(--ink3);font-size:.85rem}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:99;font-size:.9rem;box-shadow:var(--shadow);max-width:92vw}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:20px;max-width:520px;width:100%;box-shadow:var(--shadow)}
.quiz .qq{margin:10px 0}
details summary{cursor:pointer;font-weight:600}
pre.code{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:.78rem;max-height:340px}

@media print{
  header.top,nav.tabs,.noprint,.foot{display:none!important}
  body{background:#fff;color:#000}
  .card{box-shadow:none;break-inside:avoid}
  .pane{max-height:none;overflow:visible;position:static}
}
@media (max-width:600px){
  .who{grid-template-columns:1fr 1fr;width:100%}
  input.ans{width:130px}
  .barrow{grid-template-columns:110px 1fr 40px}
}
.opts.mc{display:flex;flex-direction:column;align-items:stretch;gap:5px;margin-top:6px}
.opt.mcopt{display:flex;gap:10px;align-items:flex-start;text-align:left;font-weight:400;font-size:.92rem;padding:6px 10px;line-height:1.35}
.opt.mcopt b{flex:0 0 auto;font-family:'JetBrains Mono',monospace}
.q.mcq{margin-bottom:14px}
ol.mlist{list-style:none;padding:0;margin:6px 0}ol.mlist li{margin:3px 0;line-height:1.4}ol.mlist li b{display:inline-block;width:1.4em}
.ow ul{margin:4px 0 4px 18px;padding:0}.ow li{margin:2px 0}
@media (max-width:640px){table.data{display:block;overflow-x:auto;max-width:100%}}
.qn{margin-right:8px}

.hlist{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0 10px;background:var(--surface2)}
.hlist .hlt{font:600 .95rem Lexend,sans-serif;margin-bottom:4px}
.hlist ol{list-style:none;padding:0;margin:0}.hlist li{margin:3px 0;line-height:1.4}.hlist li b{display:inline-block;min-width:2.4em;font-family:'JetBrains Mono',monospace}
.q.hdq{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.q.hdq .hpara{font-weight:600;min-width:6.5em}
.opts.hd{display:inline-flex;flex-wrap:wrap;gap:4px}
.opt.hopt{min-width:2.6em;padding:4px 6px;font-family:'JetBrains Mono',monospace;font-size:.85rem}
.opt.hopt.used{opacity:.4}
.hsel{flex-basis:100%;font-size:.88rem;padding-left:2.2em}
</style></head>

<h1>IELTS Reading Lab – Question Type 4</h1><span class="chip">Matching headings · main idea of a paragraph or section</span></div><div class="who"><input type="text" id="stName" placeholder="Full name" autocomplete="name"><input type="email" id="stEmail" placeholder="Email" autocomplete="email"><span class="status" id="saveStatus">Enter your name and email to start a test</span></div></div>
<nav class="tabs"><button data-tab="home">Study paths</button><button data-tab="how">How it works</button><button data-tab="log">Error logbook</button><button data-tab="vocab">Vocabulary</button><button data-tab="report">My report</button></nav></div></header>

<script>window.__LAB__={"name": "IELTS Reading Lab \u2013 Question Type 4", "code": "QT4", "chip": "Matching headings \u00b7 main idea of a paragraph or section", "causes": [["detail", "Chose a heading that matches only one detail", "Ask: does the heading cover the WHOLE paragraph (most of its sentences)? A heading that fits one sentence is a trap."], ["wordmatch", "Chose a heading because it repeats a word from the paragraph", "Matching words are not evidence. Look for the paraphrase of the heading\u2019s key idea (its angle)."], ["angle", "Right topic, wrong angle (debate / contrast / reasons / future \u2026)", "Split the heading into TOPIC + ANGLE. Both must match: \u201cthe debate about the origins\u201d needs a debate AND origins."], ["turn", "Missed the turn (However / But / Yet / Even so)", "The main idea often comes after the turn. Read the sentence after However before you decide."], ["numbertime", "Missed a number or time word (one / two / a range; past / future)", "Circle number and time words in the heading: \u201ctwo individuals\u201d, \u201cone film\u201d, \u201cfuture trends\u201d. Check them in the text."], ["section", "Read only one paragraph of a longer section", "When a section has two or three paragraphs, summarise all of them before choosing."], ["twice", "Used the same heading twice / used the example heading", "Each heading can be used once only. Cross out the example heading and every heading you use."], ["paraphrase", "Did not recognise the synonym", "Headings use synonyms: controversy = arguments, impact = effect, origins = when it started."], ["vocab", "Did not know a key word", "Guess from context, then add the word to your vocabulary list with a synonym."], ["time", "Ran out of time", "About 1\u20131.5 minutes per paragraph. Do the easiest paragraphs first, then the rest."], ["careless", "Careless / clicked the wrong number", "Check i / ii / iii / iv carefully before you move on."]], "causesShort": ["only a detail", "matching-word trap", "right topic, wrong angle", "missed the turn", "number / time word", "read only part of a section", "used a heading twice", "missed the synonym", "unknown word", "time", "careless"], "choiceLabel": "Option", "place": {"n": 7, "time": 12, "cut1": 3, "cut2": 5, "label": "One IELTS headings task (7 paragraphs, 12 minutes)"}, "txt": {"homeH1": "Matching headings", "homeIntro": "Learn one routine for every paragraph: <b>underline TOPIC + ANGLE in the headings \u2192 read the paragraph (first line, last line, the sentence after However) \u2192 write a 3\u20135 word summary \u2192 match the angle \u2192 cross out the heading</b>. Work through your path.", "sources": "Cambridge IELTS 8, 11, 12 and 16 Academic; IELTS Trainer 2 Academic; Mindset for IELTS Level 2 (Cambridge University Press).", "howCards": "<div class=\"card\"><h3>The 5-step routine</h3><ol>\n    <li><b>Headings first.</b> Underline the TOPIC (what it is about) and the ANGLE (what it says about it: debate, contrast, reasons, impact, a single\u2026, future\u2026).</li>\n    <li><b>Read the paragraph for its main idea.</b> First sentence, last sentence and the sentence after <i>However / But / Yet</i>. Ignore unknown words.</li>\n    <li><b>Write a summary</b> of 3\u20135 words in the margin.</li>\n    <li><b>Match the angle,</b> not the words. The heading must fit the whole paragraph or section.</li>\n    <li><b>Cross out</b> the heading (and the example). Do the easiest paragraphs first; there are always extra headings.</li></ol></div>\n  <div class=\"card\"><h3>Heading = TOPIC + ANGLE</h3><ul>\n    <li><b>The debate about</b> the origins of documentaries \u2192 people disagree about <i>when</i> they started.</li>\n    <li><b>A contrast between two</b> historic approaches \u2192 two ways of making films, compared.</li>\n    <li><b>Reasons why</b> we trust humans more than AI \u2192 explanations, not just the fact.</li>\n    <li><b>A single certainty</b> among less definite facts \u2192 one thing is sure; other things are argued about.</li>\n    <li>Same topic, different angle = a different heading. This is the most common trap.</li></ul></div>", "marking": "<div class=\"card\"><h3>Marking</h3><ul>\n    <li>Click the number of the heading (i, ii, iii \u2026) for each paragraph. The heading text appears under your choice.</li>\n    <li>Each heading can be used once only. Headings you have already used look faded. Using a heading twice is marked \u201cRepeated answer\u201d.</li>\n    <li>In the paper test, write only the Roman number (i, ii, iii \u2026).</li></ul></div>", "submitTip": "Check that every paragraph has a heading and that no heading is used twice.", "hintRule": "(where to look + what to check). After 4 tries, a second hint shows the angle word to focus on.", "markingShort": "Roman numbers only (i\u2013x). Each heading once.", "toolkit": "<div class=\"card\"><h3>Toolkit: seven traps in headings tasks</h3><table class=\"data\">\n  <tr><th>Trap</th><th>Example from your exercises</th><th>How to check</th></tr>\n  <tr><td>Matching words</td><td>\u201cmoai\u201d is in almost every paragraph of Easter Island</td><td>Look for the paraphrase of the angle, not the same word</td></tr>\n  <tr><td>Only a detail</td><td>\u201cTaking photographs\u201d (Travel tips A); \u201cThe role of prisoners and soldiers\u201d (Trans-Siberian B)</td><td>Does it cover most sentences?</td></tr>\n  <tr><td>Right topic, wrong angle</td><td>Documentaries: B = debate about origins, C = contrast of approaches</td><td>Topic AND angle must match</td></tr>\n  <tr><td>Number words</td><td>\u201ctwo individual documentary makers\u201d vs two groups; \u201cOne film\u201d</td><td>Count in the text</td></tr>\n  <tr><td>The turn</td><td>\u201cHowever\u201d in Documentaries B only changes the date</td><td>Read the sentence after the turn</td></tr>\n  <tr><td>Time words</td><td>\u201cSome probable future trends\u201d \u2013 no paragraph is about the future</td><td>Past / present / future?</td></tr>\n  <tr><td>Long sections</td><td>Rising Sum and AI: sections with two or three paragraphs</td><td>Summarise the whole section</td></tr></table></div>", "lesson": "<div class=\"card\"><h3>In-class lesson (90 minutes)</h3><ol class=\"small\">\n   <li><b>0\u201310\u2032 Lead-in.</b> Show one paragraph and three headings (Travel tips A). Which one covers the whole paragraph?</li>\n   <li><b>10\u201330\u2032 Model with F1</b> (Mindset Travel tips): best heading for B and C, then write 3\u20135 word summaries and match all headings.</li>\n   <li><b>30\u201340\u2032 TOPIC + ANGLE.</b> Students split the Documentaries headings (C1) into topic and angle before reading.</li>\n   <li><b>40\u201355\u2032 Timed exam task C1</b> (IELTS Trainer 2, 6 paragraphs, 10 min) under exam rules.</li>\n   <li><b>55\u201380\u2032 Error analysis.</b> Use the book key notes: ii (two individuals), vi (future trends), D vs F (creating vs promoting). Students tag their causes.</li>\n   <li><b>80\u201390\u2032 Homework set-up.</b> Each student continues their path at home (Homework cards).</li></ol></div>", "homework": "<div class=\"card\"><h3>Homework by path</h3><ul class=\"small\">\n   <li><b>Foundation:</b> F2, F3 (+ finish F1 if not done in class).</li>\n   <li><b>Core:</b> C2, C3, C4 (Cambridge Passage 1\u20132).</li>\n   <li><b>Extension:</b> E1, E2, E3 (Passage 3: sections, abstract headings, literary text).</li>\n   <li>Everyone: tag error causes, reach 70% to unlock, do the vocabulary revision, send the PDF report.</li></ul></div>", "printRoutine": "<li><b>The 5-step routine:</b> underline TOPIC + ANGLE in the headings \u2192 read the paragraph (first line, last line, after However) \u2192 write a 3\u20135 word summary \u2192 match the angle \u2192 cross out the heading.</li>\n    <li><b>Answers:</b> write only the Roman number (i, ii, iii \u2026). Each heading once; cross out the example.</li>"}, "keyStr": "hsrl-qt4-head-2026"};window.__CFG__={"token": "hsp-reading-l3", "lesson": "L3", "def 7L5RGlsNGwoUCkkSUUYWCR8eTM/x5xROCRcTDUhBEF9TCR0bAkpfVhgNShETBV0QChJYHR8eQA1TEUwPUkUPEUFeHBIUBwRQVg0KVl0PUkVDN1hfVUBfCR1SBV5RFVpCHA0EFg1eUVxRHRIVCQFRFkFZSBEJAQ1BQFdVARIeTF0eHVpZSAwSRFlaVRJbDRIcBUMWEkFBSIfh+ENdRFpfBhSQ7LBfVklQ"}], "sets": {}, "kindLabel": "Matching headings"}], "total": 6, "kinds": ["headings"]}], "passages": {"tortoise": {"title": "Flying tortoises", "sub": "An airborne reintroduction programme has helped conservationists take significant steps to protect the endangered Galápagos tortoise.", "letters": true, "paras": ["@A Forests of spiny cacti cover much of the uneven lava plains that separate the interior of the Galápagos island of Isabela from the Pacific Ocean. With its five distinct volcanoes, the island resembles a lunar landscape. Only the thick vegetation at the skirt of the often cloud-covered peak of Sierra Negra offers respite from the barren terrain below. This inhospitable environment is home to the giant Galápagos tortoise. Some time after the Galápagos's birth, around five million years ago, the islands were colonised by one or more tortoises from mainland South America. As these ancestral tortoises settled on the individual islands, the different populations adapted to their unique environments, giving rise to at least 14 different subspecies. Island life agreed with them. In the absence of significant predators, they grew to become the largest and longest-living tortoises on the planet, weighing more than 400 kilograms, occasionally exceeding 1.8 metres in length and living for more than a century.", "@B Before human arrival, the archipelago's tortoises numbered in the hundreds of thousands. From the 17th century onwards, pirates took a few on board for food, but the arrival of whaling ships in the 1790s saw this exploitation grow exponentially. Relatively immobile and capable of surviving for months without food or water, the tortoises were taken on board these ships to act as food supplies during long ocean passages. Sometimes, their bodies were processed into high-grade oil. In total, an estimated 200,000 animals were taken from the archipelago before the 20th century. This historical exploitation was then exacerbated when settlers came to the islands. They hunted the tortoises and destroyed their habitat to clear land for agriculture. They also introduced alien species – ranging from cattle, pigs, goats, rats and dogs to plants and ants – that either prey on the eggs and young tortoises or damage or destroy their habitat.", "@C Today, only 11 of the original subspecies survive and of these, several are highly endangered. In 1989, work began on a tortoise-breeding centre just outside the town of Puerto Villamil on Isabela, dedicated to protecting the island's tortoise populations. The centre's captive-breeding programme proved to be extremely successful, and it eventually had to deal with an overpopulation problem.", "@D The problem was also a pressing one. Captive-bred tortoises can't be reintroduced into the wild until they're at least five years old and weigh at least 4.5 kilograms, at which point their size and weight – and their hardened shells – are sufficient to protect them from predators. But if people wait too long after that point, the tortoises eventually become too large to transport.", "@E For years, repatriation efforts were carried out in small numbers, with the tortoises carried on the backs of men over weeks of long, treacherous hikes along narrow trails. But in November 2010, the environmentalist and Galápagos National Park liaison officer Godfrey Merlin, a visiting private motor yacht captain and a helicopter pilot gathered around a table in a small café in Puerto Ayora on the island of Santa Cruz to work out more ambitious reintroduction. The aim was to use a helicopter to move 300 of the breeding centre's tortoises to various locations close to Sierra Negra.", "@F This unprecedented effort was made possible by the owners of the 67-metre yacht White Cloud, who provided the Galápagos National Park with free use of their helicopter and its experienced pilot, as well as the logistical support of the yacht, its captain and crew. Originally an air ambulance, the yacht's helicopter has a rear double door and a large internal space that's well suited for cargo, so a custom crate was designed to hold up to 33 tortoises with a total weight of about 150 kilograms. This weight, together with that of the fuel, pilot and four crew, approached the helicopter's maximum payload, and there were times when it was clearly right on the edge of the helicopter's capabilities. During a period of three days, a group of volunteers from the breeding centre worked around the clock to prepare the young tortoises for transport. Meanwhile, park wardens, dropped off ahead of time in remote locations, cleared landing sites within the thick brush, cacti and lava rocks.", "@G Upon their release, the juvenile tortoises quickly spread out over their ancestral territory, investigating their new surroundings and feeding on the vegetation. Eventually, one tiny tortoise came across a fully grown giant who had been lumbering around the island for around a hundred years. The two stood side by side, a powerful symbol of the regeneration of an ancient species."]}, "travel": {"title": "Travel tips", "sub": null, "letters": true, "paras": ["@A In order to see all the best attractions and avoid the queues, try to get up early. Early morning is also a good time to take photographs and meet the locals.", "@B It is also a good idea to memorise a few useful phrases, such as 'please' and 'thank you'. You should not be worried about making mistakes, but try practising the language as much as possible. Even if your pronunciation is not perfect, locals respond better to people who make an effort.", "@C Travellers often face delays and cancellations, so it is important that you do not allow them to ruin your trip. Also, try not to get frustrated when you are unable to communicate with a native. Although you may be tempted to shout in your mother tongue in order to be understood, it is more polite and often more effective to simply use body language. You will have a much better trip if you are prepared for plans to change and you are able to see the funny side if things go wrong.", "@D Before starting your trip, find out about the people and customs of the place you are visiting. This will help you to integrate more easily and will ensure you do not do anything to offend locals. The more you know about your chosen destination, the more chance you have of gaining the most from your experience.", "@E Do not just socialise with other travellers, but try to start conversations with locals too. Locals are often the key to knowing the best and cheapest places to visit and eat. Furthermore, talking regularly with natives gives you a much better chance of learning the language. People enhance your travels just as much as sights do.", "@F In order to get a real feel for a place, spend a few hours sitting in a park or in the main square by yourself, just watching daily life happen around you. Try to absorb all the colours, smells and sounds which surround you."]}, "language": {"title": "‘This Marvellous Invention’", "sub": null, "letters": true, "paras": ["@A Of all mankind's manifold creations, language must take pride of place. Other inventions – the wheel, agriculture, sliced bread - may have transformed our material existence, but the advent of language is what made us human. Compared to language, all other inventions pale in significance, since everything we have ever achieved depends on language and originates from it. Without language, we could never have embarked on our ascent to unparalleled power over all other animals, and even over nature itself.", "@B But language is foremost not just because it came first. In its own right it is a tool of extraordinary sophistication, yet based on an idea of ingenious simplicity: 'this marvellous invention of composing out of twenty-five or thirty sounds that infinite variety of expressions which, whilst having in themselves no likeness to what is in our mind, allow us to disclose to others its whole secret, and to make known to those who cannot penetrate it all that we imagine, and all the various stirrings of our soul' This was how, in 1660, the renowned French grammarians of the Port-Royal abbey near Versailles distilled the essence of language, and no one since has celebrated more eloquently the magnitude of its achievement. Even so, there is just one flaw in all these hymns of praise, for the homage to language's unique accomplishment conceals a simple yet critical incongruity. Language is mankind's greatest invention - except, of course, that it was never invented. This apparent paradox is at the core of our fascination with language, and it holds many of its secrets.", "@C Language often seems so skillfully drafted that one can hardly imagine it as anything other than the perfected handiwork of a master craftsman. How else could this instrument make so much out of barely three dozen measly morsels of sound? In themselves, these configurations of mouth - p, f, b, v, t, d, k, g, sh, a, e and so on - amount to nothing more than a few haphazard spits and splutters, random noises with no meaning, no ability to express, no power to explain. But run them through the cogs and wheels of the language machine, let it arrange them in some very special orders, and there is nothing that these meaningless streams of air cannot do: from sighing the interminable boredom of existence to unravelling the fundamental order of the universe.", "@D The most extraordinary thing about language, however, is that one doesn't have to be a genius to set its wheels in motion. The language machine allows just about everybody - from pre-modern foragers in the subtropical savannah, to post-modern philosophers in the suburban sprawl - to tie these meaningless sounds together into an infinite variety of subtle senses, and all apparently without the slightest exertion. Yet it is precisely this deceptive ease which makes language a victim of its own success, since in everyday life its triumphs are usually taken for granted. The wheels of language run so smoothly that one rarely bothers to stop and think about all the resourcefulness and expertise that must have gone into making it tick. Language conceals art.", "@E Often, it is only the estrangement of foreign tongues, with their many exotic and outlandish features, that brings home the wonder of language's design. One of the showiest stunts that some languages can pull off is an ability to build up words of breath-breaking length, and thus express in one word what English takes a whole sentence to say. The Turkish word sehirlilistiremediklerimizdensiniz, to take one example, means nothing less than 'you are one of those whom we can't turn into a town-dweller' (In case you were wondering, this monstrosity really is one word, not merely many different words squashed together - most of its components cannot even stand up on their own.)", "@F And if that sounds like some one-off freak, then consider Sumerian, the language spoken on the banks of the Euphrates some 5,000 years ago by the people who invented writing and thus enabled the documentation of history. A Sumerian word like munintumaa ('when he had made it suitable for her') might seem rather trim compared to the Turkish colossus above. What is so impressive about it, however, is not its lengthiness but rather the reverse – the thrifty compactness of its construction. The word is made up of different slots, each corresponding to a particular portion of meaning. This sleek design allows single sounds to convey useful information, and in fact even the absence of a sound has been enlisted to express something specific. If you were to ask which bit in the Sumerian word corresponds to the pronoun 'it' in the English translation 'when he had made it suitable for her', then the answer would have to be nothing. Mind you, a very particular kind of nothing: the nothing that stands in the empty slot in the middle. The technology is so fine-tuned then that even a non-sound, when carefully placed in a particular position, has been invested with a specific function. Who could possibly have come up with such a nifty contraption?"]}, "lostcity": {"title": "The Lost City", "sub": "An explorer’s encounter with the ruined city of Machu Picchu, the most famous icon of the Inca civilisation", "letters": true, "paras": ["@A When the US explorer and academic Hiram Bingham arrived in South America in 1911, he was ready for what was to be the greatest achievement of his life: the exploration of the remote hinterland to the west of Cusco, the old capital of the Inca empire in the Andes mountains of Peru. His goal was to locate the remains of a city called Vitcos, the last capital of the Inca civilisation. Cusco lies on a high plateau at an elevation of more than 3,000 metres, and Bingham's plan was to descend from this plateau along the valley of the Urubamba river, which takes a circuitous route down to the Amazon and passes through an area of dramatic canyons and mountain ranges.", "@B When Bingham and his team set off down the Urubamba in late July, they had an advantage over travellers who had preceded them: a track had recently been blasted down the valley canyon to enable rubber to be brought up by mules from the jungle. Almost all previous travellers had left the river at Ollantaytambo and taken a high pass across the mountains to rejoin the river lower down, thereby cutting a substantial corner, but also therefore never passing through the area around Machu Picchu.", "@C On 24 July they were a few days into their descent of the valley. The day began slowly, with Bingham trying to arrange sufficient mules for the next stage of the trek. His companions showed no interest in accompanying him up the nearby hill to see some ruins that a local farmer, Melchor Arteaga, had told them about the night before. The morning was dull and damp, and Bingham also seems to have been less than keen on the prospect of climbing the hill. In his book Lost City of the Incas, he relates that he made the ascent without having the least expectation that he would find anything at the top.", "@D Bingham writes about the approach in vivid style in his book. First, as he climbs up the hill, he describes the ever-present possibility of deadly snakes, 'capable of making considerable springs when in pursuit of their prey'; not that he sees any. Then there's a sense of mounting discovery as he comes across great sweeps of terraces, then a mausoleum, followed by monumental staircases and, finally, the grand ceremonial buildings of Machu Picchu. 'It seemed like an unbelievable dream ... the sight held me spellbound ...' he wrote.", "@E We should remember, however, that Lost City of the Incas is a work of hindsight, not written until 1948, many years after his journey. His journal entries of the time reveal a much more gradual appreciation of his achievement. He spent the afternoon at the ruins noting down the dimensions of some of the buildings, then descended and rejoined his companions, to whom he seems to have said little about his discovery. At this stage, Bingham didn't realise the extent or the importance of the site, nor did he realise what use he could make of the discovery.", "@F However, soon after returning it occurred to him that he could make a name for himself from this discovery. When he came to write the National Geographic magazine article that broke the story to the world in April 1913, he knew he had to produce a big idea. He wondered whether it could have been the birthplace of the very first Inca, Manco the Great, and whether it could also have been what chroniclers described as 'the last city of the Incas'. This term refers to Vilcabamba, the settlement where the Incas had fled from Spanish invaders in the 1530s. Bingham made desperate attempts to prove this belief for nearly 40 years. Sadly, his vision of the site as both the beginning and end of the Inca civilisation, while a magnificent one, is inaccurate. We now know that Vilcabamba actually lies 65 kilometres away in the depths of the jungle.", "@G One question that has perplexed visitors, historians and archaeologists alike ever since Bingham, is why the site seems to have been abandoned before the Spanish Conquest. There are no references to it by any of the Spanish chroniclers – and if they had known of its existence so close to Cusco they would certainly have come in search of gold. An idea which has gained wide acceptance over the past few years is that Machu Picchu was a moya, a country estate built by an Inca emperor to escape the cold winters of Cusco, where the elite could enjoy monumental architecture and spectacular views. Furthermore, the particular architecture of Machu Picchu suggests that it was constructed at the time of the greatest of all the Incas, the emperor Pachacuti (c. 1438-71). By custom, Pachacuti's descendants built other similar estates for their own use, and so Machu Picchu would have been abandoned after his death, some 50 years before the Spanish Conquest."]}, "easter": {"title": "What destroyed the civilisation of Easter Island?", "sub": null, "letters": true, "paras": ["@A Easter Island, or Rapu Nui as it is known locally, is home to several hundred ancient human statues – the moai. After this remote Pacific island was settled by the Polynesians, it remained isolated for centuries. All the energy and resources that went into the moai – some of which are ten metres tall and weigh over 7,000 kilos – came from the island itself. Yet when Dutch explorers landed in 1722, they met a Stone Age culture. The moai were carved with stone tools, then transported for many kilometres, without the use of animals or wheels, to massive stone platforms. The identity of the moai builders was in doubt until well into the twentieth century. Thor Heyerdahl, the Norwegian ethnographer and adventurer, thought the statues had been created by pre-Inca peoples from Peru. Bestselling Swiss author Erich von Däniken believed they were built by stranded extraterrestrials. Modern science – linguistic, archaeological and genetic evidence – has definitively proved the moai builders were Polynesians, but not how they moved their creations. Local folklore maintains that the statues walked, while researchers have tended to assume the ancestors dragged the statues somehow, using ropes and logs.", "@B When the Europeans arrived, Rapa Nui was grassland, with only a few scrawny trees. In the 1970s and 1980s, though, researchers found pollen preserved in lake sediments, which proved the island had been covered in lush palm forests for thousands of years. Only after the Polynesians arrived did those forests disappear. US scientist Jared Diamond believes that the Rapanui people – descendants of Polynesian settlers – wrecked their own environment. They had unfortunately settled on an extremely fragile island – dry, cool, and too remote to be properly fertilised by windblown volcanic ash. When the islanders cleared the forests for firewood and farming, the forests didn't grow back. As trees became scarce and they could no longer construct wooden canoes for fishing, they ate birds. Soil erosion decreased their crop yields. Before Europeans arrived, the Rapanui had descended into civil war and cannibalism, he maintains. The collapse of their isolated civilisation, Diamond writes, is a 'worst-case scenario for what may lie ahead of us in our own future'.", "@C The moai, he thinks, accelerated the self-destruction. Diamond interprets them as power displays by rival chieftains who, trapped on a remote little island, lacked other ways of asserting their dominance. They competed by building ever bigger figures. Diamond thinks they laid the moai on wooden sledges, hauled over log rails, but that required both a lot of wood and a lot of people. To feed the people, even more land had to be cleared. When the wood was gone and civil war began, the islanders began toppling the moai. By the nineteenth century none were standing.", "@D Archaeologists Terry Hunt of the University of Hawaii and Carl Lipo of California State University agree that Easter Island lost its lush forests and that it was an 'ecological catastrophe' – but they believe the islanders themselves weren't to blame. And the moai certainly weren't. Archaeological excavations indicate that the Rapanui went to heroic efforts to protect the resources of their wind-lashed, infertile fields. They built thousands of circular stone windbreaks and gardened inside them, and used broken volcanic rocks to keep the soil moist. In short, Hunt and Lipo argue, the prehistoric Rapanui were pioneers of sustainable farming.", "@E Hunt and Lipo contend that moai-building was an activity that helped keep the peace between islanders. They also believe that moving the moai required few people and no wood, because they were walked upright. On that issue, Hunt and Lipo say, archaeological evidence backs up Rapanui folklore. Recent experiments indicate that as few as 18 people could, with three strong ropes and a bit of practice, easily manoeuvre a 1,000 kg moai replica a few hundred metres. The figures' fat bellies tilted them forward, and a D-shaped base allowed handlers to roll and rock them side to side.", "@F Moreover, Hunt and Lipo are convinced that the settlers were not wholly responsible for the loss of the island's trees. Archaeological finds of nuts from the extinct Easter Island palm show tiny grooves, made by the teeth of Polynesian rats. The rats arrived along with the settlers, and in just a few years, Hunt and Lipo calculate, they would have overrun the island. They would have prevented the reseeding of the slow-growing palm trees and thereby doomed Rapa Nui's forest, even without the settlers' campaign of deforestation. No doubt the rats ate birds' eggs too. Hunt and Lipo also see no evidence that Rapanui civilisation collapsed when the palm forest did. They think its population grew rapidly and then remained more or less stable until the arrival of the Europeans, who introduced deadly diseases to which islanders had no immunity. Then in the nineteenth century slave traders decimated the population, which shrivelled to 111 people by 1877.", "@G Hunt and Lipo's vision, therefore, is one of an island populated by peaceful and ingenious moai builders and careful stewards of the land, rather than by reckless destroyers ruining their own environment and society. 'Rather than a case of abject failure, Rapu Nui is an unlikely story of success', they claim. Whichever is the case, there are surely some valuable lessons which the world at large can learn from the story of Rapa Nui."]}, "risingsum": {"title": "Land of the Rising Sum", "sub": null, "letters": true, "paras": ["@A Japan has a significantly better record in terms of average mathematical attainment than England and Wales. Large sample international comparisons of pupils' attainments since the 1960s have established that not only did Japanese pupils at age 13 have better scores of average attainment, but there was also a larger proportion of 'low' attainers in England, where, incidentally, the variation in attainment scores was much greater. The percentage of Gross National Product spent on education is reasonably similar in the two countries, so how is this higher and more consistent attainment in maths achieved?", "@B Lower secondary schools in Japan cover three school years, from the seventh grade (age 13) to the ninth grade (age 15). Virtually all pupils at this stage attend state schools: only 3 per cent are in the private sector. Schools are usually modern in design, set well back from the road and spacious inside. Classrooms are large and pupils sit at single desks in rows. Lessons last for a standardised 50 minutes and are always followed by a 10-minute break, which gives the pupils a chance to let off steam. Teachers begin with a formal address and mutual bowing, and then concentrate on whole-class teaching.", "@- Classes are large – usually about 40 - and are unstreamed. Pupils stay in the same class for all lessons throughout the school and develop considerable class identity and loyalty. Pupils attend the school in their own neighbourhood, which in theory removes ranking by school. In practice in Tokyo, because of the relative concentration of schools, there is some competition to get into the 'better' school in a particular area.", "@C Traditional ways of teaching form the basis of the lesson and the remarkably quiet classes take their own notes of the points made and the examples demonstrated. Everyone has their own copy of the textbook supplied by the central education authority, Monbusho, as part of the concept of free compulsory education up to the age of 15. These textbooks are, on the whole, small, presumably inexpensive to produce, but well set out and logically developed. (One teacher was particularly keen to introduce colour and pictures into maths textbooks: he felt this would make them more accessible to pupils brought up in a cartoon culture.) Besides approving textbooks, Monbusho also decides the highly centralised national curriculum and: how it is to be delivered.", "@D Lessons all follow the same pattern. At the beginning, the pupils put solutions to the homework on the board, then the teachers comment, correct or elaborate as necessary. Pupils mark their own homework: this is an important principle in Japanese schooling as it enables pupils to see where and why they made a mistake, so that these can be avoided in future. No one minds mistakes or ignorance as long as you are prepared to learn from them.", "@- After the homework has been discussed, the teacher explains the topic of the lesson, slowly and with a lot of repetition and elaboration. Examples are demonstrated on the board; questions from the textbook are worked through first with the class, and then the class is set questions from the textbook to do individually. Only rarely are supplementary worksheets distributed in a maths class. The impression is that the logical nature of the textbooks and their comprehensive coverage of different types of examples, combined with the relative homogeneity of the class, renders work sheets unnecessary. At this point, the teacher would circulate and make sure that all the pupils were coping well.", "@E It is remarkable that large, mixed-ability classes could be kept together for maths throughout all their compulsory schooling from 6 to 15. Teachers say that they give individual help at the end of a lesson or after school, setting extra work if necessary. In observed lessons, any strugglers would be assisted by the teacher or quietly seek help from their neighbour. Carefully fostered class identity makes pupils keen to help each other ~ anyway, it is in their interests since the class progresses together.", "@- This scarcely seems adequate help to enable slow learners to keep up. However, the Japanese attitude towards education runs along the lines of 'if you work hard enough, you can do almost anything'. Parents are kept closely informed of their children's progress and will play a part in helping their children to keep up with class, sending them to 'Juku' (private evening tuition) if extra help is needed and encouraging them to work harder. It seems to work, at least for 95 per cent of the school population.", "@F So what are the major contributing factors in the success of maths teaching? Clearly, attitudes are important. Education is valued greatly in Japanese culture; maths is recognised as an important compulsory subject throughout schooling; and the emphasis is on hard work coupled with a focus on accuracy.", "@- Other relevant points relate to the supportive attitude of a class towards slower pupils, the lack of competition within a class, and the positive emphasis on learning for oneself and improving one's own standard. And the view of repetitively boring lessons and learning the facts by heart, which is sometimes quoted in relation to Japanese classes, may be unfair and unjustified. No poor maths lessons were observed. They were mainly good and one or two were inspirational."]}, "transsib": {"title": "The Trans-Siberian Railway", "sub": null, "letters": true, "paras": ["@A The Trans-Siberian Railway has been described by some as the most memorable journey on Earth. Measuring nearly 9,300 km, it is the longest railway line in the world and takes approximately a week to complete. It is one incredible train journey from Red Square to the Great Wall, taking in Siberia, Mongolia, the Gobi Desert and arriving in the great city of Beijing. The journey has captured the imagination of travellers from far and wide since construction began in 1891.", "@B Although officials have been building this line since 1891, it is still being expanded today. The original Trans-Siberian Railway was built from Moscow to Vladivostok on the orders of Tsar Alexander III. Building the line was not an easy task as there were only a few qualified engineers and the difficult climate often slowed progress. A lack of workmen meant that soldiers and convicts had to be conscripted to help. Up to 90,000 men were employed in its construction.", "@C From the moment building began, the project faced many difficulties. Even though it was considered a technological marvel at the time, there were arguments about the quality of work. Rails were considered too light and bridges not strong enough. Many claimed convicts had sabotaged the line. Furthermore, the project also caused serious problems for the Russian economy.", "@D Despite criticisms, however, the railway more than paid for itself in the twentieth century. The Siberian economy exploded when 2.5 million poor people moved there from European Russia between 1895 and 1916. The region quickly became famous for producing bread and butter. Without the Trans-Siberian Railway, Siberia's industrial revolution would not have happened.", "@E Today, this service is used by both tourists and workers. Running at an average speed of 60 km/h, it is not designed for anyone in a hurry. Nor are the trains particularly glamorous. The trip could never be described as dull, however, with breathtaking views from the carriage window and the opportunity to talk to fellow passengers.", "@F Although the trip certainly attracts many foreign tourists, today it gets most of its use from domestic passengers. It is responsible for 30% of Russian exports and carries more than 250,000 containers a year."]}, "docs": {"title": "Making Documentary Films", "sub": null, "letters": true, "paras": ["@A For much of the twentieth century, documentary films were overshadowed by their more successful Hollywood counterparts. For a number of reasons, documentaries were frequently ignored by critics and film studies courses at universities. Firstly, the very idea of a documentary film made some people suspicious. As the critic Dr Helmut Fischer put it, 'Documentary makers might have ambitions to tell the \"truth\" and show only \"facts\" but there is no such thing as a non-fiction film. That's because, as soon as you record an incident on camera, you are altering its reality in a fundamental way'. Secondly, even supporters of documentaries could not agree on a precise definition, which did little to improve the reputation of the genre. Lastly, there were also concerns about the ethics of filming subjects without their consent, which is a necessity in many documentary films.", "@B None of this prevented documentaries from being produced, though exactly when the process started is open to question. It is often claimed that Nanook of the North was the first documentary. Made by the American filmmaker Robert J. Flaherty in 1922, the film depicts the hard, sometimes heroic lives of native American peoples in the Canadian Arctic. Nanook of the North is said to have set off a trend that continued through the 1920s with the films of Dziga Vertov in the Soviet Union and works by other filmmakers around the world. However, that 1922 starting point has been disputed by supporters of an earlier date. Among this group is film historian Anthony Berwick, who argues that the genre can be traced back as early as 1895, when similar films started to appear, including newsreels, scientific films and accounts of journeys of exploration.", "@C In the years following 1922, one particular style of documentary started to appear. These films adopted a serious tone while depicting the lives of actual people. Cameras were mounted on tripods and subjects rehearsed and repeated activities for the purposes of the film. British filmmaker John Grierson was an important member of this group. Grierson's career lasted nearly 40 years, beginning with Drifters (1929) and culminating with | Remember, | Remember (1968). However, by the 1960s Grierson's style of film was being rejected by the Direct Cinema movement, which wanted to produce more natural and authentic films: cameras were hand-held; no additional lighting or sound was used; and the subjects did not rehearse. According to film writer Paula Murphy, the principles and methods of Direct Cinema brought documentaries to the attention of universities and film historians as never before. Documentaries started to be recognised as a distinct genre worthy of serious scholarly analysis.", "@D Starting in the 1980s, the widespread availability of first video and then digital cameras transformed filmmaking. The flexibility and low cost of these devices meant that anyone could now be a filmmaker. Amateurs working from home could compete with professionals in ways never possible before. The appearance of online film-sharing platforms in the early 2000s only increased the new possibilities for amateur filmmakers. Nonetheless, while countless amateur documentaries were being made, perhaps the most popular documentary of 2006 was still the professionally made An Inconvenient Truth. New cameras and digital platforms revolutionised the making of films. But as critic Maria Fiala has pointed out, 'The argument sometimes put forward that these innovations immediately transformed what the public expected to see in a documentary isn't entirely accurate.'", "@E However, a new generation of documentary filmmakers then emerged, and with them came a new philosophy of the genre. These filmmakers moved away from highlighting political themes or urgent social issues. Instead the focus moved inwards, exploring personal lives, relationships and emotions. It could be argued that Catfish (2010) was a perfect example of this new trend.The film chronicles the everyday lives and interactions of the social media generation and was both a commercial and critical success. Filmmaker Josh Camberwell maintains that Catfish embodies a new realisation that documentaries are inherently subjective and that this should be celebrated. Says Camberwell, 'It is a requirement for documentary makers to express a particular viewpoint and give personal responses to the material they are recording.'", "@F The popularity and variety of documentaries today is illustrated by the large number of film festivals focusing on the genre around the world. The biggest of all must be the Hot Docs Festival in Canada, which over the years has showcased hundreds of documentaries from more than 50 different countries. Even older is the Hamburg International Short Film Festival.As its name suggests, Hamburg specialises in short films, but one category takes this to its limits – entries may not exceed three minutes in duration. The Short and Sweet Festival is a slightly smaller event held in Utah, USA. The small size of the festival means that for first timers this is the ideal venue to try to get some recognition for their films. Then there is the Atlanta Shortsfest, which is a great event for a wide variety of filmmakers. Atlanta welcomes all established types of documentaries and recognises the growing popularity of animations, with a category specifically for films of this type. These are just a few of the scores of film festivals on offer, and there are more being established every year. All in all, it has never been easier for documentary makers to get their films in front of an audience."]}, "pyramid": {"title": "The Step Pyramid of Djoser", "sub": null, "letters": true, "paras": ["@A The pyramids are the most famous monuments of ancient Egypt and still hold enormous interest for people in the present day. These grand, impressive tributes to the memory of the Egyptian kings have become linked with the country even though other cultures, such as the Chinese and Mayan, also built pyramids. The evolution of the pyramid form has been written and argued about for centuries. However, there is no question that, as far as Egypt is concerned, it began with one monument to one king designed by one brilliant architect: the Step Pyramid of Djoser at Saqqara.", "@B Djoser was the first king of the Third Dynasty of Egypt and the first to build in stone. Prior to Djoser's reign, tombs were rectangular monuments made of dried clay brick, which covered underground passages where the deceased person was buried. For reasons which remain unclear, Djoser's main official, whose name was Imhotep, conceived of building a taller, more impressive tomb for his king by stacking stone slabs on top of one another, progressively making them smaller, to form the shape now known as the Step Pyramid. Djoser is thought to have reigned for 19 years, but some historians and scholars attribute a much longer time for his rule, owing to the number and size of the monuments he built.", "@C The Step Pyramid has been thoroughly examined and investigated over the last century, and it is now known that the building process went through many different stages. Historian Marc Van de Mieroop comments on this, writing 'Much experimentation was involved, which is especially clear in the construction of the pyramid in the center of the complex. It had several plans ... before it became the first Step Pyramid in history, piling six levels on top of one another ... The weight of the enormous mass was a challenge for the builders, who placed the stones at an inward incline in order to prevent the monument breaking up.'", "@D When finally completed, the Step Pyramid rose 62 meters high and was the tallest structure of its time. The complex in which it was built was the size of a city in ancient Egypt and included a temple, courtyards, shrines, and living quarters for the priests. It covered a region of 16 hectares and was surrounded by a wall 10.5 meters high. The wall had 13 false doors cut into it with only one true entrance cut into the south-east corner; the entire wall was then ringed by a trench 750 meters long and 40 meters wide. The false doors and the trench were incorporated into the complex to discourage unwanted visitors. If someone wished to enter, he or she would have needed to know in advance how to find the location of the true opening in the wall. Djoser was so proud of his accomplishment that he broke the tradition of having only his own name on the monument and had Imhotep's name carved on it as well.", "@E The burial chamber of the tomb, where the king's body was laid to rest, was dug beneath the base of the pyramid, surrounded by a vast maze of long tunnels that had rooms off them to discourage robbers. One of the most mysterious discoveries found inside the pyramid was a large number of stone vessels. Over 40,000 of these vessels, of various forms and shapes, were discovered in storerooms off the pyramid's underground passages. They are inscribed with the names of rulers from the First and Second Dynasties of Egypt and made from different kinds of stone. There is no agreement among scholars and archaeologists on why the vessels were placed in the tomb of Djoser or what they were supposed to represent. The archaeologist Jean-Philippe Lauer, who excavated most of the pyramid and complex, believes they were originally stored and then given a 'proper burial' by Djoser in his pyramid to honor his predecessors. There are other historians, however, who claim the vessels were dumped into the shafts as yet another attempt to prevent grave robbers from getting to the king's burial chamber.", "@F Unfortunately, all of the precautions and intricate design of the underground network did not prevent ancient robbers from finding a way in. Djoser's grave goods, and even his body, were stolen at some point in the past and all archaeologists found were a small number of his valuables overlooked by the thieves. There was enough left throughout the pyramid and its complex, however, to astonish and amaze the archaeologists who excavated it.", "@G Egyptologist Miroslav Verner writes, 'Few monuments hold a place in human history as significant as that of the Step Pyramid in Saqqara ... It can be said without exaggeration that this pyramid complex constitutes a milestone in the evolution of monumental stone architecture in Egypt and in the world as a whole.' The Step Pyramid was a revolutionary advance in architecture and became the archetype which all the other great pyramid builders of Egypt would follow."]}, "ai": {"title": "Attitudes towards Artificial Intelligence", "sub": null, "letters": true, "paras": ["@A Artificial intelligence (AI) can already predict the future. Police forces are using it to map when and where crime is likely to occur. Doctors can use it to predict when a patient is most likely to have a heart attack or stroke. Researchers are even trying to give AI imagination so it can plan for unexpected consequences.", "@- Many decisions in our lives require a good forecast, and AI is almost always better at forecasting than we are. Yet for all these technological advances, we still seem to deeply lack confidence in AI predictions. Recent cases show that people don't like relying on AI and prefer to trust human experts, even if these experts are wrong.", "@- If we want AI to really benefit people, we need to find a way to get people to trust it. To do that, we need to understand why people are so reluctant to trust AI in the first place.", "@B Take the case of Watson for Oncology, one of technology giant IBM's supercomputer programs. Their attempt to promote this program to cancer doctors was a PR disaster. The AI promised to deliver top-quality recommendations on the treatment of 12 cancers that accounted for 80% of the world's cases. But when doctors first interacted with Watson, they found themselves in a rather difficult situation. On the one hand, if Watson provided guidance about a treatment that coincided with their own opinions, physicians did not see much point in Watson's recommendations. The supercomputer was simply telling them what they already knew, and these recommendations did not change the actual treatment.", "@- On the other hand, if Watson generated a recommendation that contradicted the experts' opinion, doctors would typically conclude that Watson wasn't competent. And the machine wouldn't be able to explain why its treatment was plausible because its machine-learning algorithms were simply too complex to be fully understood by humans. Consequently, this has caused even more suspicion and disbelief, leading many doctors to ignore the seemingly outlandish AI recommendations and stick to their own expertise.", "@C This is just one example of people's lack of confidence in AI and their reluctance to accept what AI has to offer. Trust in other people is often based on our understanding of how others think and having experience of their reliability. This helps create a psychological feeling of safety. AI, on the other hand, is still fairly new and unfamiliar to most people. Even if it can be technically explained (and that's not always the case), AI's decision-making process is usually too difficult for most people to comprehend. And interacting with something we don't understand can cause anxiety and give us a sense that we're losing control.", "@- Many people are also simply not familiar with many instances of AI actually working, because it often happens in the background. Instead, they are acutely aware of instances where AI goes wrong. Embarrassing AI failures receive a disproportionate amount of media attention, emphasising the message that we cannot rely on technology. Machine learning is not foolproof, in part because the humans who design it aren't.", "@D Feelings about AI run deep. In a recent experiment, people from a range of backgrounds were given various sci-fi films about AI to watch and then asked questions about automation in everyday life. It was found that, regardless of whether the film they watched depicted AI in a positive or negative light, simply watching a cinematic vision of our technological future polarised the participants' attitudes. Optimists became more extreme in their enthusiasm for AI and sceptics became even more guarded.", "@- This suggests people use relevant evidence about AI in a biased manner to support their existing attitudes, a deep-rooted human tendency known as \"confirmation bias\". As AI is represented more and more in media and entertainment, it could lead to a society split between those who benefit from AI and those who reject it. More pertinently, refusing to accept the advantages offered by AI could place a large group of people at a serious disadvantage.", "@E Fortunately, we already have some ideas about how to improve trust in AI. Simply having previous experience with AI can significantly improve people's opinions about the technology, as was found in the study mentioned above. Evidence also suggests the more you use other technologies such as the internet, the more you trust them.", "@- Another solution may be to reveal more about the algorithms which AI uses and the purposes they serve. Several high-profile social media companies and online marketplaces already release transparency reports about government requests and surveillance disclosures. A similar practice for AI could help people have a better understanding of the way algorithmic decisions are made.", "@F Research suggests that allowing people some control over AI decision-making could also improve trust and enable AI to learn from human experience. For example, one study showed that when people were allowed the freedom to slightly modify an algorithm, they felt more satisfied with its decisions, more likely to believe it was superior and more likely to use it in the future.", "@- We don't need to understand the intricate inner workings of AI systems, but if people are given a degree of responsibility for how they are implemented, they will be more willing to accept AI into their lives."]}, "boards": {"title": "UK companies need more effective boards of directors", "sub": null, "letters": true, "paras": ["@A After a number of serious failures of governance (that is, how they are managed at the highest level), companies in Britain, as well as elsewhere, should consider radical changes to their directors' roles. It is clear that the role of a board director today is not an easy one. Following the 2008 financial meltdown, which resulted in a deeper and more prolonged period of economic downturn than anyone expected, the search for explanations in the many post-mortems of the crisis has meant blame has been spread far and wide. Governments, regulators, central banks and auditors have all been in the frame. The role of bank directors and management and their widely publicised failures have been extensively picked over and examined in reports, inquiries and commentaries.", "@B The knock-on effect of this scrutiny has been to make the governance of companies in general an issue of intense public debate and has significantly increased the pressures on, and the responsibilities of, directors. At the simplest and most practical level, the time involved in fulfilling the demands of a board directorship has increased significantly, calling into question the effectiveness of the classic model of corporate governance by part-time, independent non-executive directors. Where once a board schedule may have consisted of between eight and ten meetings a year, in many companies the number of events requiring board input and decisions has dramatically risen. Furthermore, the amount of reading and preparation required for each meeting is increasing. Agendas can become overloaded and this can mean the time for constructive debate must necessarily be restricted in favour of getting through the business.", "@C Often, board business is devolved to committees in order to cope with the workload, which may be more efficient but can mean that the board as a whole is less involved in fully addressing some of the most important issues. It is not uncommon for the audit committee meeting to last longer than the main board meeting itself. Process may take the place of discussion and be at the expense of real collaboration, so that boxes are ticked rather than issues tackled.", "@D A radical solution, which may work for some very large companies whose businesses are extensive and complex, is the professional board, whose members would work up to three or four days a week, supported by their own dedicated staff and advisers. There are obvious.risks to.this and.it would be important to establish clear guidelines for such a board to ensure that it did not step on the toes of management by becoming too engaged in the day-to-day running of the company. Problems of recruitment, remuneration and independence could also arise and this structure would not be appropriate for all companies. However, more professional and better-informed boards would have been particularly appropriate for banks where the executives had access to information that part-time non-executive directors lacked, leaving the latter unable to comprehend or anticipate the 2008 crash.", "@E One of the main criticisms of boards and their directors is that they do not focus sufficiently on longer-term matters of strategy, sustainability and governance, but instead concentrate too much on short-term financial metrics. Regulatory requirements and the structure of the market encourage this behaviour. The tyranny of quarterly reporting can distort board decision-making, as directors have to 'make the numbers' every four months to meet the insatiable appetite of the market for more data. This serves to encourage the trading methodology of a certain kind of investor who moves in and out of a stock without engaging in constructive dialogue with the company about strategy or performance, and is simply seeking a short-term financial gain. This effect has been made worse by the changing profile of investors due to the globalisation of capital and the increasing use of automated trading systems. Corporate culture adapts and management teams are largely incentivised to meet financial goals.", "@F Compensation for chief executives has become a combat zone where pitched battles between investors, management and board members are fought, often behind closed doors but increasingly frequently in the full glare of press attention. Many would argue that this is in the interest of transparency and good governance as shareholders use their muscle in the area of pay to pressure boards to remove underperforming chief executives. Their powers to vote down executive remuneration policies increased when binding votes came into force. The chair of the remuneration committee can be an exposed and lonely role, as Alison Carnwath, chair of Barclays Bank's remuneration committee, found when she had to resign, having been roundly criticised for trying to defend the enormous bonus to be paid to the chief executive; the irony being that she was widely understood to have spoken out against it in the privacy of the committee.", "@G The financial crisis stimulated a debate about the role and purpose of the company and a heightened awareness of corporate ethics. Trust in the corporation has been eroded and academics such as Michael Sandel, in his thoughtful and bestselling book What Money Can't Buy, are questioning the morality of capitalism and the market economy. Boards of companies in all sectors will need to widen their perspective to encompass these issues and this may involve a realignment of corporate goals. We live in challenging times."]}}};</script><script>/* IELTS Reading Lab – shared core: data access, marking, rendering of question papers and explanations */

function startExam(t) {
  const r = T(t.id);
  r.exam = {running: true, startedAt: Date.now(), deadline: Date.now() + t.time * 60000, tabSwitches: 0, interrupts: 0, usedSec: 0};
  r.draft = {}; exam.resumed = true; save(); render();

function startClock(t) {
  const r = T(t.id), el = $('#timer');
  const tick = () => {
    const left = (r.exam.deadline - Date.now()) / 1000;
    el.textContent = fmtTime(left);
    el.className = 'timer' + (left <= 60 ? ' crit' : left <= 300 ? ' warn' : '');
    if (Math.floor(left) === 300) toast('5 minutes left.');
    if (Math.floor(left) === 60) toast('1 minute left. Check your word limits.');
    if (left <= 0) { stopTimer(); submitExam(t, true); }
  };
  tick(); exam.timer = setInterval(tick, 1000);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && examRunning()) { const r = T(view.test); r.exam.tabSwitches = (r.exam.tabSwitches || 0) + 1; save(true); const el = $('#tabsw'); if (el) el.textContent = r.exam.tabSwitches; }
